<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Keep the pre-module shell visually coherent until the bundled stylesheet and boot logic take over. -->
    <style>
      html,
      body,
      #game-shell,
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        overflow: hidden;
        background: #171421;
      }

      #game-shell {
        display: grid;
        place-items: center;
      }

      #game {
        max-width: 200vh;
      }

      #orientation-gate {
        display: none;
      }

      #startup-preload {
        position: absolute;
        inset: 0;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
    <!-- Avoid browser favicon 404 noise inside embedded game hosts. -->
    <link rel="icon" href="data:," />
    <title>Mystery Pocket Tech</title>
  </head>
  <body>
    <main id="game-shell">
      <div id="game" aria-label="Mystery Pocket Tech game canvas"></div>
      <div
        id="startup-preload"
        data-state="idle"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        aria-hidden="true"
      >
        <div class="startup-preload__panel">
          <div class="startup-preload__spinner" aria-hidden="true">
            <span class="startup-preload__ring"></span>
            <span class="startup-preload__orbit"></span>
            <span class="startup-preload__core">✦</span>
          </div>
          <p id="startup-preload-heading" class="startup-preload__heading">PREPARING DROP</p>
          <div id="startup-preload-status" class="startup-preload__status">STABILIZING SIGNAL...</div>
          <div class="startup-preload__progress-row">
            <div
              id="startup-preload-progress-bar"
              class="startup-preload__progress"
              role="progressbar"
              aria-label="Startup progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="8"
            >
              <span id="startup-preload-progress-fill"></span>
            </div>
            <span id="startup-preload-progress-percent" class="startup-preload__percent" aria-hidden="true">08%</span>
          </div>
        </div>
      </div>
      <div id="orientation-gate" role="status" aria-live="polite">Rotate your device</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
