              """    this.pouch = createPouchVisual(this, root, metrics.centerX, POUCH_Y);\n    this.pouch.dragZone.on('pointerdown', (pointer: Phaser.Input.Pointer) => this.beginDrag(pointer));\n    this.startStarPulse();""",
          )
