name: Hands-on V2 correction

on:
  push:
    branches:
      - fix/hands-on-v2-correction

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply targeted correction
        run: python scripts/apply-hands-on-v2-correction.py

      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build

      - name: Commit validated correction and remove temporary tooling
        run: |
          rm .github/workflows/hands-on-v2-correction.yml
          rm scripts/apply-hands-on-v2-correction.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/data/presentation.ts src/game/scenes/OpeningScene.ts tests/presentation.test.ts .github/workflows/hands-on-v2-correction.yml scripts/apply-hands-on-v2-correction.py
          git commit -m "Apply hands-on V2 correction pass"
          git push origin HEAD:fix/hands-on-v2-correction
