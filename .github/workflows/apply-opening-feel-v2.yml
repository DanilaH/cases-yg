name: Apply opening feel V2 pass

on:
  push:
    branches:
      - feat/opening-feel-pass-v2
    paths:
      - .github/workflows/apply-opening-feel-v2.yml
      - .github/scripts/patch-feel-v2-data.py
      - .github/scripts/patch-feel-v2-scene.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/opening-feel-pass-v2
          fetch-depth: 0
      - name: Apply reviewed feel V2 patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch-feel-v2-data.py
          python .github/scripts/patch-feel-v2-scene.py
          rm .github/scripts/patch-feel-v2-data.py
          rm .github/scripts/patch-feel-v2-scene.py
          rm .github/workflows/apply-opening-feel-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement second opening feel pass'
          git push origin HEAD:feat/opening-feel-pass-v2
