name: Apply content registry integration

on:
  push:
    branches:
      - content/integrate-production-registry

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[content-pass]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply registry and pool semantics pass
        run: python3 tools/content-integration-pass.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Commit integration pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m '[content-pass] integrate production registry and Drop semantics'
          git push origin HEAD:content/integrate-production-registry
