name: Fix PR4 review findings

on:
  push:
    branches:
      - feat/collection-i18n-audio

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/collection-i18n-audio
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Apply review fixes once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/scenes/OpeningScene.ts')
          text = path.read_text()

          old = """    this.pouch?.dragZone.disableInteractive();
    this.setChromeEnabled(false);

    try {
      const pending = await this.session.prepareReveal();
      if (this.isSceneShutdown()) return;
      this.lastReveal = pending;
      getGameAudio().play('tear');
"""
          new = """    this.pouch?.dragZone.disableInteractive();
    this.setChromeEnabled(false);
    getGameAudio().play('tear');

    try {
      const pending = await this.session.prepareReveal();
      if (this.isSceneShutdown()) return;
      this.lastReveal = pending;
"""
          if old in text:
              text = text.replace(old, new, 1)

          for line in [
              "    getGameAudio().play('reveal-pop');\n",
              "    getGameAudio().play('secret-reveal');\n",
          ]:
              while line + line in text:
                  text = text.replace(line + line, line)

          reward_block = """    getGameAudio().play(pending.standard.rarity);
    if (!pending.standard.isNew) getGameAudio().play('duplicate');
    if (pending.signal.gain > 0) getGameAudio().play('signal-gain');
    if (pending.signal.lockReached || pending.signal.lockConsumed) getGameAudio().play('signal-lock');
"""
          while reward_block + reward_block in text:
              text = text.replace(reward_block + reward_block, reward_block)

          path.write_text(text)
          PY
      - name: Commit review fixes if changed
        run: |
          if [ -z "$(git status --porcelain -- src/game/scenes/OpeningScene.ts)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts
          git commit -m "Fix duplicated SFX cues and unlock audio on tear"
          git push
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
