name: Validate current-state docs patch

on:
  push:
    branches:
      - release/yandex-draft-readiness

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[current-state-docs]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python3 tools/current-state-docs-patch.py
      - name: Assert current expanded state is documented
        shell: bash
        run: |
          grep -q '60 authored collectible assets total' README.md
          grep -q '172 tests' README.md
          grep -q '6 themed Drops / 12 families / 60 collectibles' docs/GAMEPLAY_SYSTEMS.md
          grep -q 'Stage D — real Yandex DRAFT validation — NEXT' docs/PRODUCT.md
          grep -q 'requirements were re-checked.*2026-09-10' docs/YANDEX_SUBMISSION_CHECKLIST.md
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit current-state docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/GAMEPLAY_SYSTEMS.md docs/PRODUCT.md docs/YANDEX_SUBMISSION_CHECKLIST.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[current-state-docs] align canonical docs with expanded DRAFT candidate'
          git push origin HEAD:release/yandex-draft-readiness
