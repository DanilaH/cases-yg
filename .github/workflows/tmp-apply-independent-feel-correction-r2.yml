name: TEMP apply independent feel correction R2

on:
  push:
    branches:
      - polish/independent-feel-correction-r1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/independent-feel-correction-r1
          fetch-depth: 0
      - name: Apply correction
        run: python tools/tmp_apply_independent_feel_correction_r1.py
      - name: Check diff
        run: |
          git diff --check
          git diff --stat
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit clean product patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-apply-independent-feel-correction-r1.yml
          rm -f .github/workflows/tmp-apply-independent-feel-correction-r2.yml
          rm -f tools/tmp_apply_independent_feel_correction_r1.py
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' src/game/data/presentation.ts src/game/scenes/OpeningScene.ts tests/presentation.test.ts | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish independent feel consistency'
          git push origin HEAD:polish/independent-feel-correction-r1
