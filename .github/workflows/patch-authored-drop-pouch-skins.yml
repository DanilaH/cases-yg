name: Patch authored Drop pouch skins

on:
  push:
    branches:
      - content/authored-drop-pouch-skins

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/authored-drop-pouch-skins
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded source patch
        run: node tools/patch-authored-drop-pouch-skins.mjs

      - name: Commit generated source edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/ui/openingVisuals.ts tools/patch-authored-drop-pouch-skins.mjs .github/workflows/patch-authored-drop-pouch-skins.yml
          git commit -m "Use Drop-specific pouch textures at runtime"
          git push origin HEAD:content/authored-drop-pouch-skins
