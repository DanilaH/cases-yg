name: Runtime asset bundles experiment

on:
  push:
    branches:
      - experiment/runtime-asset-bundles-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6
        with:
          ref: experiment/runtime-asset-bundles-v1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build deterministic runtime bundles
        run: node tools/assets/build-runtime-bundles.mjs

      - name: Show bundle report
        run: cat .asset-build/runtime-bundles/report.json

      - name: Commit generated bundles when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/bundles src/game/data/runtimeAssetBundles.generated.ts
          if git diff --cached --quiet; then
            echo "Generated runtime bundles are already current."
            exit 0
          fi
          git commit -m "Generate runtime asset bundles"
          git push origin HEAD:experiment/runtime-asset-bundles-v1

      - name: Project gate
        run: |
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
