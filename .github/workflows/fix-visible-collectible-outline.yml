name: Fix visible collectible outline

on:
  push:
    branches:
      - fix/visible-collectible-outline

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/visible-collectible-outline
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply pre-filter silhouette outline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/ui/openingVisuals.ts')
          source = path.read_text()

          # The shader-space outline is too easy to lose after the collectible
          # framebuffer is supersampled and composited back down. Keep material
          # rim/sheen in the shader, but make the persistent rarity outline a
          # real pre-filter visual layer so it is warped together with the art.
          source = source.replace('outlineStrength: 0.34', 'outlineStrength: 0')
          source = source.replace('outlineStrength: 0.42', 'outlineStrength: 0')
          source = source.replace('outlineStrength: 0.46', 'outlineStrength: 0')
          source = source.replace('outlineStrength: 0.50', 'outlineStrength: 0')
          source = source.replace('outlineStrength: 0.54', 'outlineStrength: 0')

          old_signature = """const createAssetCollectible = (\n  scene: Phaser.Scene,\n  presentation: CollectiblePresentation,\n  textureKey: string,\n): {"""
          new_signature = """const createAssetCollectible = (\n  scene: Phaser.Scene,\n  presentation: CollectiblePresentation,\n  textureKey: string,\n  outlineColor: number,\n): {"""
          if old_signature not in source:
              raise SystemExit('createAssetCollectible signature not found')
          source = source.replace(old_signature, new_signature, 1)

          old_image = """  const image = scene.add\n    .image(presentation.artOffsetX, presentation.artOffsetY, textureKey)\n    .setOrigin(0.5);\n  image.setScale(presentation.assetWidth / Math.max(1, image.width));\n  artContent.add(image);\n  artTarget.add(artContent);"""
          new_image = """  const image = scene.add\n    .image(presentation.artOffsetX, presentation.artOffsetY, textureKey)\n    .setOrigin(0.5);\n  image.setScale(presentation.assetWidth / Math.max(1, image.width));\n\n  // Build the rarity outline before the perspective filter. Eight slightly\n  // shifted copies form a stable 2D silhouette stroke that is then warped by\n  // exactly the same homography as the collectible. This avoids the old\n  // post-filter alpha-neighbour outline becoming subpixel after supersampling.\n  const outlineOffset = 2.4;\n  const diagonalOffset = outlineOffset * 0.72;\n  const outlineOffsets = [\n    [-outlineOffset, 0],\n    [outlineOffset, 0],\n    [0, -outlineOffset],\n    [0, outlineOffset],\n    [-diagonalOffset, -diagonalOffset],\n    [diagonalOffset, -diagonalOffset],\n    [-diagonalOffset, diagonalOffset],\n    [diagonalOffset, diagonalOffset],\n  ] as const;\n  for (const [offsetX, offsetY] of outlineOffsets) {\n    const outline = scene.add\n      .image(\n        presentation.artOffsetX + offsetX,\n        presentation.artOffsetY + offsetY,\n        textureKey,\n      )\n      .setOrigin(0.5)\n      .setTint(outlineColor)\n      .setAlpha(0.62);\n    outline.setScale(image.scaleX, image.scaleY);\n    artContent.add(outline);\n  }\n  artContent.add(image);\n  artTarget.add(artContent);"""
          if old_image not in source:
              raise SystemExit('asset image block not found')
          source = source.replace(old_image, new_image, 1)

          old_call = """      ? createAssetCollectible(scene, presentation, textureKey)\n      : null;"""
          new_call = """      ? createAssetCollectible(scene, presentation, textureKey, accentColor)\n      : null;"""
          if old_call not in source:
              raise SystemExit('createAssetCollectible call not found')
          source = source.replace(old_call, new_call, 1)

          path.write_text(source)
          PY
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
      - name: Commit source changes and clean one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-visible-collectible-outline.yml
          git add src/game/ui/openingVisuals.ts
          git commit -m "Render collectible outline before perspective filter"
          git push origin HEAD:fix/visible-collectible-outline
