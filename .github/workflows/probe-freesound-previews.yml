name: Build Final Curated SFX Set

on:
  push:
    branches:
      - feat/final-sfx-set
    paths:
      - .github/workflows/probe-freesound-previews.yml

permissions:
  contents: write

jobs:
  build-sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/final-sfx-set
          fetch-depth: 0

      - name: Install audio tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download curated CC0 source previews
        shell: python
        run: |
          import html
          import re
          import urllib.request
          from pathlib import Path

          sources = {
              590343: 'foil tear — MrFossy',
              683181: 'magic item — NearTheAtmosphere',
              719971: 'switch / unlock — Jerimee',
              341871: 'ping — edschaefer',
              531512: 'positive blip — CogFireStudios',
              452998: 'blip wave — Breviceps',
              511485: 'cartoon magic sparkle — MLaudio',
              817466: 'cliche magic spell — qubodup',
              450612: 'reverse blip — Breviceps',
              531510: 'correct blips — CogFireStudios',
              683184: 'spawning — NearTheAtmosphere',
              683185: 'power up — NearTheAtmosphere',
              833634: 'success / level passed UI — Nomagician',
              677858: 'game success fanfare short — el_boss',
          }

          out = Path('/tmp/sfx-src')
          out.mkdir(parents=True, exist_ok=True)

          for sound_id, label in sources.items():
              page_url = f'https://freesound.org/s/{sound_id}/'
              req = urllib.request.Request(page_url, headers={'User-Agent': 'Mozilla/5.0'})
              raw = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', errors='replace')
              text = html.unescape(raw).replace('\\/', '/')
              urls = list(dict.fromkeys(re.findall(r'https://cdn\.freesound\.org/previews/[^"\'<> ]+?\.mp3', text)))
              if not urls:
                  raise SystemExit(f'{sound_id}: no MP3 preview URL found')
              url = next((u for u in urls if '-hq.mp3' in u), urls[0])
              target = out / f'{sound_id}.mp3'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              target.write_bytes(urllib.request.urlopen(req, timeout=30).read())
              if target.stat().st_size < 1000:
                  raise SystemExit(f'{sound_id}: downloaded preview is unexpectedly small')
              print(f'{sound_id}: {label}: {url} -> {target.stat().st_size} bytes')

      - name: Sound-design final runtime cues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/audio
          SRC=/tmp/sfx-src
          OUT=public/assets/audio
          ENC='-ar 44100 -ac 2 -c:a libmp3lame -b:a 160k'

          # Tear: tactile real aluminium-foil rip. Keep it dry and fast.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/590343.mp3" \
            -af "atrim=0:0.50,asetpts=PTS-STARTPTS,highpass=f=90,lowpass=f=12000,loudnorm=I=-18:LRA=5:TP=-2,afade=t=out:st=0.45:d=0.05" \
            $ENC "$OUT/tear.mp3"

          # Reveal pop: physical unlock transient + tiny magical item hit.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/683181.mp3" -i "$SRC/719971.mp3" \
            -filter_complex "[0:a]atrim=0:0.40,asetpts=PTS-STARTPTS,volume=1.0[a];[1:a]atrim=0:0.52,asetpts=PTS-STARTPTS,highpass=f=180,volume=0.30[b];[a][b]amix=inputs=2:duration=longest:normalize=0,loudnorm=I=-17:LRA=5:TP=-2,afade=t=out:st=0.48:d=0.06[out]" \
            -map '[out]' $ENC "$OUT/reveal-pop.mp3"

          # Common: one clean, collectible glass ping — intentionally restrained.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/341871.mp3" \
            -af "atrim=0:0.72,asetpts=PTS-STARTPTS,highpass=f=220,lowpass=f=9000,loudnorm=I=-20:LRA=5:TP=-3,afade=t=out:st=0.64:d=0.08" \
            $ENC "$OUT/rarity-common.mp3"

          # Rare: dreamy digital glint, slightly richer than Common.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/531512.mp3" -i "$SRC/452998.mp3" \
            -filter_complex "[0:a]atrim=0:0.92,asetpts=PTS-STARTPTS,volume=0.90[a];[1:a]atrim=0:0.52,asetpts=PTS-STARTPTS,adelay=70:all=1,volume=0.20[b];[a][b]amix=inputs=2:duration=longest:normalize=0,loudnorm=I=-19:LRA=6:TP=-2.5,afade=t=out:st=0.84:d=0.08[out]" \
            -map '[out]' $ENC "$OUT/rarity-rare.mp3"

          # Epic: the crystalline sparkle becomes the hero, with a subtle digital body.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/511485.mp3" -i "$SRC/531512.mp3" \
            -filter_complex "[0:a]atrim=0:1.18,asetpts=PTS-STARTPTS,volume=0.92[a];[1:a]atrim=0:0.60,asetpts=PTS-STARTPTS,adelay=45:all=1,volume=0.16[b];[a][b]amix=inputs=2:duration=longest:normalize=0,loudnorm=I=-18:LRA=7:TP=-2,afade=t=out:st=1.08:d=0.10[out]" \
            -map '[out]' $ENC "$OUT/rarity-epic.mp3"

          # Legendary: a full magical flourish plus the family sparkle signature.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/817466.mp3" -i "$SRC/511485.mp3" -i "$SRC/531512.mp3" \
            -filter_complex "[0:a]atrim=0:1.72,asetpts=PTS-STARTPTS,volume=0.88[a];[1:a]atrim=0:1.10,asetpts=PTS-STARTPTS,adelay=95:all=1,volume=0.34[b];[2:a]atrim=0:0.62,asetpts=PTS-STARTPTS,volume=0.12[c];[a][b][c]amix=inputs=3:duration=longest:normalize=0,loudnorm=I=-17:LRA=8:TP=-2,afade=t=out:st=1.58:d=0.14[out]" \
            -map '[out]' $ENC "$OUT/rarity-legendary.mp3"

          # Duplicate: soft descending/reverse blip — information, not punishment.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/450612.mp3" \
            -af "asetrate=44100*0.90,aresample=44100,atrim=0:0.36,asetpts=PTS-STARTPTS,lowpass=f=6500,loudnorm=I=-22:LRA=4:TP=-4,afade=t=out:st=0.30:d=0.06" \
            $ENC "$OUT/duplicate.mp3"

          # Signal gain: bright compact digital chirp.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/452998.mp3" \
            -af "atrim=0:0.54,asetpts=PTS-STARTPTS,highpass=f=420,lowpass=f=6500,loudnorm=I=-20:LRA=4:TP=-3,afade=t=out:st=0.48:d=0.06" \
            $ENC "$OUT/signal-gain.mp3"

          # Signal lock: crunchy lock transient followed by a confirming digital blip.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/719971.mp3" -i "$SRC/531510.mp3" \
            -filter_complex "[0:a]atrim=0:0.60,asetpts=PTS-STARTPTS,volume=0.72[a];[1:a]atrim=0:0.68,asetpts=PTS-STARTPTS,adelay=65:all=1,highpass=f=300,volume=0.45[b];[a][b]amix=inputs=2:duration=longest:normalize=0,loudnorm=I=-18:LRA=5:TP=-2,afade=t=out:st=0.68:d=0.08[out]" \
            -map '[out]' $ENC "$OUT/signal-lock.mp3"

          # Hidden Pocket: unmistakable second-beat spawn with a little sparkle trail.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/683184.mp3" -i "$SRC/511485.mp3" \
            -filter_complex "[0:a]atrim=0:1.02,asetpts=PTS-STARTPTS,volume=0.88[a];[1:a]atrim=0:0.92,asetpts=PTS-STARTPTS,adelay=105:all=1,volume=0.24[b];[a][b]amix=inputs=2:duration=longest:normalize=0,loudnorm=I=-18:LRA=7:TP=-2,afade=t=out:st=0.98:d=0.10[out]" \
            -map '[out]' $ENC "$OUT/hidden-pocket.mp3"

          # Secret: separate identity — power-up body + magical crystal flourish.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/683185.mp3" -i "$SRC/817466.mp3" -i "$SRC/511485.mp3" \
            -filter_complex "[0:a]atrim=0:1.90,asetpts=PTS-STARTPTS,volume=0.78[a];[1:a]atrim=0:1.82,asetpts=PTS-STARTPTS,volume=0.52[b];[2:a]atrim=0:1.12,asetpts=PTS-STARTPTS,adelay=190:all=1,volume=0.27[c];[a][b][c]amix=inputs=3:duration=longest:normalize=0,loudnorm=I=-16:LRA=9:TP=-1.8,afade=t=out:st=1.86:d=0.16[out]" \
            -map '[out]' $ENC "$OUT/secret-reveal.mp3"

          # Collection complete: clean glockenspiel success language, reinforced but not casino-like.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC/833634.mp3" -i "$SRC/677858.mp3" -i "$SRC/511485.mp3" \
            -filter_complex "[0:a]atrim=0:1.90,asetpts=PTS-STARTPTS,volume=0.82[a];[1:a]atrim=0:2.55,asetpts=PTS-STARTPTS,volume=0.34[b];[2:a]atrim=0:1.05,asetpts=PTS-STARTPTS,adelay=120:all=1,volume=0.18[c];[a][b][c]amix=inputs=3:duration=longest:normalize=0,loudnorm=I=-17:LRA=8:TP=-2,afade=t=out:st=2.38:d=0.17[out]" \
            -map '[out]' $ENC "$OUT/collection-complete.mp3"

      - name: Validate final audio set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            tear.mp3 reveal-pop.mp3 rarity-common.mp3 rarity-rare.mp3 rarity-epic.mp3 rarity-legendary.mp3
            duplicate.mp3 signal-gain.mp3 signal-lock.mp3 hidden-pocket.mp3 secret-reveal.mp3 collection-complete.mp3
          )
          for name in "${expected[@]}"; do
            file="public/assets/audio/$name"
            test -s "$file"
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$file")"
            size="$(stat -c%s "$file")"
            python - "$name" "$duration" "$size" <<'PY'
          import sys
          name, duration, size = sys.argv[1], float(sys.argv[2]), int(sys.argv[3])
          if not 0.04 <= duration <= 3.2:
              raise SystemExit(f'{name}: bad duration {duration:.3f}s')
          if size > 120_000:
              raise SystemExit(f'{name}: unexpectedly large {size} bytes')
          print(f'{name}: {duration:.3f}s, {size/1024:.1f} KB')
          PY
          done

      - name: Enable all reviewed SFX cues and record provenance
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/game/data/audioAssets.ts')
          text = path.read_text()
          marker = 'export const AVAILABLE_SFX_CUES = new Set<SfxCue>();'
          replacement = '''export const AVAILABLE_SFX_CUES = new Set<SfxCue>([
            'tear',
            'reveal-pop',
            'common',
            'rare',
            'epic',
            'legendary',
            'duplicate',
            'signal-gain',
            'signal-lock',
            'hidden-pocket',
            'secret-reveal',
            'collection-complete',
          ]);'''
          if marker not in text:
              raise SystemExit('Expected empty SFX allowlist not found')
          path.write_text(text.replace(marker, replacement))

          Path('docs/SFX_SOURCES.md').write_text('''# SFX source provenance\n\nThe production SFX set is custom-edited from Creative Commons 0 source material. Attribution is not required by CC0, but the source pages are recorded here for provenance and future replacement work.\n\nAll final runtime files are edited, trimmed, layered and loudness-normalized for this game; they are not raw source copies.\n\n| Freesound ID | Source | Used for | License |\n| --- | --- | --- | --- |\n| 590343 | MrFossy — SFX_STICKERRIPPER_foil_25.wav | tear | CC0 |\n| 683181 | NearTheAtmosphere — Magic Item | reveal-pop | CC0 |\n| 719971 | Jerimee — switch-flip-box-open-norm | reveal-pop, signal-lock | CC0 |\n| 341871 | edschaefer — Ping.wav | Common rarity | CC0 |\n| 531512 | CogFireStudios — Positive Blip Effect | Rare/Epic/Legendary texture | CC0 |\n| 452998 | Breviceps — Blip Wave | Rare texture, signal-gain | CC0 |\n| 511485 | MLaudio — cartoon_wink_magic_sparkle.wav | Epic/Legendary/Hidden Pocket/Secret/complete sparkle | CC0 |\n| 817466 | qubodup — Cliche Magic Spell Sound | Legendary, Secret | CC0 |\n| 450612 | Breviceps — Reverse Blip | duplicate | CC0 |\n| 531510 | CogFireStudios — Correct Blips | signal-lock | CC0 |\n| 683184 | NearTheAtmosphere — Spawning | Hidden Pocket | CC0 |\n| 683185 | NearTheAtmosphere — Power Up | Secret | CC0 |\n| 833634 | Nomagician — Success / Level Passed Videogame UI Sound | collection-complete | CC0 |\n| 677858 | el_boss — Game Success Fanfare Short | collection-complete support layer | CC0 |\n\nSource pages use `https://freesound.org/s/<ID>/`.\n''')

      - name: Commit final SFX set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/audio src/game/data/audioAssets.ts docs/SFX_SOURCES.md
          git diff --cached --check
          git commit -m 'Add final production SFX set'
          git push origin HEAD:feat/final-sfx-set
