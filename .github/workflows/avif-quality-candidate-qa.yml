name: AVIF quality candidate QA

# Temporary branch-only browser QA. Remove before merge.
on:
  push:
    branches:
      - perf/avif-quality-audit
    paths:
      - .github/workflows/avif-quality-candidate-qa.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - name: Validate project and AVIF candidate
        run: |
          npm run assets:avif:validate
          npm run typecheck
          npm test
      - name: Build debug candidate
        run: npm run build
        env:
          VITE_PLATFORM_RUNTIME: mock
          VITE_DEBUG_PANEL: 'true'
      - name: Install isolated Chromium harness
        run: |
          rm -rf /tmp/avif-quality-qa
          npm install --prefix /tmp/avif-quality-qa --package-lock=false playwright@1.55.0
          /tmp/avif-quality-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify startup and capture candidate
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/avif-quality-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium, devices } = require('/tmp/avif-quality-qa/node_modules/playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({ ...devices['Pixel 7'], serviceWorkers: 'block' });
              const page = await context.newPage();
              const pageErrors = [];
              const failedResponses = [];
              page.on('pageerror', (error) => pageErrors.push(error.message));
              page.on('response', (response) => {
                if (response.status() >= 400) failedResponses.push(`${response.status()} ${response.url()}`);
              });

              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 120_000 });
              await page.waitForFunction(
                () => document.querySelector('#startup-preload')?.getAttribute('data-state') === 'hidden',
                { timeout: 120_000 },
              );
              if (pageErrors.length) throw new Error(`page errors: ${pageErrors.join(' | ')}`);
              if (failedResponses.length) throw new Error(`failed responses: ${failedResponses.join(' | ')}`);

              await page.getByRole('button', { name: 'Startup art', exact: true }).click();
              await page.waitForFunction(() => document.querySelector('.mpt-debug-panel [data-status]')?.textContent?.includes('runtimeArtFormat'));
              const art = JSON.parse(await page.locator('.mpt-debug-panel [data-status]').textContent());
              if (art.runtimeArtFormat !== 'avif') throw new Error(`expected avif, got ${art.runtimeArtFormat}`);
              if (art.queuedCount !== 115 || art.observedCount !== 115) {
                throw new Error(`expected 115/115 startup assets, got ${art.queuedCount}/${art.observedCount}`);
              }
              if (art.encodedKiB < 3900 || art.encodedKiB > 4200) {
                throw new Error(`encodedKiB ${art.encodedKiB} outside expected candidate range`);
              }
              const requested = await page.evaluate(() => performance.getEntriesByType('resource')
                .map((entry) => entry.name)
                .filter((url) => /\/assets\/(?:collectibles|package|backgrounds)\/.*\.avif(?:\?|$)/.test(url)).length);
              if (requested !== 115) throw new Error(`expected 115 AVIF requests, got ${requested}`);

              await page.screenshot({ path: '/tmp/avif-quality-qa/candidate.png', fullPage: true });
              fs.writeFileSync('/tmp/avif-quality-qa/result.json', JSON.stringify({ art, requested }, null, 2));
              console.log(JSON.stringify({ art, requested }, null, 2));
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avif-quality-candidate-qa
          path: |
            /tmp/avif-quality-qa/result.json
            /tmp/avif-quality-qa/candidate.png
