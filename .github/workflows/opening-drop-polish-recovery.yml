name: Validate recovered Drop selector hide

on:
  push:
    branches:
      - polish/opening-drop-selector

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[opening-drop-recovery]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python3 tools/opening-drop-polish-recovery.py
      - name: Assert recovered reveal contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'if (recovered) this.hideDropSelectorForReveal();' src/game/scenes/OpeningScene.ts
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit recovered reveal fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/scenes/OpeningScene.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[opening-drop-recovery] hide Drop selector during recovered reveal'
          git push origin HEAD:polish/opening-drop-selector
