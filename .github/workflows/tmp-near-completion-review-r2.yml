name: TEMP near completion review R2

on:
  push:
    branches:
      - polish/near-completion-r1

permissions:
  contents: write

jobs:
  review-visual-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/near-completion-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install browser audit dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run corrected visual review
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.ts')
          text = p.read_text(encoding='utf-8')
          anchor = "  game.sound.mute = blocked;\n"
          if anchor not in text: raise SystemExit('audit anchor missing')
          p.write_text(text.replace(anchor, anchor + "  if (import.meta.env.DEV) (window as typeof window & { __mptAuditGame?: Phaser.Game }).__mptAuditGame = game;\n", 1), encoding='utf-8')
          PY
          cat > tools/tmp-near-completion-review.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('audit-artifacts', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
          const errors = [];
          page.on('pageerror', error => errors.push(`pageerror:${error.message}`));
          page.on('console', message => { if (message.type() === 'error') errors.push(`console:${message.text()}`); });
          await page.goto('http://127.0.0.1:5173/?debug=1', { waitUntil: 'load' });
          await page.waitForFunction(() => window.__mptAuditGame?.scene?.getScene?.('OpeningScene')?.phase === 'idle', null, { timeout: 15000 });
          const hide = page.getByRole('button', { name: 'Hide', exact: true });
          if (await hide.isVisible().catch(() => false)) await hide.click();

          const setupPending = async () => page.evaluate(async () => {
            const { SLICE_REGISTRY } = await import('/src/game/data/collectibles.ts');
            const { LITE_V2_BALANCE } = await import('/src/game/data/balance.ts');
            const { createInitialSaveState } = await import('/src/game/systems/save.ts');
            const { createPendingReveal } = await import('/src/game/systems/drops.ts');
            const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
            const ids = SLICE_REGISTRY.standardItems.map(({ collectible }) => collectible.id);
            const state = { ...createInitialSaveState(), totalOpens: 3, discoveredStandard: ids.slice(0, -1) };
            const values = [0.1, 0.1, 0, 0, 0.99];
            const pending = createPendingReveal({
              state,
              registry: SLICE_REGISTRY,
              balance: LITE_V2_BALANCE,
              random: { next: () => values.shift() ?? 0.99 },
              transactionId: 'near-completion-review',
              pouchType: 'basic',
            });
            scene.saveState = { ...state, ...pending.commit, pendingReveal: null };
            scene.lastReveal = pending;
            scene.phase = 'result';
            scene.resultReady = true;
            scene.renderResolvedResult(pending);
            window.__mptNearPending = pending;
            return { isNew: pending.standard.isNew, count: pending.commit.discoveredStandard.length };
          });

          const standardState = await setupPending();
          await page.screenshot({ path: 'audit-artifacts/standard-7of8.png', fullPage: true });
          const standard = await page.evaluate(() => {
            const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
            const near = scene.rewardTrayContainer.list.find(item => item.getData?.('nearCompletion') === true);
            return {
              text: near?.text ?? '',
              trayX: scene.rewardTrayContainer.x,
              trayY: scene.rewardTrayContainer.y,
              trayHeight: Number(scene.rewardTrayContainer.getData('height') ?? 0),
              logicalWidth: scene.metrics.logicalWidth,
            };
          });

          const hidden = await page.evaluate(async () => {
            const { SLICE_REGISTRY } = await import('/src/game/data/collectibles.ts');
            const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
            const pending = window.__mptNearPending;
            const secret = SLICE_REGISTRY.secrets[0];
            const hp = {
              ...pending,
              chips: { ...pending.chips, secretBonus: 40, totalEarned: pending.chips.totalEarned + 40, after: pending.chips.after + 40 },
              hiddenPocket: { collectibleId: secret.collectible.id, familyId: secret.familyId, isNew: true, bonusChips: 40 },
              commit: { ...pending.commit, chips: pending.commit.chips + 40, discoveredSecrets: [secret.collectible.id] },
            };
            scene.saveState = { ...scene.saveState, ...hp.commit, pendingReveal: null };
            scene.lastReveal = hp;
            scene.phase = 'result';
            scene.resultReady = true;
            scene.renderResolvedResult(hp);
            window.__mptHiddenPending = hp;
            const secretNear = scene.rewardTrayContainer.list.find(item => item.getData?.('nearCompletion') === true)?.text ?? '';
            const secretPanel = scene.resultActionPanel.getData('rarity')?.text ?? '';

            scene.resultCarouselIndex = 0;
            scene.positionResultCarousel(0, false);
            scene.renderRewardTray(hp, scene.root, false);
            scene.renderResultActionPanel(hp);
            const standardNear = scene.rewardTrayContainer.list.find(item => item.getData?.('nearCompletion') === true)?.text ?? '';
            const standardPanel = scene.resultActionPanel.getData('rarity')?.text ?? '';
            return { secretNear, secretPanel, standardNear, standardPanel };
          });
          await page.screenshot({ path: 'audit-artifacts/hidden-standard-page-consistent.png', fullPage: true });

          const secretAgain = await page.evaluate(() => {
            const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
            scene.resultCarouselIndex = 1;
            scene.positionResultCarousel(0, false);
            scene.renderRewardTray(window.__mptHiddenPending, scene.root, false);
            scene.renderResultActionPanel(window.__mptHiddenPending);
            return {
              near: scene.rewardTrayContainer.list.find(item => item.getData?.('nearCompletion') === true)?.text ?? '',
              panel: scene.resultActionPanel.getData('rarity')?.text ?? '',
            };
          });
          await page.screenshot({ path: 'audit-artifacts/hidden-secret-page-consistent.png', fullPage: true });

          await page.setViewportSize({ width: 900, height: 720 });
          await page.waitForTimeout(280);
          const narrow = await page.evaluate(() => {
            const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
            scene.resultCarouselIndex = 0;
            scene.renderResolvedResult(window.__mptHiddenPending, 0);
            const near = scene.rewardTrayContainer.list.find(item => item.getData?.('nearCompletion') === true);
            const scale = scene.metrics.scale;
            return {
              text: near?.text ?? '',
              width: near?.width ?? 0,
              trayX: scene.rewardTrayContainer.x,
              trayY: scene.rewardTrayContainer.y,
              trayHeight: Number(scene.rewardTrayContainer.getData('height') ?? 0),
              safeLeft: scene.metrics.safeLeft,
              safeRight: scene.metrics.safeRight,
              scale,
            };
          });
          await page.screenshot({ path: 'audit-artifacts/hidden-standard-900.png', fullPage: true });

          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(standardState.isNew === false && standardState.count === 7, 'review must hold a duplicate at 7/8');
          assert(standard.text === 'STANDARD SET 7/8 · 1 LEFT', `standard copy wrong: ${standard.text}`);
          assert(hidden.secretNear === '' && hidden.secretPanel === 'SECRET', 'Secret page must own Secret semantics and suppress standard tension');
          assert(hidden.standardNear === 'STANDARD SET 7/8 · 1 LEFT' && hidden.standardPanel === 'COMMON', 'standard page must restore standard semantics and near-completion copy');
          assert(secretAgain.near === '' && secretAgain.panel === 'SECRET', 'return to Secret must restore Secret semantics');
          assert(narrow.text === 'STANDARD SET 7/8 · 1 LEFT', '900px layout must retain near-completion copy');
          assert(narrow.width < 200, `900px copy overflow: ${narrow.width}`);
          assert(errors.length === 0, `runtime errors: ${errors.join('; ')}`);
          fs.writeFileSync('audit-artifacts/report.json', JSON.stringify({ standardState, standard, hidden, secretAgain, narrow, errors }, null, 2));
          await browser.close();
          EOF
          npm run dev -- --host 127.0.0.1 > /tmp/mpt-vite.log 2>&1 &
          echo $! > /tmp/mpt-vite.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:5173/?debug=1' >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/mpt-vite.log; exit 1; fi
          node tools/tmp-near-completion-review.mjs
          kill $(cat /tmp/mpt-vite.pid) || true
      - uses: actions/upload-artifact@v4
        with:
          name: near-completion-audit-r2
          path: audit-artifacts
          if-no-files-found: error
      - name: Clean temporary review files
        if: success()
        run: |
          set -euo pipefail
          git checkout -- src/main.ts package.json package-lock.json
          rm -f tools/tmp-near-completion-review.mjs
          rm -rf audit-artifacts
          rm -f .github/workflows/tmp-near-completion-review-r2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary near-completion review workflow'
          git push origin HEAD:polish/near-completion-r1
