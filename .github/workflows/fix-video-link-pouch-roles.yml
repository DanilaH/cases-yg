name: Fix Video Link pouch roles

on:
  push:
    branches:
      - fix/video-link-pouch-role-mapping
    paths:
      - .github/workflows/fix-video-link-pouch-roles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/video-link-pouch-role-mapping
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - run: npm ci

      - name: Recover original Video Link sources
        shell: bash
        run: |
          set -euo pipefail
          git show 'e420c7570c9ce888e24b04d42d9edb3ca938f0ba:biba/ChatGPT Image Sep 11, 2026, 08_27_09 PM (3).png' > /tmp/video-link-charged-body.png
          git show 'e420c7570c9ce888e24b04d42d9edb3ca938f0ba:biba/ChatGPT Image Sep 11, 2026, 08_27_10 PM (4).png' > /tmp/video-link-basic-strip.png

      - name: Rebuild the two misclassified runtime layers
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';

          const trim = async (input) =>
            sharp(input)
              .trim({ background: { r: 0, g: 0, b: 0, alpha: 0 }, threshold: 8 })
              .png()
              .toBuffer();

          const chargedBodySource = await trim('/tmp/video-link-charged-body.png');
          const chargedBody = await sharp(chargedBodySource)
            .resize({ width: 923, height: 959, fit: 'fill' })
            .png()
            .toBuffer();

          await sharp({
            create: {
              width: 1024,
              height: 1024,
              channels: 4,
              background: { r: 0, g: 0, b: 0, alpha: 0 },
            },
          })
            .composite([{ input: chargedBody, left: 68, top: 28 }])
            .webp({ quality: 90, alphaQuality: 100, effort: 6, smartSubsample: true })
            .toFile('public/assets/package/video-link-charged-pouch-body.webp');

          const basicStripSource = await trim('/tmp/video-link-basic-strip.png');
          await sharp(basicStripSource)
            .resize({ width: 984, height: 235, fit: 'fill' })
            .webp({ quality: 90, alphaQuality: 100, effort: 6, smartSubsample: true })
            .toFile('public/assets/package/video-link-basic-pouch-tear-strip-compact.webp');

          const expectations = [
            ['public/assets/package/video-link-charged-pouch-body.webp', 1024, 1024],
            ['public/assets/package/video-link-basic-pouch-tear-strip-compact.webp', 984, 235],
          ];

          for (const [file, width, height] of expectations) {
            const meta = await sharp(file).metadata();
            const stats = await sharp(file).stats();
            const alpha = stats.channels[3];
            if (
              meta.format !== 'webp' ||
              meta.width !== width ||
              meta.height !== height ||
              !meta.hasAlpha ||
              !alpha ||
              alpha.min >= 250 ||
              alpha.max <= 5
            ) {
              throw new Error(`Invalid rebuilt asset: ${file}`);
            }
            console.log(`${file}: ${meta.width}x${meta.height}, alpha ${alpha.min}-${alpha.max}`);
          }
          NODE

      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build

      - name: Commit corrected Video Link assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-video-link-pouch-roles.yml
          git add public/assets/package/video-link-charged-pouch-body.webp \
                  public/assets/package/video-link-basic-pouch-tear-strip-compact.webp
          git commit -m 'Fix Video Link pouch layer roles'
          git push origin HEAD:fix/video-link-pouch-role-mapping
