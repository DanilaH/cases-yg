name: TEMP independent feel timing audit
on:
  push:
    branches:
      - polish/independent-feel-correction-r1
permissions:
  contents: write
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/independent-feel-correction-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Expose audit handles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.ts'); t=p.read_text(); anchor='  game.sound.mute = blocked;\n'
          injection='''  if (import.meta.env.DEV) {\n    const auditWindow = window as typeof window & { __auditGame?: Phaser.Game; __auditAudio?: unknown };\n    auditWindow.__auditGame = game;\n    auditWindow.__auditAudio = audio;\n  }\n'''
          if anchor not in t: raise SystemExit('audit anchor missing')
          p.write_text(t.replace(anchor, anchor + injection, 1))
          PY
      - name: Run timing audit
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 >/tmp/vite-independent-feel-timing.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          node tools/tmp-independent-feel-timing.mjs
      - name: Print report
        if: always()
        run: |
          if test -f audit-independent-feel-timing/report.json; then cat audit-independent-feel-timing/report.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-feel-timing
          path: audit-independent-feel-timing
          retention-days: 14
      - name: Clean audit files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/main.ts package.json package-lock.json || true
          rm -rf audit-independent-feel-timing
          rm -f tools/tmp-independent-feel-timing.mjs
          rm -f .github/workflows/tmp-independent-feel-timing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary independent feel timing audit'
            git push origin HEAD:polish/independent-feel-correction-r1
          fi
