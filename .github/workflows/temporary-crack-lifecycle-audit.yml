name: Temporary crack lifecycle audit
on:
  push:
    branches: [feat/pouch-crack-dissolve-prototype-20260916]
    paths: [.github/workflows/temporary-crack-lifecycle-audit.yml]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/pouch-crack-dissolve-prototype-20260916
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Fix skip-safe crack debris choreography
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/game/scenes/OpeningScene.ts')
          code=path.read_text()
          def replace_exact(before,after):
              global code
              assert code.count(before)==1, (before, code.count(before))
              code=code.replace(before,after,1)
          replace_exact('    }\n      const proxy = { progress: 0.12 };\n', '    }\n    const proxy = { progress: 0.12 };\n')
          replace_exact('    await this.runSkippableTween({\n      targets: proxy,\n      progress: 0.66,', '    // Register debris before the first skippable tween. A skip can then\n    // destroy it without a later continuation spawning orphan particles.\n    this.spawnCrackDebris(rarity);\n    await this.runSkippableTween({\n      targets: proxy,\n      progress: 0.66,')
          replace_exact('    if (this.isSceneShutdown() || !pouch.group.active) return;\n    this.spawnCrackDebris(rarity);\n    await this.runSkippableTween({\n      targets: proxy,\n      progress: 1,', '    if (this.isSceneShutdown() || !pouch.group.active) return;\n    await this.runSkippableTween({\n      targets: proxy,\n      progress: 1,')
          replace_exact('        delay: (index % 4) * 24,\n        ease: lateral ?', '        delay: Math.round(profile.crackDurationMs * 0.30) + (index % 4) * 24,\n        ease: lateral ?')
          path.write_text(code)
          assert code.count('    this.spawnCrackDebris(rarity);')==1
          print('Skip-safe debris patch applied, all exact replacement guards passed')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit only reviewed scene change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/scenes/OpeningScene.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(feel): prevent crack debris respawn after fast-forward'
          git push origin HEAD:feat/pouch-crack-dissolve-prototype-20260916