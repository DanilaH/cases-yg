name: Final post-Secret status sync

on:
  push:
    branches:
      - docs/final-post-secret-regression-accepted

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply accepted-regression status sync
        run: node .github/scripts/final-post-secret-status-sync.mjs
      - name: Verify docs-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only -- . ':!docs/**' ':!.github/scripts/final-post-secret-status-sync.mjs' ':!.github/workflows/final-post-secret-status-sync.yml')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-doc changes:"
            echo "$unexpected"
            exit 1
          fi
          git diff -- docs
      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add docs
          git commit -m 'Mark final post-Secret regression accepted'
          git push origin HEAD:docs/final-post-secret-regression-accepted
