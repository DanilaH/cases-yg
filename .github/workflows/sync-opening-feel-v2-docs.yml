name: Sync Opening Feel V2 docs

on:
  push:
    branches:
      - docs/opening-feel-v2-sync
    paths:
      - .github/workflows/sync-opening-feel-v2-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/opening-feel-v2-sync
          fetch-depth: 0
      - name: Apply reviewed docs sync
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/sync-opening-feel-v2-docs.py
          rm .github/scripts/sync-opening-feel-v2-docs.py
          rm .github/workflows/sync-opening-feel-v2-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Sync docs to Opening Feel V2 runtime'
          git push origin HEAD:docs/opening-feel-v2-sync
