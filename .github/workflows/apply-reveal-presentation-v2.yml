name: Apply Reveal Presentation V2

on:
  push:
    branches:
      - feat/reveal-presentation-v2

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/reveal-presentation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Apply measured presentation changes
        run: |
          python tools/apply-reveal-presentation-v2.py
          rm -f tools/apply-reveal-presentation-v2.py
          rm -f .github/workflows/apply-reveal-presentation-v2.yml
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Asset self-test
        run: npm run assets:selftest
      - name: Validate assets
        run: npm run assets:validate
      - name: Build
        run: npm run build
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Implement Reveal Presentation V2"
          git push origin HEAD:feat/reveal-presentation-v2
