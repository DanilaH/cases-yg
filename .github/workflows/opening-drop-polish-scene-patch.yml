name: Validate opening Drop selector scene patch

on:
  push:
    branches:
      - polish/opening-drop-selector

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[opening-drop-polish-scene]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python3 tools/opening-drop-polish-scene-patch.py
      - name: Assert scene contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'previewLootPoolId' src/game/scenes/OpeningScene.ts
          grep -q 'dropSwitchGeneration' src/game/scenes/OpeningScene.ts
          grep -q 'reconcileDropSelection' src/game/scenes/OpeningScene.ts
          grep -q 'dropSelectorArrowHitWidth' src/game/scenes/OpeningScene.ts
          grep -q 'STANDARD.*SECRET' src/game/scenes/OpeningScene.ts || true
          grep -q 'hideDropSelectorForReveal' src/game/scenes/OpeningScene.ts
          grep -q 'scheduleTearHint' src/game/scenes/OpeningScene.ts
          grep -q 'addPersistentStandardSilhouetteAccent' src/game/scenes/OpeningScene.ts
          ! grep -q "this.phase !== 'idle' || this.dropSwitchInFlight || this.pouchArtLoadInFlight || !this.session" src/game/scenes/OpeningScene.ts
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit scene implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/scenes/OpeningScene.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[opening-drop-polish-scene] implement tactile latest-wins Drop selector'
          git push origin HEAD:polish/opening-drop-selector
