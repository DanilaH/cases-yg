name: Temporary Signal two-way audio patch
on:
  push:
    branches: [feat/crack-variation-signal-audio-20260916]
    paths: [.github/workflows/temporary-signal-audio-flight-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/crack-variation-signal-audio-20260916
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Patch only presentation audio sites
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game/scenes/OpeningScene.ts')
          s=p.read_text()
          start=s.index('  private async animateSignalLockConsumptionPrelude(')
          end=s.index('  private async bankSignalGain(',start)
          section=s[start:end]
          old="    this.root.add([ring, discharge]);\n    getGameAudio().play('signal-lock');"
          assert section.count(old)==1
          section=section.replace(old,"    this.root.add([ring, discharge]);\n    getGameAudio().play('signal-launch');\n    getGameAudio().play('signal-lock');")
          old="    if (!this.root || this.isSceneShutdown()) return;\n\n    const impact = this.add"
          assert section.count(old)==1
          section=section.replace(old,"    if (!this.root || this.isSceneShutdown()) return;\n    getGameAudio().play('signal-dock');\n\n    const impact = this.add")
          s=s[:start]+section+s[end:]
          start=s.index('  private async animateOverchargeTransition(')
          end=s.index('  private finishDeferredBankingResize(',start)
          section=s[start:end]
          old="      this.root.add(fragment);\n      getGameAudio().play('signal-gain');"
          assert section.count(old)==1
          section=section.replace(old,"      this.root.add(fragment);\n      getGameAudio().play('signal-launch');\n      getGameAudio().play('signal-gain');")
          old="      if (this.isSceneShutdown()) return;\n      this.renderSignalHud(this.root, { ...this.saveState, signal: pending.signal.after, overchargeHundredths: after });"
          assert section.count(old)==1
          section=section.replace(old,"      if (this.isSceneShutdown()) return;\n      getGameAudio().play('signal-dock');\n      this.renderSignalHud(this.root, { ...this.saveState, signal: pending.signal.after, overchargeHundredths: after });")
          s=s[:start]+section+s[end:]
          p.write_text(s)
          assert s.count("getGameAudio().play('signal-launch')")==3
          assert s.count("getGameAudio().play('signal-dock')")==3
          print('PASS launch/dock each on lock consumption, regular Signal gain and Overcharge gain')
          PY
          git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit production code only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/scenes/OpeningScene.ts
          git diff --cached --check
          git commit -m 'fix(audio): cue Signal launches and impacts in all flight paths'
          git push origin HEAD:feat/crack-variation-signal-audio-20260916
