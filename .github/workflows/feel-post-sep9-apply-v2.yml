name: Apply post-Sep-9 feel polish v2

on:
  push:
    branches:
      - feel/post-sep9-polish
    paths:
      - .github/workflows/feel-post-sep9-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feel/post-sep9-polish
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Apply bounded feel corrections
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/game/data/presentation.ts',
              "  dropSelectorSwitchMs: 120,\n  dropSelectorDotSize: 4,",
              "  dropSelectorSwitchMs: 120,\n  dropPreviewPouchOffsetX: 16,\n  dropPreviewPanelOffsetX: 10,\n  dropPreviewEntryScale: 0.985,\n  dropPreviewEntryAlpha: 0.74,\n  pouchSwapEntryOffsetY: 8,\n  pouchSwapEntryScale: 0.975,\n  pouchSwapEntryAlpha: 0.68,\n  pouchSwapEntryMs: 155,\n  dropSelectorDotSize: 4,",
              'opening presentation constants',
          )
          replace_once(
              'src/game/data/presentation.ts',
              "export const RESULT_PRESENTATION = {",
              "export const COLLECTION_FEEL_PRESENTATION = {\n  contentViewEntryMs: 140,\n  contentDropEntryMs: 160,\n  contentDropEntryOffsetX: 16,\n  contentViewEntryOffsetY: 5,\n  contentEntryAlpha: 0.72,\n  controlHoverScale: 1.025,\n  controlPressScale: 0.96,\n  controlPressMs: 60,\n  controlReleaseMs: 90,\n  returnHandoffMs: 60,\n} as const;\n\nexport const RESULT_PRESENTATION = {",
              'collection presentation constants',
          )

          replace_once(
              'src/game/scenes/OpeningScene.ts',
              "    pouch.setX(pouchX + direction * 12).setAlpha(0.78);\n    panel.setX(panelX + direction * 8).setAlpha(0.82);\n    this.tweens.add({\n      targets: pouch,\n      x: pouchX,\n      alpha: 1,\n      duration: OPENING_FEEL_PRESENTATION.dropSelectorSwitchMs,\n      ease: 'Cubic.Out',\n    });",
              "    pouch\n      .setX(pouchX + direction * OPENING_FEEL_PRESENTATION.dropPreviewPouchOffsetX)\n      .setScale(OPENING_FEEL_PRESENTATION.dropPreviewEntryScale)\n      .setAlpha(OPENING_FEEL_PRESENTATION.dropPreviewEntryAlpha);\n    panel\n      .setX(panelX + direction * OPENING_FEEL_PRESENTATION.dropPreviewPanelOffsetX)\n      .setAlpha(0.8);\n    this.tweens.add({\n      targets: pouch,\n      x: pouchX,\n      scale: 1,\n      alpha: 1,\n      duration: OPENING_FEEL_PRESENTATION.dropSelectorSwitchMs,\n      ease: 'Cubic.Out',\n    });",
              'drop preview arrival',
          )
          replace_once(
              'src/game/scenes/OpeningScene.ts',
              "    if (animateEntry) this.animateIdleEntry();\n  }\n\n  private animateIdleEntry(): void {",
              "    if (animateEntry) this.animateIdleEntry();\n  }\n\n  private animatePouchSwapEntry(): void {\n    const pouch = this.pouch?.group;\n    if (!pouch?.active) return;\n    const targetY = pouch.y;\n    pouch\n      .setY(targetY + OPENING_FEEL_PRESENTATION.pouchSwapEntryOffsetY)\n      .setScale(OPENING_FEEL_PRESENTATION.pouchSwapEntryScale)\n      .setAlpha(OPENING_FEEL_PRESENTATION.pouchSwapEntryAlpha);\n    this.tweens.add({\n      targets: pouch,\n      y: targetY,\n      scale: 1,\n      alpha: 1,\n      duration: OPENING_FEEL_PRESENTATION.pouchSwapEntryMs,\n      ease: 'Back.Out',\n    });\n  }\n\n  private animateIdleEntry(): void {",
              'pouch swap helper',
          )
          replace_once(
              'src/game/scenes/OpeningScene.ts',
              "      this.pouchArtLoadInFlight = false;\n      if (this.phase === 'idle' && !this.isSceneShutdown()) this.renderIdle();\n    });",
              "      this.pouchArtLoadInFlight = false;\n      if (this.phase === 'idle' && !this.isSceneShutdown()) {\n        this.renderIdle();\n        this.animatePouchSwapEntry();\n      }\n    });",
              'pouch swap invocation',
          )

          replace_once(
              'src/game/scenes/CollectionScene.ts',
              "import { staticTextureKey } from '../data/artAssets';",
              "import { staticTextureKey } from '../data/artAssets';\nimport { COLLECTION_FEEL_PRESENTATION } from '../data/presentation';",
              'collection feel import',
          )
          replace_once(
              'src/game/scenes/CollectionScene.ts',
              "type CollectionView = 'shelf' | 'library';\n\nexport class CollectionScene extends Phaser.Scene {",
              "type CollectionView = 'shelf' | 'library';\ntype CollectionEntryMotion = 'none' | 'view' | 'next' | 'previous';\n\nexport class CollectionScene extends Phaser.Scene {",
              'collection entry type',
          )
          replace_once(
              'src/game/scenes/CollectionScene.ts',
              "  private page = 0;\n  private dropBrowseInFlight = false;",
              "  private page = 0;\n  private dropBrowseInFlight = false;\n  private pendingEntryMotion: CollectionEntryMotion = 'none';",
              'collection entry field',
          )
          replace_once(
              'src/game/scenes/CollectionScene.ts',
              "    if (this.view === 'shelf') {\n      this.renderShelf(root);\n    } else {\n      this.renderLibrary(root);\n    }\n\n    if (this.view === 'shelf') {",
              "    const content = this.add.container(0, 0);\n    root.add(content);\n    if (this.view === 'shelf') {\n      this.renderShelf(content);\n    } else {\n      this.renderLibrary(content);\n    }\n    this.animateContentEntry(content);\n\n    if (this.view === 'shelf') {",
              'collection content container',
          )
          replace_once(
              'src/game/scenes/CollectionScene.ts',
              "  private createTab(\n",
              "  private animateContentEntry(content: Phaser.GameObjects.Container): void {\n    const motion = this.pendingEntryMotion;\n    this.pendingEntryMotion = 'none';\n    if (motion === 'none') return;\n\n    const directional = motion === 'next' || motion === 'previous';\n    const offsetX = motion === 'next'\n      ? COLLECTION_FEEL_PRESENTATION.contentDropEntryOffsetX\n      : motion === 'previous'\n        ? -COLLECTION_FEEL_PRESENTATION.contentDropEntryOffsetX\n        : 0;\n    const offsetY = motion === 'view' ? COLLECTION_FEEL_PRESENTATION.contentViewEntryOffsetY : 0;\n    content\n      .setPosition(offsetX, offsetY)\n      .setAlpha(COLLECTION_FEEL_PRESENTATION.contentEntryAlpha);\n    this.tweens.add({\n      targets: content,\n      x: 0,\n      y: 0,\n      alpha: 1,\n      duration: directional\n        ? COLLECTION_FEEL_PRESENTATION.contentDropEntryMs\n        : COLLECTION_FEEL_PRESENTATION.contentViewEntryMs,\n      ease: 'Cubic.Out',\n    });\n  }\n\n  private createTab(\n",
              'collection entry helper',
          )
          replace_once(
              'src/game/scenes/CollectionScene.ts',
              "      getGameAudio().play('ui-click');\n      this.view = view;\n      getPlatformRuntime().analytics.track('collection_view_changed', {",
              "      getGameAudio().play('ui-click');\n      this.view = view;\n      this.pendingEntryMotion = 'view';\n      getPlatformRuntime().analytics.track('collection_view_changed', {",
              'collection view entry intent',
          )
          replace_once(
              'src/game/scenes/CollectionScene.ts',
              "    this.page = nextPage;\n    this.dropBrowseInFlight = false;\n    getPlatformRuntime().analytics.track('collection_drop_browsed', {",
              "    this.page = nextPage;\n    this.dropBrowseInFlight = false;\n    this.pendingEntryMotion = direction > 0 ? 'next' : 'previous';\n    getPlatformRuntime().analytics.track('collection_drop_browsed', {",
              'collection drop entry intent',
          )

          old_back = """    back.on('pointerdown', () => {\n      getGameAudio().play('ui-click');\n      back.disableInteractive().setAlpha(0.65);\n      const lootPoolId = this.selectedLootPoolId();\n      getPlatformRuntime().analytics.track('collection_return', {\n        view: this.view,\n        lootPoolId,\n        standardCount: this.selectedPoolProgress().standardCount,\n      });\n      // Collection browsing is local. OpeningSession owns the durable switch.\n      // Defer scene replacement until the current pointer dispatch has completed.\n      this.time.delayedCall(0, () => this.scene.start('OpeningScene', { lootPoolId }));\n    });"""
          new_back = """    back.on('pointerover', () => {\n      this.tweens.killTweensOf(back);\n      this.tweens.add({ targets: back, scale: COLLECTION_FEEL_PRESENTATION.controlHoverScale, duration: COLLECTION_FEEL_PRESENTATION.controlReleaseMs, ease: 'Sine.Out' });\n    });\n    back.on('pointerout', () => {\n      this.tweens.killTweensOf(back);\n      this.tweens.add({ targets: back, scale: 1, duration: COLLECTION_FEEL_PRESENTATION.controlReleaseMs, ease: 'Sine.Out' });\n    });\n    back.on('pointerdown', () => {\n      this.tweens.killTweensOf(back);\n      this.tweens.add({ targets: back, scale: COLLECTION_FEEL_PRESENTATION.controlPressScale, duration: COLLECTION_FEEL_PRESENTATION.controlPressMs, ease: 'Sine.Out' });\n    });\n    back.on('pointerup', () => {\n      getGameAudio().play('ui-click');\n      back.disableInteractive().setAlpha(0.65);\n      const lootPoolId = this.selectedLootPoolId();\n      getPlatformRuntime().analytics.track('collection_return', {\n        view: this.view,\n        lootPoolId,\n        standardCount: this.selectedPoolProgress().standardCount,\n      });\n      this.tweens.killTweensOf(back);\n      this.tweens.add({ targets: back, scale: 1, duration: COLLECTION_FEEL_PRESENTATION.controlReleaseMs, ease: 'Sine.Out' });\n      this.time.delayedCall(COLLECTION_FEEL_PRESENTATION.returnHandoffMs, () => {\n        this.scene.start('OpeningScene', { lootPoolId });\n      });\n    });"""
          replace_once('src/game/scenes/CollectionScene.ts', old_back, new_back, 'collection return control')

          old_mute = """    button.on('pointerup', () => {\n      const wasMuted = audio.isMuted();\n      if (!wasMuted) audio.play('ui-click');\n      const muted = audio.toggleMuted();\n      if (wasMuted && !muted) audio.play('ui-click');\n      void persistMutedPreference(getPlatformRuntime().storage, muted).catch((error: unknown) => {\n        console.warn('[settings] failed to persist mute preference', error);\n      });\n      this.render();\n    });"""
          new_mute = """    button.on('pointerover', () => {\n      this.tweens.killTweensOf(button);\n      this.tweens.add({ targets: button, scale: COLLECTION_FEEL_PRESENTATION.controlHoverScale, duration: COLLECTION_FEEL_PRESENTATION.controlReleaseMs, ease: 'Sine.Out' });\n    });\n    button.on('pointerout', () => {\n      this.tweens.killTweensOf(button);\n      this.tweens.add({ targets: button, scale: 1, duration: COLLECTION_FEEL_PRESENTATION.controlReleaseMs, ease: 'Sine.Out' });\n    });\n    button.on('pointerdown', () => {\n      this.tweens.killTweensOf(button);\n      this.tweens.add({ targets: button, scale: COLLECTION_FEEL_PRESENTATION.controlPressScale, duration: COLLECTION_FEEL_PRESENTATION.controlPressMs, ease: 'Sine.Out' });\n    });\n    button.on('pointerup', () => {\n      const wasMuted = audio.isMuted();\n      if (!wasMuted) audio.play('ui-click');\n      const muted = audio.toggleMuted();\n      if (wasMuted && !muted) audio.play('ui-click');\n      button.setText(muted ? `🔇 ${messages.audio.unmute}` : `🔊 ${messages.audio.mute}`);\n      this.tweens.killTweensOf(button);\n      this.tweens.add({ targets: button, scale: 1, duration: COLLECTION_FEEL_PRESENTATION.controlReleaseMs, ease: 'Sine.Out' });\n      void persistMutedPreference(getPlatformRuntime().storage, muted).catch((error: unknown) => {\n        console.warn('[settings] failed to persist mute preference', error);\n      });\n    });"""
          replace_once('src/game/scenes/CollectionScene.ts', old_mute, new_mute, 'collection mute control')

          Path('docs/FEEL_AUDIT_2026-09-16.md').write_text('''# Signal 2000 — feel audit 2026-09-16\n\nStatus: **bounded correction implemented; automated gates required; final subjective hands-on remains human-owned**.\n\n## Audit frame\n\nThis pass audits the current product rather than reopening the Sep-9 feel work. The mature tear/reveal/reward/audio choreography already has strong structural repeated-use evidence, so source inspection alone is not a reason to retune it. The audit targets seams introduced by later work: multi-Drop navigation, Basic/Charged selection, Collection browsing, onboarding and responsive chrome.\n\n## Strong areas intentionally preserved\n\n- tear drag has immediate grab response plus continuous progress/velocity texture;\n- pouch/result pointer depth and idle life keep the hero responsive;\n- reveal hierarchy, anticipation and persistent rarity states are differentiated;\n- environment continuity survives reveal/result/idle;\n- NEW, duplicate, rarity, Signal and banking meanings stay independent;\n- reward acceptance banks value to real HUD destinations;\n- rarity ambience owns/ducks the base mix with deterministic cleanup;\n- onboarding uses a physical pouch arrival and the real tear control instead of a modal tutorial.\n\nAudio timbre and long-hold comfort remain human ear-check items and are not retuned here.\n\n## High-ROI seams and corrections\n\n### Basic ↔ Charged swap continuity\nThe outgoing pouch acknowledged selection, but the replacement appeared at its final state after `renderIdle()`. The new pouch now receives a short local fade/scale/vertical settle. The rest of the HUD is not replayed.\n\n### Opening Drop preview\nThe latest-intent/non-blocking architecture is preserved. The incoming pouch preview now has a slightly clearer directional offset and tiny scale settle, with no extra wait.\n\n### Collection state changes\nShelf ↔ Catalog and Drop browsing previously hard-cut the content. The changing content now lives in a local entry container: view changes get a short neutral settle, Drop browse gets a short directional entry. The background and top chrome remain stable.\n\n### Collection Return / Mute\nReturn and Mute now share the surrounding hover/press/release vocabulary. Return activates on completed pointer-up with a 60 ms visual handoff. Mute updates its label in place instead of rebuilding the Collection scene.\n\n## Independent review / explicit non-changes\n\n- no reward/economy/RNG/save changes;\n- no tear geometry or threshold changes;\n- no reveal-hold retuning without fresh hands-on evidence;\n- no new particles, shaders, ambience layers or audio retuning;\n- no onboarding rewrite or extra tutorial copy;\n- no blocking Drop-switch animation;\n- no Collection feature expansion;\n- no broad `OpeningScene` refactor.\n\n## Acceptance boundary\n\nAutomated green proves correctness/lifecycle compatibility, not subjective feel. The remaining hands-on check is intentionally small: repeat Basic ↔ Charged switching, rapid Opening Drop browsing, Shelf ↔ Catalog, Collection Drop browsing and Return/Mute at desktop and compact landscape sizes. Reject the pass if any transition feels slower or more ornamental than the information change it explains.\n''')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run assets:avif:validate
      - run: npm run build
      - name: Commit validated correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/data/presentation.ts src/game/scenes/OpeningScene.ts src/game/scenes/CollectionScene.ts docs/FEEL_AUDIT_2026-09-16.md
          git commit -m "Feel: polish late-added interaction seams"
          git push origin HEAD:feel/post-sep9-polish
