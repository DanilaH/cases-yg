name: TEMP randomize Secret presence R2
on:
  push:
    branches: [polish/independent-feel-correction-r1]
    paths: [.github/workflows/tmp-randomize-secret-presence-r2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/independent-feel-correction-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded Secret composition correction
        run: |
          python tools/tmp-randomize-secret-presence.py
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "src/game/scenes/OpeningScene.ts "
          grep -q "const sparklePhase = Phaser.Math.FloatBetween" src/game/scenes/OpeningScene.ts
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit product correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/scenes/OpeningScene.ts
          git commit -m 'Randomize persistent Secret sparkle composition'
          git push origin HEAD:polish/independent-feel-correction-r1
          touch /tmp/product-committed
      - name: Remove temporary files
        if: always()
        run: |
          if [ ! -f /tmp/product-committed ]; then git checkout HEAD -- src/game/scenes/OpeningScene.ts || true; fi
          rm -f .github/workflows/tmp-randomize-secret-presence-r2.yml tools/tmp-randomize-secret-presence.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary Secret presence tooling'
            git push origin HEAD:polish/independent-feel-correction-r1
          fi
