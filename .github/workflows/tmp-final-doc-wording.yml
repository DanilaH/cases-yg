name: Temporary final docs wording fix

on:
  push:
    branches:
      - docs/sync-post-result-feel-polish-v2
    paths:
      - .github/workflows/tmp-final-doc-wording.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Align public content gate wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/DECISIONS.md')
          text = p.read_text(encoding='utf-8')
          old = '| Public content direction | LOCKED | materially expand only after corrected hands-on + hosted draft validation |'
          new = '| Public content direction | LOCKED | materially expand only after final hands-on acceptance + hosted draft validation |'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old public-content row, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -Fq '| Public content direction | LOCKED | materially expand only after final hands-on acceptance + hosted draft validation |' docs/DECISIONS.md
      - name: Commit final wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add docs/DECISIONS.md
          git commit -m 'Clarify final content expansion gate'
          git push origin HEAD:docs/sync-post-result-feel-polish-v2
