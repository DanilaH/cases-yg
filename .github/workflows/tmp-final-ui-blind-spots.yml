name: Temporary final UI blind-spot patch

on:
  push:
    branches:
      - fix/final-ui-blind-spots
    paths:
      - .github/tmp-final-ui-blind-spots.py
      - .github/workflows/tmp-final-ui-blind-spots.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Apply bounded source patch
        run: python .github/tmp-final-ui-blind-spots.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add src/game/scenes/OpeningScene.ts src/styles.css
          git commit -m 'Polish final UI blind spots'
          git push origin HEAD:fix/final-ui-blind-spots
