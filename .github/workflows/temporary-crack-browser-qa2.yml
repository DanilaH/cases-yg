name: Temporary crack dissolve browser QA 2
on:
  push:
    branches: [feat/pouch-crack-dissolve-prototype-20260916]
    paths: [.github/workflows/temporary-crack-browser-qa2.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    env:
      VITE_PLATFORM_RUNTIME: mock
      VITE_DEBUG_PANEL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and Chromium
        run: |
          npm ci
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Prepare test-only reward RNG and browser script
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          rng=Path('src/game/systems/random.ts')
          rng_source=rng.read_text()
          original='export class MathRandomSource implements RandomSource {\n  public next(): number {\n    return Math.random();'
          replacement='''export class MathRandomSource implements RandomSource {
            private qaIndex = 0;
            public next(): number {
              const rarity = import.meta.env.VITE_CRACK_QA_RARITY;
              if (rarity === 'rare' || rarity === 'legendary') {
                const sample = rarity === 'rare' ? [0.1, 0.8, 0, 0, 0.99] : [0.1, 0.99, 0, 0, 0.99];
                return sample[(this.qaIndex++) % sample.length]!;
              }
              return Math.random();'''
          assert rng_source.count(original)==1
          rng.write_text(rng_source.replace(original,replacement))
          prior=Path('.github/workflows/temporary-crack-browser-qa.yml').read_text()
          code=textwrap.dedent(prior.split("cat > /tmp/qa-crack.py <<'PY'\n",1)[1].split('\n          PY',1)[0])
          old='      await page.wait_for_timeout(2400)'
          new="      await page.locator('#startup-preload').wait_for(state='hidden',timeout=90000)\n      await page.wait_for_timeout(1200)"
          assert code.count(old)==1
          code=code.replace(old,new)
          code=code.replace('for index in range(35):','for index in range(95):')
          code=code.replace("      await page.screenshot(path=str(out/'after.png')", "      print('STORAGE_FINAL',tier,json.dumps(state),flush=True)\n      await page.screenshot(path=str(out/'after.png')")
          Path('/tmp/qa-crack2.py').write_text(code)
          PY
      - name: Record actual tear rare and legendary
        run: |
          for rarity in rare legendary; do
            VITE_CRACK_QA_RARITY="$rarity" npm run build
            python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/crack-preview.log 2>&1 &
            server=$!
            sleep 2
            python /tmp/qa-crack2.py "$rarity" || { kill "$server" 2>/dev/null || true; exit 1; }
            kill "$server" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-crack-rare-vs-legendary-round2
          path: crack-browser-qa/
          if-no-files-found: ignore
          retention-days: 3
