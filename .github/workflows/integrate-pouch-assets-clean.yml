name: Integrate Pouch Assets Clean

on:
  push:
    branches:
      - feat/pouch-runtime-assets-clean
    paths:
      - .github/workflows/integrate-pouch-assets-clean.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/pouch-runtime-assets-clean
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - name: Prepare aligned pouch runtime layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/package
          node --input-type=module <<'NODE'
          import sharp from 'sharp';

          const assets = [
            {
              id: 'pouch-body',
              source: 'incoming/ChatGPT Image Sep 4, 2026, 12_25_10 AM (1).png',
              output: 'public/assets/package/pouch-body.webp',
            },
            {
              id: 'pouch-tear-strip',
              source: 'incoming/ChatGPT Image Sep 4, 2026, 12_25_11 AM (2).png',
              output: 'public/assets/package/pouch-tear-strip.webp',
            },
            {
              id: 'pouch-star-tab',
              source: 'incoming/ChatGPT Image Sep 4, 2026, 12_25_11 AM (3).png',
              output: 'public/assets/package/pouch-star-tab.webp',
            },
          ];

          for (const asset of assets) {
            const input = sharp(asset.source);
            const meta = await input.metadata();
            if (!meta.width || !meta.height || meta.width !== meta.height) {
              throw new Error(`${asset.id}: expected square source canvas, got ${meta.width}x${meta.height}`);
            }
            if (!meta.hasAlpha) {
              throw new Error(`${asset.id}: source has no alpha channel`);
            }

            const stats = await sharp(asset.source).stats();
            const alpha = stats.channels[3];
            if (!alpha || alpha.min >= 250 || alpha.max <= 5) {
              throw new Error(`${asset.id}: source does not contain meaningful transparent/opaque alpha`);
            }

            await sharp(asset.source)
              .resize(1024, 1024, { fit: 'fill' })
              .webp({ quality: 90, alphaQuality: 100, effort: 6, smartSubsample: true })
              .toFile(asset.output);

            const outMeta = await sharp(asset.output).metadata();
            const outStats = await sharp(asset.output).stats();
            const outAlpha = outStats.channels[3];
            if (outMeta.width !== 1024 || outMeta.height !== 1024 || !outMeta.hasAlpha || !outAlpha || outAlpha.min >= 250) {
              throw new Error(`${asset.id}: invalid runtime export`);
            }
            console.log(`${asset.id}: ${meta.width}x${meta.height} -> 1024x1024, alpha ${outAlpha.min}-${outAlpha.max}`);
          }
          NODE
      - name: Enable reviewed pouch art
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/game/data/artAssets.ts')
          text = path.read_text()
          marker = 'export const AVAILABLE_STATIC_ART_IDS = new Set<StaticArtId>();'
          replacement = """export const AVAILABLE_STATIC_ART_IDS = new Set<StaticArtId>([
            'pouch-body',
            'pouch-tear-strip',
            'pouch-star-tab',
          ]);"""
          if marker not in text:
              raise SystemExit('Expected empty static-art allowlist marker not found')
          path.write_text(text.replace(marker, replacement))
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Replace incoming pouch sources with runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            'incoming/ChatGPT Image Sep 2, 2026, 12_02_20 PM.png' \
            'incoming/ChatGPT Image Sep 4, 2026, 12_25_10 AM (1).png' \
            'incoming/ChatGPT Image Sep 4, 2026, 12_25_11 AM (2).png' \
            'incoming/ChatGPT Image Sep 4, 2026, 12_25_11 AM (3).png'
          git add public/assets/package src/game/data/artAssets.ts
          git commit -m 'Add final mystery pouch runtime assets'
          git push origin HEAD:feat/pouch-runtime-assets-clean
