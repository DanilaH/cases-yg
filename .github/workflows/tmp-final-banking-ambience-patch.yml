name: Temporary Final Banking Ambience Patch

on:
  push:
    branches:
      - feel/final-banking-ambience-r1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[banking-ambience-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feel/final-banking-ambience-r1
      - name: Apply reviewed banking ambience patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def apply(path_str, replacements):
              path = Path(path_str)
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
                  text = text.replace(old, new)
              path.write_text(text)

          apply('src/game/data/audioPresentation.ts', [
              (
                  """  introSettleMs: number;\n  baseMixMultiplier: number;""",
                  """  introSettleMs: number;\n  bankingPeakMultiplier: number;\n  bankingToneFilterLiftHz: number;\n  bankingShimmerMultiplier: number;\n  baseMixMultiplier: number;""",
              ),
              ("""    introSettleMs: 0,\n    baseMixMultiplier: 0.96,""", """    introSettleMs: 0,\n    bankingPeakMultiplier: 1,\n    bankingToneFilterLiftHz: 0,\n    bankingShimmerMultiplier: 1,\n    baseMixMultiplier: 0.96,"""),
              ("""    introSettleMs: 260,\n    baseMixMultiplier: 0.68,""", """    introSettleMs: 260,\n    bankingPeakMultiplier: 1.1,\n    bankingToneFilterLiftHz: 180,\n    bankingShimmerMultiplier: 1.12,\n    baseMixMultiplier: 0.68,"""),
              ("""    introSettleMs: 280,\n    baseMixMultiplier: 0.55,""", """    introSettleMs: 280,\n    bankingPeakMultiplier: 1.12,\n    bankingToneFilterLiftHz: 260,\n    bankingShimmerMultiplier: 1.16,\n    baseMixMultiplier: 0.55,"""),
              ("""    introSettleMs: 320,\n    baseMixMultiplier: 0.43,""", """    introSettleMs: 320,\n    bankingPeakMultiplier: 1.16,\n    bankingToneFilterLiftHz: 420,\n    bankingShimmerMultiplier: 1.22,\n    baseMixMultiplier: 0.43,"""),
              ("""    introSettleMs: 360,\n    baseMixMultiplier: 0.31,""", """    introSettleMs: 360,\n    bankingPeakMultiplier: 1.18,\n    bankingToneFilterLiftHz: 620,\n    bankingShimmerMultiplier: 1.28,\n    baseMixMultiplier: 0.31,"""),
          ])

          apply('src/game/systems/audio.ts', [
              (
                  """  private persistentRarityBus: GainNode | null = null;\n  private persistentRaritySources: AudioScheduledSourceNode[] = [];""",
                  """  private persistentRarityBus: GainNode | null = null;\n  private persistentRarityToneFilter: BiquadFilterNode | null = null;\n  private persistentRarityShimmerGain: GainNode | null = null;\n  private persistentRaritySources: AudioScheduledSourceNode[] = [];""",
              ),
              (
                  """  public clearResultAmbience(): void {\n    this.desiredResultAmbience = null;\n    this.cancelQueuedResultAmbience();\n    if (this.context) {\n      const fadeOutMs = this.activeResultAmbience\n        ? getRarityAmbienceProfile(this.activeResultAmbience).fadeOutMs\n        : 190;\n      this.stopPersistentRarity(this.context, fadeOutMs, true);\n    }\n  }\n\n  private applyPresentationCue""",
                  """  public clearResultAmbience(): void {\n    this.desiredResultAmbience = null;\n    this.cancelQueuedResultAmbience();\n    if (this.context) {\n      const fadeOutMs = this.activeResultAmbience\n        ? getRarityAmbienceProfile(this.activeResultAmbience).fadeOutMs\n        : 190;\n      this.stopPersistentRarity(this.context, fadeOutMs, true);\n    }\n  }\n\n  public setResultBankingProgress(progress: number): void {\n    const context = this.context;\n    const rarity = this.activeResultAmbience;\n    const bus = this.persistentRarityBus;\n    if (!context || context.state !== 'running' || !rarity || !bus) return;\n\n    const profile = getRarityAmbienceProfile(rarity);\n    const clamped = Math.max(0, Math.min(1, progress));\n    const eased = 1 - (1 - clamped) * (1 - clamped);\n    const now = context.currentTime;\n    const at = now + 0.07;\n    const busTarget = profile.busGain * (1 + (profile.bankingPeakMultiplier - 1) * eased);\n    bus.gain.cancelScheduledValues(now);\n    bus.gain.setValueAtTime(Math.max(0.0001, bus.gain.value), now);\n    bus.gain.linearRampToValueAtTime(busTarget, at);\n\n    const toneFilter = this.persistentRarityToneFilter;\n    if (toneFilter) {\n      toneFilter.frequency.cancelScheduledValues(now);\n      toneFilter.frequency.setValueAtTime(Math.max(20, toneFilter.frequency.value), now);\n      toneFilter.frequency.linearRampToValueAtTime(\n        profile.toneLowpassHz + profile.bankingToneFilterLiftHz * eased,\n        at,\n      );\n    }\n\n    const shimmerGain = this.persistentRarityShimmerGain;\n    if (shimmerGain) {\n      shimmerGain.gain.cancelScheduledValues(now);\n      shimmerGain.gain.setValueAtTime(Math.max(0.0001, shimmerGain.gain.value), now);\n      shimmerGain.gain.linearRampToValueAtTime(\n        profile.shimmerGain * (1 + (profile.bankingShimmerMultiplier - 1) * eased),\n        at,\n      );\n    }\n  }\n\n  private applyPresentationCue""",
              ),
              (
                  """    toneFilter.frequency.setValueAtTime(profile.toneLowpassHz, now);\n    toneFilter.Q.setValueAtTime(0.65, now);""",
                  """    toneFilter.frequency.setValueAtTime(profile.toneLowpassHz, now);\n    toneFilter.Q.setValueAtTime(0.65, now);\n    this.persistentRarityToneFilter = toneFilter;""",
              ),
              (
                  """      const shimmerGain = context.createGain();\n      shimmerGain.gain.setValueAtTime(profile.shimmerGain, now);\n      const shimmerBandDepth""",
                  """      const shimmerGain = context.createGain();\n      shimmerGain.gain.setValueAtTime(profile.shimmerGain, now);\n      this.persistentRarityShimmerGain = shimmerGain;\n      const shimmerBandDepth""",
              ),
              (
                  """    this.persistentRarityBus = null;\n    this.persistentRaritySources = [];\n    this.activeResultAmbience = null;""",
                  """    this.persistentRarityBus = null;\n    this.persistentRarityToneFilter = null;\n    this.persistentRarityShimmerGain = null;\n    this.persistentRaritySources = [];\n    this.activeResultAmbience = null;""",
              ),
          ])

          apply('src/game/scenes/OpeningScene.ts', [
              (
                  """  private finishDeferredBankingResize(): boolean {\n    if (!this.deferredResize || this.phase !== 'banking' || this.isSceneShutdown()) return false;\n    this.presentationSkip.reset();\n    this.renderIdle();\n    return true;\n  }""",
                  """  private finishDeferredBankingResize(): boolean {\n    if (!this.deferredResize || this.phase !== 'banking' || this.isSceneShutdown()) return false;\n    this.presentationSkip.reset();\n    getGameAudio().clearResultAmbience();\n    this.renderIdle();\n    return true;\n  }""",
              ),
              (
                  """      const finish = (): void => {\n        if (settled) return;\n        settled = true;\n        clearSkip();\n        this.setChipsHudValue(targetValue, true);\n        if (chargedReadyOnArrival) this.chargedReadyPulsePending = true;\n        resolve();\n      };""",
                  """      const finish = (): void => {\n        if (settled) return;\n        settled = true;\n        clearSkip();\n        this.setChipsHudValue(targetValue, true);\n        getGameAudio().setResultBankingProgress(\n          (sequenceStartAmount + amount) / Math.max(1, sequenceTotalAmount),\n        );\n        if (chargedReadyOnArrival) this.chargedReadyPulsePending = true;\n        resolve();\n      };""",
              ),
              (
                  """            arrived += 1;\n            this.setChipsHudValue(startValue + arrived, false);\n            if (!fastForwarding && shouldPlayChipClack(plan, index)) {\n              const sequenceProgress =\n                (sequenceStartAmount + arrived) / Math.max(1, sequenceTotalAmount);\n              getGameAudio().playChipClack(sequenceProgress);\n            }""",
                  """            arrived += 1;\n            this.setChipsHudValue(startValue + arrived, false);\n            const sequenceProgress =\n              (sequenceStartAmount + arrived) / Math.max(1, sequenceTotalAmount);\n            getGameAudio().setResultBankingProgress(sequenceProgress);\n            if (!fastForwarding && shouldPlayChipClack(plan, index)) {\n              getGameAudio().playChipClack(sequenceProgress);\n            }""",
              ),
              (
                  """    await bankLeg(pending.chips.secretBonus);\n    if (this.isSceneShutdown() || this.finishDeferredBankingResize()) return;\n\n    this.setChipsHudValue(pending.chips.after, false);""",
                  """    await bankLeg(pending.chips.secretBonus);\n    if (this.isSceneShutdown() || this.finishDeferredBankingResize()) return;\n\n    if (totalBankAmount > 0) getGameAudio().setResultBankingProgress(1);\n    this.setChipsHudValue(pending.chips.after, false);""",
              ),
              (
                  """    await this.waitPresentation(OPENING_FEEL_PRESENTATION.uiFadeOutMs);\n    if (!this.isSceneShutdown()) this.renderIdle(undefined, true);""",
                  """    await this.waitPresentation(OPENING_FEEL_PRESENTATION.uiFadeOutMs);\n    if (!this.isSceneShutdown()) {\n      getGameAudio().clearResultAmbience();\n      this.renderIdle(undefined, true);\n    }""",
              ),
              (
                  """  private continueFromResult(): void {\n    if (this.phase !== 'result' || !this.resultReady || !this.lastReveal) return;\n    getGameAudio().clearResultAmbience();\n    getGameAudio().play('ui-click');\n    this.resultCarouselDrag = null;\n    const pending = this.lastReveal;\n    void this.animateRewardBanking(pending).catch((error: unknown) => {\n      console.error('[opening] reward banking presentation failed', error);\n      if (this.saveState && !this.isSceneShutdown()) this.renderIdle();\n    });\n  }""",
                  """  private continueFromResult(): void {\n    if (this.phase !== 'result' || !this.resultReady || !this.lastReveal) return;\n    getGameAudio().play('ui-click');\n    this.resultCarouselDrag = null;\n    const pending = this.lastReveal;\n    void this.animateRewardBanking(pending).catch((error: unknown) => {\n      console.error('[opening] reward banking presentation failed', error);\n      getGameAudio().clearResultAmbience();\n      if (this.saveState && !this.isSceneShutdown()) this.renderIdle();\n    });\n  }""",
              ),
          ])

          apply('tests/audio-presentation.test.ts', [
              (
                  """      expect(profile.introPeakMs + profile.introSettleMs).toBeLessThanOrEqual(700);""",
                  """      expect(profile.introPeakMs + profile.introSettleMs).toBeLessThanOrEqual(700);\n      expect(profile.bankingPeakMultiplier).toBeGreaterThanOrEqual(1.1);\n      expect(profile.bankingPeakMultiplier).toBeLessThanOrEqual(1.2);\n      expect(profile.bankingToneFilterLiftHz).toBeGreaterThan(0);\n      expect(profile.bankingShimmerMultiplier).toBeGreaterThanOrEqual(1.1);\n      expect(profile.bankingShimmerMultiplier).toBeLessThanOrEqual(1.3);""",
              ),
          ])

          apply('tests/audio-runtime-contract.test.ts', [
              (
                  """      expect(profile.pulseDepth).toBeLessThanOrEqual(0.2);\n      expect(profile.stereoSpread).toBeLessThanOrEqual(0.5);""",
                  """      expect(profile.pulseDepth).toBeLessThanOrEqual(0.2);\n      expect(profile.stereoSpread).toBeLessThanOrEqual(0.5);\n      expect(profile.bankingPeakMultiplier).toBeLessThanOrEqual(1.2);\n      expect(profile.bankingShimmerMultiplier).toBeLessThanOrEqual(1.3);""",
              ),
          ])
          PY
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/data/audioPresentation.ts src/game/systems/audio.ts src/game/scenes/OpeningScene.ts tests/audio-presentation.test.ts tests/audio-runtime-contract.test.ts
          git diff --cached --check
          git commit -m "[banking-ambience-patch] Carry rarity ambience through banking"
          git push origin HEAD:feel/final-banking-ambience-r1
