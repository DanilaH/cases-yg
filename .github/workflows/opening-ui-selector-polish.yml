name: Opening UI Selector Polish

on:
  push:
    branches:
      - feat/gameplay-loop-lite-v2-opening-ui
    paths:
      - .github/workflows/opening-ui-selector-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/gameplay-loop-lite-v2-opening-ui
          fetch-depth: 0
      - name: Apply selector polish
        run: python3 scripts/apply-opening-ui-selector-polish.py
      - name: Remove one-shot infrastructure
        run: |
          rm scripts/apply-opening-ui-selector-polish.py
          rm .github/workflows/opening-ui-selector-polish.yml
      - name: Commit selector polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Opening pouch selector presentation"
          git push origin HEAD:feat/gameplay-loop-lite-v2-opening-ui
