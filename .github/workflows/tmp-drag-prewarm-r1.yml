name: Temporary drag prewarm patch

on:
  push:
    branches:
      - fix/drag-prewarm-r1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/drag-prewarm-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Patch drag source lifecycle
        env:
          PRIME_B64: 
          OLD_B64: 
          NEW_B64: 
          IDLE_OLD_B64: ICAgIHRoaXMucG91Y2ggPSBjcmVhdGVQb3VjaFZpc3VhbCh0aGlzLCByb290LCBtZXRyaWNzLmNlbnRlclgsIFBPVUNIX1kpOwogICAgdGhpcy5hcHBseUNoYXJnZWRQb3VjaFRyZWF0bWVudCgpOwo=
          IDLE_NEW_B64: ICAgIHRoaXMucG91Y2ggPSBjcmVhdGVQb3VjaFZpc3VhbCh0aGlzLCByb290LCBtZXRyaWNzLmNlbnRlclgsIFBPVUNIX1kpOwogICAgZ2V0R2FtZUF1ZGlvKCkucHJpbWVEcmFnVGV4dHVyZSgpOwogICAgdGhpcy5hcHBseUNoYXJnZWRQb3VjaFRyZWF0bWVudCgpOwo=
          GRAB_OLD_B64: ICAgIHRoaXMuc3RvcFN0YXJQdWxzZSgpOwogICAgZ2V0R2FtZUF1ZGlvKCkucGxheSgncG91Y2gtZ3JhYicpOwo=
          GRAB_NEW_B64: ICAgIHRoaXMuc3RvcFN0YXJQdWxzZSgpOwogICAgZ2V0R2FtZUF1ZGlvKCkucHJpbWVEcmFnVGV4dHVyZSgpOwogICAgZ2V0R2FtZUF1ZGlvKCkucGxheSgncG91Y2gtZ3JhYicpOwo=
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          dec = lambda name: base64.b64decode(os.environ[name]).decode()
          audio_path = Path('src/game/systems/audio.ts')
          audio = audio_path.read_text()
          marker = "  public setDragTexture(progress: number, velocity: number): void {\n"
          if marker not in audio: raise SystemExit('setDragTexture marker missing')
          audio = audio.replace(marker, dec('PRIME_B64') + marker, 1)
          old, new = dec('OLD_B64'), dec('NEW_B64')
          if old not in audio: raise SystemExit('updateDragTexture block missing')
          audio_path.write_text(audio.replace(old, new, 1))
          scene_path = Path('src/game/scenes/OpeningScene.ts')
          scene = scene_path.read_text()
          for old_name, new_name in [('IDLE_OLD_B64','IDLE_NEW_B64'), ('GRAB_OLD_B64','GRAB_NEW_B64')]:
              old, new = dec(old_name), dec(new_name)
              if old not in scene: raise SystemExit(f'{old_name} marker missing')
              scene = scene.replace(old, new, 1)
          scene_path.write_text(scene)
          PY
      - name: Verify scope
        run: |
          git diff -- src/game/systems/audio.ts src/game/scenes/OpeningScene.ts
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/game/scenes/OpeningScene.ts src/game/systems/audio.ts "
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
      - name: Commit product patch and remove harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-drag-prewarm-r1.yml
          git add src/game/systems/audio.ts src/game/scenes/OpeningScene.ts .github/workflows/tmp-drag-prewarm-r1.yml
          git commit -m "Prewarm drag texture before first movement"
          git push origin HEAD:fix/drag-prewarm-r1
