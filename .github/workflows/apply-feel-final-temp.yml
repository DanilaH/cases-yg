name: Apply Feel Final Temp

on:
  push:
    branches:
      - feat/opening-feel-correction

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/feel-patch/part-* > /tmp/feel-product.patch.gz.b64
          echo '475ecdbbf9e85a186118272b4660addead9cd218a09f0ac66091590369b29da4  /tmp/feel-product.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/feel-product.patch.gz.b64 | gzip -dc > /tmp/feel-product.patch
          echo '60754bd026c50484f856fe44bb0bc29f96e5a1907c59c6e9f50a0bfc5a4e9273  /tmp/feel-product.patch' | sha256sum -c -
          patch --dry-run --batch -p1 < /tmp/feel-product.patch
      - name: Apply product implementation and clean transport
        shell: bash
        run: |
          set -euo pipefail
          patch --batch -p1 < /tmp/feel-product.patch
          rm -rf .tmp
          rm -f .github/workflows/apply-feel-driver-temp.yml
          rm -f .github/workflows/apply-feel-patch-temp.yml
          rm -f .github/workflows/apply-feel-final-temp.yml
          git add -A
          git diff --cached --check
      - name: Commit product implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement opening feel correction pass'
          git push
