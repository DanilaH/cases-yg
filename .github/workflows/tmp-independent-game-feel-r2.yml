name: TEMP independent game and feel audit R2

on:
  push:
    branches:
      - audit/independent-game-feel-r1

permissions:
  contents: write

jobs:
  timing-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/independent-game-feel-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Assert product tree is main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=55ebe099e83b01d0efcc51818aadcb23158ca19a
          git diff --quiet "$SOURCE_SHA" -- . ':(exclude).github/workflows/tmp-independent-game-feel-r2.yml'
      - run: npm ci
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Expose audit handles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.ts'); t=p.read_text()
          a="  game.sound.mute = blocked;\n"
          if a not in t: raise SystemExit('anchor missing')
          x="  if (import.meta.env.DEV) {\n    const w = window as typeof window & { __auditGame?: Phaser.Game; __auditAudio?: unknown };\n    w.__auditGame = game;\n    w.__auditAudio = audio;\n  }\n"
          p.write_text(t.replace(a,a+x,1))
          PY
      - name: Create audit script
        shell: bash
        run: |
          cat > tools/tmp-feel-r2.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('audit-r2',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:720}});
          const errors=[]; const bad=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
          page.on('response',r=>{if(r.status()>=400) bad.push(`${r.status()}:${r.url()}`)});
          await page.goto('http://127.0.0.1:5173/?debug=1&platform=mock');
          await page.waitForFunction(()=>window.__auditGame?.scene?.getScene?.('OpeningScene')?.phase==='idle',null,{timeout:15000});
          const hide=page.getByRole('button',{name:'Hide',exact:true}); if(await hide.isVisible().catch(()=>false)) await hide.click();
          await page.mouse.click(640,360); await page.evaluate(()=>window.__auditAudio.play('ui-click')); await page.waitForTimeout(150);
          await page.evaluate(()=>{
            const s=window.__auditGame.scene.getScene('OpeningScene'); const a=window.__auditAudio; window.__feel=[];
            const mark=(type,name)=>window.__feel.push({t:performance.now(),type,name});
            const wrap=n=>{const o=s[n].bind(s); s[n]=async(...args)=>{mark('start',n);try{return await o(...args)}finally{mark('end',n)}}};
            for(const n of ['animateTearDetach','animateChipsPrelude','animateSignalLockConsumptionPrelude','animateStandardReveal','animatePostStandardEconomy','animateHiddenPocket','animateRewardStaging','animateDiscoveryBeat','animateCollectionAcceptance','animateRewardBanking']) if(typeof s[n]==='function') wrap(n);
            const rr=s.renderResolvedResult.bind(s); s.renderResolvedResult=(...x)=>{mark('instant','renderResolvedResult');return rr(...x)};
            const p=a.play.bind(a); a.play=(cue)=>{mark('audio',cue);return p(cue)};
          });
          const prep=async scenario=>page.evaluate(async scenario=>{
            const {getPlatformRuntime}=await import('/src/app/runtime.ts'); const {SaveRepository}=await import('/src/game/systems/save.ts'); const {resetDebugSave,stageDebugReveal}=await import('/src/debug/debugScenarios.ts');
            const s=window.__auditGame.scene.getScene('OpeningScene'); const repo=new SaveRepository(getPlatformRuntime().storage);
            await resetDebugSave(repo); await stageDebugReveal(repo,scenario); const st=await s.session.load(); s.saveState=st; s.selectedPouchType=st.pendingReveal?.pouchType??'basic'; s.lastReveal=st.pendingReveal; s.resultReady=false; s.renderIdle(); s.pouch.tab.setX(s.pouch.tabEndX); window.__feel=[]; s.ignoreNextResultTap=false;
          },scenario);
          const snap=()=>page.evaluate(()=>{const s=window.__auditGame.scene.getScene('OpeningScene'),a=window.__auditAudio;return{phase:s.phase,ready:s.resultReady,tweens:s.tweens.getAllTweens().length,std:s.standardPresenceTargets?.length??0,secret:s.secretPremiumTargets?.length??0,audio:{active:a.activeResultAmbience,desired:a.desiredResultAmbience,sources:a.persistentRaritySources?.length??0,drag:Boolean(a.dragTextureSource)}}});
          const runs=[];
          for(const scenario of ['common','rare','epic','legendary','duplicate','hidden-pocket','signal-lock-consumed']){
            await prep(scenario); const start=await page.evaluate(()=>performance.now());
            await page.evaluate(()=>{const s=window.__auditGame.scene.getScene('OpeningScene'); return s.playReveal(s.session.getPendingReveal(),false)});
            await page.waitForFunction(()=>{const s=window.__auditGame.scene.getScene('OpeningScene');return s.phase==='result'&&s.resultReady},{},{timeout:10000});
            const end=await page.evaluate(()=>performance.now()); const events=await page.evaluate(()=>window.__feel); const stable=await snap();
            const base=events.length?events[0].t:start; const normalized=events.map(e=>({...e,dt:Math.round(e.t-base)}));
            runs.push({scenario,duration:Math.round(end-start),stable,events:normalized});
          }
          // Directly invoke the same result acceptance method after setting a valid ready state; this avoids audit mouse-gesture bookkeeping.
          const collect={};
          await prep('legendary'); await page.evaluate(()=>{const s=window.__auditGame.scene.getScene('OpeningScene'); return s.playReveal(s.session.getPendingReveal(),false)}); await page.waitForFunction(()=>{const s=window.__auditGame.scene.getScene('OpeningScene');return s.phase==='result'&&s.resultReady});
          windowStart=await page.evaluate(()=>performance.now()); await page.evaluate(()=>{const s=window.__auditGame.scene.getScene('OpeningScene'); window.__feel=[]; s.continueFromResult()}); await page.waitForFunction(()=>window.__auditGame.scene.getScene('OpeningScene').phase==='idle',null,{timeout:10000}); collect.duration=Math.round((await page.evaluate(()=>performance.now()))-windowStart); collect.events=await page.evaluate(()=>window.__feel); collect.final=await snap();
          const stress=await page.evaluate(async()=>{const {getPlatformRuntime}=await import('/src/app/runtime.ts');const {SaveRepository}=await import('/src/game/systems/save.ts');const {resetDebugSave,stageDebugReveal}=await import('/src/debug/debugScenarios.ts');const s=window.__auditGame.scene.getScene('OpeningScene');const repo=new SaveRepository(getPlatformRuntime().storage);const a=window.__auditAudio;const seq=['common','rare','epic','legendary','duplicate','hidden-pocket'];const out=[];for(let i=0;i<18;i++){const sc=seq[i%seq.length];await resetDebugSave(repo);await stageDebugReveal(repo,sc);const st=await s.session.load();s.saveState=st;s.selectedPouchType=st.pendingReveal?.pouchType??'basic';s.lastReveal=st.pendingReveal;s.resultReady=false;s.renderIdle();s.pouch.tab.setX(s.pouch.tabEndX);const work=s.playReveal(s.session.getPendingReveal(),false);setTimeout(()=>s.requestPresentationFastForward(),70+(i%4)*30);await work;out.push({i,sc,phase:s.phase,ready:s.resultReady,sources:a.persistentRaritySources?.length??0,tweens:s.tweens.getAllTweens().length,std:s.standardPresenceTargets?.length??0,secret:s.secretPremiumTargets?.length??0});s.continueFromResult();const dl=performance.now()+5000;while(s.phase!=='idle'&&performance.now()<dl)await new Promise(r=>setTimeout(r,20));if(s.phase!=='idle')throw new Error(`loop ${i} stuck ${s.phase}`)}return{out,final:{phase:s.phase,sources:a.persistentRaritySources?.length??0,tweens:s.tweens.getAllTweens().length,drag:Boolean(a.dragTextureSource)}}});
          // Verify active resize + skip does not leave state incoherent.
          await prep('legendary'); const resizeWork=page.evaluate(()=>{const s=window.__auditGame.scene.getScene('OpeningScene');return s.playReveal(s.session.getPendingReveal(),false)}); await page.waitForTimeout(180); await page.setViewportSize({width:900,height:720}); await page.waitForTimeout(80); await page.evaluate(()=>window.__auditGame.scene.getScene('OpeningScene').requestPresentationFastForward()); await resizeWork; await page.waitForFunction(()=>{const s=window.__auditGame.scene.getScene('OpeningScene');return s.phase==='result'&&s.resultReady},null,{timeout:10000}); const compact=await snap(); await page.screenshot({path:'audit-r2/compact.png'});
          const report={source:'55ebe099e83b01d0efcc51818aadcb23158ca19a',runs,collect,stress,compact,errors,bad};fs.writeFileSync('audit-r2/report.json',JSON.stringify(report,null,2));
          await browser.close(); if(errors.length||bad.length)process.exitCode=1;
          EOF
          # fix accidental undeclared assignment in module
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/tmp-feel-r2.mjs');t=p.read_text();t=t.replace("          windowStart=await page.evaluate", "          const windowStart=await page.evaluate");p.write_text(t)
          PY
      - name: Run timing lifecycle audit
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 >/tmp/vite-r2.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          node tools/tmp-feel-r2.mjs
      - name: Print compact timing report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit-r2/report.json')
          if not p.exists(): raise SystemExit('report missing')
          r=json.loads(p.read_text()); print('errors',r['errors']); print('bad',r['bad']);
          for x in r['runs']:
            print('\n',x['scenario'],x['duration'],'ms',x['stable']);
            for e in x['events']: print(e['dt'],e['type'],e['name'])
          print('\ncollect',r['collect']); print('\nstress-final',r['stress']['final']); print('stress-count',len(r['stress']['out'])); print('compact',r['compact'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-game-feel-r2
          path: audit-r2
          retention-days: 14
      - name: Clean temporary audit
        if: always()
        shell: bash
        run: |
          git checkout -- src/main.ts package.json package-lock.json || true
          rm -f tools/tmp-feel-r2.mjs .github/workflows/tmp-independent-game-feel-r2.yml
          rm -rf audit-r2
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Remove temporary feel timing audit'; git push origin HEAD:audit/independent-game-feel-r1; fi
