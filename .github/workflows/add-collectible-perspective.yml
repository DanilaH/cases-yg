name: One-shot collectible perspective

on:
  push:
    branches:
      - feature/collectible-perspective

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/collectible-perspective
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply source changes
        run: node scripts/add-collectible-perspective.mjs
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
      - name: Commit source changes and remove one-shot files
        run: |
          rm -f scripts/add-collectible-perspective.mjs .github/workflows/add-collectible-perspective.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add mouse-follow perspective to result collectibles"
          git push origin HEAD:feature/collectible-perspective
