name: Temporary Phaser 4 Secret tint fix

on:
  push:
    branches:
      - polish/reveal-meta-feel-2026-09-11

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/reveal-meta-feel-2026-09-11
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: node tools/apply-secret-tintmode-fix.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit clean production fix
        shell: bash
        run: |
          rm -f .github/workflows/secret-tintmode-fix-temp.yml tools/apply-secret-tintmode-fix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts .github/workflows/secret-tintmode-fix-temp.yml tools/apply-secret-tintmode-fix.mjs
          git commit -m "Use Phaser 4 tint mode for Secret outline"
          git push origin HEAD:polish/reveal-meta-feel-2026-09-11
