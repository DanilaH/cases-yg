name: Pre-hands-on R4 visual audit

on:
  push:
    branches:
      - fix/pre-hands-on-visual-cleanup
    paths:
      - .github/workflows/pre-hands-on-r4-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assert product files match cleanup candidate exactly
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD=1877ca58c3cd31ee730bc1872d4383cd7c34b206
          git cat-file -e "$PRODUCT_HEAD^{commit}"
          unexpected="$(git diff --name-only "$PRODUCT_HEAD"...HEAD | grep -Ev '^\.github/(scripts/pre-hands-on-r4-audit\.mjs|workflows/pre-hands-on-r4-audit\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Audit commit changes product files:'
            echo "$unexpected"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Install Playwright driver and video helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-pack node_modules/playwright node_modules/playwright-core
          npm pack playwright@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pw-name.txt
          npm pack playwright-core@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pwc-name.txt
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pw-name.txt)" --strip-components=1 -C node_modules/playwright
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pwc-name.txt)" --strip-components=1 -C node_modules/playwright-core
          node node_modules/playwright/cli.js install ffmpeg
      - name: Start Vite
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Run targeted exact-revision browser audit
        run: node .github/scripts/pre-hands-on-r4-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-hands-on-r4-visual-audit
          path: /tmp/pre-hands-on-r4-audit
          if-no-files-found: error
          retention-days: 3
