name: Reveal V2 Browser Audit

on:
  push:
    branches:
      - audit/reveal-presentation-v2-browser
    paths:
      - .github/scripts/reveal-v2-browser-audit.mjs
      - .github/workflows/reveal-v2-browser-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Install Playwright driver
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-pack node_modules/playwright node_modules/playwright-core
          npm pack playwright@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pw-name.txt
          npm pack playwright-core@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pwc-name.txt
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pw-name.txt)" --strip-components=1 -C node_modules/playwright
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pwc-name.txt)" --strip-components=1 -C node_modules/playwright-core
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Run presentation audit
        run: node .github/scripts/reveal-v2-browser-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reveal-v2-browser-audit
          path: /tmp/reveal-v2-browser-audit
          if-no-files-found: warn
          retention-days: 2
