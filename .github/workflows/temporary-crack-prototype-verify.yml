name: Temporary crack dissolve prototype verification
on:
  push:
    branches: [feat/pouch-crack-dissolve-prototype-20260916]
    paths: [.github/workflows/temporary-crack-prototype-verify.yml]
permissions:
  contents: write
jobs:
  prototype:
    runs-on: ubuntu-24.04
    env:
      VITE_PLATFORM_RUNTIME: mock
      VITE_DEBUG_PANEL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply isolated production patch
        run: |
          cat > /tmp/crack.patch.xz.b64 <<'BASE64'
          
          
          
          
          
          
          BASE64
          tr -d '\n ' < /tmp/crack.patch.xz.b64 | base64 -d | xz -d > /tmp/crack.patch
          git apply --check /tmp/crack.patch
          git apply /tmp/crack.patch
      - name: Check TypeScript and full unit suite
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit prototype if checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/data/rarityPouchImpact.ts src/game/data/rarityPouchImpact.test.ts src/game/scenes/OpeningScene.ts src/game/ui/pouchPerspective.ts
          git commit -m 'feat(feel): prototype crack dissolve with tiered falloff and side sparks'
          git push origin HEAD:feat/pouch-crack-dissolve-prototype-20260916
