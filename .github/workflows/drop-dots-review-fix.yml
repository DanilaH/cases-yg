name: Validate Drop dots review fix

on:
  push:
    branches:
      - polish/drop-dots-hint-lift

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[drop-dots-review-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python3 tools/drop-dots-review-fix.py
      - name: Assert review corrections
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'fillRoundedRect(-dotWidth / 2' src/game/scenes/OpeningScene.ts
          grep -q 'metrics.safeTop + 120, message' src/game/scenes/OpeningScene.ts
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit reviewed source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/scenes/OpeningScene.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[drop-dots-review-fix] round dot rail and decouple idle message'
          git push origin HEAD:polish/drop-dots-hint-lift
