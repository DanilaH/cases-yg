name: Apply final hands-on Overcharge plan

on:
  workflow_dispatch:
  push:
    branches:
      - docs/final-hands-on-overcharge-plan
    paths:
      - '.github/scripts/apply-final-hands-on-overcharge-plan.py'
      - '.github/workflows/apply-final-hands-on-overcharge-plan.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/final-hands-on-overcharge-plan
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply canonical docs update
        run: python .github/scripts/apply-final-hands-on-overcharge-plan.py
      - name: Validate docs diff
        run: |
          git diff --check
          test -f docs/FINAL_HANDS_ON_OVERCHARGE_PLAN.md
          grep -q 'Signal Overcharge' docs/DECISIONS.md
          grep -q 'Approved next extension — Signal Overcharge' docs/GAMEPLAY_SYSTEMS.md
          grep -q 'Phase 2.6 — final-hands-on correction + Signal Overcharge' docs/IMPLEMENTATION_ROADMAP.md
          grep -q 'Signal Overcharge tuning — APPROVED MECHANIC, NUMBERS OPEN' docs/OPEN_QUESTIONS.md
          ! grep -q '^- Overcharge;' docs/DECISIONS.md
          ! grep -q '^- Overcharge;' docs/OPEN_QUESTIONS.md
      - name: Commit docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/GAMEPLAY_SYSTEMS.md docs/IMPLEMENTATION_ROADMAP.md docs/OPEN_QUESTIONS.md docs/FINAL_HANDS_ON_OVERCHARGE_PLAN.md
          if git diff --cached --quiet; then
            echo 'No docs changes to commit'
            exit 0
          fi
          git commit -m 'Lock final hands-on and Signal Overcharge plan'
          git push origin HEAD:docs/final-hands-on-overcharge-plan
