name: Apply Secret economy V4

on:
  push:
    branches:
      - fix/secret-economy-v4

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - name: Apply Secret economy V4
        run: node .github/scripts/apply-secret-economy-v4.mjs
      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
          git diff --check
      - name: Commit product changes
        run: |
          if git diff --quiet -- src tests; then
            echo 'Product patch already applied.'
            exit 0
          fi
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add src tests
          git commit -m 'Implement durable Secret jackpot economy'
          git push origin HEAD:fix/secret-economy-v4
