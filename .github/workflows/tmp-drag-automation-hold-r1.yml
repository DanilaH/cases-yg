name: Temporary drag automation hold patch

on:
  push:
    branches:
      - fix/drag-automation-hold-r1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/drag-automation-hold-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Patch AudioParam automation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/systems/audio.ts')
          text = path.read_text()
          replacements = {
              "gain.gain.cancelScheduledValues(now);\n    gain.gain.setValueAtTime(Math.max(0.0001, gain.gain.value), now);\n    gain.gain.linearRampToValueAtTime(mix.gain, now + updateSeconds);": "gain.gain.cancelAndHoldAtTime(now);\n    gain.gain.linearRampToValueAtTime(mix.gain, now + updateSeconds);",
              "filter.frequency.cancelScheduledValues(now);\n    filter.frequency.setValueAtTime(Math.max(20, filter.frequency.value), now);\n    filter.frequency.linearRampToValueAtTime(mix.bandHz, now + updateSeconds);": "filter.frequency.cancelAndHoldAtTime(now);\n    filter.frequency.linearRampToValueAtTime(mix.bandHz, now + updateSeconds);",
              "filter.Q.cancelScheduledValues(now);\n    filter.Q.setValueAtTime(Math.max(0.1, filter.Q.value), now);\n    filter.Q.linearRampToValueAtTime(mix.q, now + updateSeconds);": "filter.Q.cancelAndHoldAtTime(now);\n    filter.Q.linearRampToValueAtTime(mix.q, now + updateSeconds);",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected automation block: {old.splitlines()[0]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify scope
        run: |
          git diff -- src/game/systems/audio.ts
          test "$(git diff --name-only)" = "src/game/systems/audio.ts"
          test "$(git diff --numstat src/game/systems/audio.ts | awk '{print $1}')" = "3"
          test "$(git diff --numstat src/game/systems/audio.ts | awk '{print $2}')" = "6"
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
      - name: Commit product patch and remove harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-drag-automation-hold-r1.yml
          git add src/game/systems/audio.ts .github/workflows/tmp-drag-automation-hold-r1.yml
          git commit -m "Hold live drag AudioParams across updates"
          git push origin HEAD:fix/drag-automation-hold-r1
