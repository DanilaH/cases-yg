name: TEMP sync audio feel docs R2

on:
  push:
    branches:
      - docs/sync-audio-reward-feel-implemented

permissions:
  contents: write

jobs:
  sync-docs-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/sync-audio-reward-feel-implemented
          fetch-depth: 0

      - name: Reuse validated docs patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/tmp-sync-audio-feel-docs.yml').read_text(encoding='utf-8')
          marker = '      - name: Sync implemented feel plan and roadmap\n'
          start = text.index(marker)
          run_start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('\n\n      - name: Commit clean docs-only tree', run_start)
          lines = text[run_start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/sync-docs.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/sync-docs.sh

      - name: Commit docs and remove temporary workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-sync-audio-feel-docs.yml
          rm -f .github/workflows/tmp-sync-audio-feel-docs-r2.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Fx 'docs/AUDIO_AND_REWARD_FEEL_POLISH_PLAN.md'
          printf '%s\n' "$changed" | grep -Fx 'docs/IMPLEMENTATION_ROADMAP.md'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/tmp-sync-audio-feel-docs(-r2)?\.yml|docs/AUDIO_AND_REWARD_FEEL_POLISH_PLAN\.md|docs/IMPLEMENTATION_ROADMAP\.md)$' || true)"
          test -z "$unexpected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync implemented audio and reward feel status'
          git push origin HEAD:docs/sync-audio-reward-feel-implemented
