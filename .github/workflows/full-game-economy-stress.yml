name: Full-game economy stress

on:
  push:
    branches:
      - balance/full-game-economy-audit

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run completed-Drop and max-Overcharge stress
        run: npx vitest run tools/full-game-economy-stress.test.ts --reporter=verbose
