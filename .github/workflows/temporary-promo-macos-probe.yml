name: Temporary Signal promo macOS GPU probe
on:
  push:
    branches: [capture/signal-2000-promo-ru-en-20260917]
    paths: [.github/workflows/temporary-promo-macos-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: VITE_PLATFORM_RUNTIME=mock VITE_DEBUG_PANEL=false npm run build
      - name: Compare uncapped native WebGL capture and rAF frame pacing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/signal-gpu-probe
          /tmp/signal-gpu-probe/bin/python -m pip install 'playwright==1.55.0'
          mkdir -p probe-output
          python3 -m http.server 8765 --directory dist >/tmp/probe-http.log 2>&1 &
          sleep 2
          /tmp/signal-gpu-probe/bin/python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('probe-output')
          state={'version':5,'discoveredStandard':[],'discoveredSecrets':[],'chips':450,'signal':0,'overchargeHundredths':100,'activeLootPoolId':'y2k-essentials','totalOpens':17,'pendingReveal':None,'onboarding':{'primaryCompleted':True,'firstRevealReceipt':None},'muted':False,'stats':{'duplicates':0,'hiddenPockets':0}}
          diagnostic={'errors':[]}
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--enable-gpu','--ignore-gpu-blocklist','--use-angle=metal','--enable-webgl','--disable-frame-rate-limit','--disable-gpu-vsync','--autoplay-policy=no-user-gesture-required','--disable-background-timer-throttling','--disable-renderer-backgrounding'])
              ctx=browser.new_context(locale='ru-RU',viewport={'width':960,'height':540},device_scale_factor=1,accept_downloads=True)
              ctx.add_init_script('(()=>{const state='+json.dumps(state)+';localStorage.setItem("mystery-pocket-tech.save",JSON.stringify(state));sessionStorage.setItem("mystery-pocket-tech.debug-language","ru")})()')
              page=ctx.new_page()
              page.on('pageerror',lambda e:diagnostic['errors'].append(str(e)))
              page.goto('http://127.0.0.1:8765/',wait_until='domcontentloaded',timeout=90000)
              page.wait_for_function('document.querySelector("#startup-preload")?.dataset.state === "hidden"',timeout=90000)
              page.wait_for_timeout(1500)
              diagnostic['graphics']=page.evaluate('''() => {const c=document.querySelector('#game canvas');const gl=c?.getContext('webgl2')||c?.getContext('webgl');const d=gl?.getExtension('WEBGL_debug_renderer_info');return {width:c?.width,height:c?.height,renderer:gl?(d?gl.getParameter(d.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)):'NO GL'}}''')
              diagnostic['idle']=page.evaluate('''async()=>{let p=0;const a=[];const start=performance.now();return await new Promise(resolve=>{const f=t=>{if(p)a.push(t-p);p=t;if(performance.now()-start<2500)requestAnimationFrame(f);else resolve({frames:a.length,elapsed:performance.now()-start,over33:a.filter(v=>v>33).length,maxGap:Math.max(...a,0)})};requestAnimationFrame(f)})}''')
              page.screenshot(path=str(out/'before.png'))
              page.evaluate('''() => {const c=document.querySelector('#game canvas');const mime=['video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));window.__chunks=[];window.__rec=new MediaRecorder(c.captureStream(60),{mimeType:mime,videoBitsPerSecond:7500000});window.__rec.ondataavailable=e=>{if(e.data.size)window.__chunks.push(e.data)};window.__done=new Promise(r=>window.__rec.onstop=r);window.__d=[];window.__active=true;let p=0;const f=t=>{if(!window.__active)return;if(p)window.__d.push(t-p);p=t;requestAnimationFrame(f)};requestAnimationFrame(f);window.__rec.start(500)}''')
              page.wait_for_timeout(400)
              page.mouse.move(358,127)
              page.mouse.down()
              page.mouse.move(607,127,steps=60)
              page.mouse.up()
              page.wait_for_timeout(2600)
              with page.expect_download(timeout=60000) as info:
                  diagnostic['record']=page.evaluate('''async()=>{window.__active=false;window.__rec.stop();await window.__done;const blob=new Blob(window.__chunks,{type:window.__rec.mimeType});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='macos-canvas-no-vsync.webm';a.click();const d=window.__d;return {bytes:blob.size,rafFrames:d.length,elapsedMs:d.reduce((a,b)=>a+b,0),over33ms:d.filter(v=>v>33).length,maxGapMs:Math.max(...d,0)}}''')
              info.value.save_as(str(out/'macos-canvas-no-vsync.webm'))
              diagnostic['reward']=page.evaluate('''()=>{const s=JSON.parse(localStorage.getItem('mystery-pocket-tech.save'));return {totalOpens:s.totalOpens,pending:!!s.pendingReveal}}''')
              page.screenshot(path=str(out/'after.png'))
              browser.close()
          (out/'diagnostics.json').write_text(json.dumps(diagnostic,indent=2))
          print('GPU_PROBE',json.dumps(diagnostic),flush=True)
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-macos-gpu-canvas-probe-${{ github.run_id }}
          path: probe-output/
          if-no-files-found: warn
          retention-days: 5
