name: Temporary rarity impact browser QA
on:
  push:
    branches:
      - feel/rarity-pouch-impact-20260916
    paths:
      - .github/workflows/rarity-impact-qa.yml
permissions:
  contents: read
jobs:
  real-tear:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game with mock runtime
        env:
          VITE_PLATFORM_RUNTIME: mock
          VITE_DEBUG_PANEL: 'true'
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Log full JS stack on a real tear gesture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/rarity-impact-tear-qa.py')
          source=path.read_text()
          old="errors.append(str(error))"
          assert source.count(old)==1
          source=source.replace(old,"errors.append(getattr(error, 'stack', None) or str(error))")
          old="CASES = (('common', False, 0.13), ('legendary', True, 0.995))"
          assert source.count(old)==1
          source=source.replace(old,"CASES = (('common', False, 0.13),)")
          path.write_text(source)
          PY
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/impact-preview.log 2>&1 &
          sleep 2
          python tools/rarity-impact-tear-qa.py | tee /tmp/impact-real-tear.log
          if grep -q 'QA FAIL' /tmp/impact-real-tear.log; then exit 1; fi
      - name: Upload captured actual opening video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-2000-real-tear-stack
          path: impact-tear-qa/
          if-no-files-found: warn
          retention-days: 7
