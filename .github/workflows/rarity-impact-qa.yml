name: Temporary rarity impact browser QA
on:
  push:
    branches:
      - feel/rarity-pouch-impact-20260916
    paths:
      - .github/workflows/rarity-impact-qa.yml
permissions:
  contents: read
jobs:
  visual-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game with mock platform and capture-only debug buttons
        env:
          VITE_PLATFORM_RUNTIME: mock
          VITE_DEBUG_PANEL: 'true'
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify mobile viewport without injecting CSS during app navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/rarity-impact-qa.py')
          text = path.read_text()
          old = "        await page.add_style_tag(content='.mpt-debug-panel {visibility:hidden!important}')\n"
          assert text.count(old) == 1
          text = text.replace(old, "        await page.wait_for_load_state('domcontentloaded')\n        await page.wait_for_timeout(1000)\n")
          old = "await page.screenshot(path=str(target / f'{index+1:02d}-impact.png'),animations='allow')"
          assert text.count(old) == 1
          text = text.replace(old, "await page.screenshot(path=str(target / f'{index+1:02d}-impact.png'),style='.mpt-debug-panel {visibility:hidden!important}',animations='allow')")
          old = "await page.screenshot(path=str(target / '08-result.png'),animations='disabled')"
          assert text.count(old) == 1
          text = text.replace(old, "await page.screenshot(path=str(target / '08-result.png'),style='.mpt-debug-panel {visibility:hidden!important}',animations='disabled')")
          old = "async def main():\n    ROOT.mkdir(exist_ok=True)"
          assert text.count(old) == 1
          text = text.replace(old,"async def main():\n    global CASES\n    CASES = CASES[-2:]\n    ROOT.mkdir(exist_ok=True)")
          path.write_text(text)
          PY
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/impact-preview.log 2>&1 &
          sleep 2
          python tools/rarity-impact-qa.py | tee /tmp/impact-qa.log
          if grep -q 'QA FAIL' /tmp/impact-qa.log; then exit 1; fi
      - name: Upload actual game frames and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-2000-rarity-impact-mobile-qa
          path: impact-qa/
          if-no-files-found: warn
          retention-days: 7
