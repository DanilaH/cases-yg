name: Temporary rarity impact browser QA
on:
  push:
    branches:
      - feel/rarity-pouch-impact-20260916
    paths:
      - .github/workflows/rarity-impact-qa.yml
permissions:
  contents: read
jobs:
  visual-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game with mock platform and capture-only debug buttons
        env:
          VITE_PLATFORM_RUNTIME: mock
          VITE_DEBUG_PANEL: 'true'
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify real game rarity animations on desktop and mobile viewport
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/impact-preview.log 2>&1 &
          sleep 2
          python tools/rarity-impact-qa.py | tee /tmp/impact-qa.log
          if grep -q 'QA FAIL' /tmp/impact-qa.log; then exit 1; fi
      - name: Upload actual game frames and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-2000-rarity-impact-browser-qa
          path: impact-qa/
          if-no-files-found: warn
          retention-days: 7
