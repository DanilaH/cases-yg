name: TEMP near completion R1

on:
  push:
    branches:
      - polish/near-completion-r1

permissions:
  contents: write

jobs:
  implement-audit-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/near-completion-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply bounded near-completion pass
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'anchor missing in {path}: expected {count}, got {actual}: {old[:160]!r}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          # Pure collection-state helper: presentation reads state, never changes loot resolution.
          replace(
              'src/game/systems/collection.ts',
              """export const buildCollectionSnapshot = (\n""",
              """export interface StandardNearCompletion {\n  current: number;\n  total: number;\n  missingCollectibleId: string;\n  familyId: string;\n  rarity: StandardRarity;\n}\n\nexport const getStandardNearCompletion = (\n  registry: ContentRegistry,\n  state: Pick<SaveState, 'discoveredStandard'>,\n): StandardNearCompletion | null => {\n  const total = registry.standardItems.length;\n  if (total < 2) return null;\n\n  const owned = new Set(state.discoveredStandard);\n  const missing = registry.standardItems.filter(({ collectible }) => !owned.has(collectible.id));\n  if (missing.length !== 1) return null;\n\n  const last = missing[0];\n  if (!last) return null;\n  return {\n    current: total - 1,\n    total,\n    missingCollectibleId: last.collectible.id,\n    familyId: last.familyId,\n    rarity: last.rarity,\n  };\n};\n\nexport const buildCollectionSnapshot = (\n""",
          )

          replace(
              'src/i18n/en.ts',
              """    milestoneCollected: 'COLLECTED',\n""",
              """    milestoneCollected: 'COLLECTED',\n    nearCompletionStandardSet: 'STANDARD SET',\n    nearCompletionOneLeft: '1 LEFT',\n""",
          )
          replace(
              'src/i18n/en.ts',
              """    loadError: 'Collection data could not be loaded. Reload to retry.',\n""",
              """    loadError: 'Collection data could not be loaded. Reload to retry.',\n    nearCompletionOneLeft: '1 LEFT',\n    lastStandard: 'LAST STANDARD',\n""",
          )
          replace(
              'src/i18n/ru.ts',
              """    milestoneCollected: 'СОБРАНО',\n""",
              """    milestoneCollected: 'СОБРАНО',\n    nearCompletionStandardSet: 'ОСНОВНЫЕ',\n    nearCompletionOneLeft: 'ОСТАЛСЯ 1',\n""",
          )
          replace(
              'src/i18n/ru.ts',
              """    loadError: 'Не удалось загрузить коллекцию. Перезагрузите игру и попробуйте снова.',\n""",
              """    loadError: 'Не удалось загрузить коллекцию. Перезагрузите игру и попробуйте снова.',\n    nearCompletionOneLeft: 'ОСТАЛСЯ 1',\n    lastStandard: 'ПОСЛЕДНИЙ',\n""",
          )

          # Opening result: subtle stateful line only on the standard reward page.
          replace(
              'src/game/scenes/OpeningScene.ts',
              """import { getGameAudio } from '../systems/audio';\n""",
              """import { getGameAudio } from '../systems/audio';\nimport { getStandardNearCompletion } from '../systems/collection';\n""",
          )
          replace(
              'src/game/scenes/OpeningScene.ts',
              """      if (signalText) {\n        const icon = createSignalToken(this, iconX, cursorY + 4, false);\n        const text = this.add.text(textX, cursorY, signalText, {\n          color: signalColor,\n          stroke: '#100b16',\n          strokeThickness: 2,\n          fontFamily: DIGITAL_FONT_FAMILY,\n          fontSize: '6px',\n          wordWrap: { width: width - 48, useAdvancedWrap: true },\n        });\n        tray.add([icon, text]);\n        cursorY += Math.max(18, text.height + 5);\n      }\n\n      if (animate && pending.chips.overchargeBonus > 0) {\n""",
              """      if (signalText) {\n        const icon = createSignalToken(this, iconX, cursorY + 4, false);\n        const text = this.add.text(textX, cursorY, signalText, {\n          color: signalColor,\n          stroke: '#100b16',\n          strokeThickness: 2,\n          fontFamily: DIGITAL_FONT_FAMILY,\n          fontSize: '6px',\n          wordWrap: { width: width - 48, useAdvancedWrap: true },\n        });\n        tray.add([icon, text]);\n        cursorY += Math.max(18, text.height + 5);\n      }\n\n      const nearCompletion = getStandardNearCompletion(SLICE_REGISTRY, pending.commit);\n      if (nearCompletion) {\n        const nearCompletionText = this.add.text(\n          textX,\n          cursorY,\n          `${messages.opening.nearCompletionStandardSet} ${nearCompletion.current}/${nearCompletion.total} · ${messages.opening.nearCompletionOneLeft}`,\n          {\n            color: '#8df8ff',\n            stroke: '#100b16',\n            strokeThickness: 2,\n            fontFamily: DIGITAL_FONT_FAMILY,\n            fontSize: '6px',\n            wordWrap: { width: width - 48, useAdvancedWrap: true },\n          },\n        );\n        nearCompletionText.setData('nearCompletion', true);\n        tray.add(nearCompletionText);\n        cursorY += Math.max(18, nearCompletionText.height + 5);\n      }\n\n      if (animate && pending.chips.overchargeBonus > 0) {\n""",
          )

          # Collection: reuse existing family count and the actual missing card; no new banner/meta screen.
          replace(
              'src/game/scenes/CollectionScene.ts',
              """import { buildCollectionSnapshot, getShelfFeaturedOwned, type CollectionSnapshot } from '../systems/collection';\n""",
              """import {\n  buildCollectionSnapshot,\n  getShelfFeaturedOwned,\n  getStandardNearCompletion,\n  type CollectionSnapshot,\n} from '../systems/collection';\n""",
          )
          replace(
              'src/game/scenes/CollectionScene.ts',
              """    const messages = getMessages(getPlatformRuntime().language);\n    const families = this.visibleFamilies();\n    const cardWidth = Math.min(300, (metrics.logicalWidth - 150) / Math.max(1, families.length) - 28);\n""",
              """    const messages = getMessages(getPlatformRuntime().language);\n    const families = this.visibleFamilies();\n    const nearCompletion = this.saveState ? getStandardNearCompletion(SLICE_REGISTRY, this.saveState) : null;\n    const cardWidth = Math.min(300, (metrics.logicalWidth - 150) / Math.max(1, families.length) - 28);\n""",
              1,
          )
          replace(
              'src/game/scenes/CollectionScene.ts',
              """      const familySnapshot = this.snapshot!.families.find(({ familyId }) => familyId === family.id)!;\n      const x = startX + index * (cardWidth + gap);\n""",
              """      const familySnapshot = this.snapshot!.families.find(({ familyId }) => familyId === family.id)!;\n      const familyNearCompletion = nearCompletion?.familyId === family.id;\n      const x = startX + index * (cardWidth + gap);\n""",
              1,
          )
          replace(
              'src/game/scenes/CollectionScene.ts',
              """            `${familySnapshot.standardCount}/${familySnapshot.standardTotal}   ·   ✦ ${familySnapshot.secretOwned.length}/${familySnapshot.secretTotal}`,\n            {\n              color: '#ded3e8',\n              fontFamily: 'monospace',\n              fontSize: '13px',\n            },\n""",
              """            `${familySnapshot.standardCount}/${familySnapshot.standardTotal}${familyNearCompletion ? ` · ${messages.collection.nearCompletionOneLeft}` : ''}   ·   ✦ ${familySnapshot.secretOwned.length}/${familySnapshot.secretTotal}`,\n            {\n              color: familyNearCompletion ? '#8df8ff' : '#ded3e8',\n              fontFamily: 'monospace',\n              fontSize: '13px',\n              fontStyle: familyNearCompletion ? 'bold' : 'normal',\n            },\n""",
              1,
          )
          replace(
              'src/game/scenes/CollectionScene.ts',
              """    const messages = getMessages(getPlatformRuntime().language);\n    const families = this.visibleFamilies();\n    const rowStartY = families.length === 1 ? 330 : 270;\n""",
              """    const messages = getMessages(getPlatformRuntime().language);\n    const families = this.visibleFamilies();\n    const nearCompletion = this.saveState ? getStandardNearCompletion(SLICE_REGISTRY, this.saveState) : null;\n    const rowStartY = families.length === 1 ? 330 : 270;\n""",
              1,
          )
          replace(
              'src/game/scenes/CollectionScene.ts',
              """        const x = startX + index * (cardWidth + gap);\n        const borderColor = entry.secret ? 0x65f6ff : RARITY_REVEAL_COLORS[entry.rarity];\n        root.add(\n          this.add\n            .rectangle(x, y, cardWidth, 154, entry.owned ? 0x382e46 : 0x292231, 0.96)\n            .setStrokeStyle(2, borderColor, entry.owned ? 0.75 : 0.25),\n        );\n""",
              """        const x = startX + index * (cardWidth + gap);\n        const borderColor = entry.secret ? 0x65f6ff : RARITY_REVEAL_COLORS[entry.rarity];\n        const isLastStandard = Boolean(\n          !entry.secret &&\n          !entry.owned &&\n          nearCompletion?.missingCollectibleId === entry.id,\n        );\n        const card = this.add\n          .rectangle(x, y, cardWidth, 154, entry.owned ? 0x382e46 : isLastStandard ? 0x302b3a : 0x292231, 0.96)\n          .setStrokeStyle(isLastStandard ? 3 : 2, borderColor, isLastStandard ? 0.9 : entry.owned ? 0.75 : 0.25);\n        card.setData('nearCompletionLastStandard', isLastStandard ? entry.id : null);\n        root.add(card);\n""",
              1,
          )
          replace(
              'src/game/scenes/CollectionScene.ts',
              """        root.add(\n          this.add\n            .text(x, y + 60, messages.rarity[entry.rarity], {\n""",
              """        if (isLastStandard) {\n          const lastTag = this.add\n            .text(x, y + 35, messages.collection.lastStandard, {\n              color: '#dffcff',\n              backgroundColor: '#203544',\n              padding: { x: 5, y: 3 },\n              fontFamily: 'monospace',\n              fontSize: '7px',\n              fontStyle: 'bold',\n            })\n            .setOrigin(0.5);\n          lastTag.setData('nearCompletionLastStandard', entry.id);\n          root.add(lastTag);\n        }\n        root.add(\n          this.add\n            .text(x, y + 60, messages.rarity[entry.rarity], {\n""",
              1,
          )
          PY

          cat > tests/near-completion.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';

          import { SLICE_REGISTRY } from '../src/game/data/collectibles';
          import { getStandardNearCompletion } from '../src/game/systems/collection';

          const standards = SLICE_REGISTRY.standardItems;
          const ids = standards.map(({ collectible }) => collectible.id);
          const last = standards.at(-1);
          if (!last) throw new Error('Slice requires at least one standard collectible');

          describe('standard near-completion presentation state', () => {
            it('identifies the one missing standard at 7/8', () => {
              expect(getStandardNearCompletion(SLICE_REGISTRY, { discoveredStandard: ids.slice(0, -1) })).toEqual({
                current: 7,
                total: 8,
                missingCollectibleId: last.collectible.id,
                familyId: last.familyId,
                rarity: last.rarity,
              });
            });

            it('stays off before 7/8 and after completion', () => {
              expect(getStandardNearCompletion(SLICE_REGISTRY, { discoveredStandard: ids.slice(0, 6) })).toBeNull();
              expect(getStandardNearCompletion(SLICE_REGISTRY, { discoveredStandard: ids })).toBeNull();
            });

            it('ignores unknown ids instead of treating them as collection progress', () => {
              expect(getStandardNearCompletion(SLICE_REGISTRY, {
                discoveredStandard: [...ids.slice(0, 6), 'unknown-standard'],
              })).toBeNull();
              expect(getStandardNearCompletion(SLICE_REGISTRY, {
                discoveredStandard: [...ids.slice(0, -1), 'unknown-standard'],
              })?.missingCollectibleId).toBe(last.collectible.id);
            });
          });
          EOF

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build

      - name: Source contract guard
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          collection = Path('src/game/systems/collection.ts').read_text(encoding='utf-8')
          opening = Path('src/game/scenes/OpeningScene.ts').read_text(encoding='utf-8')
          collection_scene = Path('src/game/scenes/CollectionScene.ts').read_text(encoding='utf-8')
          assert "missing.length !== 1" in collection
          assert "getStandardNearCompletion(SLICE_REGISTRY, pending.commit)" in opening
          reward = opening.split('private renderRewardTray', 1)[1].split('private animateDiscoveryBeat', 1)[0]
          assert "nearCompletionText.setData('nearCompletion', true)" in reward
          assert reward.index('if (secretSelected && pending.hiddenPocket)') < reward.index('getStandardNearCompletion(SLICE_REGISTRY, pending.commit)')
          assert "getStandardNearCompletion(SLICE_REGISTRY, this.saveState)" in collection_scene
          assert "nearCompletionLastStandard" in collection_scene
          assert "LAST STANDARD" in Path('src/i18n/en.ts').read_text(encoding='utf-8')
          # Presentation-only pass: no resolver/economy/save implementation files changed.
          changed = set(__import__('subprocess').check_output(['git', 'diff', '--name-only', 'HEAD']).decode().splitlines())
          forbidden = {'src/game/systems/drops.ts', 'src/game/systems/pouches.ts', 'src/game/systems/save.ts', 'src/game/data/balance.ts'}
          assert not (changed & forbidden), changed & forbidden
          PY
          git diff --check

      - name: Install browser audit dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run near-completion browser audit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.ts')
          text = path.read_text(encoding='utf-8')
          anchor = "  game.sound.mute = blocked;\n"
          if anchor not in text: raise SystemExit('main audit anchor missing')
          text = text.replace(anchor, anchor + "  if (import.meta.env.DEV) (window as typeof window & { __mptAuditGame?: Phaser.Game }).__mptAuditGame = game;\n", 1)
          path.write_text(text, encoding='utf-8')
          PY
          cat > tools/tmp-near-completion-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('audit-artifacts', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
          const errors = [];
          page.on('pageerror', error => errors.push(`pageerror:${error.message}`));
          page.on('console', message => { if (message.type() === 'error') errors.push(`console:${message.text()}`); });
          await page.goto('http://127.0.0.1:5173/?debug=1', { waitUntil: 'load' });
          await page.waitForFunction(() => window.__mptAuditGame?.scene?.getScene?.('OpeningScene')?.phase === 'idle', null, { timeout: 15000 });
          const hide = page.getByRole('button', { name: 'Hide', exact: true });
          if (await hide.isVisible().catch(() => false)) await hide.click();

          const collectionSetup = await page.evaluate(async () => {
            const { SLICE_REGISTRY } = await import('/src/game/data/collectibles.ts');
            const { createInitialSaveState } = await import('/src/game/systems/save.ts');
            const opening = window.__mptAuditGame.scene.getScene('OpeningScene');
            opening.scene.start('CollectionScene');
            const standards = SLICE_REGISTRY.standardItems;
            const missing = standards.at(-1);
            return { missingId: missing.collectible.id, missingFamily: missing.familyId, missingRarity: missing.rarity };
          });
          await page.waitForFunction(() => Boolean(window.__mptAuditGame?.scene?.getScene?.('CollectionScene')?.snapshot), null, { timeout: 15000 });

          const shelf = await page.evaluate(async () => {
            const { SLICE_REGISTRY } = await import('/src/game/data/collectibles.ts');
            const { createInitialSaveState } = await import('/src/game/systems/save.ts');
            const { buildCollectionSnapshot } = await import('/src/game/systems/collection.ts');
            const scene = window.__mptAuditGame.scene.getScene('CollectionScene');
            const ids = SLICE_REGISTRY.standardItems.map(({ collectible }) => collectible.id);
            const state = { ...createInitialSaveState(), totalOpens: 10, discoveredStandard: ids.slice(0, -1) };
            scene.saveState = state;
            scene.snapshot = buildCollectionSnapshot(SLICE_REGISTRY, state);
            scene.view = 'shelf';
            scene.render();
            const texts = scene.root.list.filter(item => typeof item.text === 'string').map(item => item.text);
            return { texts, standardCount: scene.snapshot.standardCount, standardTotal: scene.snapshot.standardTotal };
          });
          await page.screenshot({ path: 'audit-artifacts/collection-shelf-7of8.png', fullPage: true });

          const library = await page.evaluate(() => {
            const scene = window.__mptAuditGame.scene.getScene('CollectionScene');
            scene.view = 'library';
            scene.render();
            const texts = scene.root.list.filter(item => typeof item.text === 'string').map(item => item.text);
            const tagged = scene.root.list.filter(item => item.getData?.('nearCompletionLastStandard'));
            return {
              texts,
              taggedCount: tagged.length,
              taggedIds: tagged.map(item => item.getData('nearCompletionLastStandard')),
            };
          });
          await page.screenshot({ path: 'audit-artifacts/collection-library-last-standard.png', fullPage: true });

          await page.evaluate(() => window.__mptAuditGame.scene.getScene('CollectionScene').scene.start('OpeningScene'));
          await page.waitForFunction(() => window.__mptAuditGame?.scene?.getScene?.('OpeningScene')?.phase === 'idle', null, { timeout: 15000 });

          const openingStandard = await page.evaluate(async () => {
            const { SLICE_REGISTRY } = await import('/src/game/data/collectibles.ts');
            const { LITE_V2_BALANCE } = await import('/src/game/data/balance.ts');
            const { createInitialSaveState } = await import('/src/game/systems/save.ts');
            const { createPendingReveal } = await import('/src/game/systems/drops.ts');
            const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
            const ids = SLICE_REGISTRY.standardItems.map(({ collectible }) => collectible.id);
            const state = { ...createInitialSaveState(), totalOpens: 3, discoveredStandard: ids.slice(0, -1) };
            const values = [0.1, 0.1, 0, 0, 0.99];
            const random = { next: () => values.shift() ?? 0.99 };
            const pending = createPendingReveal({
              state,
              registry: SLICE_REGISTRY,
              balance: LITE_V2_BALANCE,
              random,
              transactionId: 'near-completion-audit',
              pouchType: 'basic',
            });
            const committed = { ...state, ...pending.commit, pendingReveal: null };
            scene.saveState = committed;
            scene.lastReveal = pending;
            scene.phase = 'result';
            scene.resultReady = true;
            scene.renderResolvedResult(pending);
            window.__mptNearPending = pending;
            const near = scene.rewardTrayContainer.list.find(item => item.getData?.('nearCompletion') === true);
            return {
              standardIsNew: pending.standard.isNew,
              count: pending.commit.discoveredStandard.length,
              text: near?.text ?? '',
              width: near?.width ?? 0,
              trayHeight: Number(scene.rewardTrayContainer.getData('height') ?? 0),
              trayY: scene.rewardTrayContainer.y,
            };
          });
          await page.screenshot({ path: 'audit-artifacts/opening-standard-7of8.png', fullPage: true });

          const openingRu = await page.evaluate(async () => {
            const { getPlatformRuntime } = await import('/src/app/runtime.ts');
            const runtime = getPlatformRuntime();
            runtime.language = 'ru';
            const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
            scene.renderResolvedResult(window.__mptNearPending);
            const near = scene.rewardTrayContainer.list.find(item => item.getData?.('nearCompletion') === true);
            return { text: near?.text ?? '', width: near?.width ?? 0 };
          });
          await page.screenshot({ path: 'audit-artifacts/opening-standard-7of8-ru.png', fullPage: true });

          const hidden = await page.evaluate(async () => {
            const { getPlatformRuntime } = await import('/src/app/runtime.ts');
            getPlatformRuntime().language = 'en';
            const { SLICE_REGISTRY } = await import('/src/game/data/collectibles.ts');
            const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
            const pending = window.__mptNearPending;
            const secret = SLICE_REGISTRY.secrets[0];
            const hiddenPending = {
              ...pending,
              chips: {
                ...pending.chips,
                secretBonus: 40,
                totalEarned: pending.chips.totalEarned + 40,
                after: pending.chips.after + 40,
              },
              hiddenPocket: {
                collectibleId: secret.collectible.id,
                familyId: secret.familyId,
                isNew: true,
                bonusChips: 40,
              },
              commit: {
                ...pending.commit,
                chips: pending.commit.chips + 40,
                discoveredSecrets: [secret.collectible.id],
              },
            };
            scene.saveState = { ...scene.saveState, ...hiddenPending.commit, pendingReveal: null };
            scene.lastReveal = hiddenPending;
            scene.phase = 'result';
            scene.resultReady = true;
            scene.renderResolvedResult(hiddenPending);
            window.__mptHiddenPending = hiddenPending;
            const secretNear = scene.rewardTrayContainer.list.find(item => item.getData?.('nearCompletion') === true);
            const secretIndex = scene.resultCarouselIndex;
            scene.resultCarouselIndex = 0;
            scene.positionResultCarousel(0, false);
            scene.renderRewardTray(hiddenPending, scene.root, false);
            const standardNear = scene.rewardTrayContainer.list.find(item => item.getData?.('nearCompletion') === true);
            return {
              secretIndex,
              secretNearText: secretNear?.text ?? '',
              standardNearText: standardNear?.text ?? '',
            };
          });
          await page.screenshot({ path: 'audit-artifacts/hidden-standard-page-7of8.png', fullPage: true });

          const secretShot = await page.evaluate(() => {
            const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
            scene.resultCarouselIndex = 1;
            scene.positionResultCarousel(0, false);
            scene.renderRewardTray(window.__mptHiddenPending, scene.root, false);
            const near = scene.rewardTrayContainer.list.find(item => item.getData?.('nearCompletion') === true);
            return { nearText: near?.text ?? '', index: scene.resultCarouselIndex };
          });
          await page.screenshot({ path: 'audit-artifacts/hidden-secret-page-no-near-completion.png', fullPage: true });

          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(shelf.standardCount === 7 && shelf.standardTotal === 8, 'collection setup must be 7/8');
          assert(shelf.texts.some(text => text.includes('1 LEFT')), 'shelf must reinforce one remaining standard');
          assert(library.texts.includes('LAST STANDARD'), 'library must label the actual final missing slot');
          assert(library.taggedCount >= 2, 'missing card and tag should carry near-completion markers');
          assert(library.taggedIds.every(id => id === collectionSetup.missingId), 'only the actual missing standard may be emphasized');
          assert(openingStandard.standardIsNew === false, 'audit opening should be a duplicate while remaining at 7/8');
          assert(openingStandard.count === 7, 'duplicate must leave collection at 7/8');
          assert(openingStandard.text === 'STANDARD SET 7/8 · 1 LEFT', `unexpected EN result copy: ${openingStandard.text}`);
          assert(openingStandard.width < 200, `EN near-completion line overflow: ${openingStandard.width}`);
          assert(openingRu.text === 'ОСНОВНЫЕ 7/8 · ОСТАЛСЯ 1', `unexpected RU result copy: ${openingRu.text}`);
          assert(openingRu.width < 200, `RU near-completion line overflow: ${openingRu.width}`);
          assert(hidden.secretIndex === 1, 'Hidden Pocket result should default to Secret page');
          assert(hidden.secretNearText === '', 'Secret page must suppress standard near-completion copy');
          assert(hidden.standardNearText === 'STANDARD SET 7/8 · 1 LEFT', 'standard Hidden Pocket page must restore near-completion copy');
          assert(secretShot.index === 1 && secretShot.nearText === '', 'switching back to Secret must suppress near-completion copy again');
          assert(errors.length === 0, `runtime errors: ${errors.join('; ')}`);
          fs.writeFileSync('audit-artifacts/report.json', JSON.stringify({ collectionSetup, shelf, library, openingStandard, openingRu, hidden, secretShot, errors }, null, 2));
          await browser.close();
          EOF
          npm run dev -- --host 127.0.0.1 > /tmp/mpt-vite.log 2>&1 &
          echo $! > /tmp/mpt-vite.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:5173/?debug=1' >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/mpt-vite.log; exit 1; fi
          node tools/tmp-near-completion-audit.mjs
          kill $(cat /tmp/mpt-vite.pid) || true

      - uses: actions/upload-artifact@v4
        with:
          name: near-completion-audit-r1
          path: audit-artifacts
          if-no-files-found: error

      - name: Restore audit-only changes and commit clean product tree
        if: success()
        run: |
          set -euo pipefail
          git checkout -- src/main.ts package.json package-lock.json
          rm -f tools/tmp-near-completion-audit.mjs
          rm -rf audit-artifacts
          rm -f .github/workflows/tmp-near-completion-r1.yml
          git status --short
          git diff --check
