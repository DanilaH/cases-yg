name: Opening QA fix

on:
  push:
    branches:
      - fix/opening-selector-responsiveness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/opening-selector-responsiveness
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply opening QA fixes
        run: node tools/opening-qa-fix-temp-v2.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Remove temporary patchers and commit production diff
        run: |
          git rm tools/opening-qa-fix-temp.mjs tools/opening-qa-fix-temp-v2.mjs .github/workflows/opening-qa-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/data/artAssets.ts src/game/scenes/OpeningScene.ts src/i18n/en.ts src/i18n/ru.ts tests/runtime-assets.test.ts
          git commit -m "Fix opening selector responsiveness and explain pouch odds"
          git push origin HEAD:fix/opening-selector-responsiveness
