name: Orientation consensus hardening

on:
  push:
    branches:
      - orientation-consensus-hardening

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[orientation-consensus-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: orientation-consensus-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply orientation hardening
        shell: bash
        run: |
          cat > src/app/viewport.ts <<'EOF'
          export interface ViewportSize {
            width: number;
            height: number;
          }

          export interface ViewportState extends ViewportSize {
            portrait: boolean;
          }

          const isUsable = (size: ViewportSize | null | undefined): size is ViewportSize =>
            Boolean(size && Number.isFinite(size.width) && Number.isFinite(size.height) && size.width > 0 && size.height > 0);

          export const isPortraitViewport = (size: ViewportSize): boolean => size.height > size.width;

          const resolvePortrait = (
            visualViewport: ViewportSize | null | undefined,
            innerViewport: ViewportSize | null | undefined,
            documentViewport: ViewportSize | null | undefined,
            mediaPortrait: boolean | null,
          ): boolean => {
            const inner = isUsable(innerViewport) ? innerViewport : null;
            const documentSize = isUsable(documentViewport) ? documentViewport : null;
            const visual = isUsable(visualViewport) ? visualViewport : null;

            // Layout viewport geometry is the primary truth. screen.orientation is
            // intentionally excluded: Android browsers/webviews can leave it stale
            // after the page geometry has already rotated.
            if (inner && documentSize) {
              const innerPortrait = isPortraitViewport(inner);
              const documentPortrait = isPortraitViewport(documentSize);
              if (innerPortrait === documentPortrait) return innerPortrait;
              // During the brief disagreement window, matchMedia is only a tie-breaker.
              if (mediaPortrait !== null) return mediaPortrait;
              return innerPortrait;
            }
            if (inner) return isPortraitViewport(inner);
            if (documentSize) return isPortraitViewport(documentSize);
            if (visual) return isPortraitViewport(visual);
            return mediaPortrait ?? false;
          };

          /**
           * Resolve one coherent viewport snapshot. Orientation and dimensions must
           * come from the same decision so the rotate gate cannot disagree with the
           * Phaser/CSS resize path.
           *
           * visualViewport remains the preferred size only when its orientation
           * agrees with the resolved layout orientation. This handles the common
           * mobile-rotation case where visualViewport is stale for a few frames.
           */
          export const resolveViewportState = (
            visualViewport: ViewportSize | null | undefined,
            innerViewport: ViewportSize | null | undefined,
            documentViewport: ViewportSize | null | undefined,
            mediaPortrait: boolean | null,
          ): ViewportState => {
            const portrait = resolvePortrait(visualViewport, innerViewport, documentViewport, mediaPortrait);
            const candidates = [visualViewport, innerViewport, documentViewport].filter(isUsable);
            const size = candidates.find((candidate) => isPortraitViewport(candidate) === portrait) ?? candidates[0] ?? { width: 1, height: 1 };
            return { width: size.width, height: size.height, portrait };
          };
          EOF

          cat > tests/viewport.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';

          import { isPortraitViewport, resolveViewportState } from '../src/app/viewport';

          describe('viewport resolution', () => {
            it('prefers visualViewport when all geometry agrees', () => {
              expect(resolveViewportState(
                { width: 844, height: 390 },
                { width: 844, height: 390 },
                { width: 844, height: 390 },
                false,
              )).toEqual({ width: 844, height: 390, portrait: false });
            });

            it('rejects stale portrait visualViewport after layout geometry rotates to landscape', () => {
              expect(resolveViewportState(
                { width: 390, height: 844 },
                { width: 844, height: 390 },
                { width: 844, height: 390 },
                true,
              )).toEqual({ width: 844, height: 390, portrait: false });
            });

            it('does not let a stale media orientation override agreeing layout geometry', () => {
              expect(resolveViewportState(
                { width: 390, height: 844 },
                { width: 915, height: 412 },
                { width: 915, height: 412 },
                true,
              ).portrait).toBe(false);
            });

            it('uses media orientation only as a tie-breaker while layout sources disagree', () => {
              expect(resolveViewportState(
                { width: 390, height: 844 },
                { width: 844, height: 390 },
                { width: 390, height: 844 },
                false,
              )).toEqual({ width: 844, height: 390, portrait: false });
            });

            it('falls back to the best available geometry without orientation APIs', () => {
              const state = resolveViewportState(
                { width: 412, height: 915 },
                null,
                null,
                null,
              );
              expect(state).toEqual({ width: 412, height: 915, portrait: true });
              expect(isPortraitViewport(state)).toBe(true);
            });
          });
          EOF

          python <<'PY'
          from pathlib import Path

          path = Path('src/main.ts')
          text = path.read_text()

          text = text.replace(
              "import { resolveViewportSize } from './app/viewport';",
              "import { resolveViewportState, type ViewportState } from './app/viewport';",
          )
          text = text.replace(
              "const VIEWPORT_SETTLE_DELAYS_MS = [120, 360, 700] as const;",
              "const VIEWPORT_SETTLE_DELAYS_MS = [120, 360, 700, 1200, 2000] as const;\nconst VIEWPORT_WATCHDOG_MS = 500;",
          )

          old = '''const readOrientationPortraitHint = (): boolean | null => {
            const orientationType = window.screen.orientation?.type;
            if (orientationType?.startsWith('portrait')) return true;
            if (orientationType?.startsWith('landscape')) return false;
            if (typeof window.matchMedia === 'function') {
              return window.matchMedia('(orientation: portrait)').matches;
            }
            return null;
          };

          const readLiveViewportSize = (): CssViewportSize => {
            const viewport = window.visualViewport;
            const root = document.documentElement;
            return resolveViewportSize(
              viewport ? { width: viewport.width, height: viewport.height } : null,
              { width: window.innerWidth, height: window.innerHeight },
              { width: root.clientWidth, height: root.clientHeight },
              readOrientationPortraitHint(),
            );
          };

          const syncViewportCssSize = (): CssViewportSize => {
            const size = readLiveViewportSize();
          '''
          new = '''const readOrientationMediaPortrait = (): boolean | null => {
            if (typeof window.matchMedia !== 'function') return null;
            return window.matchMedia('(orientation: portrait)').matches;
          };

          const readLiveViewportState = (): ViewportState => {
            const viewport = window.visualViewport;
            const root = document.documentElement;
            return resolveViewportState(
              viewport ? { width: viewport.width, height: viewport.height } : null,
              { width: window.innerWidth, height: window.innerHeight },
              { width: root.clientWidth, height: root.clientHeight },
              readOrientationMediaPortrait(),
            );
          };

          const readLiveViewportSize = (): CssViewportSize => {
            const { width, height } = readLiveViewportState();
            return { width, height };
          };

          const syncViewportCssSize = (state: ViewportState = readLiveViewportState()): CssViewportSize => {
            const size = state;
          '''
          if old not in text:
              raise SystemExit('viewport reader block not found')
          text = text.replace(old, new)

          old = '''  const updateOrientationGate = (): void => {
            const viewport = readLiveViewportSize();
            const portrait = readOrientationPortraitHint() ?? viewport.height > viewport.width;
            if (gate) gate.dataset.visible = portrait ? 'true' : 'false';
            platform.activity.setBlocked('orientation', portrait);
          };'''
          new = '''  const updateOrientationGate = (viewport: ViewportState): void => {
            if (gate) gate.dataset.visible = viewport.portrait ? 'true' : 'false';
            platform.activity.setBlocked('orientation', viewport.portrait);
          };'''
          if old not in text:
              raise SystemExit('orientation gate block not found')
          text = text.replace(old, new)

          old = '''  const applyViewportChange = (): void => {
            syncViewportCssSize();
            syncBackingStore();
            updateOrientationGate();
          };

          let viewportAnimationFrame: number | null = null;'''
          new = '''  let lastViewportSignature = '';
          const getViewportSignature = (viewport: ViewportState): string =>
            `${Math.round(viewport.width)}x${Math.round(viewport.height)}:${viewport.portrait ? 'p' : 'l'}`;

          const applyViewportChange = (): void => {
            const viewport = readLiveViewportState();
            syncViewportCssSize(viewport);
            syncBackingStore();
            updateOrientationGate(viewport);
            lastViewportSignature = getViewportSignature(viewport);
          };

          let viewportAnimationFrame: number | null = null;'''
          if old not in text:
              raise SystemExit('apply viewport block not found')
          text = text.replace(old, new)

          old = '''  applyViewportChange();
          window.addEventListener('resize', scheduleViewportChange);'''
          new = '''  applyViewportChange();
          const viewportWatchdog = window.setInterval(() => {
            const viewport = readLiveViewportState();
            if (getViewportSignature(viewport) !== lastViewportSignature) scheduleViewportChange();
          }, VIEWPORT_WATCHDOG_MS);
          window.addEventListener('resize', scheduleViewportChange);'''
          if old not in text:
              raise SystemExit('initial apply block not found')
          text = text.replace(old, new)

          old = '''      for (const timer of viewportSettleTimers) window.clearTimeout(timer);
              viewportSettleTimers = [];
              resizeObserver?.disconnect();'''
          new = '''      for (const timer of viewportSettleTimers) window.clearTimeout(timer);
              viewportSettleTimers = [];
              window.clearInterval(viewportWatchdog);
              resizeObserver?.disconnect();'''
          if old not in text:
              raise SystemExit('cleanup block not found')
          text = text.replace(old, new)

          path.write_text(text)
          PY

          cat > docs/ORIENTATION_ROTATION_HARDENING_2026-09-14.md <<'EOF'
          # Signal 2000 — Orientation Rotation Hardening

          **Date:** 2026-09-14
          **Trigger:** repeated real-phone failure where portrait/landscape rotation could leave the rotate gate or game layout stale.

          ## Root cause

          The previous hotfix improved stale `visualViewport` handling but promoted `screen.orientation.type` to orientation truth. That is still unsafe on mobile browsers/webviews: `screen.orientation` can lag behind the layout viewport or remain stale while `innerWidth/innerHeight` and document client geometry have already rotated. The rotate gate and the chosen viewport size could therefore be driven by a stale API signal.

          ## Fix

          - Orientation truth now comes primarily from layout geometry (`innerWidth/innerHeight` + document client bounds).
          - `visualViewport` is preferred for actual size only when its portrait/landscape shape agrees with resolved layout orientation.
          - `matchMedia('(orientation: portrait)')` is only a tie-breaker while the two layout geometry sources temporarily disagree.
          - `screen.orientation` is retained only as an event source; its reported type is no longer trusted as state.
          - CSS sizing, Phaser backing-store resize, and the rotate gate consume one coherent resolved viewport snapshot.
          - Settle checks extend through 2 seconds.
          - A cheap 500 ms geometry watchdog guarantees eventual recovery even if a mobile browser drops the useful rotation/resize event entirely. It only schedules the resize pipeline when the resolved viewport signature actually changes.

          ## Guardrails

          No gameplay, economy, RNG, save, reward, onboarding, Signal/Overcharge, or Yandex monetization semantics change.

          ## Validation

          Full gate: `npm ci`, typecheck, tests, asset self-test, asset validation, production build. Real-phone portrait ↔ landscape cycling remains the final acceptance gate.
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Asset self-test
        run: npm run assets:selftest

      - name: Asset validation
        run: npm run assets:validate

      - name: Production build
        run: npm run build

      - name: Remove one-shot workflow
        run: rm .github/workflows/orientation-consensus-hardening.yml

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden orientation with viewport geometry consensus [orientation-consensus-done]"
          git push origin HEAD:orientation-consensus-hardening
