name: Apply signal HUD label fit fix

on:
  push:
    branches:
      - fix-signal-lock-ready-fit
    paths:
      - .github/workflows/fix-signal-lock-ready-fit.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix-signal-lock-ready-fit

      - name: Patch compact lock-ready label size
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/scenes/OpeningScene.ts')
          source = path.read_text()
          old = "fontSize: chrome.compact ? '19px' : lockReady ? '8px' : '9px',"
          new = "fontSize: chrome.compact ? (lockReady ? '13px' : '19px') : lockReady ? '8px' : '9px',"
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one signal HUD font-size seam, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/fix-signal-lock-ready-fit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts .github/workflows/fix-signal-lock-ready-fit.yml
          git commit -m "Keep signal lock ready label inside HUD"
          git push origin HEAD:fix-signal-lock-ready-fit
