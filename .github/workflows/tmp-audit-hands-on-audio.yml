name: TEMP hands-on audio browser audit

on:
  push:
    branches:
      - polish/hands-on-audio-corrections-r1
    paths:
      - .github/workflows/tmp-audit-hands-on-audio.yml
      - tools/tmp-audit-hands-on-audio.mjs

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/hands-on-audio-corrections-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install project
        run: npm ci
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/mpt-dev.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/mpt-dev.log
          exit 1
      - name: Correct audit for default Secret carousel page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/tmp-audit-hands-on-audio.mjs')
          t = p.read_text()
          start = t.index('const standardInitial = await persistentSnapshot();')
          end = t.index('const bankingMark = await oscillatorCount();')
          new = '''const secretInitial = await persistentSnapshot();

const subthresholdMark = await oscillatorCount();
await drag(-30);
const subthresholdClicks = await recentCarouselSwitchCount(subthresholdMark);
assert(subthresholdClicks === 0, 'Sub-threshold carousel drag emitted a switch cue', { subthresholdClicks });

const returnMark = await oscillatorCount();
await drag(112);
const returnClicks = await recentCarouselSwitchCount(returnMark);
const standardAfterReturn = await persistentSnapshot();
assert(returnClicks === 1, 'Secret to standard page change did not emit exactly one switch cue', { returnClicks });
assert(standardAfterReturn.total < secretInitial.total, 'Secret persistent sources were not retired on return', {
  secretInitial,
  standardAfterReturn,
});

const secondSecretMark = await oscillatorCount();
await drag(-112);
const secondSecretClicks = await recentCarouselSwitchCount(secondSecretMark);
const secretSecond = await persistentSnapshot();
assert(secondSecretClicks === 1, 'Standard to Secret page change did not emit exactly one switch cue', { secondSecretClicks });
assert(secretSecond.total > standardAfterReturn.total, 'Secret page did not take persistent ambience ownership', {
  standardAfterReturn,
  secretSecond,
});
assert(Math.abs(secretSecond.total - secretInitial.total) <= 1, 'Persistent rarity sources stacked across carousel cycles', {
  secretInitial,
  secretSecond,
});

const secondReturnMark = await oscillatorCount();
await drag(112);
const secondReturnClicks = await recentCarouselSwitchCount(secondReturnMark);
const standardSecondReturn = await persistentSnapshot();
assert(secondReturnClicks === 1, 'Second return page change did not emit exactly one switch cue', { secondReturnClicks });
assert(Math.abs(standardSecondReturn.total - standardAfterReturn.total) <= 1, 'Base/persistent source count drifted after repeated page switching', {
  standardAfterReturn,
  standardSecondReturn,
});

'''
          t = t[:start] + new + t[end:]
          report_start = t.index('const report = {')
          report_end = t.index('\n\nawait writeFile', report_start)
          report = '''const report = {
  failures,
  pageErrors,
  badResponses,
  secretInitial,
  standardAfterReturn,
  secretSecond,
  standardSecondReturn,
  afterBanking,
  switchCounts: {
    subthreshold: subthresholdClicks,
    firstReturn: returnClicks,
    secondSecret: secondSecretClicks,
    secondReturn: secondReturnClicks,
  },
  chipClacks: clacks,
};'''
          p.write_text(t[:report_start] + report + t[report_end:])
          PY
      - name: Run browser audit
        run: node tools/tmp-audit-hands-on-audio.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hands-on-audio-audit
          path: hands-on-audio-audit.json
          if-no-files-found: warn
      - name: Remove temporary audit tooling
        if: success()
        run: |
          git checkout -- tools/tmp-audit-hands-on-audio.mjs package.json package-lock.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp-audit-hands-on-audio.mjs .github/workflows/tmp-audit-hands-on-audio.yml
          git commit -m "Remove temporary hands-on audio browser audit"
          git push origin HEAD:polish/hands-on-audio-corrections-r1
