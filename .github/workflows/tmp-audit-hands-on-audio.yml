name: TEMP hands-on audio browser audit

on:
  push:
    branches:
      - polish/hands-on-audio-corrections-r1
    paths:
      - .github/workflows/tmp-audit-hands-on-audio.yml
      - tools/tmp-audit-hands-on-audio.mjs

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/hands-on-audio-corrections-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install project
        run: npm ci
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/mpt-dev.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/mpt-dev.log
          exit 1
      - name: Align audit with default Secret carousel page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/tmp-audit-hands-on-audio.mjs')
          t = p.read_text()
          t = t.replace("const realSwitchMark = await oscillatorCount();\nawait drag(-112);", "const realSwitchMark = await oscillatorCount();\nawait drag(112);", 1)
          t = t.replace("assert(secretFirst.total > standardInitial.total, 'Secret page did not take persistent ambience ownership'", "assert(secretFirst.total < standardInitial.total, 'Secret sources did not retire when switching to standard'", 1)
          t = t.replace("const returnMark = await oscillatorCount();\nawait drag(112);", "const returnMark = await oscillatorCount();\nawait drag(-112);", 1)
          t = t.replace("assert(standardAfterReturn.total < secretFirst.total, 'Secret persistent sources were not retired on return'", "assert(standardAfterReturn.total > secretFirst.total, 'Secret page did not take persistent ambience ownership'", 1)
          t = t.replace("const secondSecretMark = await oscillatorCount();\nawait drag(-112);", "const secondSecretMark = await oscillatorCount();\nawait drag(112);", 1)
          t = t.replace("await drag(112);\nconst standardSecondReturn", "await drag(-112);\nconst standardSecondReturn", 1)
          p.write_text(t)
          PY
      - name: Run browser audit
        run: node tools/tmp-audit-hands-on-audio.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hands-on-audio-audit
          path: hands-on-audio-audit.json
          if-no-files-found: warn
      - name: Remove temporary audit tooling
        if: success()
        run: |
          git checkout -- tools/tmp-audit-hands-on-audio.mjs package.json package-lock.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp-audit-hands-on-audio.mjs .github/workflows/tmp-audit-hands-on-audio.yml
          git commit -m "Remove temporary hands-on audio browser audit"
          git push origin HEAD:polish/hands-on-audio-corrections-r1
