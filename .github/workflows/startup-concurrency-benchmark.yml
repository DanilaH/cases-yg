name: Startup art concurrency benchmark

on:
  push:
    branches:
      - experiment/startup-concurrency-benchmark
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install isolated browser harness
        run: |
          rm -rf /tmp/browser-harness
          npm install --prefix /tmp/browser-harness --package-lock=false playwright@1.55.0
          /tmp/browser-harness/node_modules/.bin/playwright install --with-deps chromium

      - name: Benchmark live Pages under fixed mobile network
        run: |
          mkdir -p /tmp/startup-concurrency-benchmark
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium, devices } = require('/tmp/browser-harness/node_modules/playwright');

          const BASE_URL = 'https://danilah.github.io/cases-yg/';
          const PROFILE = {
            name: 'moderate-4g',
            latencyMs: 80,
            downloadBytesPerSecond: 1_250_000,
            uploadBytesPerSecond: 625_000,
            connectionType: 'cellular4g',
          };
          const CANDIDATES = [
            { label: 'default', value: null },
            { label: 'x4', value: 4 },
            { label: 'x8', value: 8 },
            { label: 'x12', value: 12 },
            { label: 'x16', value: 16 },
            { label: 'x24', value: 24 },
            { label: 'x32', value: 32 },
          ];
          const ROUNDS = 5;
          const median = (values) => {
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.floor(sorted.length / 2)];
          };
          const percentile = (values, p) => {
            const sorted = [...values].sort((a, b) => a - b);
            const index = Math.min(sorted.length - 1, Math.max(0, Math.ceil((p / 100) * sorted.length) - 1));
            return sorted[index];
          };
          const rotatedOrder = (round) => {
            const shift = round % CANDIDATES.length;
            return [...CANDIDATES.slice(shift), ...CANDIDATES.slice(0, shift)];
          };

          const collectOne = async (browser, candidate, round) => {
            const context = await browser.newContext({
              ...devices['Pixel 7'],
              serviceWorkers: 'block',
            });
            const page = await context.newPage();
            const client = await context.newCDPSession(page);
            await client.send('Network.enable');
            await client.send('Network.setCacheDisabled', { cacheDisabled: true });
            await client.send('Network.emulateNetworkConditions', {
              offline: false,
              latency: PROFILE.latencyMs,
              downloadThroughput: PROFILE.downloadBytesPerSecond,
              uploadThroughput: PROFILE.uploadBytesPerSecond,
              connectionType: PROFILE.connectionType,
            });

            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));

            const url = new URL(BASE_URL);
            url.searchParams.set('benchmark', `round-${round}`);
            if (candidate.value !== null) url.searchParams.set('artConcurrency', String(candidate.value));

            const startedAt = Date.now();
            await page.goto(url.toString(), { waitUntil: 'domcontentloaded', timeout: 120_000 });
            await page.waitForFunction(
              () => document.querySelector('#startup-preload')?.getAttribute('data-state') === 'hidden',
              { timeout: 120_000 },
            );
            const wallClockMs = Date.now() - startedAt;
            if (pageErrors.length) throw new Error(`${candidate.label} round ${round} page errors: ${pageErrors.join(' | ')}`);

            await page.getByRole('button', { name: 'Startup timing', exact: true }).click();
            await page.waitForFunction(() => document.querySelector('.mpt-debug-panel [data-status]')?.textContent?.includes('platformToArtMs'));
            const timing = JSON.parse(await page.locator('.mpt-debug-panel [data-status]').textContent());

            await page.getByRole('button', { name: 'Startup art', exact: true }).click();
            await page.waitForFunction(() => document.querySelector('.mpt-debug-panel [data-status]')?.textContent?.includes('loaderWallMs'));
            const art = JSON.parse(await page.locator('.mpt-debug-panel [data-status]').textContent());

            if (art.queuedCount !== 115 || art.observedCount !== 115) {
              throw new Error(`${candidate.label} round ${round}: expected 115/115 art timings, got ${art.queuedCount}/${art.observedCount}`);
            }
            if (candidate.value !== null && art.loaderMaxParallelDownloads !== candidate.value) {
              throw new Error(`${candidate.label} round ${round}: override failed, loader=${art.loaderMaxParallelDownloads}`);
            }
            if (candidate.value === null && art.loaderMaxParallelDownloads !== 6) {
              throw new Error(`default round ${round}: expected Android default loader=6, got ${art.loaderMaxParallelDownloads}`);
            }
            if (art.cacheLikeCount !== 0) {
              throw new Error(`${candidate.label} round ${round}: browser cache contaminated sample (${art.cacheLikeCount} cache-like entries)`);
            }

            const result = {
              round,
              label: candidate.label,
              concurrency: art.loaderMaxParallelDownloads,
              platformToArtMs: timing.platformToArtMs,
              moduleToReadyMs: timing.moduleToReadyMs,
              loaderWallMs: art.loaderWallMs,
              resourceSpanMs: art.resourceSpanMs,
              settleAfterLastResponseMs: art.settleAfterLastResponseMs,
              maxObservedNetworkConcurrency: art.maxObservedNetworkConcurrency,
              transferKiB: art.transferKiB,
              encodedKiB: art.encodedKiB,
              protocols: art.protocols,
              wallClockMs,
            };
            console.log(JSON.stringify(result));
            await context.close();
            return result;
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const samples = [];
            try {
              for (let round = 0; round < ROUNDS; round += 1) {
                for (const candidate of rotatedOrder(round)) {
                  samples.push(await collectOne(browser, candidate, round + 1));
                }
              }
            } finally {
              await browser.close();
            }

            const summary = CANDIDATES.map((candidate) => {
              const rows = samples.filter((sample) => sample.label === candidate.label);
              const artValues = rows.map((sample) => sample.platformToArtMs);
              const loaderValues = rows.map((sample) => sample.loaderWallMs);
              return {
                label: candidate.label,
                concurrency: rows[0]?.concurrency,
                samples: artValues,
                medianPlatformToArtMs: median(artValues),
                p90PlatformToArtMs: percentile(artValues, 90),
                minPlatformToArtMs: Math.min(...artValues),
                maxPlatformToArtMs: Math.max(...artValues),
                medianLoaderWallMs: median(loaderValues),
              };
            }).sort((a, b) => a.medianPlatformToArtMs - b.medianPlatformToArtMs);

            const result = {
              target: BASE_URL,
              device: 'Pixel 7 emulation',
              profile: PROFILE,
              rounds: ROUNDS,
              summary,
              samples,
            };
            fs.writeFileSync('/tmp/startup-concurrency-benchmark/result.json', JSON.stringify(result, null, 2));
            console.log('\n=== SUMMARY ===');
            console.log(JSON.stringify(summary, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-concurrency-benchmark
          path: /tmp/startup-concurrency-benchmark/result.json
