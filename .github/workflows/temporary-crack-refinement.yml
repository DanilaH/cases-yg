name: Temporary crack refinement
on:
  push:
    branches: [feat/pouch-crack-dissolve-prototype-20260916]
    paths: [.github/workflows/temporary-crack-refinement.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply visual correction
        run: |
          cat > /tmp/crack-refine.xz.b64 <<'DATA'
          
          DATA
          tr -d '\n ' </tmp/crack-refine.xz.b64 | base64 -d | xz -d >/tmp/crack-refine.patch
          git apply --check /tmp/crack-refine.patch
          git apply /tmp/crack-refine.patch
      - name: Validate TypeScript tests build and commit source-only refinement
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/scenes/OpeningScene.ts src/game/ui/pouchPerspective.ts
          git commit -m 'fix(feel): center cracks on pouch body and preserve independent debris'
          git push origin HEAD:feat/pouch-crack-dissolve-prototype-20260916
