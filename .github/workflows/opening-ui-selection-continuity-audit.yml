name: Opening UI selection continuity audit

on:
  push:
    branches:
      - audit/gameplay-loop-lite-v2-opening-ui-3

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: db0aad6c847ce09936fe85fa3ec2f62fc9eebda3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify fallback guard still exists
        run: |
          grep -F "this.selectedPouchType === 'charged' && !canAffordPouch(this.saveState, 'charged', LITE_V2_BALANCE)" src/game/scenes/OpeningScene.ts
          grep -F "this.selectedPouchType = 'basic';" src/game/scenes/OpeningScene.ts
      - name: Install Playwright driver and video helper
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-pack node_modules/playwright node_modules/playwright-core
          npm pack playwright@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pw-name.txt
          npm pack playwright-core@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pwc-name.txt
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pw-name.txt)" --strip-components=1 -C node_modules/playwright
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pwc-name.txt)" --strip-components=1 -C node_modules/playwright-core
          node node_modules/playwright/cli.js install ffmpeg
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Audit repeated Charged selection
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const out = '/tmp/opening-ui-selection-continuity-audit';
          await fs.mkdir(out, { recursive: true });
          const SAVE_KEY = 'mystery-pocket-tech.save';
          const errors = [];
          const save = { version: 2, discoveredStandard: [], discoveredSecrets: [], chips: 130, signal: 0, activeLootPoolId: 'y2k-essentials', totalOpens: 3, pendingReveal: null, muted: false, stats: { duplicates: 0, hiddenPockets: 0 } };
          const browser = await chromium.launch({ headless: true, channel: 'chrome', args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'] });
          const context = await browser.newContext({ viewport: { width: 1280, height: 720 }, locale: 'en-US', recordVideo: { dir: out, size: { width: 1280, height: 720 } } });
          const page = await context.newPage();
          page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
          page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
          const readSave = async () => JSON.parse(await page.evaluate(k => localStorage.getItem(k), SAVE_KEY));
          const waitPending = async () => page.waitForFunction(key => {
            const raw = localStorage.getItem(key); if (!raw) return false;
            try { return JSON.parse(raw).pendingReveal !== null; } catch { return false; }
          }, SAVE_KEY, { timeout: 5000 });
          const waitCommit = async total => {
            await page.waitForFunction(({ key, total }) => {
              const raw = localStorage.getItem(key); if (!raw) return false;
              try { const state = JSON.parse(raw); return state.pendingReveal === null && state.totalOpens === total; } catch { return false; }
            }, { key: SAVE_KEY, total }, { timeout: 12000 });
            // Result becomes tappable only after the post-commit hold. Leave extra headroom for CI timing.
            await page.waitForTimeout(1800);
          };
          const tear = async () => {
            const x = 482, y = 183;
            await page.mouse.move(x, y); await page.mouse.down();
            await page.mouse.move(x + 150, y, { steps: 8 }); await page.waitForTimeout(90);
            await page.mouse.move(x + 310, y, { steps: 10 }); await page.mouse.up();
            await waitPending();
          };
          await page.goto('http://127.0.0.1:5173/?debug=1&platform=mock', { waitUntil: 'domcontentloaded' });
          await page.waitForSelector('#game canvas', { state: 'visible', timeout: 20000 });
          await page.waitForFunction(() => document.querySelector('#orientation-gate')?.getAttribute('data-visible') !== 'true');
          await page.evaluate(({ key, value }) => localStorage.setItem(key, JSON.stringify(value)), { key: SAVE_KEY, value: save });
          await page.reload({ waitUntil: 'domcontentloaded' });
          await page.waitForSelector('#game canvas', { state: 'visible', timeout: 20000 });
          await page.waitForTimeout(700);
          await page.evaluate(() => { const p = document.querySelector('.mpt-debug-panel'); if (p) p.style.display = 'none'; });

          await page.mouse.click(750, 96);
          await page.waitForTimeout(220);
          await page.screenshot({ path: `${out}/01-charged-selected-before-first-open.png` });
          await tear();
          const firstPending = await readSave();
          if (firstPending.pendingReveal?.pouchType !== 'charged') throw new Error(`First open was not Charged: ${firstPending.pendingReveal?.pouchType}`);
          await waitCommit(4);
          const committed = await readSave();
          if (committed.chips < 60) throw new Error(`Fixture invariant failed: first Charged left only ${committed.chips} CHIPS`);
          // Tap empty background, away from the Hidden Pocket carousel and result panel.
          await page.mouse.click(200, 650);
          await page.waitForTimeout(1000);
          await page.screenshot({ path: `${out}/02-charged-selection-persists-after-result.png` });

          await tear();
          const secondPending = await readSave();
          if (secondPending.pendingReveal?.pouchType !== 'charged') throw new Error(`Repeated open did not preserve Charged: ${secondPending.pendingReveal?.pouchType}`);
          await fs.writeFile(`${out}/report.json`, JSON.stringify({ auditedHead: 'db0aad6c847ce09936fe85fa3ec2f62fc9eebda3', errors, firstCommittedChips: committed.chips, repeatedPouchType: secondPending.pendingReveal?.pouchType }, null, 2));
          await context.close(); await browser.close();
          if (errors.length) throw new Error(`Browser diagnostics: ${errors.join(' | ')}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-ui-selection-continuity-audit
          path: /tmp/opening-ui-selection-continuity-audit
          if-no-files-found: error
          retention-days: 3
