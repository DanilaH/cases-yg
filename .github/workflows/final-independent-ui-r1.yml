name: Final independent UI R1 audit

on:
  push:
    branches:
      - audit/final-independent-ui-r1
    paths:
      - .github/scripts/final-independent-ui-r1.mjs
      - .github/workflows/final-independent-ui-r1.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assert exact audited product tree
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD=96b4f62481a499a94b2afb10dbab3fb82b9d1da2
          git cat-file -e "$PRODUCT_HEAD^{commit}"
          unexpected="$(git diff --name-only "$PRODUCT_HEAD"...HEAD | grep -Ev '^\.github/(scripts/final-independent-ui-r1\.mjs|workflows/final-independent-ui-r1\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Audit branch changes product files:'
            echo "$unexpected"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install Playwright driver and video helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-pack node_modules/playwright node_modules/playwright-core
          npm pack playwright@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pw-name.txt
          npm pack playwright-core@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pwc-name.txt
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pw-name.txt)" --strip-components=1 -C node_modules/playwright
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pwc-name.txt)" --strip-components=1 -C node_modules/playwright-core
          node node_modules/playwright/cli.js install ffmpeg
      - name: Normalize synthetic result fixture
        shell: bash
        run: |
          sed -i 's/signalBefore: 3, signalGain: 1/signalGain: 1/' .github/scripts/final-independent-ui-r1.mjs
      - name: Start Vite
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Run independent browser and video audit
        run: node .github/scripts/final-independent-ui-r1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-independent-ui-r1
          path: /tmp/final-independent-ui-r1
          if-no-files-found: error
          retention-days: 3
