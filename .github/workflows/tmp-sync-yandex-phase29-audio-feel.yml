name: TEMP sync Yandex Phase 2.9 audio feel

on:
  push:
    branches:
      - docs/sync-yandex-phase29-audio-feel

permissions:
  contents: write

jobs:
  sync-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/sync-yandex-phase29-audio-feel
          fetch-depth: 0

      - name: Sync hosted validation checklist
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/YANDEX_SLICE_VALIDATION.md')
          text = path.read_text(encoding='utf-8')

          def replace(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one anchor, got {count}: {old[:180]!r}')
              text = text.replace(old, new, 1)

          replace(
              'This checklist is the hosted-platform gate that runs **after Phase 2.6 Signal Overcharge + Phase 2.7 Secret reward correction + final merged-main repeated-use acceptance + Phase 2.8 result/reveal choreography correction (PR #65)**.',
              'This checklist is the hosted-platform gate that runs **after Phase 2.6 Signal Overcharge + Phase 2.7 Secret reward correction + final merged-main repeated-use acceptance + Phase 2.8 result/reveal choreography correction + Phase 2.9 Audio + Reward Feel bounded polish (PRs #75–#82)**.',
          )

          replace(
              '- debug rewarded CHIPS probe reloads after a durable grant before another pouch can use stale in-memory session state.\n\n## DRAFT — boot / LoadingAPI',
              '''- debug rewarded CHIPS probe reloads after a durable grant before another pouch can use stale in-memory session state;\n- base gameplay ambience unlock/mute/platform-block lifecycle and deterministic teardown;\n- stable result-owned Rare/Epic/Legendary/Secret ambience with no persistent-source stacking across repeated openings;\n- Hidden Pocket active-page ambience ownership and Secret↔standard cross-state cleanup;\n- NEW discovery and DUPLICATE conversion remain presentation-only and do not mutate collection/economy outside the committed result;\n- drag/tear continuous texture releases on hold/release/cancel/complete/mute/block/scene teardown;\n- high-rarity anticipation/settle does not alter deterministic result timing or replay on recovery;\n- collection milestone presentation is one-shot per committed opening;\n- 7/8 near-completion presentation is read-only and does not alter rarity/drop/targeting probabilities.\n\n## DRAFT — boot / LoadingAPI''',
          )

          pause_anchor = '''6. Repeat while a Secret premium state is visible; persistent Secret tweens must resume cleanly and still teardown on collect/navigation.\n\n## DRAFT — interstitial'''
          pause_replacement = '''6. Repeat while a Secret premium state is visible; persistent Secret tweens must resume cleanly and still teardown on collect/navigation.\n\n## DRAFT — Phase 2.9 Audio + Reward Feel lifecycle\n\nThe Phase 2.9 polish deliberately uses stateful WebAudio presentation, so hosted validation must prove it behaves under the real Yandex lifecycle rather than only in local Chromium.\n\n### Base ambience / mute / platform block\n\n- after the first valid user gesture, the quiet room/device ambience + slow pad enters once and remains restrained under foreground SFX;\n- mute immediately silences persistent ambience and drag texture; unmute restores only the currently desired stable state, without stacking a second bed/rarity layer;\n- Yandex pause/ad/activity block suspends audio coherently and resume restores it once;\n- returning from Collection/root recreation does not leave an orphan rarity loop or progressively increase loudness;\n- hold Common result open for at least 30 seconds: only base ambience remains, with no unintended rarity hum;\n- hold Rare/Epic/Legendary/Secret results open long enough to judge that each persistent state is continuous, click/pop-free and ordered by presence without masking tear/reveal/Signal/CHIPS foreground cues.\n\n### Stable result ownership / Hidden Pocket\n\n- persistent rarity ambience begins from the stable result state, not prematurely during reward staging/Signal/Overcharge choreography;\n- recovered pending Rare/Epic/Legendary results enter the correct single persistent ambience state without replaying transient discovery/conversion meaning;\n- Hidden Pocket Secret page owns Secret ambience; swiping to the standard page suppresses Secret ambience and activates only the matching standard rarity state; swiping back restores Secret without overlap;\n- collect/navigation fades persistent rarity ambience and returns to the ordinary idle bed without a hard cut or stale source.\n\n### NEW vs DUPLICATE / collect / drag / anticipation\n\n- a first-time standard keeps its normal rarity reveal, then receives one short collection-registration acknowledgement; recovery must not replay it as if another acquisition happened;\n- a duplicate keeps the same rarity reveal quality but omits the discovery acknowledgement and emphasizes recycle/conversion meaning instead;\n- accepting either result produces one coherent collect→banking handoff and reaches the exact committed wallet/Signal state; presentation never owns durable reward mutation;\n- drag the tear tab slowly, quickly, stop mid-drag, release/cancel, mute during drag and complete a tear: the continuous material texture follows movement and always releases cleanly with no orphan source;\n- Common/Rare remain fast; Epic/Legendary/Secret use the bounded anticipation/settle hierarchy, and aggressive fast-forward/recovery cannot create duplicate suspense or alter the already-staged result.\n\n### Milestones / near-completion\n\n- validate one-shot 4/8 standards, 8/8 standards, first Secret and 2/2 Secrets milestones after durable commit; resize/re-render/recovery must not retrigger the same opening's milestone;\n- at exactly 7/8 standards, Collection highlights only the actual missing standard slot and Opening may show low-priority near-completion copy;\n- the 7/8 cue remains present across duplicates while the committed set is still 7/8, disappears at 8/8, and never changes resolver eligibility, pity, rarity weights or pouch profile behavior;\n- on Hidden Pocket, near-completion copy follows the active standard page and remains suppressed on the Secret page.\n\n### Subjective hosted mix check\n\nAutomation cannot approve mix fatigue. On the hosted DRAFT, play several consecutive openings with headphones and at least one ordinary speaker/device class. Reject/tune only from direct evidence if ambience is tiring, rarity hum is too loud, duplicate/discovery cues mask rarity, or repeated use feels busier rather than better.\n\n## DRAFT — interstitial'''
          replace(pause_anchor, pause_replacement)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -F 'Phase 2.9 Audio + Reward Feel bounded polish (PRs #75–#82)' docs/YANDEX_SLICE_VALIDATION.md
          grep -F '## DRAFT — Phase 2.9 Audio + Reward Feel lifecycle' docs/YANDEX_SLICE_VALIDATION.md

      - name: Commit clean docs-only diff
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-sync-yandex-phase29-audio-feel.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/YANDEX_SLICE_VALIDATION.md
          git commit -m 'Sync Phase 2.9 Yandex draft validation'
          git push origin HEAD:docs/sync-yandex-phase29-audio-feel
