# retry after runtime asset test isolation fix
name: Integrate Flip Phone Assets Clean

on:
  push:
    branches:
      - feat/flip-phone-runtime-assets-clean
    paths:
      - .github/workflows/integrate-flip-phone-assets-clean.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/flip-phone-runtime-assets-clean
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - name: Map uploaded sources to pipeline inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets-src/raw/flip-phone
          cp 'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 12_01_10 PM.png' assets-src/raw/flip-phone/common.png
          cp 'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 12_01_07 PM.png' assets-src/raw/flip-phone/rare.png
          cp 'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 12_01_04 PM.png' assets-src/raw/flip-phone/epic.png
          cp 'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 12_00_57 PM.png' assets-src/raw/flip-phone/legendary.png
          cp 'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 12_01_13 PM.png' assets-src/raw/flip-phone/secret-noir.png
      - run: npm run assets:prepare -- --family flip-phone --require-all
      - run: npm run assets:validate -- --family flip-phone --require-all
      - name: Enable reviewed Flip Phone art
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/game/data/artAssets.ts')
          text = path.read_text()
          old = 'export const AVAILABLE_COLLECTIBLE_ART_IDS = new Set<string>();'
          new = """export const AVAILABLE_COLLECTIBLE_ART_IDS = new Set<string>([
            'flip-phone-common',
            'flip-phone-rare',
            'flip-phone-epic',
            'flip-phone-legendary',
            'flip-phone-secret-noir',
          ]);"""
          if old not in text:
              raise SystemExit('Expected empty collectible art allowlist not found')
          path.write_text(text.replace(old, new))
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run build
      - name: Replace raw uploads with runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 12_00_57 PM.png' \
            'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 12_01_04 PM.png' \
            'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 12_01_07 PM.png' \
            'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 12_01_10 PM.png' \
            'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 12_01_13 PM.png'
          git add public/assets/collectibles/flip-phone-*.webp src/game/data/artAssets.ts
          git commit -m 'Add final Flip Phone collectible assets'
          git push origin HEAD:feat/flip-phone-runtime-assets-clean
