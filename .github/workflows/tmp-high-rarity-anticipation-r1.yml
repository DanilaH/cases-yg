name: TEMP high rarity anticipation R1

on:
  push:
    branches:
      - polish/high-rarity-anticipation-r1

permissions:
  contents: write

jobs:
  implement-audit-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/high-rarity-anticipation-r1
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply bounded anticipation and rarity-mass pass
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) < count:
                  raise SystemExit(f'anchor missing in {path}: {old[:140]!r}')
              text = text.replace(old, new, count)
              file.write_text(text, encoding='utf-8')

          # Reveal presentation: explicit anticipation + settle mass on the existing rarity profile.
          replace(
              'src/game/data/presentation.ts',
              """  overshootScale: number;\n  introDuration: number;\n  settleDuration: number;\n  shake: number;\n  secondaryRing: boolean;\n""",
              """  overshootScale: number;\n  introDuration: number;\n  settleDuration: number;\n  anticipationHoldMs: number;\n  introEase: string;\n  settleEase: string;\n  aftershockScale: number;\n  aftershockDurationMs: number;\n  shake: number;\n  secondaryRing: boolean;\n""",
          )

          replacements = {
              """    overshootScale: 1.14,\n    introDuration: 360,\n    settleDuration: 140,\n    shake: 0.0006,\n""": """    overshootScale: 1.08,\n    introDuration: 330,\n    settleDuration: 120,\n    anticipationHoldMs: 0,\n    introEase: 'Cubic.Out',\n    settleEase: 'Sine.Out',\n    aftershockScale: 1,\n    aftershockDurationMs: 0,\n    shake: 0.0006,\n""",
              """    overshootScale: 1.16,\n    introDuration: 380,\n    settleDuration: 145,\n    shake: 0.0013,\n""": """    overshootScale: 1.11,\n    introDuration: 370,\n    settleDuration: 160,\n    anticipationHoldMs: 0,\n    introEase: 'Back.Out',\n    settleEase: 'Sine.InOut',\n    aftershockScale: 1,\n    aftershockDurationMs: 0,\n    shake: 0.0013,\n""",
              """    overshootScale: 1.2,\n    introDuration: 420,\n    settleDuration: 155,\n    shake: 0.0027,\n""": """    overshootScale: 1.16,\n    introDuration: 420,\n    settleDuration: 175,\n    anticipationHoldMs: 90,\n    introEase: 'Back.Out',\n    settleEase: 'Quad.Out',\n    aftershockScale: 1.012,\n    aftershockDurationMs: 90,\n    shake: 0.0027,\n""",
              """    overshootScale: 1.23,\n    introDuration: 455,\n    settleDuration: 165,\n    shake: 0.0038,\n""": """    overshootScale: 1.19,\n    introDuration: 455,\n    settleDuration: 190,\n    anticipationHoldMs: 150,\n    introEase: 'Back.Out',\n    settleEase: 'Cubic.Out',\n    aftershockScale: 1.022,\n    aftershockDurationMs: 130,\n    shake: 0.0038,\n""",
              """    overshootScale: 1.25,\n    introDuration: 480,\n    settleDuration: 175,\n    shake: 0.0045,\n""": """    overshootScale: 1.22,\n    introDuration: 480,\n    settleDuration: 200,\n    anticipationHoldMs: 180,\n    introEase: 'Back.Out',\n    settleEase: 'Cubic.Out',\n    aftershockScale: 1,\n    aftershockDurationMs: 0,\n    shake: 0.0045,\n""",
          }
          for old, new in replacements.items():
              replace('src/game/data/presentation.ts', old, new)

          # Audio policy: deliberate near-silence only for Epic+ and strongest for Secret.
          replace(
              'src/game/data/audioPresentation.ts',
              """export interface AudioCuePresentationDirective {\n  clearPersistent?: boolean;\n  persistent?: PersistentResultAmbience;\n  persistentDelayMs?: number;\n  duck?: AudioDuckProfile;\n}\n\n""",
              """export interface AudioCuePresentationDirective {\n  clearPersistent?: boolean;\n  persistent?: PersistentResultAmbience;\n  persistentDelayMs?: number;\n  duck?: AudioDuckProfile;\n}\n\nexport interface RevealAnticipationAudioProfile {\n  enabled: boolean;\n  multiplier: number;\n  attackMs: number;\n  releaseMs: number;\n}\n\nexport const REVEAL_ANTICIPATION_AUDIO: Readonly<Record<ResultAmbienceRarity, RevealAnticipationAudioProfile>> = {\n  common: { enabled: false, multiplier: 1, attackMs: 0, releaseMs: 0 },\n  rare: { enabled: false, multiplier: 1, attackMs: 0, releaseMs: 0 },\n  epic: { enabled: true, multiplier: 0.56, attackMs: 35, releaseMs: 260 },\n  legendary: { enabled: true, multiplier: 0.18, attackMs: 32, releaseMs: 340 },\n  secret: { enabled: true, multiplier: 0.08, attackMs: 28, releaseMs: 380 },\n} as const;\n\nexport const getRevealAnticipationAudioProfile = (rarity: ResultAmbienceRarity): RevealAnticipationAudioProfile =>\n  REVEAL_ANTICIPATION_AUDIO[rarity];\n\n""",
          )

          # Audio controller public presentation primitive. No cue/asset and no durable state.
          replace(
              'src/game/systems/audio.ts',
              """  getDragTextureMix,\n  getRarityAmbienceProfile,\n""",
              """  getDragTextureMix,\n  getRarityAmbienceProfile,\n  getRevealAnticipationAudioProfile,\n""",
          )
          anchor = """  public setResultAmbience(rarity: ResultAmbienceRarity): void {\n"""
          method = """  public beginRevealAnticipation(rarity: ResultAmbienceRarity, holdMs: number): void {\n    const profile = getRevealAnticipationAudioProfile(rarity);\n    if (!profile.enabled || holdMs <= 0 || this.muted || this.blocked || typeof AudioContext === 'undefined') return;\n\n    const context = this.getContext();\n    if (!context) return;\n    const apply = (): void => {\n      if (this.muted || this.blocked || context.state !== 'running') return;\n      this.ensureBaseAmbience(context);\n      this.desiredResultAmbience = null;\n      this.cancelQueuedResultAmbience();\n      const fadeOutMs = this.activeResultAmbience\n        ? Math.min(120, getRarityAmbienceProfile(this.activeResultAmbience).fadeOutMs)\n        : 70;\n      this.stopPersistentRarity(context, fadeOutMs, false);\n      this.duckBase(context, {\n        multiplier: profile.multiplier,\n        attackMs: profile.attackMs,\n        holdMs,\n        releaseMs: profile.releaseMs,\n      });\n    };\n\n    if (context.state === 'running') {\n      apply();\n      return;\n    }\n    if (context.state === 'suspended') {\n      void context.resume().then(apply).catch(() => undefined);\n    }\n  }\n\n"""
          replace('src/game/systems/audio.ts', anchor, method + anchor)

          # Standard reveal: hold before transient/FX, then rarity-specific landing and optional micro-aftershock.
          replace(
              'src/game/scenes/OpeningScene.ts',
              """    const fx = REVEAL_FX_PRESETS[pending.standard.rarity];\n    this.createRevealBackdrop(fx.backdropAlpha, fx.particleDuration);\n    const heroX = this.metrics!.centerX;\n    const heroY = presentation.revealY;\n    const finalScale = presentation.revealScale;\n\n    getGameAudio().play('reveal-pop');\n""",
              """    const fx = REVEAL_FX_PRESETS[pending.standard.rarity];\n    const heroX = this.metrics!.centerX;\n    const heroY = presentation.revealY;\n    const finalScale = presentation.revealScale;\n    const audio = getGameAudio();\n\n    audio.beginRevealAnticipation(pending.standard.rarity, fx.anticipationHoldMs);\n    if (fx.anticipationHoldMs > 0) {\n      await this.waitPresentation(fx.anticipationHoldMs);\n      if (this.isSceneShutdown()) return pouch.group;\n    }\n\n    this.createRevealBackdrop(fx.backdropAlpha, fx.particleDuration);\n    audio.play('reveal-pop');\n""",
          )
          replace(
              'src/game/scenes/OpeningScene.ts',
              """      duration: fx.introDuration,\n      ease: 'Back.Out',\n    });\n""",
              """      duration: fx.introDuration,\n      ease: fx.introEase,\n    });\n""",
              1,
          )
          replace(
              'src/game/scenes/OpeningScene.ts',
              """      scale: finalScale,\n      duration: fx.settleDuration,\n      ease: 'Sine.Out',\n    });\n\n    if (fx.shake > 0) this.cameras.main.shake(100, fx.shake);\n\n    getGameAudio().play(pending.standard.rarity);\n""",
              """      scale: finalScale,\n      duration: fx.settleDuration,\n      ease: fx.settleEase,\n    });\n\n    if (fx.shake > 0) this.cameras.main.shake(100, fx.shake);\n    if (fx.aftershockScale > 1 && fx.aftershockDurationMs > 0) {\n      await this.runSkippableTween({\n        targets: visual.group,\n        scale: finalScale * fx.aftershockScale,\n        duration: fx.aftershockDurationMs,\n        yoyo: true,\n        ease: 'Sine.InOut',\n      });\n      visual.group.setScale(finalScale);\n    }\n\n    audio.play(pending.standard.rarity);\n""",
          )

          # Secret keeps its bespoke motion but gets the strongest deliberate silence and profile easing.
          replace(
              'src/game/scenes/OpeningScene.ts',
              """    const heroX = metrics.centerX;\n    const heroY = secretPresentation.revealY;\n    this.createRevealBackdrop(Math.min(0.58, fx.backdropAlpha * 1.28), fx.particleDuration + 120);\n""",
              """    const heroX = metrics.centerX;\n    const heroY = secretPresentation.revealY;\n    getGameAudio().beginRevealAnticipation('secret', fx.anticipationHoldMs);\n    await this.waitPresentation(fx.anticipationHoldMs);\n    if (this.isSceneShutdown()) return;\n    this.createRevealBackdrop(Math.min(0.58, fx.backdropAlpha * 1.28), fx.particleDuration + 120);\n""",
          )
          # Two remaining exact secret-specific easing occurrences in animateHiddenPocket.
          secret_marker = """    await this.runSkippableTween({\n      targets: secret.group,\n      y: heroY,\n      scale: secretPresentation.revealScale * fx.overshootScale,\n      alpha: 1,\n      duration: fx.introDuration,\n      ease: 'Back.Out',\n    });\n    await this.runSkippableTween({\n      targets: secret.group,\n      scale: secretPresentation.revealScale,\n      duration: fx.settleDuration,\n      ease: 'Sine.Out',\n    });\n"""
          secret_new = """    await this.runSkippableTween({\n      targets: secret.group,\n      y: heroY,\n      scale: secretPresentation.revealScale * fx.overshootScale,\n      alpha: 1,\n      duration: fx.introDuration,\n      ease: fx.introEase,\n    });\n    await this.runSkippableTween({\n      targets: secret.group,\n      scale: secretPresentation.revealScale,\n      duration: fx.settleDuration,\n      ease: fx.settleEase,\n    });\n"""
          replace('src/game/scenes/OpeningScene.ts', secret_marker, secret_new)

          # Tests lock the intended ladder and keep normal openings fast.
          replace(
              'tests/audio-presentation.test.ts',
              """  getDragTextureMix,\n  getRarityAmbienceProfile,\n""",
              """  getDragTextureMix,\n  getRarityAmbienceProfile,\n  getRevealAnticipationAudioProfile,\n""",
          )
          replace(
              'tests/audio-presentation.test.ts',
              """  it('uses silence/duck hierarchy instead of simply stacking louder transients', () => {\n""",
              """  it('reserves deliberate pre-reveal silence for Epic and above', () => {\n    const common = getRevealAnticipationAudioProfile('common');\n    const rare = getRevealAnticipationAudioProfile('rare');\n    const epic = getRevealAnticipationAudioProfile('epic');\n    const legendary = getRevealAnticipationAudioProfile('legendary');\n    const secret = getRevealAnticipationAudioProfile('secret');\n\n    expect(common.enabled).toBe(false);\n    expect(rare.enabled).toBe(false);\n    expect(epic.enabled).toBe(true);\n    expect(epic.multiplier).toBeGreaterThan(legendary.multiplier);\n    expect(legendary.multiplier).toBeGreaterThan(secret.multiplier);\n    expect(secret.multiplier).toBeLessThanOrEqual(0.1);\n    expect(epic.releaseMs).toBeLessThanOrEqual(secret.releaseMs);\n  });\n\n  it('uses silence/duck hierarchy instead of simply stacking louder transients', () => {\n""",
          )
          replace(
              'tests/presentation.test.ts',
              """  it('keeps reveal emergence on one stable z-order path', () => {\n""",
              """  it('gives rarity a bounded anticipation and perceived-mass ladder', () => {\n    const common = REVEAL_FX_PRESETS.common;\n    const rare = REVEAL_FX_PRESETS.rare;\n    const epic = REVEAL_FX_PRESETS.epic;\n    const legendary = REVEAL_FX_PRESETS.legendary;\n    const secret = REVEAL_FX_PRESETS.secret;\n\n    expect(common.anticipationHoldMs).toBe(0);\n    expect(rare.anticipationHoldMs).toBe(0);\n    expect(epic.anticipationHoldMs).toBeGreaterThan(0);\n    expect(epic.anticipationHoldMs).toBeLessThan(legendary.anticipationHoldMs);\n    expect(legendary.anticipationHoldMs).toBeLessThan(secret.anticipationHoldMs);\n    expect(secret.anticipationHoldMs).toBeLessThanOrEqual(200);\n    expect(common.introDuration).toBeLessThan(rare.introDuration);\n    expect(rare.introDuration).toBeLessThanOrEqual(epic.introDuration);\n    expect(epic.aftershockScale).toBeGreaterThan(1);\n    expect(legendary.aftershockScale).toBeGreaterThan(epic.aftershockScale);\n    expect(legendary.aftershockDurationMs).toBeGreaterThan(epic.aftershockDurationMs);\n    expect(secret.aftershockScale).toBe(1);\n  });\n\n  it('keeps reveal emergence on one stable z-order path', () => {\n""",
          )
          PY

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build

      - name: Product contract guard
        run: |
          python - <<'PY'
          from pathlib import Path
          scene = Path('src/game/scenes/OpeningScene.ts').read_text(encoding='utf-8')
          audio = Path('src/game/systems/audio.ts').read_text(encoding='utf-8')
          presentation = Path('src/game/data/presentation.ts').read_text(encoding='utf-8')
          assert "audio.beginRevealAnticipation(pending.standard.rarity, fx.anticipationHoldMs)" in scene
          assert "getGameAudio().beginRevealAnticipation('secret', fx.anticipationHoldMs)" in scene
          assert 'fx.aftershockScale > 1' in scene
          assert 'beginRevealAnticipation' in audio
          assert 'REVEAL_ANTICIPATION_AUDIO' in Path('src/game/data/audioPresentation.ts').read_text(encoding='utf-8')
          assert 'session.commitReveal()' in scene
          # This pass stays presentation-only: no new durable writes/resolution calls in reveal motion.
          section = scene.split('private async animateStandardReveal', 1)[1].split('private async animateRecoveredReveal', 1)[0]
          assert 'commitReveal' not in section
          assert 'prepareReveal' not in section
          assert 'resolve' not in section.lower()
          assert presentation.count('anticipationHoldMs:') == 5
          PY
          git diff --check

      - name: Install browser audit dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run anticipation browser audit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.ts')
          text = path.read_text(encoding='utf-8')
          anchor = "  game.sound.mute = blocked;\n"
          if anchor not in text: raise SystemExit('main audit anchor missing')
          injection = """  game.sound.mute = blocked;\n  if (import.meta.env.DEV) {\n    const auditWindow = window as typeof window & { __mptAuditGame?: Phaser.Game; __mptAuditAudio?: unknown };\n    auditWindow.__mptAuditGame = game;\n    auditWindow.__mptAuditAudio = audio;\n  }\n"""
          text = text.replace(anchor, injection, 1)
          path.write_text(text, encoding='utf-8')
          PY
          cat > tools/tmp-anticipation-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('audit-artifacts', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
          const errors = [];
          page.on('pageerror', error => errors.push(`pageerror:${error.message}`));
          page.on('console', message => { if (message.type() === 'error') errors.push(`console:${message.text()}`); });

          const waitIdle = async () => page.waitForFunction(() => {
            const scene = window.__mptAuditGame?.scene?.getScene?.('OpeningScene');
            return Boolean(scene && scene.phase === 'idle' && window.__mptAuditAudio);
          }, null, { timeout: 15000 });

          const armScenario = async name => {
            await page.goto('http://127.0.0.1:5173/?debug=1', { waitUntil: 'load' });
            await waitIdle();
            const button = page.getByRole('button', { name, exact: true });
            await button.waitFor({ state: 'visible' });
            await Promise.all([page.waitForEvent('load'), button.click()]);
            await waitIdle();
            const hide = page.getByRole('button', { name: 'Hide', exact: true });
            if (await hide.isVisible().catch(() => false)) await hide.click();
          };

          const runScenario = async (name, screenshot) => {
            await armScenario(name);
            await page.evaluate(() => {
              window.__mptAuditEvents = [];
              const audio = window.__mptAuditAudio;
              const begin = audio.beginRevealAnticipation.bind(audio);
              const play = audio.play.bind(audio);
              audio.beginRevealAnticipation = (rarity, holdMs) => {
                window.__mptAuditEvents.push({ kind: 'anticipation', rarity, holdMs, t: performance.now() });
                return begin(rarity, holdMs);
              };
              audio.play = cue => {
                window.__mptAuditEvents.push({ kind: 'play', cue, t: performance.now() });
                return play(cue);
              };
              const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
              scene.beginDrag({ id: 903, x: 400 });
            });
            await page.waitForTimeout(24);
            await page.evaluate(() => {
              const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
              scene.handlePointerMove({ id: 903, x: 760 });
            });
            await page.waitForFunction(() => {
              const scene = window.__mptAuditGame.scene.getScene('OpeningScene');
              return scene.phase === 'result' && scene.resultReady;
            }, null, { timeout: 20000 });
            await page.screenshot({ path: `audit-artifacts/${screenshot}`, fullPage: true });
            return page.evaluate(() => ({
              events: window.__mptAuditEvents,
              phase: window.__mptAuditGame.scene.getScene('OpeningScene').phase,
              resultReady: window.__mptAuditGame.scene.getScene('OpeningScene').resultReady,
            }));
          };

          const common = await runScenario('Force Common', 'common-result.png');
          const epic = await runScenario('Force Epic', 'epic-result.png');
          const legendary = await runScenario('Force Legendary (Charged)', 'legendary-result.png');
          const hidden = await runScenario('Force Hidden Pocket', 'hidden-secret-result.png');

          const anticipation = (run, rarity) => run.events.find(event => event.kind === 'anticipation' && event.rarity === rarity);
          const revealPopAfter = (run, t) => run.events.find(event => event.kind === 'play' && event.cue === 'reveal-pop' && event.t >= t);
          const secretRevealAfter = (run, t) => run.events.find(event => event.kind === 'play' && event.cue === 'secret-reveal' && event.t >= t);
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          const commonA = anticipation(common, 'common');
          const epicA = anticipation(epic, 'epic');
          const legendaryA = anticipation(legendary, 'legendary');
          const secretA = anticipation(hidden, 'secret');
          assert(commonA?.holdMs === 0, 'Common must not gain an anticipation delay');
          assert(epicA?.holdMs === 90, 'Epic anticipation contract mismatch');
          assert(legendaryA?.holdMs === 150, 'Legendary anticipation contract mismatch');
          assert(secretA?.holdMs === 180, 'Secret anticipation contract mismatch');
          const epicPop = revealPopAfter(epic, epicA.t);
          const legendaryPop = revealPopAfter(legendary, legendaryA.t);
          const secretReveal = secretRevealAfter(hidden, secretA.t);
          assert(epicPop && epicPop.t - epicA.t >= 70, 'Epic reveal transient must follow a real anticipation gap');
          assert(legendaryPop && legendaryPop.t - legendaryA.t >= 125, 'Legendary reveal transient must follow a stronger anticipation gap');
          assert(secretReveal && secretReveal.t - secretA.t >= 155, 'Secret reveal must follow the strongest anticipation gap');
          assert(legendaryPop.t - legendaryA.t > epicPop.t - epicA.t, 'Legendary anticipation must exceed Epic at runtime');
          assert([common, epic, legendary, hidden].every(run => run.phase === 'result' && run.resultReady), 'all audited reveals must settle to ready result');
          assert(errors.length === 0, `runtime errors: ${errors.join('; ')}`);

          fs.writeFileSync('audit-artifacts/report.json', JSON.stringify({ common, epic, legendary, hidden, errors }, null, 2));
          await browser.close();
          EOF
          mkdir -p audit-artifacts
          npm run dev -- --host 127.0.0.1 > /tmp/mpt-vite.log 2>&1 &
          echo $! > /tmp/mpt-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/?debug=1 >/dev/null; then break; fi
            sleep 1
          done
          node tools/tmp-anticipation-audit.mjs
          kill $(cat /tmp/mpt-vite.pid) || true

      - uses: actions/upload-artifact@v4
        with:
          name: high-rarity-anticipation-audit
          path: audit-artifacts
          if-no-files-found: error

      - name: Restore temporary audit changes and commit clean product tree
        run: |
          git checkout -- src/main.ts
          rm -f tools/tmp-anticipation-audit.mjs
          rm -rf audit-artifacts
          rm -f .github/workflows/tmp-high-rarity-anticipation-r1.yml
          git status --short
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/data/presentation.ts src/game/data/audioPresentation.ts src/game/systems/audio.ts src/game/scenes/OpeningScene.ts tests/presentation.test.ts tests/audio-presentation.test.ts .github/workflows/tmp-high-rarity-anticipation-r1.yml
          git commit -m 'Polish high rarity anticipation and settle'
          git push origin HEAD:polish/high-rarity-anticipation-r1
