name: Yandex DRAFT artifact

on:
  push:
    branches:
      - qa/yandex-draft-artifact-1782d807

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Audit dist
        run: |
          test -f dist/index.html
          echo "files=$(find dist -type f | wc -l)"
          du -sb dist
      - name: Upload exact DRAFT archive
        uses: actions/upload-artifact@v4
        with:
          name: mystery-pocket-tech-yandex-draft-1782d807
          path: dist/
          if-no-files-found: error
          compression-level: 9
          retention-days: 3
