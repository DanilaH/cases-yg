name: Final post-Secret repeated-use R1

on:
  push:
    branches:
      - audit/final-post-secret-repeated-use-r1

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Assert exact merged product tree
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_SHA=341c4a265a39c1d8f9d7e1cd1030b7d4e8c62cba
          unexpected="$(git diff --name-only "$PRODUCT_SHA" -- . ':!.github/scripts/final-post-secret-repeated-use-r1.mjs' ':!.github/workflows/final-post-secret-repeated-use-r1.yml')"
          if [ -n "$unexpected" ]; then
            echo 'Audit branch changes product tree unexpectedly:'
            echo "$unexpected"
            exit 1
          fi
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install ffmpeg
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Start Vite
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/final-post-secret-vite.log 2>&1 &
          echo $! > /tmp/final-post-secret-vite.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/final-post-secret-vite.log
          exit 1
      - name: Run final repeated-use audit
        run: node .github/scripts/final-post-secret-repeated-use-r1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-post-secret-repeated-use-r1
          path: /tmp/final-post-secret-repeated-use-r1
          retention-days: 5
