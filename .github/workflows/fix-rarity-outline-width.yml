name: Fix rarity outline width

on:
  push:
    branches:
      - fix/rarity-outline-width

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rarity-outline-width
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply rarity-specific outline widths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/game/ui/openingVisuals.ts')
          s = p.read_text()

          material_block = """const COLLECTIBLE_MATERIAL_PROFILES: Readonly<\n  Record<StandardRarity | 'secret', PerspectiveMaterialProfile>\n> = {\n  common: { sheenStrength: 0.014, rimStrength: 0.008, outlineStrength: 0, tint: [0.98, 0.97, 1] },\n  rare: { sheenStrength: 0.032, rimStrength: 0.016, outlineStrength: 0, tint: [0.70, 0.93, 1] },\n  epic: { sheenStrength: 0.050, rimStrength: 0.023, outlineStrength: 0, tint: [0.90, 0.72, 1] },\n  legendary: { sheenStrength: 0.070, rimStrength: 0.031, outlineStrength: 0, tint: [1, 0.83, 0.46] },\n  secret: { sheenStrength: 0.084, rimStrength: 0.038, outlineStrength: 0, tint: [1, 0.72, 0.86] },\n};\n"""
          replacement_block = material_block + """\nconst COLLECTIBLE_OUTLINE_RADIUS: Readonly<Record<StandardRarity | 'secret', number>> = {\n  common: 1.4,\n  rare: 1.9,\n  epic: 2.5,\n  legendary: 3.2,\n  secret: 3.8,\n};\n"""
          if material_block not in s:
              raise SystemExit('material profile block not found')
          s = s.replace(material_block, replacement_block, 1)

          sig_old = """  textureKey: string,\n  outlineColor: number,\n): {\n"""
          sig_new = """  textureKey: string,\n  outlineColor: number,\n  outlineOffset: number,\n): {\n"""
          if sig_old not in s:
              raise SystemExit('createAssetCollectible signature not found')
          s = s.replace(sig_old, sig_new, 1)

          radius_old = """  const outlineOffset = 2.4;\n  const diagonalOffset = outlineOffset * 0.72;\n"""
          radius_new = """  const diagonalOffset = outlineOffset * 0.72;\n"""
          if radius_old not in s:
              raise SystemExit('fixed outline offset not found')
          s = s.replace(radius_old, radius_new, 1)

          call_old = """      ? createAssetCollectible(scene, presentation, textureKey, accentColor)\n"""
          call_new = """      ? createAssetCollectible(\n          scene,\n          presentation,\n          textureKey,\n          accentColor,\n          COLLECTIBLE_OUTLINE_RADIUS[rarity],\n        )\n"""
          if call_old not in s:
              raise SystemExit('createAssetCollectible call not found')
          s = s.replace(call_old, call_new, 1)

          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
      - name: Commit source changes and clean one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-rarity-outline-width.yml
          git add src/game/ui/openingVisuals.ts .github/workflows/fix-rarity-outline-width.yml
          git commit -m "Restore rarity-specific collectible outline widths"
          git push origin HEAD:fix/rarity-outline-width
