name: Integrate authored Drop pouches

on:
  push:
    branches:
      - content/authored-drop-pouch-skins-v2
    paths:
      - .github/workflows/integrate-authored-drop-pouches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: content/authored-drop-pouch-skins-v2
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - run: npm ci

      - name: Wire Drop-specific pouch art
        shell: python
        run: |
          from pathlib import Path

          DROPS = ['video-link', 'pocket-office', 'pocket-audio', 'game-zone', 'analog-nights']
          VARIANTS = ['basic', 'charged']
          LAYERS = ['body', 'tear-strip', 'star-tab']

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          def static_id(drop: str, variant: str, layer: str) -> str:
              return f'{drop}-{variant}-pouch-{layer}'

          # --- artAssets.ts -------------------------------------------------
          path = Path('src/game/data/artAssets.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "import type { ContentRegistry, LootPoolId } from './collectibles';",
              "import type { ContentRegistry, GameLootPoolId, LootPoolId } from './collectibles';\nimport { DEFAULT_LOOT_POOL_ID } from './collectibles';",
              'artAssets import',
          )

          id_lines = []
          path_lines = []
          available_lines = []
          for drop in DROPS:
              for variant in VARIANTS:
                  for layer in LAYERS:
                      art_id = static_id(drop, variant, layer)
                      id_lines.append(f"  | '{art_id}'")
                      suffix = 'tear-strip-compact' if layer == 'tear-strip' else layer
                      path_lines.append(f"  '{art_id}': 'assets/package/{drop}-{variant}-pouch-{suffix}.webp',")
                      available_lines.append(f"  '{art_id}',")

          text = replace_once(
              text,
              "  | 'charged-pouch-star-tab'\n  | 'opening-bg'",
              "  | 'charged-pouch-star-tab'\n" + '\n'.join(id_lines) + "\n  | 'opening-bg'",
              'StaticArtId expansion',
          )
          text = replace_once(
              text,
              "  'charged-pouch-star-tab': 'assets/package/charged-pouch-star-tab.webp',\n  'opening-bg'",
              "  'charged-pouch-star-tab': 'assets/package/charged-pouch-star-tab.webp',\n" + '\n'.join(path_lines) + "\n  'opening-bg'",
              'STATIC_ART_PATHS expansion',
          )
          text = replace_once(
              text,
              "  'charged-pouch-star-tab',\n  'opening-bg'",
              "  'charged-pouch-star-tab',\n" + '\n'.join(available_lines) + "\n  'opening-bg'",
              'AVAILABLE_STATIC_ART_IDS expansion',
          )

          old_map = """export type PouchArtVariant = 'basic' | 'charged';
          export type PouchArtLayer = 'body' | 'tear-strip' | 'star-tab';

          const POUCH_STATIC_ART_IDS: Readonly<Record<PouchArtVariant, Readonly<Record<PouchArtLayer, StaticArtId>>>> = {
            basic: {
              body: 'pouch-body',
              'tear-strip': 'pouch-tear-strip',
              'star-tab': 'pouch-star-tab',
            },
            charged: {
              body: 'charged-pouch-body',
              'tear-strip': 'charged-pouch-tear-strip',
              'star-tab': 'charged-pouch-star-tab',
            },
          };

          const BOOT_STATIC_ART_IDS""".replace('          ', '')

          drop_entries = []
          for drop in DROPS:
              drop_entries.append(f"""  '{drop}': {{
              basic: {{
                body: '{drop}-basic-pouch-body',
                'tear-strip': '{drop}-basic-pouch-tear-strip',
                'star-tab': '{drop}-basic-pouch-star-tab',
              }},
              charged: {{
                body: '{drop}-charged-pouch-body',
                'tear-strip': '{drop}-charged-pouch-tear-strip',
                'star-tab': '{drop}-charged-pouch-star-tab',
              }},
            }},""")

          new_map = """export type PouchArtVariant = 'basic' | 'charged';
          export type PouchArtLayer = 'body' | 'tear-strip' | 'star-tab';

          type PouchLayerIds = Readonly<Record<PouchArtLayer, StaticArtId>>;
          type PouchVariantIds = Readonly<Record<PouchArtVariant, PouchLayerIds>>;

          const POUCH_STATIC_ART_IDS: PouchVariantIds = {
            basic: {
              body: 'pouch-body',
              'tear-strip': 'pouch-tear-strip',
              'star-tab': 'pouch-star-tab',
            },
            charged: {
              body: 'charged-pouch-body',
              'tear-strip': 'charged-pouch-tear-strip',
              'star-tab': 'charged-pouch-star-tab',
            },
          };

          const DROP_POUCH_STATIC_ART_IDS: Readonly<Partial<Record<GameLootPoolId, PouchVariantIds>>> = {
          DROP_ENTRIES
          };

          const BOOT_STATIC_ART_IDS""".replace('          ', '').replace('DROP_ENTRIES', '\n'.join(drop_entries))
          text = replace_once(text, old_map, new_map, 'Drop pouch map')

          old_selector = """export const pouchStaticArtId = (variant: PouchArtVariant, layer: PouchArtLayer): StaticArtId =>
            POUCH_STATIC_ART_IDS[variant][layer];"""
          new_selector = """const dropPouchIds = (lootPoolId: LootPoolId): PouchVariantIds =>
            DROP_POUCH_STATIC_ART_IDS[lootPoolId as GameLootPoolId] ?? POUCH_STATIC_ART_IDS;

          export const pouchStaticArtId = (
            variant: PouchArtVariant,
            layer: PouchArtLayer,
            lootPoolId: LootPoolId = DEFAULT_LOOT_POOL_ID,
          ): StaticArtId => dropPouchIds(lootPoolId)[variant][layer];"""
          text = replace_once(text, old_selector, new_selector, 'pouchStaticArtId')

          old_tail = """export const getRuntimePouchArt = (variant: PouchArtVariant): readonly RuntimeStaticArt[] =>
            toRuntimeStaticArt(Object.values(POUCH_STATIC_ART_IDS[variant]));"""
          new_tail = """export const getRuntimePouchArt = (
            variant: PouchArtVariant,
            lootPoolId: LootPoolId = DEFAULT_LOOT_POOL_ID,
          ): readonly RuntimeStaticArt[] =>
            toRuntimeStaticArt(Object.values(dropPouchIds(lootPoolId)[variant]));

          export const getRuntimePouchArtForLootPool = (
            lootPoolId: LootPoolId,
          ): readonly RuntimeStaticArt[] => [
            ...getRuntimePouchArt('basic', lootPoolId),
            ...getRuntimePouchArt('charged', lootPoolId),
          ];"""
          text = replace_once(text, old_tail, new_tail, 'getRuntimePouchArt')
          path.write_text(text)

          # --- artLoading.ts ------------------------------------------------
          path = Path('src/game/systems/artLoading.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "  getRuntimePouchArt,\n  type PouchArtVariant,",
              "  getRuntimePouchArt,\n  getRuntimePouchArtForLootPool,\n  type PouchArtVariant,",
              'artLoading import',
          )
          old_tail = """export const ensureLootPoolCollectibleArt = (
            scene: Phaser.Scene,
            registry: ContentRegistry,
            lootPoolId: LootPoolId,
          ): Promise<void> =>
            ensureRuntimeImageArt(scene, getRuntimeCollectibleArtForLootPool(registry, lootPoolId), 'collectible art');

          export const ensurePouchArt = (scene: Phaser.Scene, variant: PouchArtVariant): Promise<void> =>
            ensureRuntimeImageArt(scene, getRuntimePouchArt(variant), `${variant} pouch art`);"""
          new_tail = """export const ensureLootPoolCollectibleArt = (
            scene: Phaser.Scene,
            registry: ContentRegistry,
            lootPoolId: LootPoolId,
          ): Promise<void> =>
            ensureRuntimeImageArt(scene, getRuntimeCollectibleArtForLootPool(registry, lootPoolId), 'collectible art');

          export const ensureLootPoolArt = (
            scene: Phaser.Scene,
            registry: ContentRegistry,
            lootPoolId: LootPoolId,
          ): Promise<void> =>
            ensureRuntimeImageArt(
              scene,
              [
                ...getRuntimeCollectibleArtForLootPool(registry, lootPoolId),
                ...getRuntimePouchArtForLootPool(lootPoolId),
              ],
              'Drop art',
            );

          export const ensurePouchArt = (
            scene: Phaser.Scene,
            variant: PouchArtVariant,
            lootPoolId: LootPoolId,
          ): Promise<void> =>
            ensureRuntimeImageArt(scene, getRuntimePouchArt(variant, lootPoolId), `${variant} pouch art`);"""
          text = replace_once(text, old_tail, new_tail, 'artLoading exports')
          path.write_text(text)

          # --- openingVisuals.ts --------------------------------------------
          path = Path('src/game/ui/openingVisuals.ts')
          text = path.read_text()
          text = replace_once(text, '  _lootPoolId: GameLootPoolId = DEFAULT_LOOT_POOL_ID,', '  lootPoolId: GameLootPoolId = DEFAULT_LOOT_POOL_ID,', 'openingVisuals arg')
          text = replace_once(text, "pouchStaticArtId(variant, 'body')", "pouchStaticArtId(variant, 'body', lootPoolId)", 'openingVisuals body')
          text = replace_once(text, "pouchStaticArtId(variant, 'tear-strip')", "pouchStaticArtId(variant, 'tear-strip', lootPoolId)", 'openingVisuals strip')
          text = replace_once(text, "pouchStaticArtId(variant, 'star-tab')", "pouchStaticArtId(variant, 'star-tab', lootPoolId)", 'openingVisuals tab')
          path.write_text(text)

          # --- OpeningScene.ts ----------------------------------------------
          path = Path('src/game/scenes/OpeningScene.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "import { ensureLootPoolCollectibleArt, ensurePouchArt } from '../systems/artLoading';",
              "import { ensureLootPoolArt, ensurePouchArt } from '../systems/artLoading';",
              'OpeningScene import',
          )
          count = text.count('await ensureLootPoolCollectibleArt(this, GAME_REGISTRY, targetLootPoolId);')
          if count != 1:
              raise SystemExit(f'OpeningScene initial Drop load: expected one match, got {count}')
          text = text.replace('await ensureLootPoolCollectibleArt(this, GAME_REGISTRY, targetLootPoolId);', 'await ensureLootPoolArt(this, GAME_REGISTRY, targetLootPoolId);', 1)
          count = text.count('await ensureLootPoolCollectibleArt(this, GAME_REGISTRY, target);')
          if count != 1:
              raise SystemExit(f'OpeningScene switch Drop load: expected one match, got {count}')
          text = text.replace('await ensureLootPoolCollectibleArt(this, GAME_REGISTRY, target);', 'await ensureLootPoolArt(this, GAME_REGISTRY, target);', 1)
          text = replace_once(text, "await ensurePouchArt(this, 'charged');", "await ensurePouchArt(this, 'charged', targetLootPoolId);", 'OpeningScene recovered charged')
          text = replace_once(text, 'await ensurePouchArt(this, pouchType);', 'await ensurePouchArt(this, pouchType, this.getDisplayedLootPoolId());', 'OpeningScene pouch selection')
          path.write_text(text)

          # --- runtime-assets.test.ts ---------------------------------------
          path = Path('tests/runtime-assets.test.ts')
          text = path.read_text()
          text = "import { existsSync } from 'node:fs';\n\n" + text
          text = replace_once(
              text,
              '  getRuntimePouchArt,\n  getRuntimeStaticArt,',
              '  getRuntimePouchArt,\n  getRuntimePouchArtForLootPool,\n  getRuntimeStaticArt,',
              'runtime test import',
          )
          anchor = """    expect(pouchStaticArtId('basic', 'body')).toBe('pouch-body');
              expect(pouchStaticArtId('charged', 'body')).toBe('charged-pouch-body');
            });

          """.replace('          ', '')
          addition = """    expect(pouchStaticArtId('basic', 'body')).toBe('pouch-body');
              expect(pouchStaticArtId('charged', 'body')).toBe('charged-pouch-body');
            });

            it('maps authored Basic and Charged pouch layers for every themed Drop', () => {
              replaceSetContents(AVAILABLE_STATIC_ART_IDS, defaultStaticArtIds);

              expect(getRuntimePouchArtForLootPool('y2k-essentials').map(({ id }) => id)).toEqual([
                'pouch-body',
                'pouch-tear-strip',
                'pouch-star-tab',
                'charged-pouch-body',
                'charged-pouch-tear-strip',
                'charged-pouch-star-tab',
              ]);

              for (const lootPoolId of GAME_LOOT_POOL_IDS.filter((id) => id !== 'y2k-essentials')) {
                const ids = getRuntimePouchArtForLootPool(lootPoolId).map(({ id }) => id);
                expect(ids).toHaveLength(6);
                expect(ids).toEqual([
                  `${lootPoolId}-basic-pouch-body`,
                  `${lootPoolId}-basic-pouch-tear-strip`,
                  `${lootPoolId}-basic-pouch-star-tab`,
                  `${lootPoolId}-charged-pouch-body`,
                  `${lootPoolId}-charged-pouch-tear-strip`,
                  `${lootPoolId}-charged-pouch-star-tab`,
                ]);
              }

              expect(pouchStaticArtId('basic', 'body', 'game-zone')).toBe('game-zone-basic-pouch-body');
              expect(pouchStaticArtId('charged', 'star-tab', 'analog-nights')).toBe('analog-nights-charged-pouch-star-tab');
            });

            it('keeps every reviewed static-art path backed by a committed public asset', () => {
              replaceSetContents(AVAILABLE_STATIC_ART_IDS, defaultStaticArtIds);

              for (const { id, assetPath } of getRuntimeStaticArt()) {
                expect(existsSync(`public/${assetPath}`), `missing reviewed static art for ${id}: ${assetPath}`).toBe(true);
              }
            });

          """.replace('          ', '')
          text = replace_once(text, anchor, addition, 'runtime tests insertion')
          path.write_text(text)

          # --- ASSET_MANIFEST.md --------------------------------------------
          path = Path('docs/ASSET_MANIFEST.md')
          text = path.read_text()
          section2_start = text.index('# 2. Mystery Pouch — INTEGRATED')
          section3_start = text.index('# 3. Environment art — INTEGRATED')
          section2 = """# 2. Mystery Pouch — INTEGRATED

          Runtime keeps the original Y2K Essentials pouch set and adds authored Drop-specific Basic/Charged skins for the other five Drops.

          Y2K Essentials remains on the established generic runtime mapping:

          ```text
          public/assets/package/pouch-body.webp
          public/assets/package/pouch-tear-strip-compact.webp
          public/assets/package/pouch-star-tab.webp
          public/assets/package/charged-pouch-body.webp
          public/assets/package/charged-pouch-tear-strip-compact.webp
          public/assets/package/charged-pouch-star-tab.webp
          ```

          Authored themed sets use the same naming contract for `video-link`, `pocket-office`, `pocket-audio`, `game-zone`, and `analog-nights`:

          ```text
          public/assets/package/<drop>-basic-pouch-body.webp
          public/assets/package/<drop>-basic-pouch-tear-strip-compact.webp
          public/assets/package/<drop>-basic-pouch-star-tab.webp
          public/assets/package/<drop>-charged-pouch-body.webp
          public/assets/package/<drop>-charged-pouch-tear-strip-compact.webp
          public/assets/package/<drop>-charged-pouch-star-tab.webp
          ```

          Accepted contract:

          - body: transparent 1024×1024 WebP using the established authored pouch alignment;
          - star tab: transparent 1024×1024 padded WebP using the established tab alignment;
          - runtime strip: compact transparent 984×235 WebP;
          - Drop skins change authored material/theme only; tear geometry, drag travel, threshold and hit area stay runtime-owned and unchanged;
          - Basic and Charged for a Drop share the same interaction contract;
          - body owns the main silhouette; strip and star remain independent layers;
          - runtime owns shadow/highlight/motion and contains no synthetic dark slit/mouth.

          The full source PNG intake is temporary production material and is removed after promotion; reviewed WebPs are the committed runtime artifacts.

          ---

          """.replace('          ', '')
          text = text[:section2_start] + section2 + text[section3_start:]

          old_64_start = text.index('## 6.4 Charged pouch raster fallback')
          section7_start = text.index('# 7. Corrected runtime UI / FX — CURRENT')
          new_64 = """## 6.4 Authored Drop-specific pouch rasters — INTEGRATED

          The earlier runtime-only Charged treatment has been superseded by reviewed authored Basic/Charged pouch sets per themed Drop while retaining the exact same interaction geometry.

          Current policy:

          - Y2K Essentials keeps the original authored Basic/Charged set;
          - Video Link, Pocket Office, Pocket Audio, Game Zone and Analog Nights use their own authored Basic/Charged body, compact tear strip and star tab;
          - Phaser still owns glow/rings/sparks/selection feedback on top of those rasters;
          - no Drop is allowed to introduce a different tear mechanic, hitbox, drag distance or pouch silhouette contract.

          ---

          """.replace('          ', '')
          text = text[:old_64_start] + new_64 + text[section7_start:]
          path.write_text(text)

      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build

      - name: Commit clean integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-authored-drop-pouches.yml
          git add src/game/data/artAssets.ts src/game/systems/artLoading.ts src/game/ui/openingVisuals.ts src/game/scenes/OpeningScene.ts tests/runtime-assets.test.ts docs/ASSET_MANIFEST.md
          git commit -m 'Integrate authored Drop-specific pouch skins'
          git push origin HEAD:content/authored-drop-pouch-skins-v2
