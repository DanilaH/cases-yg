name: Sync final regression acceptance docs

on:
  push:
    branches:
      - docs/final-regression-accepted

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Apply canonical status sync
        run: node .github/scripts/sync-final-regression-docs.mjs
      - name: Commit docs sync
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md docs; then
            echo "Docs already synchronized."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git commit -m "Mark final repeated-use regression accepted"
          git push
