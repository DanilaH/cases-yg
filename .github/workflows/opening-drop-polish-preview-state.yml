name: Validate opening Drop preview state

on:
  push:
    branches:
      - polish/opening-drop-selector

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[opening-drop-preview-state]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python3 tools/opening-drop-polish-preview-state.py
      - name: Assert atomic preview HUD contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const presentationState = displayedLootPoolId === this.saveState.activeLootPoolId' src/game/scenes/OpeningScene.ts
          grep -q 'this.renderResourceHud(root, presentationState)' src/game/scenes/OpeningScene.ts
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit preview state fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/scenes/OpeningScene.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[opening-drop-preview-state] keep preview HUD atomic with Drop skin'
          git push origin HEAD:polish/opening-drop-selector
