name: Secret presentation acceptance R1

on:
  push:
    branches:
      - audit/secret-presentation-acceptance-r1

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Assert exact product tree
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_SHA=629d5beb666aa9365ce7197082938ea1a50d9d15
          unexpected="$(git diff --name-only "$PRODUCT_SHA" -- . ':!.github/scripts/secret-presentation-acceptance-r1.mjs' ':!.github/workflows/secret-presentation-acceptance-r1.yml')"
          if [ -n "$unexpected" ]; then
            echo 'Audit branch changes product tree unexpectedly:'
            echo "$unexpected"
            exit 1
          fi
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Start Vite
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/secret-presentation-vite.log 2>&1 &
          echo $! > /tmp/secret-presentation-vite.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/secret-presentation-vite.log
          exit 1
      - name: Run browser acceptance
        run: node .github/scripts/secret-presentation-acceptance-r1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-presentation-acceptance-r1
          path: /tmp/secret-presentation-acceptance-r1
          retention-days: 5
