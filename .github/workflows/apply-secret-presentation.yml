name: Apply Secret presentation correction

on:
  push:
    branches:
      - fix/secret-presentation

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - name: Apply Secret presentation correction
        run: |
          node .github/scripts/apply-secret-presentation.mjs
          node .github/scripts/fix-secret-presentation-targeting.mjs
      - name: Verify product change
        run: |
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
          git diff --check
      - name: Commit product changes
        run: |
          if git diff --quiet -- src tests; then
            echo 'Product patch already applied.'
            exit 0
          fi
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add src tests
          git commit -m 'Complete Secret reward presentation'
          git push origin HEAD:fix/secret-presentation
