name: Opening Feel Correction Audit

on:
  push:
    branches:
      - audit/opening-feel-correction-r1
    paths:
      - .github/workflows/opening-feel-correction-audit.yml
      - .github/scripts/opening-feel-correction-audit.mjs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assert product tree matches PR candidate exactly
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD=309c7c86dc4b384aab57dafb1743aa7537594b2f
          git cat-file -e "$PRODUCT_HEAD^{commit}"
          unexpected="$(git diff --name-only "$PRODUCT_HEAD"...HEAD | grep -Ev '^\.github/(workflows/opening-feel-correction-audit\.yml|scripts/opening-feel-correction-audit\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Audit branch changes product files:'
            echo "$unexpected"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Install Playwright driver and video helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-pack node_modules/playwright node_modules/playwright-core
          npm pack playwright@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pw-name.txt
          npm pack playwright-core@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pwc-name.txt
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pw-name.txt)" --strip-components=1 -C node_modules/playwright
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pwc-name.txt)" --strip-components=1 -C node_modules/playwright-core
          node node_modules/playwright/cli.js install ffmpeg
      - name: Start Vite
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Run exact-revision browser audit
        run: node .github/scripts/opening-feel-correction-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-feel-correction-r1-audit
          path: /tmp/opening-feel-correction-audit
          if-no-files-found: error
          retention-days: 3
