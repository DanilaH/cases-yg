name: Promote authored Drop pouch assets

on:
  push:
    branches:
      - content/authored-drop-pouch-skins-v2
    paths:
      - .github/workflows/promote-authored-drop-pouches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: content/authored-drop-pouch-skins-v2
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - run: npm ci

      - name: Prepare authored pouch runtime layers
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import sharp from 'sharp';

          const groups = [
            {
              drop: 'analog-nights',
              files: [
                'ChatGPT Image Sep 11, 2026, 08_25_14 PM (1).png',
                'ChatGPT Image Sep 11, 2026, 08_25_24 PM (2).png',
                'ChatGPT Image Sep 11, 2026, 08_25_24 PM (3).png',
                'ChatGPT Image Sep 11, 2026, 08_25_25 PM (4).png',
                'ChatGPT Image Sep 11, 2026, 08_25_26 PM (5).png',
                'ChatGPT Image Sep 11, 2026, 08_25_27 PM (6).png',
              ],
            },
            {
              drop: 'game-zone',
              files: [
                'ChatGPT Image Sep 11, 2026, 08_26_53 PM (1).png',
                'ChatGPT Image Sep 11, 2026, 08_27_04 PM (2).png',
                'ChatGPT Image Sep 11, 2026, 08_27_09 PM (3).png',
                'ChatGPT Image Sep 11, 2026, 08_27_10 PM (4).png',
                'ChatGPT Image Sep 11, 2026, 08_27_10 PM (5).png',
                'ChatGPT Image Sep 11, 2026, 08_27_10 PM (6).png',
              ],
            },
            {
              drop: 'pocket-audio',
              files: [
                'ChatGPT Image Sep 11, 2026, 08_31_12 PM (1).png',
                'ChatGPT Image Sep 11, 2026, 08_31_12 PM (2).png',
                'ChatGPT Image Sep 11, 2026, 08_31_12 PM (3).png',
                'ChatGPT Image Sep 11, 2026, 08_31_12 PM (4).png',
                'ChatGPT Image Sep 11, 2026, 08_31_13 PM (5).png',
                'ChatGPT Image Sep 11, 2026, 08_31_13 PM (6).png',
              ],
            },
            {
              drop: 'video-link',
              files: [
                'ChatGPT Image Sep 11, 2026, 08_31_32 PM (1).png',
                'ChatGPT Image Sep 11, 2026, 08_31_32 PM (2).png',
                'ChatGPT Image Sep 11, 2026, 08_31_32 PM (3).png',
                'ChatGPT Image Sep 11, 2026, 08_31_32 PM (4).png',
                'ChatGPT Image Sep 11, 2026, 08_31_32 PM (5).png',
                'ChatGPT Image Sep 11, 2026, 08_31_32 PM (6).png',
              ],
            },
            {
              drop: 'pocket-office',
              files: [
                'ChatGPT Image Sep 11, 2026, 08_33_05 PM (1).png',
                'ChatGPT Image Sep 11, 2026, 08_33_05 PM (2).png',
                'ChatGPT Image Sep 11, 2026, 08_33_05 PM (3).png',
                'ChatGPT Image Sep 11, 2026, 08_33_05 PM (4).png',
                'ChatGPT Image Sep 11, 2026, 08_33_06 PM (5).png',
                'ChatGPT Image Sep 11, 2026, 08_33_06 PM (6).png',
              ],
            },
          ];

          const roles = [
            ['basic', 'body'],
            ['basic', 'star-tab'],
            ['basic', 'tear-strip'],
            ['charged', 'body'],
            ['charged', 'star-tab'],
            ['charged', 'tear-strip'],
          ];

          const outputDir = 'public/assets/package';
          await fs.mkdir(outputDir, { recursive: true });

          const trim = async (input) =>
            sharp(input)
              .trim({ background: { r: 0, g: 0, b: 0, alpha: 0 }, threshold: 8 })
              .png()
              .toBuffer();

          const assertSource = async (input, label) => {
            const metadata = await sharp(input).metadata();
            if (!metadata.width || !metadata.height || !metadata.hasAlpha) {
              throw new Error(`${label}: expected a raster source with alpha`);
            }
            const stats = await sharp(input).stats();
            const alpha = stats.channels[3];
            if (!alpha || alpha.min >= 250 || alpha.max <= 5) {
              throw new Error(`${label}: source does not contain meaningful transparent/opaque alpha`);
            }
          };

          const encodeOnCanvas = async ({ input, width, height, canvasWidth, canvasHeight, left, top, output }) => {
            const trimmed = await trim(input);
            const resized = await sharp(trimmed)
              .resize({ width, height, fit: 'fill' })
              .png()
              .toBuffer();

            await sharp({
              create: {
                width: canvasWidth,
                height: canvasHeight,
                channels: 4,
                background: { r: 0, g: 0, b: 0, alpha: 0 },
              },
            })
              .composite([{ input: resized, left, top }])
              .webp({ quality: 90, alphaQuality: 100, effort: 6, smartSubsample: true })
              .toFile(output);
          };

          const encodeStrip = async (input, output) => {
            const trimmed = await trim(input);
            await sharp(trimmed)
              .resize({ width: 984, height: 235, fit: 'fill' })
              .webp({ quality: 90, alphaQuality: 100, effort: 6, smartSubsample: true })
              .toFile(output);
          };

          const expectations = [];

          for (const group of groups) {
            if (group.files.length !== roles.length) throw new Error(`${group.drop}: expected six sources`);

            for (let index = 0; index < roles.length; index += 1) {
              const [variant, role] = roles[index];
              const source = path.join('biba', group.files[index]);
              const outputName = role === 'tear-strip'
                ? `${group.drop}-${variant}-pouch-tear-strip-compact.webp`
                : `${group.drop}-${variant}-pouch-${role}.webp`;
              const output = path.join(outputDir, outputName);
              const label = `${group.drop}/${variant}/${role}`;

              await assertSource(source, label);

              if (role === 'body') {
                // Exact established authored Charged Pouch alignment contract.
                await encodeOnCanvas({
                  input: source,
                  width: 923,
                  height: 959,
                  canvasWidth: 1024,
                  canvasHeight: 1024,
                  left: 68,
                  top: 28,
                  output,
                });
                expectations.push([output, 1024, 1024, label]);
              } else if (role === 'star-tab') {
                // Preserve the existing padded star-tab geometry used by runtime hit/drag presentation.
                await encodeOnCanvas({
                  input: source,
                  width: 271,
                  height: 259,
                  canvasWidth: 1024,
                  canvasHeight: 1024,
                  left: 33,
                  top: 15,
                  output,
                });
                expectations.push([output, 1024, 1024, label]);
              } else {
                await encodeStrip(source, output);
                expectations.push([output, 984, 235, label]);
              }
            }
          }

          if (expectations.length !== 30) throw new Error(`Expected 30 runtime exports, got ${expectations.length}`);

          for (const [output, width, height, label] of expectations) {
            const metadata = await sharp(output).metadata();
            const stats = await sharp(output).stats();
            const alpha = stats.channels[3];
            if (
              metadata.format !== 'webp' ||
              metadata.width !== width ||
              metadata.height !== height ||
              !metadata.hasAlpha ||
              !alpha ||
              alpha.min >= 250 ||
              alpha.max <= 5
            ) {
              throw new Error(`${label}: invalid runtime export ${metadata.format} ${metadata.width}x${metadata.height}`);
            }
            console.log(`${label}: ${path.basename(output)} ${metadata.width}x${metadata.height} alpha ${alpha.min}-${alpha.max}`);
          }
          NODE

      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build

      - name: Commit promoted pouch assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r biba
          git rm .github/workflows/promote-authored-drop-pouches.yml
          git add public/assets/package
          git commit -m 'Prepare authored Drop pouch assets'
          git push origin HEAD:content/authored-drop-pouch-skins-v2
