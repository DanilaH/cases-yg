name: Temporary alignment grid pass

on:
  push:
    branches:
      - tmp/alignment-grid-pass

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded alignment patch
        run: python tools/tmp-alignment-pass.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/data/presentation.ts src/game/systems/rewardLayout.ts src/game/scenes/OpeningScene.ts tests/reward-layout.test.ts tests/presentation.test.ts
          git commit -m "Align reward and result UI grid [skip ci]"
          git push
