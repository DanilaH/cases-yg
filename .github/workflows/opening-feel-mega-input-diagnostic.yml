name: Opening Feel Mega Input Diagnostic

on:
  push:
    branches:
      - audit/opening-feel-correction-r2
    paths:
      - .github/workflows/opening-feel-mega-input-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assert exact product candidate
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD=85d57a05ce35582878379c8b5d2e253604607768
          unexpected="$(git diff --name-only "$PRODUCT_HEAD"...HEAD | grep -Ev '^\.github/workflows/(opening-feel-correction-r2-audit|opening-feel-mega-input-diagnostic)\.yml$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - name: Install Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-pack node_modules/playwright node_modules/playwright-core
          npm pack playwright@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pw-name.txt
          npm pack playwright-core@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pwc-name.txt
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pw-name.txt)" --strip-components=1 -C node_modules/playwright
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pwc-name.txt)" --strip-components=1 -C node_modules/playwright-core
      - name: Start Vite
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/vite.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/vite.log; exit 1
      - name: Run focused Mega input diagnostic
        shell: bash
        run: |
          mkdir -p .github/scripts
          cat > .github/scripts/mega-input-diagnostic.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const out = '/tmp/mega-input-diagnostic';
          await fs.rm(out, { recursive: true, force: true });
          await fs.mkdir(out, { recursive: true });
          const browser = await chromium.launch({ headless: true, channel: 'chrome', args: ['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist'] });
          const ctx = await browser.newContext({ viewport: { width: 1280, height: 720 }, locale: 'en-US' });
          const page = await ctx.newPage();
          await page.goto('http://127.0.0.1:5173/?debug=1&platform=mock', { waitUntil: 'domcontentloaded' });
          await page.waitForSelector('#game canvas', { state: 'visible' });
          await page.waitForTimeout(700);

          await page.evaluate(async () => {
            const mod = await import('/src/game/scenes/OpeningScene.ts');
            const proto = mod.OpeningScene.prototype;
            globalThis.__mptInputTrace = [];
            const trace = (event, scene, extra = {}) => globalThis.__mptInputTrace.push({
              event,
              t: performance.now(),
              phase: scene?.phase,
              resultReady: scene?.resultReady,
              panelActive: scene?.resultActionPanel?.active ?? null,
              panelAlpha: scene?.resultActionPanel?.alpha ?? null,
              ...extra,
            });
            for (const name of ['renderResultActionPanel','continueFromResult','animateRewardBanking']) {
              const original = proto[name];
              proto[name] = function (...args) {
                globalThis.__mptScene = this;
                trace(name, this);
                return original.apply(this, args);
              };
            }
            const canvas = document.querySelector('#game canvas');
            for (const type of ['pointerdown','pointerup']) canvas?.addEventListener(type, (event) => {
              const scene = globalThis.__mptScene;
              trace(`dom:${type}`, scene, { x: event.clientX, y: event.clientY, button: event.button });
            });
          });

          const save = { version:2, discoveredStandard:[], discoveredSecrets:[], chips:0, signal:0, activeLootPoolId:'y2k-essentials', totalOpens:3, pendingReveal:null, muted:false, stats:{duplicates:0,hiddenPockets:0} };
          await page.evaluate((value) => localStorage.setItem('mystery-pocket-tech.save', JSON.stringify(value)), save);
          await page.reload({ waitUntil: 'domcontentloaded' });
          await page.waitForSelector('#game canvas', { state: 'visible' });
          await page.waitForTimeout(700);

          // Reinstall instrumentation after reload.
          await page.evaluate(async () => {
            const mod = await import('/src/game/scenes/OpeningScene.ts');
            const proto = mod.OpeningScene.prototype;
            globalThis.__mptInputTrace = [];
            const trace = (event, scene, extra = {}) => globalThis.__mptInputTrace.push({ event, t:performance.now(), phase:scene?.phase, resultReady:scene?.resultReady, panelActive:scene?.resultActionPanel?.active ?? null, panelAlpha:scene?.resultActionPanel?.alpha ?? null, ...extra });
            for (const name of ['renderResultActionPanel','continueFromResult','animateRewardBanking']) {
              const original = proto[name];
              proto[name] = function (...args) { globalThis.__mptScene=this; trace(name,this); return original.apply(this,args); };
            }
            const canvas = document.querySelector('#game canvas');
            for (const type of ['pointerdown','pointerup']) canvas?.addEventListener(type, (event) => trace(`dom:${type}`, globalThis.__mptScene, {x:event.clientX,y:event.clientY,button:event.button}));
          });

          await page.evaluate(() => {
            globalThis.__mptAuditOriginalRandom = Math.random;
            globalThis.__mptAuditRandom = [0.1,0.1,0.0,0.999,0.5,0.99];
            Math.random = () => globalThis.__mptAuditRandom.length ? globalThis.__mptAuditRandom.shift() : 0.99;
          });
          const sx=482, sy=183;
          await page.mouse.move(sx,sy); await page.mouse.down(); await page.mouse.move(sx+150,sy,{steps:8}); await page.mouse.move(sx+310,sy,{steps:10}); await page.mouse.up();
          await page.waitForFunction(() => { const raw=localStorage.getItem('mystery-pocket-tech.save'); return raw && JSON.parse(raw).pendingReveal !== null; }, null, { timeout:6000 });
          await page.evaluate(() => { Math.random=globalThis.__mptAuditOriginalRandom; });
          await page.waitForFunction(() => { const raw=localStorage.getItem('mystery-pocket-tech.save'); const s=raw&&JSON.parse(raw); return s && s.pendingReveal===null && s.totalOpens===4; }, null, { timeout:12000 });
          await page.waitForTimeout(1800);
          await page.screenshot({ path:`${out}/before-tap.png` });
          const before = await page.evaluate(() => ({ phase:globalThis.__mptScene?.phase, resultReady:globalThis.__mptScene?.resultReady, panelAlpha:globalThis.__mptScene?.resultActionPanel?.alpha, trace:globalThis.__mptInputTrace }));
          await page.mouse.move(640,568); await page.mouse.down(); await page.waitForTimeout(80); await page.mouse.up();
          await page.waitForTimeout(350);
          await page.screenshot({ path:`${out}/after-center-tap.png` });
          const after = await page.evaluate(() => ({ phase:globalThis.__mptScene?.phase, resultReady:globalThis.__mptScene?.resultReady, panelAlpha:globalThis.__mptScene?.resultActionPanel?.alpha, trace:globalThis.__mptInputTrace }));
          await page.mouse.move(900,600); await page.mouse.down(); await page.waitForTimeout(80); await page.mouse.up();
          await page.waitForTimeout(350);
          const afterOutside = await page.evaluate(() => ({ phase:globalThis.__mptScene?.phase, resultReady:globalThis.__mptScene?.resultReady, panelAlpha:globalThis.__mptScene?.resultActionPanel?.alpha, trace:globalThis.__mptInputTrace }));
          await fs.writeFile(`${out}/trace.json`, JSON.stringify({ before, after, afterOutside }, null, 2));
          await ctx.close(); await browser.close();
          JS
          node .github/scripts/mega-input-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mega-input-diagnostic
          path: /tmp/mega-input-diagnostic
          if-no-files-found: error
          retention-days: 1
