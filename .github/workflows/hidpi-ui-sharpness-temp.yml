name: HiDPI UI sharpness

on:
  push:
    branches:
      - polish/hidpi-ui-sharpness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/hidpi-ui-sharpness
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply HiDPI sharpness patch
        run: node tools/hidpi-ui-sharpness-temp.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Remove temporary patcher and commit production diff
        run: |
          git rm tools/hidpi-ui-sharpness-temp.mjs .github/workflows/hidpi-ui-sharpness-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/game/systems/layout.ts src/game/systems/renderDensity.ts src/game/systems/uiSharpness.ts src/game/scenes/OpeningScene.ts src/game/scenes/CollectionScene.ts tests/render-density.test.ts
          git commit -m "Sharpen Phaser UI on HiDPI displays"
          git push origin HEAD:polish/hidpi-ui-sharpness
