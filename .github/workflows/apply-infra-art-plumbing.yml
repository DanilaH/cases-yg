name: Apply infrastructure art plumbing

on:
  push:
    branches:
      - feat/infrastructure-completion

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/infrastructure-completion
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Add final-art fallback plumbing once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/ui/openingVisuals.ts')
          text = path.read_text()
          if "collectibleTextureKey" not in text:
              text = text.replace(
                  "import Phaser from 'phaser';\n\n",
                  "import Phaser from 'phaser';\n\nimport { collectibleTextureKey } from '../data/artAssets';\n",
                  1,
              )

          marker = "export const createCollectibleVisual = (\n"
          if "const createAssetCollectible = (" not in text:
              helper = """const createAssetCollectible = (\n  scene: Phaser.Scene,\n  familyId: string,\n  textureKey: string,\n): Phaser.GameObjects.Container => {\n  const group = scene.add.container(0, 0);\n  const targetWidth = familyId === 'flip-phone' ? 190 : 246;\n  const image = scene.add.image(0, 0, textureKey).setOrigin(0.5);\n  image.setScale(targetWidth / Math.max(1, image.width));\n  const visualBottom = image.displayHeight / 2;\n  const shadowWidth = familyId === 'flip-phone' ? 170 : 220;\n  const shadow = scene.add.ellipse(0, visualBottom - 8, shadowWidth, 28, 0x050408, 0.2);\n  group.add([shadow, image]);\n  image.setDepth(1);\n  return group;\n};\n\n"""
              text = text.replace(marker, helper + marker, 1)

          old_sig = """  x: number,\n  y: number,\n): CollectibleVisual => {\n  const accentColor = rarity === 'secret' ? SECRET_REVEAL_COLOR : RARITY_REVEAL_COLORS[rarity];\n  const group =\n    familyId === 'camera'\n      ? createCamera(scene, accentColor)\n      : familyId === 'flip-phone'\n        ? createFlipPhone(scene, accentColor)\n        : createGenericDevice(scene, accentColor);\n"""
          new_sig = """  x: number,\n  y: number,\n  collectibleId?: string,\n): CollectibleVisual => {\n  const accentColor = rarity === 'secret' ? SECRET_REVEAL_COLOR : RARITY_REVEAL_COLORS[rarity];\n  const textureKey = collectibleId ? collectibleTextureKey(collectibleId) : null;\n  const group =\n    textureKey && scene.textures.exists(textureKey)\n      ? createAssetCollectible(scene, familyId, textureKey)\n      : familyId === 'camera'\n        ? createCamera(scene, accentColor)\n        : familyId === 'flip-phone'\n          ? createFlipPhone(scene, accentColor)\n          : createGenericDevice(scene, accentColor);\n"""
          if old_sig in text:
              text = text.replace(old_sig, new_sig, 1)
          path.write_text(text)

          opening = Path('src/game/scenes/OpeningScene.ts')
          text = opening.read_text()
          text = text.replace(
              "createCollectibleVisual(this, root, pending.standard.familyId, pending.standard.rarity, heroX, POUCH_Y + 52)",
              "createCollectibleVisual(\n      this,\n      root,\n      pending.standard.familyId,\n      pending.standard.rarity,\n      heroX,\n      POUCH_Y + 52,\n      pending.standard.collectibleId,\n    )",
              1,
          )
          text = text.replace(
              "      POUCH_Y + 42,\n    );",
              "      POUCH_Y + 42,\n      pending.hiddenPocket.collectibleId,\n    );",
              1,
          )
          text = text.replace(
              "        metrics.centerX - 188,\n        344,\n      );",
              "        metrics.centerX - 188,\n        344,\n        pending.standard.collectibleId,\n      );",
              1,
          )
          text = text.replace(
              "const secret = createCollectibleVisual(this, root, pending.hiddenPocket.familyId, 'secret', metrics.centerX + 72, 314);",
              "const secret = createCollectibleVisual(\n        this,\n        root,\n        pending.hiddenPocket.familyId,\n        'secret',\n        metrics.centerX + 72,\n        314,\n        pending.hiddenPocket.collectibleId,\n      );",
              1,
          )
          text = text.replace(
              "        metrics.centerX,\n        316,\n      );",
              "        metrics.centerX,\n        316,\n        pending.standard.collectibleId,\n      );",
              1,
          )
          opening.write_text(text)

          collection = Path('src/game/scenes/CollectionScene.ts')
          text = collection.read_text()
          text = text.replace(
              "const visual = createCollectibleVisual(this, root, family.id, best, x, 365);",
              "const visual = createCollectibleVisual(this, root, family.id, best, x, 365, family.standard[best].id);",
              1,
          )
          text = text.replace(
              "const visual = createCollectibleVisual(this, root, family.id, entry.rarity, x, y - 8);",
              "const visual = createCollectibleVisual(this, root, family.id, entry.rarity, x, y - 8, entry.id);",
              1,
          )
          collection.write_text(text)
          PY
      - name: Commit patch if changed
        run: |
          if [ -z "$(git status --porcelain -- src/game/ui/openingVisuals.ts src/game/scenes/OpeningScene.ts src/game/scenes/CollectionScene.ts)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/ui/openingVisuals.ts src/game/scenes/OpeningScene.ts src/game/scenes/CollectionScene.ts
          git commit -m "Wire reviewed collectible art into runtime scenes"
          git push
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
