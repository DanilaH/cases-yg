name: Apply pouch variant offsets

on:
  push:
    branches:
      - polish/pouch-variant-offsets

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[pouch-variant-offsets]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/pouch-variant-offsets.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/data/presentation.ts src/game/ui/openingVisuals.ts
          git commit -m '[pouch-variant-offsets] split Basic and Charged optical offsets'
          git push origin HEAD:polish/pouch-variant-offsets
