name: Verify PR4

on:
  push:
    branches:
      - feat/collection-i18n-audio

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/collection-i18n-audio
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Apply reviewed source patch once
        run: node scripts/apply-pr4-patch.mjs
      - name: Commit source patch if changed
        run: |
          if [ -z "$(git status --porcelain -- src/game/scenes/OpeningScene.ts src/game/scenes/CollectionScene.ts)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts src/game/scenes/CollectionScene.ts
          git commit -m "Integrate localized opener audio and collection copy"
          git push
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
