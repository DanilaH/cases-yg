name: Temporary docs duplicate-marker fix

on:
  push:
    branches:
      - docs/sync-post-result-feel-polish-v2
    paths:
      - .github/tmp-fix-doc-sync-duplicates.py
      - .github/workflows/tmp-fix-doc-sync-duplicates.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python .github/tmp-fix-doc-sync-duplicates.py
      - name: Validate no duplicate markers remain
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -Fq '# Phase 0 — established opener baseline — COMPLETE# Phase 0' docs/IMPLEMENTATION_ROADMAP.md
          ! grep -Fq '# Deferred information pass — NOT PART OF 2.1# Deferred' docs/IMPLEMENTATION_ROADMAP.md
          ! grep -Fq 'OPENING_FEEL_CORRECTION_SCOPE.md`.Canonical' docs/PROBE_VALIDATION.md
          ! grep -Fq 'INTEGRATED# 5. Current Lite V2' docs/ASSET_MANIFEST.md
      - name: Commit duplicate-marker cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add docs/IMPLEMENTATION_ROADMAP.md docs/PROBE_VALIDATION.md docs/ASSET_MANIFEST.md
          git commit -m 'Fix docs sync duplicate markers'
          git push origin HEAD:docs/sync-post-result-feel-polish-v2
