name: Fix asset runtime review findings

on:
  push:
    branches:
      - feat/asset-runtime-infrastructure

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/asset-runtime-infrastructure
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Keep Collection chrome above foreground art
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/scenes/CollectionScene.ts')
          text = path.read_text()
          marker = "    const messages = getMessages(getPlatformRuntime().language);\n\n"
          start = text.find("    root.add(\n      this.add\n        .text(metrics.centerX, 48", text.find(marker))
          content = text.find("    if (this.view === 'shelf') {", start)
          pager = text.find("    this.renderPager(root);", content)
          if start >= 0 and content >= 0 and pager >= 0:
              chrome_block = text[start:content]
              content_block = text[content:pager]
              if content_block.find("collection-foreground") >= 0 and chrome_block.find("messages.collection.title") >= 0:
                  text = text[:start] + content_block + chrome_block + text[pager:]
          path.write_text(text)

          opening = Path('src/game/scenes/OpeningScene.ts')
          text = opening.read_text()
          text = text.replace(
              "    if (recovered) {\n      this.pouch.tab.setX(this.pouch.tabEndX);\n      }\n",
              "    if (recovered) {\n      this.pouch.tab.setX(this.pouch.tabEndX);\n    }\n",
              1,
          )
          opening.write_text(text)
          PY
      - name: Commit review fixes if changed
        run: |
          if [ -z "$(git status --porcelain -- src/game/scenes/CollectionScene.ts src/game/scenes/OpeningScene.ts)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/CollectionScene.ts src/game/scenes/OpeningScene.ts
          git commit -m "Keep Collection chrome above foreground art"
          git push
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
