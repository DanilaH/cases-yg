name: Integrate Environment Assets Clean

on:
  push:
    branches:
      - feat/environment-runtime-assets-clean
    paths:
      - .github/workflows/integrate-environment-assets-clean.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/environment-runtime-assets-clean
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Prepare environment runtime assets
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageOps, ImageStat

          WIDTH, HEIGHT = 1728, 720
          assets = [
              {
                  'id': 'opening-bg',
                  'source': Path('incoming/ChatGPT Image Sep 4, 2026, 11_35_27 AM.png'),
                  'output': Path('public/assets/backgrounds/opening-bg.webp'),
                  'expected_size': (1942, 809),
                  'transparent': False,
              },
              {
                  'id': 'collection-bg',
                  'source': Path('incoming/ChatGPT Image Sep 4, 2026, 11_34_44 AM.png'),
                  'output': Path('public/assets/backgrounds/collection-bg.webp'),
                  'expected_size': (1916, 821),
                  'transparent': False,
              },
              {
                  'id': 'collection-foreground',
                  'source': Path('incoming/ChatGPT Image Sep 4, 2026, 11_35_06 AM.png'),
                  'output': Path('public/assets/backgrounds/collection-foreground.webp'),
                  'expected_size': (1942, 809),
                  'transparent': True,
              },
          ]

          Path('public/assets/backgrounds').mkdir(parents=True, exist_ok=True)

          for asset in assets:
              with Image.open(asset['source']) as source:
                  if source.size != asset['expected_size']:
                      raise SystemExit(f"{asset['id']}: unexpected source size {source.size}, expected {asset['expected_size']}")
                  has_alpha = 'A' in source.getbands()
                  if asset['transparent'] != has_alpha:
                      raise SystemExit(f"{asset['id']}: unexpected alpha state; mode={source.mode}")

                  fitted = ImageOps.fit(
                      source,
                      (WIDTH, HEIGHT),
                      method=Image.Resampling.LANCZOS,
                      centering=(0.5, 0.5),
                  )
                  fitted = fitted.convert('RGBA' if asset['transparent'] else 'RGB')
                  fitted.save(asset['output'], 'WEBP', quality=88, method=6, exact=True)

              with Image.open(asset['output']) as exported:
                  if exported.size != (WIDTH, HEIGHT):
                      raise SystemExit(f"{asset['id']}: bad runtime dimensions {exported.size}")
                  if asset['transparent']:
                      alpha = exported.getchannel('A')
                      if alpha.getextrema() != (0, 255):
                          raise SystemExit(f"{asset['id']}: foreground alpha range is {alpha.getextrema()}")
                      top_mean = ImageStat.Stat(alpha.crop((0, 0, WIDTH, 200))).mean[0]
                      if top_mean > 12:
                          raise SystemExit(f"{asset['id']}: upper UI zone too opaque: {top_mean}")
                      print(f"{asset['id']}: upper alpha mean {top_mean:.4f}")

              kb = asset['output'].stat().st_size / 1024
              print(f"{asset['id']}: {asset['expected_size'][0]}x{asset['expected_size'][1]} -> {WIDTH}x{HEIGHT}; {kb:.0f} KB")

      - name: Enable reviewed environment art
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/game/data/artAssets.ts')
          text = path.read_text()
          marker = """export const AVAILABLE_STATIC_ART_IDS = new Set<StaticArtId>([
            'pouch-body',
            'pouch-tear-strip',
            'pouch-star-tab',
          ]);"""
          replacement = """export const AVAILABLE_STATIC_ART_IDS = new Set<StaticArtId>([
            'pouch-body',
            'pouch-tear-strip',
            'pouch-star-tab',
            'opening-bg',
            'collection-bg',
            'collection-foreground',
          ]);"""
          if marker not in text:
              raise SystemExit('Expected pouch-only static-art allowlist not found')
          path.write_text(text.replace(marker, replacement))

      - name: Commit final environment assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            'incoming/ChatGPT Image Sep 4, 2026, 11_34_44 AM.png' \
            'incoming/ChatGPT Image Sep 4, 2026, 11_35_06 AM.png' \
            'incoming/ChatGPT Image Sep 4, 2026, 11_35_27 AM.png' \
            '.github/workflows/integrate-environment-assets-clean.yml'
          git add public/assets/backgrounds src/game/data/artAssets.ts
          git commit -m 'Add final environment runtime assets'
          git push origin HEAD:feat/environment-runtime-assets-clean

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
