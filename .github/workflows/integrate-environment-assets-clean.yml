name: Integrate Environment Assets Clean

on:
  push:
    branches:
      - feat/environment-runtime-assets-clean
    paths:
      - .github/workflows/integrate-environment-assets-clean.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/environment-runtime-assets-clean
          fetch-depth: 0

      - name: Prepare environment runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/backgrounds

          # Confirm the three generated source roles before conversion.
          test "$(magick identify -format '%[channels]' 'incoming/ChatGPT Image Sep 4, 2026, 11_35_06 AM.png')" != "srgb"

          magick 'incoming/ChatGPT Image Sep 4, 2026, 11_35_27 AM.png' \
            -resize '1728x720^' -gravity center -extent 1728x720 \
            -quality 88 public/assets/backgrounds/opening-bg.webp

          magick 'incoming/ChatGPT Image Sep 4, 2026, 11_34_44 AM.png' \
            -resize '1728x720^' -gravity center -extent 1728x720 \
            -quality 88 public/assets/backgrounds/collection-bg.webp

          magick 'incoming/ChatGPT Image Sep 4, 2026, 11_35_06 AM.png' \
            -resize '1728x720^' -gravity center -extent 1728x720 \
            -quality 88 public/assets/backgrounds/collection-foreground.webp

          for file in opening-bg collection-bg collection-foreground; do
            dims="$(magick identify -format '%wx%h' "public/assets/backgrounds/${file}.webp")"
            test "$dims" = '1728x720'
            size="$(stat -c%s "public/assets/backgrounds/${file}.webp")"
            echo "${file}: 1728x720; $((size / 1024)) KB"
          done

          alpha_range="$(magick public/assets/backgrounds/collection-foreground.webp -alpha extract -format '%[fx:minima],%[fx:maxima]' info:)"
          test "$alpha_range" = '0,1'
          top_alpha="$(magick public/assets/backgrounds/collection-foreground.webp -crop 1728x200+0+0 +repage -alpha extract -format '%[fx:mean]' info:)"
          python - "$top_alpha" <<'PY'
          import sys
          mean = float(sys.argv[1])
          if mean > 0.05:
              raise SystemExit(f'foreground upper UI zone too opaque: {mean}')
          print(f'foreground upper alpha mean: {mean:.6f}')
          PY

      - name: Enable reviewed environment art
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/game/data/artAssets.ts')
          text = path.read_text()
          marker = """export const AVAILABLE_STATIC_ART_IDS = new Set<StaticArtId>([
            'pouch-body',
            'pouch-tear-strip',
            'pouch-star-tab',
          ]);"""
          replacement = """export const AVAILABLE_STATIC_ART_IDS = new Set<StaticArtId>([
            'pouch-body',
            'pouch-tear-strip',
            'pouch-star-tab',
            'opening-bg',
            'collection-bg',
            'collection-foreground',
          ]);"""
          if marker not in text:
              raise SystemExit('Expected pouch-only static-art allowlist not found')
          path.write_text(text.replace(marker, replacement))

      - name: Commit final environment assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            'incoming/ChatGPT Image Sep 4, 2026, 11_34_44 AM.png' \
            'incoming/ChatGPT Image Sep 4, 2026, 11_35_06 AM.png' \
            'incoming/ChatGPT Image Sep 4, 2026, 11_35_27 AM.png' \
            '.github/workflows/integrate-environment-assets-clean.yml'
          git add public/assets/backgrounds src/game/data/artAssets.ts
          git commit -m 'Add final environment runtime assets'
          git push origin HEAD:feat/environment-runtime-assets-clean

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
