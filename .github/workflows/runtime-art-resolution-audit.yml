name: Runtime art resolution audit

on:
  push:
    branches:
      - experiment/runtime-art-resolution-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime art
        run: node tools/assets/audit-runtime-art.mjs

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: runtime-art-audit
          path: .asset-build/runtime-art-audit.json

      - name: Project gate
        run: |
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
