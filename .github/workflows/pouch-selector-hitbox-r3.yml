name: Pouch selector hitbox R3 audit

on:
  push:
    branches:
      - audit/pouch-selector-hitbox-r3
    paths:
      - .github/workflows/pouch-selector-hitbox-r3.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assert product tree matches candidate exactly
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD=1e984ba85171cf59a9c3c19d8143d6a9b415be34
          git cat-file -e "$PRODUCT_HEAD^{commit}"
          unexpected="$(git diff --name-only "$PRODUCT_HEAD"...HEAD | grep -Ev '^\.github/(scripts/pouch-selector-hitbox-r3\.mjs|workflows/pouch-selector-hitbox-r3\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Audit branch changes product files:'
            echo "$unexpected"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Install Playwright driver and video helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-pack node_modules/playwright node_modules/playwright-core
          npm pack playwright@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pw-name.txt
          npm pack playwright-core@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pwc-name.txt
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pw-name.txt)" --strip-components=1 -C node_modules/playwright
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pwc-name.txt)" --strip-components=1 -C node_modules/playwright-core
          node node_modules/playwright/cli.js install ffmpeg
      - name: Start Vite
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Probe full selector cards at 900 and 1280
        run: node .github/scripts/pouch-selector-hitbox-r3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pouch-selector-hitbox-r3
          path: /tmp/pouch-selector-hitbox-r3
          if-no-files-found: error
          retention-days: 3
