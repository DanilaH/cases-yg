name: Apply pouch selector hitbox fix

on:
  push:
    branches:
      - fix/pouch-selector-hitbox
    paths:
      - .github/workflows/fix-pouch-selector-hitbox.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pouch-selector-hitbox
          fetch-depth: 0
      - name: Apply reviewed selector input fix
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/fix-pouch-selector-hitbox.py
          rm .github/scripts/fix-pouch-selector-hitbox.py
          rm .github/workflows/fix-pouch-selector-hitbox.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align pouch selector hit area with visible cards'
          git push origin HEAD:fix/pouch-selector-hitbox
