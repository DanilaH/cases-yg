name: Temporary result choreography docs sync

on:
  push:
    branches:
      - tmp/sync-result-choreography-docs

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Normalize exact current Hidden Pocket block
        run: python tools/tmp-sync-result-choreography-docs-pre.py
      - name: Apply bounded documentation sync
        run: python tools/tmp-sync-result-choreography-docs.py
      - name: Preserve explicit Charged odds wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/GAMEPLAY_SYSTEMS.md')
          text = p.read_text()
          old = '- Hidden Pocket `6%` from opening #4;'
          new = '- Charged from #4: `6%`;'
          if old not in text:
              raise SystemExit('Expected post-patch Charged odds line not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Verify and commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GAMEPLAY_SYSTEMS.md docs/DECISIONS.md docs/IMPLEMENTATION_ROADMAP.md docs/YANDEX_SLICE_VALIDATION.md
          git diff --cached --check
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Sync result choreography docs [skip ci]"
          git push
