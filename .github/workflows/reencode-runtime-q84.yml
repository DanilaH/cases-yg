name: Generate q84 runtime image candidate

on:
  push:
    branches:
      - perf/runtime-webp-q84
    paths:
      - .github/workflows/reencode-runtime-q84.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: perf/runtime-webp-q84

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Re-encode reviewed runtime WebP at q84
        run: node tools/assets/reencode-runtime-q84-once.mjs

      - name: Keep trim regeneration on the same quality floor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/assets/trim-runtime-art.mjs')
          source = path.read_text()
          old = "const WEBP_OPTIONS = {\n  quality: 88,"
          new = "const WEBP_OPTIONS = {\n  quality: 84,"
          if source.count(old) != 1:
              raise SystemExit(f'expected one trim quality seam, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Show migration report
        run: cat .asset-build/runtime-q84-report.json | tail -n 30

      - name: Full gate
        run: |
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build

      - name: Remove one-off migration scaffolding and commit candidate
        run: |
          rm .github/workflows/reencode-runtime-q84.yml
          rm tools/assets/reencode-runtime-q84-once.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/assets tools/assets/trim-runtime-art.mjs .github/workflows/reencode-runtime-q84.yml tools/assets/reencode-runtime-q84-once.mjs
          git commit -m "Re-encode runtime WebP at quality 84"
          git push origin HEAD:perf/runtime-webp-q84
