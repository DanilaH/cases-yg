name: Refine chip emitter

on:
  push:
    branches:
      - feat/opening-feel-pass-v2
    paths:
      - .github/workflows/refine-chip-emitter.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/opening-feel-pass-v2
          fetch-depth: 0
      - name: Apply reviewed emitter polish
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/refine-chip-emitter.py
          rm .github/scripts/refine-chip-emitter.py
          rm .github/workflows/refine-chip-emitter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Keep chip banking clear of reward copy'
          git push origin HEAD:feat/opening-feel-pass-v2
