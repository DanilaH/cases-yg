name: Final reveal meta visual gate

on:
  push:
    branches:
      - review/reveal-meta-feel-2026-09-11

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/reveal-meta-feel-2026-09-11
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated browser driver
        shell: bash
        run: |
          mkdir -p /tmp/mpt-review-runner
          cd /tmp/mpt-review-runner
          npm init -y >/dev/null
          npm install playwright@1.55.0
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/mpt-review-runner/node_modules/playwright node_modules/playwright
          ln -s /tmp/mpt-review-runner/node_modules/playwright-core node_modules/playwright-core
          test -x /usr/bin/google-chrome
      - name: Start game
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Capture exact production-head visual scenarios
        shell: bash
        run: |
          mkdir -p review-artifacts/screens review-artifacts/logs tools/review
          cat > tools/review/final-gate-temp.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const OUT = 'review-artifacts';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
          const browser = await chromium.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required','--use-gl=swiftshader','--window-size=1280,720'],
          });
          const context = await browser.newContext({ viewport: { width: 1280, height: 720 }, locale: 'en-US' });
          const page = await context.newPage();
          const errors = [];
          page.on('console', (m) => { if (m.type() === 'error') errors.push(`[console] ${m.text()}`); });
          page.on('pageerror', (e) => errors.push(`[pageerror] ${e.message}`));
          const waitGame = async () => { await page.waitForSelector('canvas', { state: 'visible', timeout: 15000 }); await sleep(1200); };
          const revealDebugPanel = async () => { const b = page.getByRole('button', { name: 'DEBUG' }); if (await b.count()) await b.click(); };
          const triggerReloadingDebugAction = async (label) => {
            await revealDebugPanel();
            await page.evaluate(() => sessionStorage.setItem('mystery-pocket-tech.debug-panel-collapsed', '1'));
            const nav = page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 10000 });
            await page.getByRole('button', { name: label, exact: true }).click();
            await nav; await waitGame();
          };
          const layout = async () => {
            const box = await page.locator('canvas').boundingBox(); if (!box) throw new Error('Canvas missing');
            const scale = box.height / 720; const logicalWidth = clamp((box.width / box.height) * 720, 900, 1728); const offsetX = (box.width - logicalWidth * scale) / 2;
            return { box, scale, logicalWidth, offsetX, centerX: logicalWidth / 2 };
          };
          const p = (m, x, y) => ({ x: m.box.x + m.offsetX + x * m.scale, y: m.box.y + y * m.scale });
          const dragPouch = async (duration = 1050) => {
            const m = await layout(); const start = p(m, m.centerX - 158, 177); const end = p(m, m.centerX + 164, 177);
            await page.mouse.move(start.x, start.y); await page.mouse.down();
            for (let i = 1; i <= 28; i += 1) { const t = i / 28; await page.mouse.move(start.x + (end.x - start.x) * t, start.y + Math.sin(t * Math.PI) * 2 * m.scale); await sleep(duration / 28); }
            await page.mouse.up();
          };
          const shot = async (name) => page.screenshot({ path: `${OUT}/screens/${name}.png` });

          await page.goto('http://127.0.0.1:4173/?debug', { waitUntil: 'domcontentloaded' }); await waitGame();
          await triggerReloadingDebugAction('Reset save');
          await dragPouch();
          for (let i = 0; i < 12; i += 1) { await sleep(250); await shot(`basic-new-${String(i + 1).padStart(2,'0')}`); }
          await sleep(1100); await shot('basic-new-settled');

          await triggerReloadingDebugAction('Reset save');
          await triggerReloadingDebugAction('Force Hidden Pocket');
          for (let i = 0; i < 10; i += 1) { await sleep(350); await shot(`secret-${String(i + 1).padStart(2,'0')}`); }
          await sleep(900); await shot('secret-settled');

          await writeFile(`${OUT}/logs/browser-errors.txt`, errors.join('\n'));
          await browser.close();
          if (errors.length) { console.error(errors.join('\n')); process.exitCode = 2; }
          EOF
          node tools/review/final-gate-temp.mjs
          git rev-parse HEAD > review-artifacts/logs/production-head.txt
          cp /tmp/vite.log review-artifacts/logs/vite.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-reveal-meta-visual-gate
          path: review-artifacts
          if-no-files-found: error
          retention-days: 2
