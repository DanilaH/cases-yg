name: Temporary crack prototype fix and verify
on:
  push:
    branches: [feat/pouch-crack-dissolve-prototype-20260916]
    paths: [.github/workflows/temporary-crack-fix-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reapply prototype and correct Phaser type
        run: |
          python - <<'PY'
          import base64, lzma
          from pathlib import Path
          source=Path('.github/workflows/temporary-crack-prototype-verify.yml').read_text()
          payload=source.split("cat > /tmp/crack.patch.xz.b64 <<'BASE64'",1)[1].split('BASE64',1)[0]
          Path('/tmp/crack.patch').write_bytes(lzma.decompress(base64.b64decode(''.join(payload.split()))))
          PY
          git apply --check /tmp/crack.patch
          git apply /tmp/crack.patch
          sed -i 's/private crackDebris: Phaser.GameObjects.Arc\[\] = \[\];/private crackDebris: Phaser.GameObjects.Ellipse[] = [];/' src/game/scenes/OpeningScene.ts
      - name: Strict checks and production build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit only prototype production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/data/rarityPouchImpact.ts src/game/data/rarityPouchImpact.test.ts src/game/scenes/OpeningScene.ts src/game/ui/pouchPerspective.ts
          git commit -m 'feat(feel): prototype glowing crack dissolve and rarity debris'
          git push origin HEAD:feat/pouch-crack-dissolve-prototype-20260916
