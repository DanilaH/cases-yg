name: Temporary secret outline review fix

on:
  push:
    branches:
      - polish/reveal-meta-feel-2026-09-11

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/reveal-meta-feel-2026-09-11
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: node tools/apply-secret-outline-review-fix.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit clean production fix
        run: |
          rm tools/apply-secret-outline-review-fix.mjs
          rm .github/workflows/secret-outline-review-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Refine Secret silhouette accent"
          git push origin HEAD:polish/reveal-meta-feel-2026-09-11
