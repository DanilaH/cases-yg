name: Temporary crack contrast refinement
on:
  push:
    branches: [feat/pouch-crack-dissolve-prototype-20260916]
    paths: [.github/workflows/temporary-crack-contrast.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Improve crack contrast and sequence
        run: |
          python - <<'PY'
          from pathlib import Path
          shader=Path('src/game/ui/pouchPerspective.ts')
          source=shader.read_text()
          start="  '            vec2 centered = uv - vec2(0.5, 0.69);',"
          end="  '            sampled.a *= 1.0 - hole * cover;',"
          assert source.count(start)==1 and source.count(end)==1
          fragment=[
            "            // Offset the fracture network to the foil around the central medallion.",
            "            float veinLeft = abs(uv.x - (0.32 + 0.095 * sin(uv.y * 17.0) + 0.020 * sin(uv.y * 47.0)));",
            "            float veinRight = abs(uv.x - (0.68 + 0.105 * sin(uv.y * 19.0 + 1.8) + 0.018 * sin(uv.y * 51.0)));",
            "            float branchLeft = abs(uv.y - (0.57 + 0.60 * (uv.x - 0.32) + 0.018 * sin(uv.x * 43.0)));",
            "            float branchRight = abs(uv.y - (0.57 - 0.60 * (uv.x - 0.68) + 0.020 * sin(uv.x * 49.0)));",
            "            float crack = min(min(veinLeft, veinRight), min(branchLeft, branchRight));",
            "            float radius = length((uv - vec2(0.5, 0.65)) * vec2(0.9, 1.16));",
            "            float growth = 1.0 - smoothstep(crackProgress * 0.62 - 0.07, crackProgress * 0.62 + 0.05, radius);",
            "            float noise = fract(sin(dot(floor(uv * vec2(167.0, 191.0)), vec2(12.9898, 78.233))) * 43758.5453);",
            "            float width = 0.0025 + crackProgress * crackProgress * crackStrength * 0.027;",
            "            float ragged = crack + (noise - 0.5) * 0.007;",
            "            float cover = smoothstep(0.12, 0.19, uv.x) * (1.0 - smoothstep(0.80, 0.88, uv.x));",
            "            cover *= smoothstep(0.31, 0.40, uv.y) * (1.0 - smoothstep(0.87, 0.96, uv.y));",
            "            float material = cover * growth * smoothstep(0.12, 0.65, sampled.a);",
            "            float burn = (1.0 - smoothstep(width + 0.003, width + 0.025, ragged)) * material;",
            "            float edge = (1.0 - smoothstep(width + 0.002, width + 0.016, ragged)) * material;",
            "            float core = (1.0 - smoothstep(0.0, 0.009, ragged)) * material;",
            "            // Charcoal undercut gives gold/cyan lines contrast on bright silver foil.",
            "            sampled.rgb = mix(sampled.rgb, vec3(0.10, 0.065, 0.13), burn * 0.68 * crackStrength);",
            "            sampled.rgb += crackTint * (edge * 0.64 + core * 0.92) * crackStrength;",
            "            float hole = (1.0 - smoothstep(width * 0.68, width + 0.003, ragged)) * material;",
            "            sampled.a *= 1.0 - hole;",
          ]
          replacement='\n'.join("  '"+line.replace('\\','\\\\').replace("'","\\'")+"'," for line in fragment)
          left=source.index(start);right=source.index(end,left)+len(end)
          shader.write_text(source[:left]+replacement+source[right:])

          scene=Path('src/game/scenes/OpeningScene.ts')
          source=scene.read_text()
          start='    this.spawnCrackDebris(rarity);\n    const proxy = { progress: 0.12 };'
          end='    // Debris lives on the scene root, not the fading pouch.'
          assert source.count(start)==1 and source.count(end)==1
          stage='''    const proxy = { progress: 0.12 };
            const syncPreview = (): void => {
              if (perspective) perspective.crackProgress = proxy.progress;
            };
            // Make cracks readable before the foil disappears. This first stage
            // uses part of the existing duration instead of slowing every open.
            await this.runSkippableTween({
              targets: proxy,
              progress: 0.66,
              duration: Math.round(profile.crackDurationMs * 0.42),
              ease: 'Sine.Out',
              onUpdate: syncPreview,
            }, () => {
              proxy.progress = 0.66;
              syncPreview();
            });
            if (this.isSceneShutdown() || !pouch.group.active) return;
            this.spawnCrackDebris(rarity);
            await this.runSkippableTween({
              targets: proxy,
              progress: 1,
              duration: profile.crackDurationMs - Math.round(profile.crackDurationMs * 0.42),
              ease: 'Cubic.In',
              onUpdate: () => {
                if (perspective) perspective.crackProgress = proxy.progress;
                else if (pouch.bodyLayer.active) pouch.bodyLayer.setAlpha(1 - proxy.progress * 0.6);
                if (pouch.group.active && proxy.progress > 0.78) {
                  pouch.group.setAlpha(1 - (proxy.progress - 0.78) / 0.22);
                }
              },
            }, () => {
              if (perspective) perspective.crackProgress = 1;
              else if (pouch.bodyLayer.active) pouch.bodyLayer.setAlpha(0.4);
              if (pouch.group.active) pouch.group.setAlpha(0);
            });
          '''
          import textwrap
          stage=textwrap.dedent(stage)
          stage=textwrap.indent(stage,'    ')
          left=source.index(start);right=source.index(end,left)
          scene.write_text(source[:left]+stage+source[right:])
          PY
      - name: TypeScript, complete unit suite and build, then source-only commit
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          git add src/game/ui/pouchPerspective.ts src/game/scenes/OpeningScene.ts
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(feel): stage readable crack network and glowing foil burn'
          git push origin HEAD:feat/pouch-crack-dissolve-prototype-20260916
