name: Temporary Hidden Pocket Typefix

on:
  push:
    branches:
      - feel/hidden-pocket-owned-banking-r1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[hidden-typefix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feel/hidden-pocket-owned-banking-r1
      - name: Apply type annotation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/scenes/OpeningScene.ts')
          text = path.read_text()
          old = """        const crossesReady =\n          !readyShown &&\n          crossedChargedReadyThreshold(pending, LITE_V2_BALANCE) &&\n          nextValue < chargedCost &&\n          target >= chargedCost;"""
          new = """        const crossesReady: boolean =\n          !readyShown &&\n          crossedChargedReadyThreshold(pending, LITE_V2_BALANCE) &&\n          nextValue < chargedCost &&\n          target >= chargedCost;"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one crossesReady anchor, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit typefix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts
          git diff --cached --check
          git commit -m "[hidden-typefix] Stabilize banking threshold inference"
          git push origin HEAD:feel/hidden-pocket-owned-banking-r1
