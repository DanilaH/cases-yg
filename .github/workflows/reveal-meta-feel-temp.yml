name: Temporary reveal meta feel polish

on:
  push:
    branches:
      - polish/reveal-meta-feel-2026-09-11

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/reveal-meta-feel-2026-09-11
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Apply production polish
        run: node tools/apply-reveal-meta-feel-polish.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Asset self-test
        run: npm run assets:selftest
      - name: Validate collectible assets
        run: npm run assets:validate
      - name: Production build
        run: npm run build
      - name: Commit only production changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm tools/apply-reveal-meta-feel-polish.mjs
          rm .github/workflows/reveal-meta-feel-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Polish reveal and collection meta feel"
          git push origin HEAD:polish/reveal-meta-feel-2026-09-11
