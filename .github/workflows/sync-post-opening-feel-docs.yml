name: Sync post opening-feel docs

on:
  push:
    branches:
      - docs/sync-post-opening-feel
    paths:
      - .github/workflows/sync-post-opening-feel-docs.yml
      - .github/scripts/sync-post-opening-feel-docs.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/sync-post-opening-feel
          fetch-depth: 0
      - name: Sync canonical docs
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/sync-post-opening-feel-docs.py
          rm .github/scripts/sync-post-opening-feel-docs.py
          rm .github/workflows/sync-post-opening-feel-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Sync docs after opening feel correction merge'
          git push origin HEAD:docs/sync-post-opening-feel
