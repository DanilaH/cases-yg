name: Temporary crack dissolve browser QA
on:
  push:
    branches: [feat/pouch-crack-dissolve-prototype-20260916]
    paths: [.github/workflows/temporary-crack-browser-qa.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    env:
      VITE_PLATFORM_RUNTIME: mock
      VITE_DEBUG_PANEL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install game and browser
        run: |
          npm ci
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Seed ONLY the test build's reward RNG (never Math.random)
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/game/systems/random.ts')
          source=path.read_text()
          before='export class MathRandomSource implements RandomSource {\n  public next(): number {\n    return Math.random();'
          after='''export class MathRandomSource implements RandomSource {
            private qaIndex = 0;
            public next(): number {
              const rarity = import.meta.env.VITE_CRACK_QA_RARITY;
              if (rarity === 'rare' || rarity === 'legendary') {
                const sample = rarity === 'rare' ? [0.1, 0.8, 0, 0, 0.99] : [0.1, 0.99, 0, 0, 0.99];
                return sample[(this.qaIndex++) % sample.length]!;
              }
              return Math.random();'''
          assert source.count(before)==1
          path.write_text(source.replace(before,after))
          PY
      - name: Capture actual drag-to-tear, not debug staged-reveal
        run: |
          cat > /tmp/qa-crack.py <<'PY'
          import asyncio,json,sys,traceback
          from pathlib import Path
          from playwright.async_api import async_playwright
          tier=sys.argv[1]
          async def main():
            out=Path('crack-browser-qa')/tier;out.mkdir(parents=True,exist_ok=True)
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader'])
              context=await browser.new_context(viewport={'width':1600,'height':900},locale='ru-RU',record_video_dir=str(out),record_video_size={'width':1600,'height':900})
              page=await context.new_page();errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)))
              page.on('console',lambda msg: errors.append('console:'+msg.text) if msg.type=='error' else None)
              try:
                await page.goto('http://127.0.0.1:4173/',wait_until='domcontentloaded',timeout=60000)
                await page.locator('.mpt-debug-panel__meta strong').wait_for(timeout=75000)
                await page.wait_for_function("Boolean(localStorage.getItem('mystery-pocket-tech.save'))",timeout=75000)
                await page.evaluate('''() => {
                  const k='mystery-pocket-tech.save';const s=JSON.parse(localStorage.getItem(k));
                  Object.assign(s,{version:5,chips:450,totalOpens:17,signal:0,
                    overchargeHundredths:100,activeLootPoolId:'y2k-essentials',pendingReveal:null,
                    onboarding:{primaryCompleted:true,firstRevealReceipt:null},
                    discoveredStandard:[],discoveredSecrets:[],stats:{duplicates:0,hiddenPockets:0}});
                  localStorage.setItem(k,JSON.stringify(s));
                }''')
                await page.reload(wait_until='domcontentloaded',timeout=60000)
                await page.locator('.mpt-debug-panel__meta strong').wait_for(timeout=75000)
                await page.wait_for_timeout(2400)
                if tier=='legendary':
                  await page.mouse.click(163,386)
                  await page.wait_for_timeout(650)
                before=await page.evaluate("JSON.parse(localStorage.getItem('mystery-pocket-tech.save'))")
                await page.screenshot(path=str(out/'before.png'),style='.mpt-debug-panel {visibility:hidden!important}')
                await page.mouse.move(601,226)
                await page.mouse.down()
                await page.mouse.move(770,226,steps=9)
                await page.mouse.move(1003,227,steps=13)
                await page.mouse.up()
                for index in range(35):
                  await page.wait_for_timeout(350)
                  state=await page.evaluate("JSON.parse(localStorage.getItem('mystery-pocket-tech.save'))")
                  if state.get('discoveredStandard') and not state.get('pendingReveal'):
                    break
                await page.screenshot(path=str(out/'after.png'),style='.mpt-debug-panel {visibility:hidden!important}')
                print('CRACK_QA',tier,'before',before.get('totalOpens'),'after',state.get('totalOpens'),'items',state.get('discoveredStandard'),'errors',json.dumps(errors),flush=True)
                assert state.get('totalOpens')==before.get('totalOpens')+1
                assert any(item.endswith('-'+tier) for item in state.get('discoveredStandard',[])),state.get('discoveredStandard')
                assert not state.get('pendingReveal')
                assert not errors,errors
              finally:
                await context.close();await browser.close()
          asyncio.run(main())
          PY
          for rarity in rare legendary; do
            VITE_CRACK_QA_RARITY="$rarity" npm run build
            python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/crack-preview.log 2>&1 &
            server=$!
            sleep 2
            python /tmp/qa-crack.py "$rarity" || { kill "$server" 2>/dev/null || true; exit 1; }
            kill "$server" 2>/dev/null || true
          done
          git status --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-crack-rare-vs-legendary-videos
          path: crack-browser-qa/
          if-no-files-found: ignore
          retention-days: 3
