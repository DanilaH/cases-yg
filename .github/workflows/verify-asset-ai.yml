name: Verify asset AI pipeline

on:
  push:
    branches:
      - feat/asset-production-pipeline

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/asset-production-pipeline
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update AI asset tooling lockfile"
          git push
      - run: npm ci
      - run: npm run assets:model:u2netp
      - run: npm run assets:ai:selftest
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
