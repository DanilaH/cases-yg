name: Verify asset AI pipeline temporary

on:
  push:
    branches:
      - feat/asset-production-pipeline

permissions:
  contents: read

jobs:
  verify-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/asset-production-pipeline
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run assets:model:u2netp
      - run: npm run assets:model:u2netp -- --force
      - run: npm run assets:ai:selftest
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
