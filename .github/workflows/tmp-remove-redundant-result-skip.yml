name: TEMP remove redundant result skip
on:
  push:
    branches:
      - polish/independent-feel-correction-r1
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/independent-feel-correction-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Remove redundant branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game/scenes/OpeningScene.ts')
          t=p.read_text()
          block='''\n    // The pre-ready result panel explicitly says "Tap to speed up". Keep that\n    // promise true here as well as during reveal/banking, while preventing the\n    // same physical gesture from becoming an immediate collect on pointerup.\n    if (this.phase === 'result' && !this.resultReady) {\n      if (this.requestPresentationFastForward()) {\n        this.ignoreNextResultTap = true;\n        getGameAudio().play('ui-skip');\n      }\n      return;\n    }\n'''
          if t.count(block) != 1:
              raise SystemExit(f'expected redundant block once, got {t.count(block)}')
          p.write_text(t.replace(block, '\n', 1))
          PY
          git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit clean fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-remove-redundant-result-skip.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove redundant result skip branch'
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' src/game/data/presentation.ts src/game/scenes/OpeningScene.ts tests/presentation.test.ts | sort)"
          test "$changed" = "$expected"
          git push origin HEAD:polish/independent-feel-correction-r1
