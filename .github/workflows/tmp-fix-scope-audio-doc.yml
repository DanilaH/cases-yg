name: Temporary scope audio docs fix

on:
  push:
    branches:
      - docs/sync-post-result-feel-polish-v2
    paths:
      - .github/tmp-fix-scope-audio-doc.py
      - .github/workflows/tmp-fix-scope-audio-doc.yml

permissions:
  contents: write

jobs:
  fix-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python .github/tmp-fix-scope-audio-doc.py
      - name: Locate stale cue wording
        shell: bash
        run: |
          set -euo pipefail
          grep -nF '`chips-collect`' README.md docs/ASSET_MANIFEST.md docs/DECISIONS.md docs/GAMEPLAY_SYSTEMS.md docs/IMPLEMENTATION_ROADMAP.md docs/OPENING_FEEL_CORRECTION_SCOPE.md docs/OPEN_QUESTIONS.md docs/PROBE_VALIDATION.md docs/PRODUCT.md || true
      - name: Assert canonical docs consistency
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          files = [
              'README.md',
              'docs/ASSET_MANIFEST.md',
              'docs/DECISIONS.md',
              'docs/GAMEPLAY_SYSTEMS.md',
              'docs/IMPLEMENTATION_ROADMAP.md',
              'docs/OPENING_FEEL_CORRECTION_SCOPE.md',
              'docs/OPEN_QUESTIONS.md',
              'docs/PROBE_VALIDATION.md',
              'docs/PRODUCT.md',
          ]
          text = '\n'.join(Path(path).read_text(encoding='utf-8') for path in files)
          stale = [
              '`chips-collect`', '91 unit tests', '91-test',
              'current product gate is the second 20–30 opening hands-on',
              'second **20–30 opening hands-on**',
              'second 20–30 opening hands-on on the merged corrected build',
              'after the second corrected hands-on',
              'Phase 2.3 acceptance',
              'next external gate after second hands-on acceptance',
          ]
          found = [token for token in stale if token in text]
          if found:
              raise SystemExit(f'stale current-state wording remains: {found}')
          roadmap = Path('docs/IMPLEMENTATION_ROADMAP.md').read_text(encoding='utf-8')
          assert roadmap.count('# Phase 0 — established opener baseline — COMPLETE') == 1
          assert roadmap.count('# Deferred information pass — NOT PART OF 2.1') == 1
          assert roadmap.count('# Phase 2.5 — final hands-on acceptance — CURRENT REQUIRED GATE') == 1
          probe = Path('docs/PROBE_VALIDATION.md').read_text(encoding='utf-8')
          assert probe.count('Canonical correction scope: `OPENING_FEEL_CORRECTION_SCOPE.md`.') == 1
          assets = Path('docs/ASSET_MANIFEST.md').read_text(encoding='utf-8')
          assert assets.count('# 5. Current Lite V2 UI/economy visuals — INTEGRATED') == 1
          decisions = Path('docs/DECISIONS.md').read_text(encoding='utf-8')
          assert '| Final hands-on acceptance | OPEN | **current product gate**' in decisions
          assert '`chip-clack`' in decisions and '`pouch-grab`' in decisions
          readme = Path('README.md').read_text(encoding='utf-8')
          assert '108-test current suite' in readme
          assert 'final hands-on acceptance' in readme
          print('canonical docs consistency PASS')
          PY
      - name: Commit canonical audio wording sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add docs/OPENING_FEEL_CORRECTION_SCOPE.md docs/PROBE_VALIDATION.md
          git commit -m 'Align canonical audio wording'
          git push origin HEAD:docs/sync-post-result-feel-polish-v2
