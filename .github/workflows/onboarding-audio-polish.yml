name: Validate onboarding audio polish

on:
  push:
    branches:
      - onboarding-recovery-hardening
    paths:
      - .github/workflows/onboarding-audio-polish.yml

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: onboarding-recovery-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply semantic arrival and landing cues
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def patch(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          patch(
              'src/game/data/audioAssets.ts',
              "  'pouch-select',\n  'pouch-grab',",
              "  'pouch-select',\n  'pouch-arrival',\n  'pouch-land',\n  'pouch-grab',",
          )
          patch(
              'src/game/data/audioAssets.ts',
              "  'pouch-select': 'assets/audio/pouch-select.mp3',\n  'pouch-grab': 'assets/audio/pouch-grab.mp3',",
              "  'pouch-select': 'assets/audio/pouch-select.mp3',\n  'pouch-arrival': 'assets/audio/pouch-arrival.mp3',\n  'pouch-land': 'assets/audio/pouch-land.mp3',\n  'pouch-grab': 'assets/audio/pouch-grab.mp3',",
          )

          patch(
              'src/game/systems/audio.ts',
              "  'pouch-select': [\n    { frequency: 520, endFrequency: 720, duration: 0.055, type: 'triangle', gain: 0.026 },\n    { frequency: 920, endFrequency: 1080, duration: 0.045, type: 'sine', gain: 0.018, delay: 0.035 },\n  ],\n  // `pouch-grab` is generated by schedulePouchGrab for a short plastic zip/pop transient.",
              "  'pouch-select': [\n    { frequency: 520, endFrequency: 720, duration: 0.055, type: 'triangle', gain: 0.026 },\n    { frequency: 920, endFrequency: 1080, duration: 0.045, type: 'sine', gain: 0.018, delay: 0.035 },\n  ],\n  'pouch-arrival': [\n    { frequency: 430, endFrequency: 190, duration: 0.22, type: 'sine', gain: 0.018 },\n    { frequency: 760, endFrequency: 320, duration: 0.16, type: 'triangle', gain: 0.009, delay: 0.03 },\n  ],\n  'pouch-land': [\n    { frequency: 135, endFrequency: 82, duration: 0.09, type: 'sine', gain: 0.035 },\n    { frequency: 620, endFrequency: 240, duration: 0.055, type: 'triangle', gain: 0.017, delay: 0.01 },\n  ],\n  // `pouch-grab` is generated by schedulePouchGrab for a short plastic zip/pop transient.",
          )

          patch(
              'src/game/data/audioPresentation.ts',
              "    case 'pouch-grab':\n      return {\n        clearPersistent: true,\n        duck: { multiplier: 0.8, attackMs: 18, holdMs: 70, releaseMs: 180 },\n      };",
              "    case 'pouch-land':\n      return {\n        duck: { multiplier: 0.78, attackMs: 8, holdMs: 55, releaseMs: 150 },\n      };\n    case 'pouch-grab':\n      return {\n        clearPersistent: true,\n        duck: { multiplier: 0.8, attackMs: 18, holdMs: 70, releaseMs: 180 },\n      };",
          )

          patch(
              'src/game/scenes/FirstRunScene.ts',
              "    audio.primeDragTexture();\n\n    await Promise.all([",
              "    audio.primeDragTexture();\n    audio.play('pouch-arrival');\n\n    await Promise.all([",
          )
          patch(
              'src/game/scenes/FirstRunScene.ts',
              "    audio.setDragTexture(0.58, 0.72);\n    audio.play('pouch-grab');",
              "    audio.setDragTexture(0.58, 0.72);\n    audio.play('pouch-land');",
          )

          patch(
              'docs/ONBOARDING.md',
              "Merged implementation: PR #149, squash commit `2f2a0dcad60e61896394c5f8ca831b374f5884ce`.",
              "Base directed-onboarding implementation: PR #149, squash commit `2f2a0dcad60e61896394c5f8ca831b374f5884ce`. Recovery/lifecycle hardening is tracked in PR #155.",
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Asset self-test
        run: npm run assets:selftest

      - name: Asset validation
        run: npm run assets:validate

      - name: Production build
        run: npm run build

      - name: Commit validated polish
        run: |
          rm .github/workflows/onboarding-audio-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add dedicated first-run arrival and landing cues"
          git push origin HEAD:onboarding-recovery-hardening
