name: Pre-hands-on visual cleanup

on:
  push:
    branches:
      - fix/pre-hands-on-visual-cleanup
    paths:
      - .github/workflows/pre-hands-on-visual-cleanup.yml
      - .github/scripts/pre-hands-on-visual-cleanup.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pre-hands-on-visual-cleanup
          fetch-depth: 0
      - name: Apply reviewed visual cleanup
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pre-hands-on-visual-cleanup.py
          rm .github/scripts/pre-hands-on-visual-cleanup.py
          rm .github/workflows/pre-hands-on-visual-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix pre-hands-on visual review findings'
          git push origin HEAD:fix/pre-hands-on-visual-cleanup
