name: Refine pouch selector hitbox

on:
  push:
    branches:
      - fix/pouch-selector-hitbox
    paths:
      - .github/workflows/refine-pouch-selector-hitbox.yml
      - .github/scripts/refine-pouch-selector-hitbox.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pouch-selector-hitbox
          fetch-depth: 0
      - name: Apply explicit Container hit area
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/refine-pouch-selector-hitbox.py
          rm .github/scripts/refine-pouch-selector-hitbox.py
          rm .github/workflows/refine-pouch-selector-hitbox.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use explicit pouch selector hit rectangles'
          git push origin HEAD:fix/pouch-selector-hitbox
