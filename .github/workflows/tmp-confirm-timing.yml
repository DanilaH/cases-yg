name: TEMP confirm opening timing
on:
  push:
    branches: [polish/independent-feel-correction-r1]
    paths: [.github/workflows/tmp-confirm-timing.yml]
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/independent-feel-correction-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Expose audit handles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.ts'); t=p.read_text(); anchor='  game.sound.mute = blocked;\n'
          injection='''  if (import.meta.env.DEV) {\n    const auditWindow = window as typeof window & { __auditGame?: Phaser.Game; __auditAudio?: unknown };\n    auditWindow.__auditGame = game;\n    auditWindow.__auditAudio = audio;\n  }\n'''
          if anchor not in t: raise SystemExit('audit anchor missing')
          p.write_text(t.replace(anchor, anchor + injection, 1))
          PY
      - name: Confirm timing stability
        run: |
          cat >/tmp/confirm-timing.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:720}});
          const errors=[]; page.on('pageerror',e=>errors.push(e.message)); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:5173/?debug=1&platform=mock');
          await page.waitForFunction(()=>window.__auditGame?.scene?.getScene?.('OpeningScene')?.phase==='idle',null,{timeout:15000});
          const hide=page.getByRole('button',{name:'Hide',exact:true}); if(await hide.isVisible().catch(()=>false)) await hide.click();
          const prep=async scenario=>page.evaluate(async name=>{
            const {getPlatformRuntime}=await import('/src/app/runtime.ts');
            const {SaveRepository}=await import('/src/game/systems/save.ts');
            const {resetDebugSave,stageDebugReveal}=await import('/src/debug/debugScenarios.ts');
            const s=window.__auditGame.scene.getScene('OpeningScene'); const repo=new SaveRepository(getPlatformRuntime().storage);
            await resetDebugSave(repo); await stageDebugReveal(repo,name); const st=await s.session.load();
            s.saveState=st; s.selectedPouchType=st.pendingReveal?.pouchType??'basic'; s.lastReveal=st.pendingReveal; s.resultReady=false; s.phase='idle'; s.renderIdle(); if(s.pouch)s.pouch.tab.setX(s.pouch.tabEndX);
          },scenario);
          const run=async scenario=>{await prep(scenario); const t0=performance.now(); await page.evaluate(()=>{const s=window.__auditGame.scene.getScene('OpeningScene'); const p=s.session.getPendingReveal(); s.phase='revealing'; s.lastReveal=p; return s.playReveal(p,false)}); const t1=performance.now(); const ready=await page.evaluate(()=>window.__auditGame.scene.getScene('OpeningScene').resultReady); await page.evaluate(()=>window.__auditGame.scene.getScene('OpeningScene').continueFromResult()); await page.waitForFunction(()=>window.__auditGame.scene.getScene('OpeningScene').phase==='idle',null,{timeout:12000}); return {scenario,revealToReadyMs:Math.round(t1-t0),ready};};
          const runs=[]; for(const s of ['common','rare','common','epic','common']) runs.push(await run(s));
          console.log(JSON.stringify({runs,errors},null,2));
          await browser.close(); if(errors.length) process.exitCode=1;
          JS
          npm run dev -- --host 127.0.0.1 >/tmp/vite-confirm.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          node /tmp/confirm-timing.mjs
      - name: Clean temporary workflow
        if: always()
        run: |
          git checkout -- src/main.ts package.json package-lock.json || true
          rm -f .github/workflows/tmp-confirm-timing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary timing confirmation'
            git push origin HEAD:polish/independent-feel-correction-r1
          fi
