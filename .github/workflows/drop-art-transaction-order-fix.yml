name: Validate Drop art transaction ordering

on:
  push:
    branches:
      - content/load-drop-art

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[drop-art-transaction-order-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python3 tools/drop-art-transaction-order-fix.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit transaction ordering fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/scenes/OpeningScene.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[drop-art-transaction-order-fix] serialize preload and Drop persistence'
          git push origin HEAD:content/load-drop-art
