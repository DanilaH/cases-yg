name: Materialize runtime AVIF candidate

# Temporary branch-only materializer. Remove before the production PR merges.
on:
  push:
    branches:
      - perf/runtime-avif-fallback
    paths:
      - tools/perf/apply-runtime-avif-rollout.mjs
      - tests/startup-asset-staging.test.ts
      - .github/workflows/materialize-runtime-avif-candidate.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - name: Apply rollout patch
        run: node tools/perf/apply-runtime-avif-rollout.mjs
      - name: Build AVIF companions
        run: npm run assets:avif:build
      - name: Validate candidate
        run: |
          npm run assets:avif:validate
          npm run typecheck
          npm test
          npm run build
      - name: Commit generated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts public/assets
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "perf: materialize runtime AVIF q70"
          git push origin HEAD:${GITHUB_REF_NAME}
