name: Integrate Flip Phone Assets

on:
  pull_request:
    branches:
      - main
    paths:
      - '.asset-upload/final/READY'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Reassemble final runtime payload
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-upload/final/part-*.b64 \
            | tr -d '\r\n\t ' \
            | base64 --decode > /tmp/flip-phone-runtime-final.tar.gz
          echo '2fb481965d97308aa3fde2ae160157128eda54aacbf9b2bb380da0b31139942d  /tmp/flip-phone-runtime-final.tar.gz' | sha256sum -c -
          mkdir -p public/assets/collectibles
          tar -xzf /tmp/flip-phone-runtime-final.tar.gz -C public/assets/collectibles
          ls -lh public/assets/collectibles/flip-phone-*.webp
      - run: npm ci
      - name: Validate final Flip Phone family
        run: npm run assets:validate -- --family flip-phone --require-all
      - name: Enable reviewed runtime art
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/data/artAssets.ts')
          text = path.read_text()
          old = 'export const AVAILABLE_COLLECTIBLE_ART_IDS = new Set<string>();'
          new = '''export const AVAILABLE_COLLECTIBLE_ART_IDS = new Set<string>([
            'flip-phone-common',
            'flip-phone-rare',
            'flip-phone-epic',
            'flip-phone-legendary',
            'flip-phone-secret-noir',
          ]);'''
          if old not in text:
              raise SystemExit('Expected empty collectible-art allowlist was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit final runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .asset-upload
          git rm .github/workflows/recover-flip-phone-assets.yml
          git add public/assets/collectibles/flip-phone-*.webp src/game/data/artAssets.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add final Flip Phone collectible family'
          git push origin HEAD:${{ github.head_ref }}
