name: Fix authored Drop pouch integration workflow

on:
  push:
    branches:
      - content/authored-drop-pouch-skins-v2
    paths:
      - .github/workflows/fix-authored-drop-pouch-integration.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: content/authored-drop-pouch-skins-v2
          fetch-depth: 0

      - name: Make AVAILABLE_STATIC_ART_IDS patch scoped
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/integrate-authored-drop-pouches.yml')
          text = path.read_text()
          old = '''          text = replace_once(
              text,
              "  'charged-pouch-star-tab',\\n  'opening-bg'",
              "  'charged-pouch-star-tab',\\n" + '\\n'.join(available_lines) + "\\n  'opening-bg'",
              'AVAILABLE_STATIC_ART_IDS expansion',
          )'''
          new = '''          available_start = text.index('export const AVAILABLE_STATIC_ART_IDS')
          available_end = text.index(']);', available_start)
          available_block = text[available_start:available_end]
          available_block = replace_once(
              available_block,
              "  'charged-pouch-star-tab',\\n  'opening-bg'",
              "  'charged-pouch-star-tab',\\n" + '\\n'.join(available_lines) + "\\n  'opening-bg'",
              'AVAILABLE_STATIC_ART_IDS expansion',
          )
          text = text[:available_start] + available_block + text[available_end:]'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one workflow patch target, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

      - name: Commit workflow fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-authored-drop-pouch-integration.yml
          git add .github/workflows/integrate-authored-drop-pouches.yml
          git commit -m 'Fix Drop pouch integration patch scope'
          git push origin HEAD:content/authored-drop-pouch-skins-v2
