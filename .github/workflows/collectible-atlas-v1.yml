name: Collectible atlas benchmark

on:
  push:
    branches:
      - experiment/collectible-atlas-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Benchmark batch atlases
        run: node tools/assets/benchmark-collectible-atlas-v1.mjs

      - name: Benchmark global multi-atlas
        run: node tools/assets/benchmark-collectible-atlas-v2.mjs

      - name: Show summaries
        run: |
          cat .asset-build/collectible-atlas-v1/summary.md
          cat .asset-build/collectible-atlas-v2/summary.md

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: collectible-atlas-benchmark
          path: |
            .asset-build/collectible-atlas-v1/report.json
            .asset-build/collectible-atlas-v1/summary.md
            .asset-build/collectible-atlas-v2/report.json
            .asset-build/collectible-atlas-v2/summary.md
            .asset-build/collectible-atlas-v2/*.webp
            .asset-build/collectible-atlas-v2/*.json

      - name: Project gate
        run: |
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
