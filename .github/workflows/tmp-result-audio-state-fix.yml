name: TEMP result audio state fix

on:
  push:
    branches:
      - "fix/result-audio-state-lifecycle"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/result-audio-state-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply result-state ownership patch
        run: echo '' | base64 -d | python
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit clean correction
        run: |
          rm .github/workflows/tmp-result-audio-state-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix result ambience ownership"
          git push origin HEAD:fix/result-audio-state-lifecycle
