name: Apply Drop UI integration

on:
  push:
    branches:
      - content/add-drop-ui

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[drop-ui-pass]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply Drop UI pass
        run: python3 tools/run-drop-ui-pass.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Asset checks
        run: |
          npm run assets:selftest
          npm run assets:validate
      - name: Build
        run: npm run build
      - name: Commit Drop UI pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m '[drop-ui-pass] add Drop selection and collection navigation'
          git push origin HEAD:content/add-drop-ui
