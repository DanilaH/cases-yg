name: Temporary Signal 2000 promo capture

on:
  push:
    branches:
      - capture/signal-2000-promo-ru-en-20260917
    paths:
      - .github/workflows/temporary-promo-capture.yml
      - scripts/temporary-promo-capture.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare isolated deterministic capture and 540p native recorder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          random_path = Path('src/game/systems/random.ts')
          source = random_path.read_text()
          original = '    return Math.random();'
          replacement = '''    if (import.meta.env.VITE_CAPTURE_REWARD === 'true') {
            const mode = window.sessionStorage.getItem('signal.capture.reward');
            const sequences: Record<string, readonly number[]> = {
              legendary: [0.1, 0.99, 0, 0, 0.99],
              'hidden-pocket': [0.1, 0.1, 0, 0.1],
            };
            const sequence = mode ? sequences[mode] : undefined;
            if (sequence) {
              const index = Number(window.sessionStorage.getItem('signal.capture.random-index') ?? '0');
              window.sessionStorage.setItem('signal.capture.random-index', String(index + 1));
              return sequence[index] ?? (mode === 'hidden-pocket' ? 0 : 0.99);
            }
          }
          return Math.random();'''
          assert source.count(original) == 1
          random_path.write_text(source.replace(original, replacement))
          balance_path = Path('src/game/data/balance.ts')
          balance_source = balance_path.read_text()
          assert balance_source.count('hiddenPocketChance: 0.015,') == 1
          balance_path.write_text(balance_source.replace('hiddenPocketChance: 0.015,', 'hiddenPocketChance: 1,'))
          script_path = Path('scripts/temporary-promo-capture.py')
          script = script_path.read_text()
          def replace_once(old, new):
              global script
              assert script.count(old) == 1, f'Expected one occurrence: {old}'
              script = script.replace(old, new)
          replace_once("context.add_init_script('''(lang) => {", "context.add_init_script(\"(\" + '''(lang) => {")
          replace_once("}''', lang)", "}''' + \")(\" + json.dumps(lang) + \")\")")
          replace_once("SCENARIOS = [('epic-phone', 7.8), ('legendary', 8.4), ('hidden-pocket', 10.0)]", "SCENARIOS = [('hidden-pocket', 43.0), ('legendary', 18.0)]")
          replace_once("viewport={'width': 1920, 'height': 1080}", "viewport={'width': 960, 'height': 540}")
          replace_once("'-framerate', '30'", "'-framerate', '60'")
          replace_once("'-video_size', '1920x1080'", "'-video_size', '960x540'")
          replace_once("':99.0+0,0'", "':99.0+0,74'")
          replace_once("'-r', '30'", "'-r', '60'")
          replace_once("'--window-size=1920,1080'", "'--window-size=960,614'")
          replace_once("page.mouse.move(716, 253)", "page.mouse.move(358, 127)")
          replace_once("for i in range(1, 43):", "for i in range(1, 13):")
          replace_once("page.mouse.move(716 + 495 * i / 42, 253 + (i % 4 == 0) * 2)", "page.mouse.move(358 + 248 * i / 12, 127 + (i % 4 == 0) * 2)")
          replace_once("            page.screenshot(path=str(folder / f'{scenario}-before.png'))", "            if scenario == 'legendary': page.mouse.click(92, 233); page.wait_for_timeout(2200)\n            page.screenshot(path=str(folder / f'{scenario}-before.png'))")
          replace_once("stream['width'] == 1920", "stream['width'] == 960")
          replace_once("and stream['height'] == 1080 for stream in info['streams']", "and stream['height'] == 540 for stream in info['streams']")
          replace_once("assert float(info['format']['duration']) >= 25, info", "assert float(info['format']['duration']) >= 50, info")
          replace_once("    with log_path.open('w') as log:", "    page.evaluate(\"\"\"() => { window.__captureRafs = []; const start = performance.now(); const tick = t => { if (t - start < 12000) { window.__captureRafs.push(t); requestAnimationFrame(tick); } }; requestAnimationFrame(tick); }\"\"\")\n    with log_path.open('w') as log:")
          replace_once("    assert proc.returncode == 0, f'ffmpeg exited {proc.returncode}: {log_path.read_text()}'", "    print('RAF_MEASURE', scenario, page.evaluate(\"\"\"() => { const t = window.__captureRafs || []; return {total:t.length, perSecond:Array.from({length:12}, (_,i) => t.filter(v => v>=t[0]+i*1000 && v<t[0]+(i+1)*1000).length)}; }\"\"\"), flush=True)\n    assert proc.returncode == 0, f'ffmpeg exited {proc.returncode}: {log_path.read_text()}'")
          script_path.write_text(script)
          PY
          python3 -m py_compile scripts/temporary-promo-capture.py
          VITE_PLATFORM_RUNTIME=mock VITE_DEBUG_PANEL=true VITE_CAPTURE_REWARD=true npm run build
      - name: Install recorder and Chromium
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb pulseaudio ffmpeg x11-utils
          python3 -m venv /tmp/signal-capture-venv
          /tmp/signal-capture-venv/bin/pip install playwright==1.55.0
          /tmp/signal-capture-venv/bin/python -m playwright install --with-deps chromium
      - name: Record both locales at native 540p and measure real animation cadence
        shell: bash
        env:
          SOURCE_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 960x720x24 -ac -nolisten tcp >/tmp/promo-xvfb.log 2>&1 &
          sleep 2
          xdpyinfo -display :99 >/dev/null
          pulseaudio --start --exit-idle-time=-1 || true
          sleep 2
          pactl load-module module-null-sink sink_name=promo sink_properties=device.description=promo
          pactl set-default-sink promo
          export PULSE_SINK=promo
          python3 -m http.server 8765 --directory dist >/tmp/promo-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/ >/dev/null
          /tmp/signal-capture-venv/bin/python scripts/temporary-promo-capture.py
          for f in promo-output/signal-2000-promo-ru.mp4 promo-output/signal-2000-promo-en.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate,nb_frames,width,height -of default=noprint_wrappers=1 "$f"
            ffmpeg -hide_banner -loglevel info -i "$f" -vf mpdecimate -an -f null - 2>&1 | tr '\r' '\n' | grep '^frame=' | tail -1
          done
      - name: Upload raw video and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-2000-promo-540p-${{ github.run_id }}
          path: promo-output/
          retention-days: 5
          if-no-files-found: warn
