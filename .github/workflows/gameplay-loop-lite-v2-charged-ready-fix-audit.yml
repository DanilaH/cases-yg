name: Gameplay Loop Lite V2 Charged-ready Fix Audit

on:
  push:
    branches:
      - audit/gameplay-loop-lite-v2-charged-ready-fix
    paths:
      - .github/workflows/gameplay-loop-lite-v2-charged-ready-fix-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assert product tree matches correction revision
        run: |
          set -euo pipefail
          PRODUCT_HEAD=d7a824f7f55ae42461662c0789471509c1215b90
          git cat-file -e "$PRODUCT_HEAD^{commit}"
          unexpected="$(git diff --name-only "$PRODUCT_HEAD"...HEAD | grep -Ev '^\.github/workflows/gameplay-loop-lite-v2-charged-ready-fix-audit\.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Audit branch changes product files:"
            echo "$unexpected"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Prepare exact audit driver
        run: |
          set -euo pipefail
          git fetch origin audit/gameplay-loop-lite-v2-final-merged
          mkdir -p .github/scripts
          git show origin/audit/gameplay-loop-lite-v2-final-merged:.github/scripts/gameplay-loop-lite-v2-final-merged-audit.mjs > .github/scripts/final-audit-runtime.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/final-audit-runtime.mjs')
          text = path.read_text()
          text = text.replace(
              "const PRODUCT_HEAD = '1626f7954edfc715ff54f4b50060ff9eec68a3c4';",
              "const PRODUCT_HEAD = 'd7a824f7f55ae42461662c0789471509c1215b90';",
          )
          path.write_text(text)
          PY
      - name: Install Playwright driver and video helper
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-pack node_modules/playwright node_modules/playwright-core
          npm pack playwright@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pw-name.txt
          npm pack playwright-core@1.55.0 --pack-destination /tmp/pw-pack >/tmp/pwc-name.txt
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pw-name.txt)" --strip-components=1 -C node_modules/playwright
          tar -xzf "/tmp/pw-pack/$(cat /tmp/pwc-name.txt)" --strip-components=1 -C node_modules/playwright-core
          node node_modules/playwright/cli.js install ffmpeg
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Run full exact-revision browser audit
        run: node .github/scripts/final-audit-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-loop-lite-v2-charged-ready-fix-audit
          path: /tmp/gameplay-loop-lite-v2-final-merged-audit
          if-no-files-found: error
          retention-days: 3
