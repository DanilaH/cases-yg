name: Analytics ordering fix

on:
  push:
    branches:
      - analytics/final-event-pass

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: analytics/final-event-pass
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tools/analytics-order-fix-temp.mjs
      - run: |
          npm run typecheck
          npx vitest run tests/analytics.test.ts
      - name: Remove temporary fixer and commit production diff
        shell: bash
        run: |
          rm -f tools/analytics-order-fix-temp.mjs .github/workflows/analytics-order-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix first-opening analytics event order"
          git push origin HEAD:analytics/final-event-pass
