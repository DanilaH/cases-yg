name: Prepare expanded content assets

on:
  push:
    branches:
      - content/prepare-expanded-assets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: content/prepare-expanded-assets
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - run: npm ci

      - name: Map committed intake files to semantic raw slots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            assets-src/raw/webcam \
            assets-src/raw/home-console \
            assets-src/raw/cassette-player \
            assets-src/raw/crt-tv \
            assets-src/raw/mini-camcorder \
            assets-src/raw/pda \
            assets-src/raw/portable-disc-player \
            assets-src/raw/handheld-console \
            assets-src/raw/mp3-player \
            assets-src/raw/pager

          cp "biba/ChatGPT Image Sep 10, 2026, 11_35_43 AM (1).png" assets-src/raw/webcam/common.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_35_43 AM (3).png" assets-src/raw/webcam/rare.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_35_43 AM (4).png" assets-src/raw/webcam/epic.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_35_43 AM (2).png" assets-src/raw/webcam/legendary.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_35_43 AM (5).png" assets-src/raw/webcam/secret-stereo.png

          cp "biba/ChatGPT Image Sep 10, 2026, 11_36_32 AM.png" assets-src/raw/home-console/common.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_36_36 AM.png" assets-src/raw/home-console/rare.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_36_39 AM.png" assets-src/raw/home-console/epic.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_36_41 AM.png" assets-src/raw/home-console/legendary.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_36_19 AM.png" assets-src/raw/home-console/secret-noir.png

          cp "biba/ChatGPT Image Sep 10, 2026, 11_37_12 AM (1).png" assets-src/raw/cassette-player/common.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_37_12 AM (2).png" assets-src/raw/cassette-player/rare.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_37_13 AM (5).png" assets-src/raw/cassette-player/epic.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_37_12 AM (3).png" assets-src/raw/cassette-player/legendary.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_37_13 AM (4).png" assets-src/raw/cassette-player/secret-remote.png

          cp "biba/ChatGPT Image Sep 10, 2026, 11_37_54 AM (1).png" assets-src/raw/crt-tv/common.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_37_54 AM (2).png" assets-src/raw/crt-tv/rare.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_37_54 AM (3).png" assets-src/raw/crt-tv/epic.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_37_54 AM (4).png" assets-src/raw/crt-tv/legendary.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_37_54 AM (5).png" assets-src/raw/crt-tv/secret-communicator.png

          cp "biba/ChatGPT Image Sep 10, 2026, 11_38_31 AM (1).png" assets-src/raw/mini-camcorder/common.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_38_31 AM (2).png" assets-src/raw/mini-camcorder/rare.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_38_32 AM (3).png" assets-src/raw/mini-camcorder/epic.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_38_32 AM (4).png" assets-src/raw/mini-camcorder/legendary.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_38_32 AM (5).png" assets-src/raw/mini-camcorder/secret-prototype.png

          cp "biba/ChatGPT Image Sep 10, 2026, 11_39_30 AM (1).png" assets-src/raw/pda/common.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_39_30 AM (2).png" assets-src/raw/pda/rare.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_39_30 AM (3).png" assets-src/raw/pda/epic.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_39_30 AM (4).png" assets-src/raw/pda/legendary.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_39_30 AM (5).png" assets-src/raw/pda/secret-flip.png

          cp "biba/ChatGPT Image Sep 10, 2026, 11_42_33 AM (1).png" assets-src/raw/portable-disc-player/common.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_42_33 AM (2).png" assets-src/raw/portable-disc-player/rare.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_42_33 AM (3).png" assets-src/raw/portable-disc-player/epic.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_42_33 AM (5).png" assets-src/raw/portable-disc-player/legendary.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_42_33 AM (4).png" assets-src/raw/portable-disc-player/secret-remote.png

          cp "biba/ChatGPT Image Sep 10, 2026, 11_43_04 AM (1).png" assets-src/raw/handheld-console/common.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_43_04 AM (3).png" assets-src/raw/handheld-console/rare.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_46_34 AM.png" assets-src/raw/handheld-console/epic.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_43_04 AM (4).png" assets-src/raw/handheld-console/legendary.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_43_04 AM (2).png" assets-src/raw/handheld-console/secret-phone.png

          cp "biba/ChatGPT Image Sep 10, 2026, 11_44_15 AM.png" assets-src/raw/mp3-player/common.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_44_12 AM.png" assets-src/raw/mp3-player/rare.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_44_09 AM.png" assets-src/raw/mp3-player/epic.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_45_08 AM.png" assets-src/raw/mp3-player/legendary.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_43_31 AM.png" assets-src/raw/mp3-player/secret-pearl.png

          cp "biba/ChatGPT Image Sep 10, 2026, 11_47_45 AM (1).png" assets-src/raw/pager/common.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_47_45 AM (2).png" assets-src/raw/pager/rare.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_47_46 AM (3).png" assets-src/raw/pager/epic.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_47_46 AM (4).png" assets-src/raw/pager/legendary.png
          cp "biba/ChatGPT Image Sep 10, 2026, 11_47_46 AM (5).png" assets-src/raw/pager/secret-flip.png

      - name: Expand collectible manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const path = 'assets-src/collectibles.manifest.json';
          const manifest = JSON.parse(await fs.readFile(path, 'utf8'));
          const families = {
            webcam: ['common', 'rare', 'epic', 'legendary', 'secret-stereo'],
            'home-console': ['common', 'rare', 'epic', 'legendary', 'secret-noir'],
            'cassette-player': ['common', 'rare', 'epic', 'legendary', 'secret-remote'],
            'crt-tv': ['common', 'rare', 'epic', 'legendary', 'secret-communicator'],
            'mini-camcorder': ['common', 'rare', 'epic', 'legendary', 'secret-prototype'],
            pda: ['common', 'rare', 'epic', 'legendary', 'secret-flip'],
            'portable-disc-player': ['common', 'rare', 'epic', 'legendary', 'secret-remote'],
            'handheld-console': ['common', 'rare', 'epic', 'legendary', 'secret-phone'],
            'mp3-player': ['common', 'rare', 'epic', 'legendary', 'secret-pearl'],
            pager: ['common', 'rare', 'epic', 'legendary', 'secret-flip'],
          };
          const replaceFamilies = new Set(Object.keys(families));
          manifest.assets = manifest.assets.filter((entry) => !replaceFamilies.has(entry.family));
          for (const [family, slots] of Object.entries(families)) {
            for (const slot of slots) {
              const id = `${family}-${slot}`;
              manifest.assets.push({
                id,
                family,
                source: `assets-src/raw/${family}/${slot}.png`,
                output: `public/assets/collectibles/${id}.webp`,
              });
            }
          }
          if (manifest.assets.length !== 60) {
            throw new Error(`Expected 60 manifest entries, got ${manifest.assets.length}`);
          }
          await fs.writeFile(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Prepare all ten new collectible families
        shell: bash
        run: |
          set -euo pipefail
          for family in \
            webcam \
            home-console \
            cassette-player \
            crt-tv \
            mini-camcorder \
            pda \
            portable-disc-player \
            handheld-console \
            mp3-player \
            pager
          do
            npm run assets:prepare -- --family "$family" --require-all
          done

      - name: Prepare authored Charged Pouch parts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import sharp from 'sharp';

          const source = {
            body: 'biba/ChatGPT Image Sep 10, 2026, 11_33_18 AM (1).png',
            star: 'biba/ChatGPT Image Sep 10, 2026, 11_33_18 AM (2).png',
            strip: 'biba/ChatGPT Image Sep 10, 2026, 11_33_19 AM (3).png',
          };
          const outputDir = 'public/assets/package';
          await fs.mkdir(outputDir, { recursive: true });

          const trim = async (input) =>
            sharp(input)
              .trim({ background: { r: 0, g: 0, b: 0, alpha: 0 }, threshold: 8 })
              .png()
              .toBuffer();

          const encodeCanvas = async ({ input, width, height, canvas, left, top, output }) => {
            const trimmed = await trim(input);
            const resized = await sharp(trimmed)
              .resize({ width, height, fit: 'fill' })
              .png()
              .toBuffer();
            await sharp({
              create: {
                width: canvas.width,
                height: canvas.height,
                channels: 4,
                background: { r: 0, g: 0, b: 0, alpha: 0 },
              },
            })
              .composite([{ input: resized, left, top }])
              .webp({ quality: 90, alphaQuality: 100, effort: 6, smartSubsample: true })
              .toFile(output);
          };

          await encodeCanvas({
            input: source.body,
            width: 923,
            height: 959,
            canvas: { width: 1024, height: 1024 },
            left: 68,
            top: 28,
            output: path.join(outputDir, 'charged-pouch-body.webp'),
          });
          await encodeCanvas({
            input: source.star,
            width: 271,
            height: 259,
            canvas: { width: 1024, height: 1024 },
            left: 33,
            top: 15,
            output: path.join(outputDir, 'charged-pouch-star-tab.webp'),
          });

          const strip = await trim(source.strip);
          await sharp(strip)
            .resize({ width: 984, height: 235, fit: 'fill' })
            .webp({ quality: 90, alphaQuality: 100, effort: 6, smartSubsample: true })
            .toFile(path.join(outputDir, 'charged-pouch-tear-strip-compact.webp'));

          const expectations = [
            ['charged-pouch-body.webp', 1024, 1024],
            ['charged-pouch-star-tab.webp', 1024, 1024],
            ['charged-pouch-tear-strip-compact.webp', 984, 235],
          ];
          for (const [name, width, height] of expectations) {
            const metadata = await sharp(path.join(outputDir, name)).metadata();
            if (
              metadata.format !== 'webp' ||
              metadata.width !== width ||
              metadata.height !== height ||
              !metadata.hasAlpha
            ) {
              throw new Error(`Invalid Charged Pouch output ${name}: ${JSON.stringify(metadata)}`);
            }
          }
          NODE

      - name: Validate prepared collectible outputs
        run: npm run assets:validate

      - name: Promote reviewed outputs and remove intake staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r biba
          git add \
            assets-src/collectibles.manifest.json \
            public/assets/collectibles \
            public/assets/package/charged-pouch-body.webp \
            public/assets/package/charged-pouch-star-tab.webp \
            public/assets/package/charged-pouch-tear-strip-compact.webp

          echo "Prepared collectible count:"
          find public/assets/collectibles -maxdepth 1 -type f -name '*.webp' | wc -l
          git status --short

          git commit -m "Prepare expanded collectible assets"
          git push origin HEAD:content/prepare-expanded-assets
