name: Validate final doc consistency

on:
  push:
    branches:
      - release/yandex-draft-readiness

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[final-doc-consistency]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python3 tools/final-doc-consistency-patch.py
      - name: Assert stale current-state assumptions are gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'current two-family development build' docs/YANDEX_SUBMISSION_CHECKLIST.md
          ! grep -q 'current small catalog' docs/YANDEX_SUBMISSION_CHECKLIST.md
          ! grep -q 'current two-family catalog' docs/YANDEX_SUBMISSION_CHECKLIST.md
          ! grep -q 'current work is Phase 2.6' docs/PRODUCT.md
          ! grep -q 'One final direct repeated-use regression remains' docs/PRODUCT.md
          ! grep -q 'later content-scale evidence may reopen them' docs/PRODUCT.md
          ! grep -q 'Player-facing Drop selector waits for Drop #2' docs/PRODUCT.md
          grep -q 'real hosted Yandex DRAFT' docs/PRODUCT.md
          grep -q 'expanded six-Drop public-release candidate' docs/YANDEX_SUBMISSION_CHECKLIST.md
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit final doc cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PRODUCT.md docs/YANDEX_SUBMISSION_CHECKLIST.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[final-doc-consistency] remove stale pre-expansion assumptions'
          git push origin HEAD:release/yandex-draft-readiness
