name: Temporary viewport QA cleanup
on:
  push:
    branches: [fix/ultrawide-backdrop-rarity-pulses-20260916]
    paths: [.github/workflows/temporary-viewport-impact-qa.yml]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'clean temporary viewport QA') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize CSS formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles.css')
          text = path.read_text()
          start = text.index('#game-shell::before,')
          end = text.index('\n#game {\n  position: relative;', start)
          region = text[start:end]
          lines = region.splitlines(keepends=True)
          normalized = lines[0] + ''.join(line[2:] if line.startswith('  ') else line for line in lines[1:])
          text = text[:start] + normalized + text[end:]
          text = text.replace('\n\n\n#game {\n  max-width:', '\n\n#game {\n  max-width:')
          path.write_text(text)
          PY
      - name: Final code validation
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Remove temporary QA files and commit only product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-viewport-impact-qa.yml tools/temporary-viewport-impact-qa.py
          git add src/styles.css
          git commit -m 'chore: clean temporary viewport QA after verified visual polish'
          git push origin HEAD:fix/ultrawide-backdrop-rarity-pulses-20260916
