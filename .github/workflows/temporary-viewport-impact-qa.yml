name: Temporary viewport and vignette QA
on:
  push:
    branches: [fix/ultrawide-backdrop-rarity-pulses-20260916]
    paths: [.github/workflows/temporary-viewport-impact-qa.yml]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    env:
      VITE_PLATFORM_RUNTIME: mock
      VITE_DEBUG_PANEL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow code patch and feather background transition
        run: |
          python tools/temporary-viewport-impact-qa.py patch
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles.css')
          text = path.read_text()
          before = '''  background-color: #171421;
            background-image: var(--shell-backdrop-url), var(--shell-backdrop-url);
            background-size: auto var(--shell-backdrop-height, 100%), cover;
            background-position: center center;
            background-repeat: no-repeat;
            display: grid;'''.replace('            ', '  ')
          after = '''  background-color: #171421;
          background-image: var(--shell-backdrop-url);
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          display: grid;'''
          assert text.count(before) == 1, 'shell background CSS anchor missing'
          text = text.replace(before, after, 1)
          anchor = '''  place-items: center;
          overflow: hidden;
          }
          '''.replace('          ', '  ')
          # Only match the first shell layout block, not the unrelated orientation gate.
          anchor = '  place-items: center;\n  overflow: hidden;\n}\n'
          assert text.count(anchor) == 1, 'shell layout CSS anchor missing'
          before_layer = '''  place-items: center;
          overflow: hidden;
          }
          '''.replace('          ', '  ')
          layer = '''#game-shell::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            /* Match the scene artwork exactly next to the capped canvas;
               progressively blend to a full-bleed cover only beyond its edges. */
            background-image: var(--shell-backdrop-url);
            background-size: auto var(--shell-backdrop-height, 100%);
            background-position: center center;
            background-repeat: no-repeat;
            -webkit-mask-image: linear-gradient(to right,
              transparent calc(50% - 121.5dvh), #000 calc(50% - 100dvh),
              #000 calc(50% + 100dvh), transparent calc(50% + 121.5dvh));
            mask-image: linear-gradient(to right,
              transparent calc(50% - 121.5dvh), #000 calc(50% - 100dvh),
              #000 calc(50% + 100dvh), transparent calc(50% + 121.5dvh));
          }
          
          #game {
            position: relative;
            z-index: 1;
          }
          '''.replace('            ', '  ')
          text = text.replace(anchor, anchor + '\n' + layer + '\n', 1)
          path.write_text(text)
          qa = Path('tools/temporary-viewport-impact-qa.py')
          code = qa.read_text()
          code = code.replace("await page.wait_for_timeout(1500)\n                await page.evaluate('''() => {", "await page.wait_for_function(\"() => !!localStorage.getItem('mystery-pocket-tech.save')\", timeout=60000)\n                await page.wait_for_timeout(2000)\n                await page.evaluate('''() => {")
          code = code.replace("await page.screenshot(path=str(root/'ultrawide-1848x635.png'))", "await page.screenshot(path=str(root/'ultrawide-1848x635.png'), style='.mpt-debug-panel {visibility:hidden!important}')")
          assert "wait_for_function(\"() => !!localStorage.getItem" in code, 'QA wait anchor missing'
          qa.write_text(code)
          PY
      - name: Check, test and build patched game
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Install headless browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check ultrawide backdrop and real pouch drag
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/viewport-impact-preview.log 2>&1 &
          sleep 2
          python tools/temporary-viewport-impact-qa.py qa
      - name: Commit only production changes after QA passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles.css src/game/ui/staticArt.ts src/game/data/rarityPouchImpact.ts src/game/data/rarityPouchImpact.test.ts src/game/scenes/OpeningScene.ts
          git commit -m 'fix(feel): fill ultrawide backdrop and make rarity edge pulses readable'
          git push origin HEAD:fix/ultrawide-backdrop-rarity-pulses-20260916
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-2000-ultrawide-pulse-review
          path: viewport-impact-qa/
          if-no-files-found: ignore
          retention-days: 7
