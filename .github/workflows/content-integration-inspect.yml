name: Content integration inspection

on:
  push:
    branches:
      - content/integrate-production-registry

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Slice-era references
        run: |
          echo '=== SLICE_* ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'SLICE_' src tests || true
          echo '=== collection/completion symbols ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E 'getStandardNearCompletion|isStandardCollectionComplete|resolveCollectionMilestone' src tests || true
          echo '=== onboarding totalOpens/protectedOpenings ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E 'protectedOpenings|openingNumber|totalOpens' src/game/systems/pouches.ts tests/lite-pouches.test.ts || true
