name: Post-sync docs review cleanup

on:
  push:
    branches:
      - docs/sync-post-opening-feel
    paths:
      - .github/workflows/post-sync-review-fix.yml
      - .github/scripts/post-sync-review-fix.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/sync-post-opening-feel
          fetch-depth: 0
      - name: Apply reviewed docs cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/post-sync-review-fix.py')
          text = p.read_text()
          start = text.index('def rep(path: str, old: str, new: str) -> None:')
          marker = '\n# README lifecycle wording.'
          end = text.index(marker, start)
          replacement = '''def rep(path: str, old: str, new: str) -> None:\n    p = Path(path)\n    text = p.read_text()\n    if old in text:\n        p.write_text(text.replace(old, new, 1))\n'''
          p.write_text(text[:start] + replacement + text[end:])
          PY
          python .github/scripts/post-sync-review-fix.py
          rm .github/scripts/post-sync-review-fix.py
          rm .github/workflows/post-sync-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finish post-merge docs coherence cleanup'
          git push origin HEAD:docs/sync-post-opening-feel
