name: Post-sync docs review cleanup

on:
  push:
    branches:
      - docs/sync-post-opening-feel
    paths:
      - .github/workflows/post-sync-review-fix.yml
      - .github/scripts/post-sync-review-fix.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/sync-post-opening-feel
          fetch-depth: 0
      - name: Apply reviewed docs cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/post-sync-review-fix.py')
          text = p.read_text()
          old = '''    if old not in text:\n        raise SystemExit(f"{path}: missing expected text: {old[:100]!r}")\n    p.write_text(text.replace(old, new, 1))'''
          new = '''    if old in text:\n        p.write_text(text.replace(old, new, 1))\n        return\n    if new in text:\n        return\n    raise SystemExit(f"{path}: neither expected old nor reviewed new text found: {old[:100]!r}")'''
          if old not in text:
              raise SystemExit('post-sync patcher function shape changed unexpectedly')
          p.write_text(text.replace(old, new, 1))
          PY
          python .github/scripts/post-sync-review-fix.py
          rm .github/scripts/post-sync-review-fix.py
          rm .github/workflows/post-sync-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finish post-merge docs coherence cleanup'
          git push origin HEAD:docs/sync-post-opening-feel
