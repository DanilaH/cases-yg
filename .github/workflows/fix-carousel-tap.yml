name: Fix carousel tap

on:
  push:
    branches:
      - feat/reveal-presentation-v2
    paths:
      - .github/workflows/fix-carousel-tap.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/reveal-presentation-v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply correction
        run: python tools/audit/fix-carousel-tap.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit verified correction and clean temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-carousel-tap.yml tools/audit/fix-carousel-tap.py
          git add src/game/scenes/OpeningScene.ts
          git commit -m "Allow tap-to-continue inside result carousel"
          git push origin HEAD:feat/reveal-presentation-v2
