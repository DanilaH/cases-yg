name: Opening UI selection continuity fix

on:
  push:
    branches:
      - feat/gameplay-loop-lite-v2-opening-ui
    paths:
      - .github/workflows/opening-ui-selection-continuity-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preserve selected pouch across repeated openings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/scenes/OpeningScene.ts')
          text = path.read_text()
          needle = "    this.selectedPouchType = 'basic';\n"
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f'expected exactly 2 unconditional selectedPouchType resets, found {count}')
          text = text.replace(needle, '')
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/opening-ui-selection-continuity-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts .github/workflows/opening-ui-selection-continuity-fix.yml
          git commit -m "Preserve pouch selection across openings"
          git push
