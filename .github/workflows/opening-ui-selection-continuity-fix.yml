name: Opening UI selection continuity fix

on:
  push:
    branches:
      - feat/gameplay-loop-lite-v2-opening-ui
    paths:
      - .github/workflows/opening-ui-selection-continuity-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preserve selected pouch across repeated openings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/scenes/OpeningScene.ts')
          text = path.read_text()
          create_snippet = "    this.ignoreNextResultTap = false;\n    this.selectedPouchType = 'basic';\n"
          continue_snippet = "    this.resultCarouselDrag = null;\n    this.selectedPouchType = 'basic';\n    this.renderIdle();\n"
          if create_snippet not in text:
              raise SystemExit('create() pouch reset snippet not found')
          if continue_snippet not in text:
              raise SystemExit('continueFromResult() pouch reset snippet not found')
          text = text.replace(create_snippet, "    this.ignoreNextResultTap = false;\n", 1)
          text = text.replace(continue_snippet, "    this.resultCarouselDrag = null;\n    this.renderIdle();\n", 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/opening-ui-selection-continuity-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts .github/workflows/opening-ui-selection-continuity-fix.yml
          git commit -m "Preserve pouch selection across openings"
          git push
