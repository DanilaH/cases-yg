name: Apply onboarding recovery hardening

on:
  push:
    branches:
      - onboarding-recovery-hardening
    paths:
      - .github/workflows/onboarding-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: onboarding-recovery-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply focused hardening patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def patch(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              updated = text.replace(old, new, count)
              p.write_text(updated)

          # Save v5: primary onboarding completion is separate from reward commit.
          patch('src/game/systems/save.ts', 'export const SAVE_VERSION = 4;', 'export const SAVE_VERSION = 5;')
          patch(
              'src/game/systems/save.ts',
              "export interface SaveState extends ProgressSnapshot {\n  version: typeof SAVE_VERSION;\n  pendingReveal: PendingReveal | null;\n",
              "export interface PrimaryOnboardingState {\n  primaryCompleted: boolean;\n  firstRevealReceipt: PendingReveal | null;\n}\n\nexport interface SaveState extends ProgressSnapshot {\n  version: typeof SAVE_VERSION;\n  pendingReveal: PendingReveal | null;\n  onboarding: PrimaryOnboardingState;\n",
          )
          patch(
              'src/game/systems/save.ts',
              "  totalOpens: 0,\n  pendingReveal: null,\n  muted: false,\n",
              "  totalOpens: 0,\n  pendingReveal: null,\n  onboarding: {\n    primaryCompleted: false,\n    firstRevealReceipt: null,\n  },\n  muted: false,\n",
          )
          patch(
              'src/game/systems/save.ts',
              "const pendingMatchesBaseState = (state: SaveState, pending: PendingReveal): boolean => {",
              "const isPrimaryOnboardingState = (value: unknown): value is PrimaryOnboardingState =>\n  isRecord(value) &&\n  typeof value.primaryCompleted === 'boolean' &&\n  (value.firstRevealReceipt === null || isPendingReveal(value.firstRevealReceipt));\n\nconst revealCommitMatchesState = (state: SaveState, receipt: PendingReveal): boolean =>\n  state.pendingReveal === null &&\n  state.totalOpens === receipt.commit.totalOpens &&\n  state.chips === receipt.commit.chips &&\n  state.signal === receipt.commit.signal &&\n  state.overchargeHundredths === receipt.commit.overchargeHundredths &&\n  state.activeLootPoolId === receipt.commit.activeLootPoolId &&\n  state.stats.duplicates === receipt.commit.stats.duplicates &&\n  state.stats.hiddenPockets === receipt.commit.stats.hiddenPockets &&\n  sameStrings(state.discoveredStandard, receipt.commit.discoveredStandard) &&\n  sameStrings(state.discoveredSecrets, receipt.commit.discoveredSecrets);\n\nconst pendingMatchesBaseState = (state: SaveState, pending: PendingReveal): boolean => {",
          )
          patch(
              'src/game/systems/save.ts',
              "const validatePendingBaseState = (state: SaveState): SaveState => {\n  if (state.pendingReveal && !pendingMatchesBaseState(state, state.pendingReveal)) {\n    throw new Error('Pending reveal does not match its base save state');\n  }\n  return state;\n};",
              "const validateSaveState = (state: SaveState): SaveState => {\n  if (state.pendingReveal && !pendingMatchesBaseState(state, state.pendingReveal)) {\n    throw new Error('Pending reveal does not match its base save state');\n  }\n\n  const onboarding = state.onboarding;\n  if (onboarding.primaryCompleted && onboarding.firstRevealReceipt !== null) {\n    throw new Error('Completed onboarding cannot retain a first reveal receipt');\n  }\n  if (onboarding.firstRevealReceipt) {\n    const receipt = onboarding.firstRevealReceipt;\n    if (receipt.openingNumber !== 1 || receipt.baseTotalOpens !== 0 || !revealCommitMatchesState(state, receipt)) {\n      throw new Error('Primary onboarding receipt does not match committed save state');\n    }\n  }\n  return state;\n};",
          )
          patch(
              'src/game/systems/save.ts',
              "  return validatePendingBaseState({\n    version: SAVE_VERSION,\n    ...progress,\n    pendingReveal: legacy.pendingReveal ? migrateLegacyPending(legacy.pendingReveal, progress) : null,\n    muted: legacy.muted,\n  });",
              "  return validateSaveState({\n    version: SAVE_VERSION,\n    ...progress,\n    pendingReveal: legacy.pendingReveal ? migrateLegacyPending(legacy.pendingReveal, progress) : null,\n    onboarding: {\n      primaryCompleted: progress.totalOpens > 0,\n      firstRevealReceipt: null,\n    },\n    muted: legacy.muted,\n  });",
          )
          patch(
              'src/game/systems/save.ts',
              "  return parseCurrentSave({\n    ...value,\n    version: SAVE_VERSION,\n    pendingReveal,\n  });\n};\n\nconst parseCurrentSave",
              "  return migrateV4Save({\n    ...value,\n    version: 4,\n    pendingReveal,\n  });\n};\n\nconst migrateV4Save = (value: Record<string, unknown>): SaveState => {\n  if (value.version !== 4) {\n    throw new Error('Invalid V4 save payload');\n  }\n\n  const primaryCompleted = isNonNegativeInteger(value.totalOpens) && value.totalOpens > 0;\n  return parseCurrentSave({\n    ...value,\n    version: SAVE_VERSION,\n    onboarding: {\n      primaryCompleted,\n      firstRevealReceipt: null,\n    },\n  });\n};\n\nconst parseCurrentSave",
          )
          patch(
              'src/game/systems/save.ts',
              "    !isProgressSnapshot(value) ||\n    (value.pendingReveal !== null && !isPendingReveal(value.pendingReveal)) ||\n    typeof value.muted !== 'boolean'\n",
              "    !isProgressSnapshot(value) ||\n    (value.pendingReveal !== null && !isPendingReveal(value.pendingReveal)) ||\n    !isPrimaryOnboardingState(value.onboarding) ||\n    typeof value.muted !== 'boolean'\n",
          )
          patch(
              'src/game/systems/save.ts',
              "  return validatePendingBaseState(value as unknown as SaveState);",
              "  return validateSaveState(value as unknown as SaveState);",
          )
          patch(
              'src/game/systems/save.ts',
              "  if (value.version === 3) {\n    return migrateV3Save(value);\n  }\n  if (value.version === SAVE_VERSION) {",
              "  if (value.version === 3) {\n    return migrateV3Save(value);\n  }\n  if (value.version === 4) {\n    return migrateV4Save(value);\n  }\n  if (value.version === SAVE_VERSION) {",
          )
          patch(
              'src/game/systems/save.ts',
              "  return {\n    version: SAVE_VERSION,\n    ...pending.commit,\n    pendingReveal: null,\n    muted: state.muted,\n  };\n};\n\nexport class SaveRepository",
              "  const onboarding: PrimaryOnboardingState =\n    !state.onboarding.primaryCompleted && pending.openingNumber === 1\n      ? { primaryCompleted: false, firstRevealReceipt: pending }\n      : state.onboarding;\n\n  return {\n    version: SAVE_VERSION,\n    ...pending.commit,\n    pendingReveal: null,\n    onboarding,\n    muted: state.muted,\n  };\n};\n\nexport const completePrimaryOnboardingState = (state: SaveState): SaveState => {\n  if (state.onboarding.primaryCompleted) return state;\n  const receipt = state.onboarding.firstRevealReceipt;\n  if (!receipt || receipt.openingNumber !== 1 || !revealCommitMatchesState(state, receipt)) {\n    throw new Error('Primary onboarding cannot complete without its committed first reveal receipt');\n  }\n\n  return {\n    ...state,\n    onboarding: {\n      primaryCompleted: true,\n      firstRevealReceipt: null,\n    },\n  };\n};\n\nexport class SaveRepository",
          )

          # Primary routing uses the explicit durable completion marker / receipt.
          patch(
              'src/game/systems/onboarding.ts',
              "export const shouldRunPrimaryOnboarding = (\n  state: Pick<SaveState, 'totalOpens' | 'pendingReveal'>,\n): boolean => state.totalOpens === 0 && (state.pendingReveal === null || state.pendingReveal.openingNumber === 1);",
              "export const shouldRunPrimaryOnboarding = (\n  state: Pick<SaveState, 'totalOpens' | 'pendingReveal' | 'onboarding'>,\n): boolean => {\n  if (state.onboarding.primaryCompleted) return false;\n  if (state.onboarding.firstRevealReceipt) return true;\n  return state.totalOpens === 0 && (state.pendingReveal === null || state.pendingReveal.openingNumber === 1);\n};",
          )
          patch(
              'src/game/systems/onboarding.ts',
              "  after.pendingReveal === null &&\n  after.muted === before.muted &&",
              "  after.pendingReveal === null &&\n  after.onboarding.primaryCompleted === before.onboarding.primaryCompleted &&\n  after.onboarding.firstRevealReceipt?.id === before.onboarding.firstRevealReceipt?.id &&\n  after.muted === before.muted &&",
          )

          # Session owns ambiguous-write-safe completion so its cached state stays authoritative.
          patch(
              'src/game/systems/openingSession.ts',
              "import { SaveRepository, type SaveState } from './save';",
              "import { SaveRepository, completePrimaryOnboardingState, type SaveState } from './save';",
          )
          patch(
              'src/game/systems/openingSession.ts',
              "const matchesCommittedPending = (state: SaveState, pending: PendingReveal): boolean =>\n  state.pendingReveal === null &&",
              "const matchesCommittedPending = (state: SaveState, pending: PendingReveal): boolean =>\n  state.pendingReveal === null &&\n  (pending.openingNumber !== 1 || state.onboarding.firstRevealReceipt?.id === pending.id) &&",
          )
          patch(
              'src/game/systems/openingSession.ts',
              "const matchesLootPoolSwitch = (before: SaveState, after: SaveState, lootPoolId: LootPoolId): boolean =>\n  after.pendingReveal === null &&",
              "const matchesLootPoolSwitch = (before: SaveState, after: SaveState, lootPoolId: LootPoolId): boolean =>\n  after.pendingReveal === null &&\n  after.onboarding.primaryCompleted === before.onboarding.primaryCompleted &&\n  after.onboarding.firstRevealReceipt?.id === before.onboarding.firstRevealReceipt?.id &&",
          )
          patch(
              'src/game/systems/openingSession.ts',
              "export class OpeningSession {",
              "const matchesPrimaryOnboardingCompletion = (before: SaveState, after: SaveState): boolean =>\n  after.pendingReveal === before.pendingReveal &&\n  after.version === before.version &&\n  after.muted === before.muted &&\n  after.onboarding.primaryCompleted &&\n  after.onboarding.firstRevealReceipt === null &&\n  after.activeLootPoolId === before.activeLootPoolId &&\n  after.totalOpens === before.totalOpens &&\n  after.chips === before.chips &&\n  after.signal === before.signal &&\n  after.overchargeHundredths === before.overchargeHundredths &&\n  after.stats.duplicates === before.stats.duplicates &&\n  after.stats.hiddenPockets === before.stats.hiddenPockets &&\n  sameStrings(after.discoveredStandard, before.discoveredStandard) &&\n  sameStrings(after.discoveredSecrets, before.discoveredSecrets);\n\nexport class OpeningSession {",
          )
          patch(
              'src/game/systems/openingSession.ts',
              "  public async commitReveal(): Promise<SaveState> {",
              "  public async completePrimaryOnboarding(): Promise<SaveState> {\n    const current = this.getState();\n    if (current.onboarding.primaryCompleted) return current;\n    const completed = completePrimaryOnboardingState(current);\n\n    try {\n      await this.options.repository.write(completed);\n      this.state = completed;\n      return completed;\n    } catch (error: unknown) {\n      try {\n        const reloaded = await this.options.repository.load();\n        this.state = reloaded;\n        if (matchesPrimaryOnboardingCompletion(current, reloaded)) return reloaded;\n      } catch {\n        // Preserve the original write error.\n      }\n      throw error;\n    }\n  }\n\n  public async commitReveal(): Promise<SaveState> {",
          )

          # First-run shell must skip directly to a committed-but-uncollected receipt.
          patch(
              'src/game/scenes/FirstRunScene.ts',
              "      if (!shouldRunPrimaryOnboarding(state)) {\n        this.startOpening();\n        return;\n      }\n\n      state = await ensureInitialOnboardingChips(repository, state);",
              "      if (!shouldRunPrimaryOnboarding(state)) {\n        this.startOpening();\n        return;\n      }\n      if (state.onboarding.firstRevealReceipt) {\n        this.startOpening();\n        return;\n      }\n\n      state = await ensureInitialOnboardingChips(repository, state);",
          )
          patch(
              'src/game/scenes/FirstRunScene.ts',
              "      if (!shouldRunPrimaryOnboarding(this.saveState)) {\n        this.startOpening();\n        return;\n      }\n\n      this.renderStage();",
              "      if (!shouldRunPrimaryOnboarding(this.saveState)) {\n        this.startOpening();\n        return;\n      }\n      if (this.saveState.onboarding.firstRevealReceipt) {\n        this.startOpening();\n        return;\n      }\n\n      this.renderStage();",
          )

          # Opening distinguishes a live first-run handoff from reload recovery, replays committed result safely,
          # carries exact Signal causality, and persists completion before accepting collect.
          patch(
              'src/game/scenes/OpeningScene.ts',
              "interface OpeningSceneData {\n  lootPoolId?: GameLootPoolId;\n}",
              "interface OpeningSceneData {\n  lootPoolId?: GameLootPoolId;\n  onboardingHandoffId?: string;\n}",
          )
          patch(
              'src/game/scenes/OpeningScene.ts',
              "  private requestedLootPoolId: GameLootPoolId | null = null;\n  private previewLootPoolId",
              "  private requestedLootPoolId: GameLootPoolId | null = null;\n  private requestedOnboardingHandoffId: string | null = null;\n  private previewLootPoolId",
          )
          patch(
              'src/game/scenes/OpeningScene.ts',
              "  public init(data: OpeningSceneData = {}): void {\n    this.requestedLootPoolId = data.lootPoolId ?? null;\n  }",
              "  public init(data: OpeningSceneData = {}): void {\n    this.requestedLootPoolId = data.lootPoolId ?? null;\n    this.requestedOnboardingHandoffId = data.onboardingHandoffId ?? null;\n  }",
          )
          patch(
              'src/game/scenes/OpeningScene.ts',
              "    let idleMessage: string | undefined;\n    const requestedLootPoolId = this.requestedLootPoolId;\n    this.requestedLootPoolId = null;",
              "    let idleMessage: string | undefined;\n    const requestedLootPoolId = this.requestedLootPoolId;\n    const onboardingHandoffId = this.requestedOnboardingHandoffId;\n    this.requestedLootPoolId = null;\n    this.requestedOnboardingHandoffId = null;",
          )
          patch(
              'src/game/scenes/OpeningScene.ts',
              "    const pending = this.saveState.pendingReveal;\n    if (pending) {",
              "    const onboardingReplay = this.saveState.onboarding.firstRevealReceipt;\n    if (onboardingReplay) {\n      this.selectedPouchType = onboardingReplay.pouchType;\n      this.lastReveal = onboardingReplay;\n      this.phase = 'result';\n      this.resultReady = true;\n      this.renderResolvedResult(onboardingReplay);\n      platform.activity.setGameplayDesired(true);\n      platform.markReady();\n      platform.analytics.track('onboarding_result_recovered', { openingNumber: onboardingReplay.openingNumber });\n      platform.analytics.track('onboarding_result_ready', { openingNumber: onboardingReplay.openingNumber, recovered: true });\n      return;\n    }\n\n    const pending = this.saveState.pendingReveal;\n    if (pending) {",
          )
          patch(
              'src/game/scenes/OpeningScene.ts',
              "      void this.playReveal(pending, true);",
              "      void this.playReveal(pending, onboardingHandoffId !== pending.id);",
          )
          patch(
              'src/game/scenes/OpeningScene.ts',
              "    this.resultReady = true;\n    this.renderResultActionPanel(pending);\n  }",
              "    this.resultReady = true;\n    this.renderResultActionPanel(pending);\n    if (pending.openingNumber === 1 && !committed.onboarding.primaryCompleted) {\n      getPlatformRuntime().analytics.track('onboarding_result_ready', {\n        openingNumber: pending.openingNumber,\n        recovered: false,\n      });\n    }\n  }",
          )
          patch(
              'src/game/scenes/OpeningScene.ts',
              "      signalAfter: committed.signal,\n    });",
              "      signalAfter: committed.signal,\n      signalGain: pending.signal.gain,\n    });",
          )
          patch(
              'src/game/scenes/OpeningScene.ts',
              "  private continueFromResult(): void {\n    if (this.phase !== 'result' || !this.resultReady || !this.lastReveal) return;\n    getGameAudio().play('ui-click');\n    this.resultCarouselDrag = null;\n    const pending = this.lastReveal;\n    getPlatformRuntime().analytics.track('result_collected', {\n      openingNumber: pending.openingNumber,\n      lootPoolId: pending.lootPoolId,\n      pouchType: pending.pouchType,\n      rarity: pending.standard.rarity,\n      isNew: pending.standard.isNew,\n      hiddenPocket: pending.hiddenPocket !== null,\n      startPage: pending.hiddenPocket && this.resultCarouselIndex === 1 ? 'secret' : 'standard',\n    });\n    void this.animateRewardBanking(pending).catch((error: unknown) => {\n      console.error('[opening] reward banking presentation failed', error);\n      getGameAudio().clearResultAmbience();\n      if (this.saveState && !this.isSceneShutdown()) this.renderIdle();\n    });\n  }",
              "  private continueFromResult(): void {\n    if (this.phase !== 'result' || !this.resultReady || !this.lastReveal) return;\n    getGameAudio().play('ui-click');\n    this.resultCarouselDrag = null;\n    this.resultReady = false;\n    const pending = this.lastReveal;\n    this.renderResultActionPanel(pending);\n    void this.acceptResult(pending);\n  }\n\n  private async acceptResult(pending: PendingReveal): Promise<void> {\n    if (!this.session || !this.saveState || this.isSceneShutdown()) return;\n\n    if (pending.openingNumber === 1 && !this.saveState.onboarding.primaryCompleted) {\n      try {\n        this.saveState = await this.session.completePrimaryOnboarding();\n      } catch (error: unknown) {\n        console.error('[onboarding] failed to persist first collect', error);\n        if (!this.isSceneShutdown()) {\n          this.resultReady = true;\n          this.renderResultActionPanel(pending);\n        }\n        return;\n      }\n    }\n\n    getPlatformRuntime().analytics.track('result_collected', {\n      openingNumber: pending.openingNumber,\n      lootPoolId: pending.lootPoolId,\n      pouchType: pending.pouchType,\n      rarity: pending.standard.rarity,\n      isNew: pending.standard.isNew,\n      hiddenPocket: pending.hiddenPocket !== null,\n      startPage: pending.hiddenPocket && this.resultCarouselIndex === 1 ? 'secret' : 'standard',\n    });\n    try {\n      await this.animateRewardBanking(pending);\n    } catch (error: unknown) {\n      console.error('[opening] reward banking presentation failed', error);\n      getGameAudio().clearResultAmbience();\n      if (this.saveState && !this.isSceneShutdown()) this.renderIdle();\n    }\n  }",
          )

          # Focused contract tests.
          patch(
              'tests/opening-session.test.ts',
              "    expect(committed.pendingReveal).toBeNull();\n    expect(committed.totalOpens).toBe(pending.openingNumber);",
              "    expect(committed.pendingReveal).toBeNull();\n    expect(committed.onboarding.primaryCompleted).toBe(false);\n    expect(committed.onboarding.firstRevealReceipt).toEqual(pending);\n    expect(committed.totalOpens).toBe(pending.openingNumber);",
          )
          patch(
              'tests/opening-session.test.ts',
              "    expect(persisted).toEqual(committed);\n  });\n\n  it('stages Charged cost",
              "    expect(persisted).toEqual(committed);\n\n    const completed = await session.completePrimaryOnboarding();\n    expect(completed.onboarding).toEqual({ primaryCompleted: true, firstRevealReceipt: null });\n    expect((await new SaveRepository(storage).load()).onboarding).toEqual(completed.onboarding);\n  });\n\n  it('stages Charged cost",
          )
          patch(
              'tests/opening-session.test.ts',
              "  it('accepts an ambiguous commit write when reload proves the complete transaction is committed', async () => {",
              "  it('accepts an ambiguous primary collect write only when reload proves completion is durable', async () => {\n    const storage = new WriteThenThrowStorage(3);\n    const session = createSession(storage);\n    await session.load();\n    await session.prepareReveal();\n    await session.commitReveal();\n\n    const completed = await session.completePrimaryOnboarding();\n\n    expect(completed.onboarding).toEqual({ primaryCompleted: true, firstRevealReceipt: null });\n    expect(session.getState()).toEqual(completed);\n  });\n\n  it('accepts an ambiguous commit write when reload proves the complete transaction is committed', async () => {",
          )
          patch(
              'tests/onboarding.test.ts',
              "    expect(recovered.chips.cacheBonus).toBe(20);\n  });",
              "    expect(recovered.chips.cacheBonus).toBe(20);\n  });\n\n  it('keeps primary onboarding active after reward commit until the exact first result is collected', async () => {\n    const storage = new MemoryStorageAdapter();\n    const repository = new SaveRepository(storage);\n    const granted = await ensureInitialOnboardingChips(repository, await repository.load());\n    const session = new OpeningSession({\n      repository,\n      registry: DEFAULT_DROP_REGISTRY,\n      balance: LITE_V2_BALANCE,\n      random: new SequenceRandom([0, 0, 0, 0, 0]),\n      createTransactionId: () => 'first-collect-gate',\n    });\n    await session.load();\n    const pending = await session.prepareReveal('basic');\n    const committed = await session.commitReveal();\n\n    expect(granted.totalOpens).toBe(0);\n    expect(committed.pendingReveal).toBeNull();\n    expect(committed.onboarding.primaryCompleted).toBe(false);\n    expect(committed.onboarding.firstRevealReceipt).toEqual(pending);\n    expect(shouldRunPrimaryOnboarding(committed)).toBe(true);\n\n    const completed = await session.completePrimaryOnboarding();\n    expect(completed.onboarding).toEqual({ primaryCompleted: true, firstRevealReceipt: null });\n    expect(shouldRunPrimaryOnboarding(completed)).toBe(false);\n  });",
          )
          patch(
              'tests/save-migration.test.ts',
              "      pendingReveal: null,\n      stats: { duplicates: 2, hiddenPockets: 0 },",
              "      pendingReveal: null,\n      onboarding: { primaryCompleted: true, firstRevealReceipt: null },\n      stats: { duplicates: 2, hiddenPockets: 0 },",
          )
          patch(
              'tests/save-migration.test.ts',
              "  it('rejects a current pending transaction whose commit no longer matches its base collection', () => {",
              "  it('migrates V4 onboarding state conservatively without inventing a replay receipt', () => {\n    const freshV5 = createInitialSaveState();\n    const freshV4 = { ...freshV5, version: 4 };\n    delete (freshV4 as Record<string, unknown>).onboarding;\n    const migratedFresh = parseSaveState(JSON.stringify(freshV4));\n    expect(migratedFresh.onboarding).toEqual({ primaryCompleted: false, firstRevealReceipt: null });\n\n    const progressedV4 = { ...freshV4, totalOpens: 1 };\n    const migratedProgressed = parseSaveState(JSON.stringify(progressedV4));\n    expect(migratedProgressed.onboarding).toEqual({ primaryCompleted: true, firstRevealReceipt: null });\n  });\n\n  it('rejects a current pending transaction whose commit no longer matches its base collection', () => {",
          )

          # Canonical onboarding contract now matches runtime semantics.
          patch(
              'docs/ONBOARDING.md',
              "The primary onboarding is complete after the first opening commits. `totalOpens > 0` is sufficient durable evidence; do not add a redundant permanent intro-complete flag.",
              "The primary onboarding is complete only after the player accepts the first result with the ordinary collect action. Reward commit and tutorial completion are deliberately separate: the first result may already be durable while the collect lesson is still unfinished. The save therefore keeps a durable `primaryCompleted` marker plus the exact committed first-result receipt until collect succeeds.",
          )
          patch(
              'docs/ONBOARDING.md',
              "- `totalOpens >= 1`: primary onboarding is complete and must not restart.",
              "- opening #1 committed but collect not yet accepted: replay the exact stored first-result receipt directly in the normal result UI; do not reroll or recommit the reward.\n- `primaryCompleted === true`: primary onboarding is complete and must not restart. Existing pre-v5 saves with prior openings are grandfathered as complete because no exact historical receipt can be reconstructed safely.",
          )
          patch(
              'docs/ONBOARDING.md',
              "The existing durable `pendingReveal` / ambiguous-write recovery contract remains authoritative. Onboarding presentation is explicitly subordinate to it.",
              "The existing durable `pendingReveal` / ambiguous-write recovery contract remains authoritative. A live FirstRun → Opening handoff is not treated as reload recovery and therefore receives the full authored reveal; an actual reload of a staged transaction may use the abbreviated recovery reveal. Once opening #1 commits, its exact receipt remains durable until collect so refresh cannot erase the tutorial state or duplicate economy mutations.",
          )
          patch(
              'docs/ONBOARDING.md',
              "Guidance observes existing game-authored lifecycle/analytics events. Local guidance observers are isolated from the gameplay emitter: a presentation observer failure must not propagate back into reward or interaction flow.",
              "Guidance observes existing game-authored lifecycle/analytics events. `reveal_complete` carries the exact transaction-authored `signalGain`, so the first-duplicate hint does not infer causality by racing a later save read. Local guidance observers are isolated from the gameplay emitter: a presentation observer failure must not propagate back into reward or interaction flow.",
          )
          patch(
              'docs/ONBOARDING.md',
              "- page refresh after the first pending reveal was persisted never rerolls it;\n- ordinary Opening UI appears for the first reveal;",
              "- page refresh after the first pending reveal was persisted never rerolls it;\n- page refresh after opening #1 committed but before collect replays the exact committed result without a second commit;\n- primary completion becomes durable only when first-result collect succeeds;\n- the live first-run handoff uses the full reveal choreography, while true reload recovery may use the shortened recovery reveal;\n- ordinary Opening UI appears for the first reveal;",
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Asset self-test
        run: npm run assets:selftest

      - name: Asset validation
        run: npm run assets:validate

      - name: Production build
        run: npm run build

      - name: Commit validated hardening
        run: |
          rm .github/workflows/onboarding-hardening-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete onboarding recovery hardening"
          git push origin HEAD:onboarding-recovery-hardening
