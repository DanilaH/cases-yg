name: Inspect Historical Pouch Sources

on:
  push:
    branches:
      - fix/hands-on-ux-pass
    paths:
      - .github/workflows/inspect-pouch-master.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore historical pouch sources
        run: |
          mkdir -p /tmp/pouch-sources
          git show '72e300b6d494320598ff1a6a08eeb3cf2195a98a:incoming/ChatGPT Image Sep 2, 2026, 12_02_20 PM.png' > '/tmp/pouch-sources/0-master.png'
          git show '72e300b6d494320598ff1a6a08eeb3cf2195a98a:incoming/ChatGPT Image Sep 4, 2026, 12_25_10 AM (1).png' > '/tmp/pouch-sources/1.png'
          git show '72e300b6d494320598ff1a6a08eeb3cf2195a98a:incoming/ChatGPT Image Sep 4, 2026, 12_25_11 AM (2).png' > '/tmp/pouch-sources/2.png'
          git show '72e300b6d494320598ff1a6a08eeb3cf2195a98a:incoming/ChatGPT Image Sep 4, 2026, 12_25_11 AM (3).png' > '/tmp/pouch-sources/3.png'
      - name: Inspect geometry
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in sorted(Path('/tmp/pouch-sources').glob('*.png')):
              img = Image.open(p).convert('RGBA')
              print(p.name, 'size=', img.size, 'alpha_bbox=', img.getchannel('A').getbbox())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: historical-pouch-sources
          path: /tmp/pouch-sources
          retention-days: 2
