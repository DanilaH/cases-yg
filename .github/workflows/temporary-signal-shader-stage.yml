name: Temporary Signal shader stage inspection
on:
  push:
    branches: [feat/crack-variation-signal-audio-20260916]
    paths: [.github/workflows/temporary-signal-shader-stage.yml]
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      VITE_PLATFORM_RUNTIME: mock
      VITE_DEBUG_PANEL: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser and expose scene on this QA runner only
        run: |
          npm ci
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.ts');s=p.read_text()
          old='  game.sound.mute = blocked;\n  if (loopSuspended) game.loop.sleep();'
          assert s.count(old)==1
          s=s.replace(old,"  (window as Window & { __qaGame?: Phaser.Game }).__qaGame = game;\n"+old)
          p.write_text(s)
          print('QA-only Phaser scene handle exposed; main source unchanged on GitHub')
          PY
          npm run build
      - name: Capture actual shader at multiple progress values
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/shader-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          cat > /tmp/stages.py <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright
          from PIL import Image,ImageDraw
          OUT=Path('signal-shader-stages');OUT.mkdir(exist_ok=True)
          async def ready(page):
              await page.locator('.mpt-debug-panel__meta strong').wait_for(timeout=90000)
              await page.locator('#startup-preload').wait_for(state='hidden',timeout=90000)
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader'])
                  try:
                      page=await browser.new_page(viewport={'width':1600,'height':900},locale='ru-RU');errors=[]
                      page.on('pageerror',lambda e:errors.append(str(e)))
                      await page.goto('http://127.0.0.1:4173/',wait_until='domcontentloaded')
                      await ready(page)
                      await page.evaluate('''() => {const k='mystery-pocket-tech.save'; const s=JSON.parse(localStorage.getItem(k));Object.assign(s,{version:5,chips:650,totalOpens:17,signal:0,overchargeHundredths:100,activeLootPoolId:'y2k-essentials',pendingReveal:null,onboarding:{primaryCompleted:true,firstRevealReceipt:null},discoveredStandard:[],discoveredSecrets:[],stats:{duplicates:0,hiddenPockets:0}});localStorage.setItem(k,JSON.stringify(s));}''')
                      await page.reload(wait_until='domcontentloaded');await ready(page)
                      await page.wait_for_timeout(3200)
                      images=[]
                      for rarity,values in [('rare',[0.396,0.788,0.933]),('legendary',[0.996,0.829,0.349])]:
                          if rarity=='legendary':
                              await page.evaluate("window.__qaGame.scene.getScene('OpeningScene').pouch.perspective.crackProgress = 0")
                              await page.mouse.click(163,386)
                              await page.wait_for_timeout(750)
                          for variant in (0.17,0.67):
                              for step,progress in enumerate((0.25,0.54,0.73,0.85)):
                                  await page.evaluate('''({v,s,t,p}) => {const scene=window.__qaGame.scene.getScene('OpeningScene');const filter=scene.pouch?.perspective;if(!filter) throw Error('Missing pouch filter');filter.crackVariant=v;filter.crackStrength=s;filter.crackTint=t;filter.crackProgress=p;}''', {'v':variant,'s':0.7 if rarity=='rare' else 1,'t':values,'p':progress})
                                  await page.wait_for_timeout(85)
                                  image=OUT/f'{rarity}-v{variant}-{step}.png'
                                  await page.screenshot(path=str(image),clip={'x':550,'y':115,'width':500,'height':560},style='.mpt-debug-panel {visibility:hidden!important}')
                                  images.append(image)
                      sheet=Image.new('RGB',(4*350,4*390),'black');pen=ImageDraw.Draw(sheet)
                      for index,path in enumerate(images):
                          image=Image.open(path).convert('RGB');image.thumbnail((348,365))
                          x=(index%4)*350;y=(index//4)*390
                          sheet.paste(image,(x,y));pen.text((x+6,y+4),path.stem,fill='white',stroke_width=1,stroke_fill='black')
                      sheet.save(OUT/'shader-stage-contact.jpg',quality=89)
                      assert not errors,errors
                      print('PASS 16 explicit shader stages; no page errors',flush=True)
                  finally:
                      await browser.close()
          asyncio.run(main())
          PY
          python /tmp/stages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-shader-stages
          path: signal-shader-stages/
          retention-days: 3
          if-no-files-found: ignore
