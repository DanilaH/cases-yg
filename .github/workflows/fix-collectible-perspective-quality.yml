name: One-shot collectible perspective quality

on:
  push:
    branches:
      - feature/collectible-perspective

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/collectible-perspective
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply follow-up
        run: node scripts/fix-collectible-perspective-quality.mjs
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
      - name: Commit and clean one-shot files
        run: |
          rm -f scripts/fix-collectible-perspective-quality.mjs .github/workflows/fix-collectible-perspective-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep collectible perspective sharp at hero scale"
          git push origin HEAD:feature/collectible-perspective
