name: Post-672 runtime art audit

on:
  push:
    branches:
      - experiment/post-672-runtime-art-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime art
        run: node tools/assets/audit-runtime-art.mjs

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: post-672-runtime-art-audit
          path: .asset-build/runtime-art-audit.json
