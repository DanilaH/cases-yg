name: Temporary crack source export
on:
  push:
    branches: [feat/pouch-crack-dissolve-prototype-20260916]
    paths: [.github/workflows/temporary-crack-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot source needed for prototype
        run: |
          mkdir -p /tmp/crack-source
          cp -a src tests package.json package-lock.json tsconfig.json vite.config.ts AGENTS.md /tmp/crack-source/
          cd /tmp/crack-source
          find src/game -type f | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: signal-crack-source
          path: /tmp/crack-source/
          retention-days: 1
