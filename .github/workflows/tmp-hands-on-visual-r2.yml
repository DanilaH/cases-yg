name: TEMP hands-on visual correction R2

on:
  push:
    branches:
      - polish/hands-on-feel-corrections-r1
    paths:
      - .github/workflows/tmp-hands-on-visual-r2.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/hands-on-feel-corrections-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply repaired visual correction
        run: python tools/tmp-apply-hands-on-visual-r2.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Asset self-test
        run: npm run assets:selftest
      - name: Asset validation
        run: npm run assets:validate
      - name: Build
        run: npm run build
      - name: Commit product correction and remove temporary tooling
        if: success()
        run: |
          rm -f tools/tmp-apply-hands-on-visual.py tools/tmp-apply-hands-on-visual-r2.py
          rm -f .github/workflows/tmp-hands-on-visual.yml .github/workflows/tmp-hands-on-visual-r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix hands-on visual continuity and discovery feedback'
          git push origin HEAD:polish/hands-on-feel-corrections-r1
