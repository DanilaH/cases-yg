name: TEMP collection milestones R3

on:
  push:
    branches:
      - polish/collection-milestones-r1

permissions:
  contents: write

jobs:
  implement-audit-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/collection-milestones-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Reuse product patch and correct fixture contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/tmp-collection-milestones-r1.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply bounded collection milestone pass\n'
          start = text.index(marker)
          run_start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('\n\n      - run: npm ci', run_start)
          lines = text[run_start:end].splitlines()
          Path('/tmp/apply-r1.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-r1.sh
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('tests/collection-milestones.test.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
            "const secretIds = SLICE_REGISTRY.secrets.map(({ collectible }) => collectible.id);\n",
            "const secretIds = SLICE_REGISTRY.secrets.map(({ collectible }) => collectible.id);\n\nconst itemAt = (items: readonly string[], index: number): string => {\n  const item = items[index];\n  if (!item) throw new Error(`Missing test fixture item at ${index}`);\n  return item;\n};\n",
            1,
          )
          for prefix, count in [('standardIds', 8), ('secretIds', 2)]:
            for index in range(count):
              text = text.replace(f'{prefix}[{index}]', f'itemAt({prefix}, {index})')
          text, bonus_count = re.subn(
            r'(overcharge:\s*\{\s*beforeHundredths:\s*100,\s*appliedGainHundredths:\s*0,\s*afterHundredths:\s*100,)(\s*\})',
            r'\1\n        bonusChips: 0,\2',
            text,
            count=1,
          )
          text, multiplier_count = re.subn(r'^\s*multiplierHundredths:\s*100,\s*$', '', text, count=1, flags=re.MULTILINE)
          if bonus_count != 1 or multiplier_count != 1:
            raise SystemExit(f'fixture repair mismatch: bonus={bonus_count}, multiplier={multiplier_count}')
          p.write_text(text, encoding='utf-8')
          PY

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build

      - name: Source contract guard
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          scene = Path('src/game/scenes/OpeningScene.ts').read_text(encoding='utf-8')
          resolver = Path('src/game/systems/collectionMilestones.ts').read_text(encoding='utf-8')
          assert 'resolveCollectionMilestone(SLICE_REGISTRY, pending, committed)' in scene
          assert 'this.renderResolvedResult(pending);\n    if (collectionMilestone) this.showCollectionMilestone(collectionMilestone);' in scene
          completion = scene.split('private trackRevealCompletion', 1)[1].split('private clearCollectionMilestoneMotion', 1)[0]
          assert "play('collection-complete')" not in completion
          assert "milestone.kind === 'standards-complete' || milestone.kind === 'secrets-complete'" in scene
          assert all(kind in resolver for kind in ["'secrets-complete'", "'standards-complete'", "'first-secret'", "'standards-half'"])
          milestone_section = scene.split('private showCollectionMilestone', 1)[1].split('private getResultPanelCopy', 1)[0]
          assert 'commitReveal' not in milestone_section and 'prepareReveal' not in milestone_section
          PY
          git diff --check

      - name: Install browser audit dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Reuse milestone presentation browser audit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/tmp-collection-milestones-r1.yml').read_text(encoding='utf-8')
          marker = '      - name: Run milestone presentation browser audit\n'
          start = text.index(marker)
          run_start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('\n\n      - uses: actions/upload-artifact@v4', run_start)
          lines = text[run_start:end].splitlines()
          Path('/tmp/browser-r1.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/browser-r1.sh

      - uses: actions/upload-artifact@v4
        with:
          name: collection-milestone-audit-r3
          path: audit-artifacts
          if-no-files-found: error

      - name: Restore audit-only changes and commit clean product tree
        run: |
          set -euo pipefail
          git checkout -- src/main.ts
          rm -f tools/tmp-collection-milestone-audit.mjs
          rm -rf audit-artifacts
          rm -f .github/workflows/tmp-collection-milestones-r1.yml
          rm -f .github/workflows/tmp-collection-milestones-r2.yml
          rm -f .github/workflows/tmp-collection-milestones-r3.yml
          git status --short
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add bounded collection milestone moments'
          git push origin HEAD:polish/collection-milestones-r1
