name: Remove persistent rarity ring

on:
  push:
    branches:
      - fix/remove-persistent-rarity-ring

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/remove-persistent-rarity-ring
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply removal
        run: node scripts/remove-persistent-rarity-ring.mjs
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
      - name: Commit source changes and clean one-shot files
        run: |
          rm -f scripts/remove-persistent-rarity-ring.mjs .github/workflows/remove-persistent-rarity-ring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove persistent collectible rarity ring"
          git push origin HEAD:fix/remove-persistent-rarity-ring
