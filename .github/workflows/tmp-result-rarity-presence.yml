name: Temporary rarity presence polish

on:
  pull_request:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/result-rarity-presence
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply bounded rarity presence polish
        run: |
          python - <<'PY'
          from pathlib import Path

          presentation = Path('src/game/data/presentation.ts')
          text = presentation.read_text()
          marker = "export const getCollectiblePresentation = (familyId: string): CollectiblePresentation =>\n  COLLECTIBLE_PRESENTATION[familyId] ?? FALLBACK_PRESENTATION;\n\n"
          block = """export interface StandardResultPresenceProfile {\n  enabled: boolean;\n  glowAlpha: number;\n  glowWidth: number;\n  glowHeight: number;\n  ringAlpha: number;\n  pulseScale: number;\n  pulseDurationMs: number;\n  sparkleCount: number;\n}\n\nexport const STANDARD_RESULT_PRESENCE: Readonly<Record<StandardRarity, StandardResultPresenceProfile>> = {\n  common: {\n    enabled: false,\n    glowAlpha: 0,\n    glowWidth: 0,\n    glowHeight: 0,\n    ringAlpha: 0,\n    pulseScale: 1,\n    pulseDurationMs: 0,\n    sparkleCount: 0,\n  },\n  rare: {\n    enabled: true,\n    glowAlpha: 0.035,\n    glowWidth: 252,\n    glowHeight: 186,\n    ringAlpha: 0,\n    pulseScale: 1.035,\n    pulseDurationMs: 1900,\n    sparkleCount: 0,\n  },\n  epic: {\n    enabled: true,\n    glowAlpha: 0.05,\n    glowWidth: 278,\n    glowHeight: 204,\n    ringAlpha: 0.1,\n    pulseScale: 1.045,\n    pulseDurationMs: 1750,\n    sparkleCount: 2,\n  },\n  legendary: {\n    enabled: true,\n    glowAlpha: 0.065,\n    glowWidth: 306,\n    glowHeight: 224,\n    ringAlpha: 0.15,\n    pulseScale: 1.055,\n    pulseDurationMs: 1600,\n    sparkleCount: 4,\n  },\n} as const;\n\nexport const getStandardResultPresence = (rarity: StandardRarity): StandardResultPresenceProfile =>\n  STANDARD_RESULT_PRESENCE[rarity];\n\n"""
          assert marker in text
          text = text.replace(marker, marker + block, 1)
          presentation.write_text(text)

          opening = Path('src/game/scenes/OpeningScene.ts')
          text = opening.read_text()

          old = "  getRewardTrayHeight,\n  getCollectiblePresentation,\n"
          new = "  getRewardTrayHeight,\n  getCollectiblePresentation,\n  getStandardResultPresence,\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  private secretPremiumTargets: Phaser.GameObjects.GameObject[] = [];\n  private resultBreathTarget: Phaser.GameObjects.Container | null = null;\n"
          new = "  private secretPremiumTargets: Phaser.GameObjects.GameObject[] = [];\n  private standardPresenceTargets: Phaser.GameObjects.GameObject[] = [];\n  private resultBreathTarget: Phaser.GameObjects.Container | null = null;\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "    this.clearAmbientMotion();\n    this.clearSecretPremiumMotion();\n    this.clearHudMotion();\n"
          new = "    this.clearAmbientMotion();\n    this.clearSecretPremiumMotion();\n    this.clearStandardPresenceMotion();\n    this.clearHudMotion();\n"
          assert old in text
          text = text.replace(old, new, 1)

          marker = "  private trackSecretPremiumTarget<T extends Phaser.GameObjects.GameObject>(target: T): T {\n    this.secretPremiumTargets.push(target);\n    return target;\n  }\n\n"
          block = """  private clearStandardPresenceMotion(): void {\n    for (const target of this.standardPresenceTargets) this.tweens.killTweensOf(target);\n    this.standardPresenceTargets = [];\n  }\n\n  private trackStandardPresenceTarget<T extends Phaser.GameObjects.GameObject>(target: T): T {\n    this.standardPresenceTargets.push(target);\n    return target;\n  }\n\n  private addPersistentStandardRarityState(\n    parent: Phaser.GameObjects.Container,\n    rarity: StandardRarity,\n    x = 0,\n    y = 0,\n  ): void {\n    const profile = getStandardResultPresence(rarity);\n    if (!profile.enabled) return;\n\n    const color = RARITY_REVEAL_COLORS[rarity];\n    const layer = this.trackStandardPresenceTarget(this.add.container(x, y));\n    layer.setData('standardResultPresence', { rarity, ...profile });\n\n    const glow = this.trackStandardPresenceTarget(\n      this.add\n        .ellipse(0, 6, profile.glowWidth, profile.glowHeight, color, profile.glowAlpha)\n        .setBlendMode(Phaser.BlendModes.ADD),\n    );\n    layer.add(glow);\n    this.tweens.add({\n      targets: glow,\n      scale: profile.pulseScale,\n      alpha: 1.3,\n      duration: profile.pulseDurationMs,\n      yoyo: true,\n      repeat: -1,\n      ease: 'Sine.InOut',\n    });\n\n    if (profile.ringAlpha > 0) {\n      const ring = this.trackStandardPresenceTarget(\n        this.add\n          .circle(0, 2, Math.min(profile.glowWidth, profile.glowHeight) * 0.57, 0xffffff, 0)\n          .setStrokeStyle(2, color, profile.ringAlpha)\n          .setBlendMode(Phaser.BlendModes.ADD),\n      );\n      layer.add(ring);\n      this.tweens.add({\n        targets: ring,\n        scale: profile.pulseScale + 0.025,\n        alpha: 0.56,\n        duration: profile.pulseDurationMs + 260,\n        yoyo: true,\n        repeat: -1,\n        ease: 'Sine.InOut',\n      });\n    }\n\n    for (let index = 0; index < profile.sparkleCount; index += 1) {\n      const angle = (Math.PI * 2 * index) / Math.max(1, profile.sparkleCount) + 0.42;\n      const radius = 104 + (index % 2) * 24;\n      const sparkle = this.trackStandardPresenceTarget(\n        this.add\n          .circle(\n            Math.cos(angle) * radius,\n            Math.sin(angle) * radius * 0.72,\n            index % 2 === 0 ? 2.2 : 1.6,\n            color,\n            0.18 + index * 0.035,\n          )\n          .setBlendMode(Phaser.BlendModes.ADD),\n      );\n      layer.add(sparkle);\n      const baseY = sparkle.y;\n      this.tweens.add({\n        targets: sparkle,\n        y: baseY - 6 - (index % 2) * 3,\n        alpha: Math.min(0.46, 0.3 + index * 0.04),\n        scale: 1.3 + (index % 2) * 0.12,\n        duration: profile.pulseDurationMs + 180 + index * 130,\n        delay: 180 + index * 190,\n        yoyo: true,\n        repeat: -1,\n        repeatDelay: 420 + index * 110,\n        ease: 'Sine.InOut',\n      });\n    }\n\n    parent.add(layer);\n  }\n\n"""
          assert marker in text
          text = text.replace(marker, marker + block, 1)

          old = "    const standardPage = this.add.container(0, getCollectiblePresentation(pending.standard.familyId).revealY);\n    root.add(standardPage);\n    const standardVisual = createCollectibleVisual(\n"
          new = "    const standardPage = this.add.container(0, getCollectiblePresentation(pending.standard.familyId).revealY);\n    root.add(standardPage);\n    this.addPersistentStandardRarityState(standardPage, pending.standard.rarity);\n    const standardVisual = createCollectibleVisual(\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "    } else {\n      const standard = createCollectibleVisual(\n        this,\n        root,\n        pending.standard.familyId,\n        pending.standard.rarity,\n        metrics.centerX,\n        getCollectiblePresentation(pending.standard.familyId).revealY,\n"
          new = "    } else {\n      const standardPresentation = getCollectiblePresentation(pending.standard.familyId);\n      this.addPersistentStandardRarityState(\n        root,\n        pending.standard.rarity,\n        metrics.centerX,\n        standardPresentation.revealY,\n      );\n      const standard = createCollectibleVisual(\n        this,\n        root,\n        pending.standard.familyId,\n        pending.standard.rarity,\n        metrics.centerX,\n        standardPresentation.revealY,\n"
          assert old in text
          text = text.replace(old, new, 1)

          opening.write_text(text)

          tests = Path('tests/presentation.test.ts')
          text = tests.read_text()
          old = "  getRewardTrayHeight,\n  MOTION_PRESENTATION,\n"
          new = "  getRewardTrayHeight,\n  getStandardResultPresence,\n  MOTION_PRESENTATION,\n"
          assert old in text
          text = text.replace(old, new, 1)
          marker = "  it('keeps reveal emergence on one stable z-order path', () => {\n"
          block = """  it('keeps persistent rarity presence restrained and clearly below Secret treatment', () => {\n    const common = getStandardResultPresence('common');\n    const rare = getStandardResultPresence('rare');\n    const epic = getStandardResultPresence('epic');\n    const legendary = getStandardResultPresence('legendary');\n\n    expect(common.enabled).toBe(false);\n    expect(rare.enabled).toBe(true);\n    expect(rare.glowAlpha).toBeLessThan(epic.glowAlpha);\n    expect(epic.glowAlpha).toBeLessThan(legendary.glowAlpha);\n    expect(rare.ringAlpha).toBeLessThan(epic.ringAlpha);\n    expect(epic.ringAlpha).toBeLessThan(legendary.ringAlpha);\n    expect(rare.sparkleCount).toBe(0);\n    expect(epic.sparkleCount).toBeLessThan(legendary.sparkleCount);\n    expect(legendary.sparkleCount).toBeLessThanOrEqual(4);\n    expect(legendary.glowAlpha).toBeLessThanOrEqual(0.07);\n  });\n\n"""
          assert marker in text
          text = text.replace(marker, block + marker, 1)
          tests.write_text(text)
          PY
          git diff --check

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build

      - name: Install browser audit dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run rarity presence visual audit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.ts')
          text = path.read_text()
          marker = "  game.sound.mute = blocked;\n"
          hook = "  if (import.meta.env.DEV) {\n    (window as Window & { __mptRarityAuditGame?: Phaser.Game }).__mptRarityAuditGame = game;\n  }\n"
          assert marker in text
          path.write_text(text.replace(marker, hook + marker, 1))
          PY
          cat > tools/.tmp-rarity-presence-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const outDir = 'tmp-rarity-presence-audit';
          await fs.mkdir(outDir, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ locale: 'en-US', viewport: { width: 1280, height: 720 } });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', (e) => errors.push(`pageerror: ${e.message}`));
          page.on('console', (m) => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
          page.on('requestfailed', (r) => errors.push(`requestfailed: ${r.url()} ${r.failure()?.errorText ?? ''}`));

          async function open() {
            await page.goto('http://127.0.0.1:5173/?platform=mock&debug=1', { waitUntil: 'domcontentloaded' });
            await page.locator('canvas').waitFor({ state: 'visible' });
            await page.waitForFunction(() => Boolean(window.__mptRarityAuditGame?.scene?.getScene('OpeningScene')));
          }
          async function expand() {
            const button = page.getByRole('button', { name: 'DEBUG', exact: true });
            if (await button.count()) await button.click();
          }
          async function collapse() {
            const button = page.getByRole('button', { name: 'Hide', exact: true });
            if (await button.count()) await button.click();
          }
          async function stage(name) {
            await expand();
            await Promise.all([
              page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 10000 }),
              page.getByRole('button', { name, exact: true }).click(),
            ]);
            await page.locator('canvas').waitFor({ state: 'visible' });
            await page.waitForFunction(() => {
              const scene = window.__mptRarityAuditGame?.scene?.getScene('OpeningScene');
              return Boolean(scene?.phase === 'result' && scene?.resultReady && scene?.resultActionPanel?.active);
            }, null, { timeout: 12000 });
            await collapse();
            await page.waitForTimeout(260);
          }
          async function readPresence() {
            return page.evaluate(() => {
              const scene = window.__mptRarityAuditGame?.scene?.getScene('OpeningScene');
              if (!scene) throw new Error('OpeningScene unavailable');
              const found = [];
              const walk = (obj) => {
                if (!obj) return;
                if (typeof obj.getData === 'function') {
                  const data = obj.getData('standardResultPresence');
                  if (data) {
                    const b = obj.getBounds?.();
                    found.push({
                      data,
                      bounds: b ? { left: b.left, top: b.top, right: b.right, bottom: b.bottom, width: b.width, height: b.height } : null,
                    });
                  }
                }
                if (Array.isArray(obj.list)) obj.list.forEach(walk);
              };
              walk(scene.root);
              return {
                rarity: scene.lastReveal?.standard?.rarity ?? null,
                presence: found,
                panelTop: scene.resultActionPanel ? scene.resultActionPanel.y - 56 : null,
                secretPremiumTargets: scene.secretPremiumTargets?.filter((x) => x?.active).length ?? 0,
              };
            });
          }

          const report = { errors, states: {}, failures: [] };
          const fail = (name, pass, detail) => { if (!pass) report.failures.push({ name, detail }); };

          await open();
          const scenarios = [
            ['common', 'Force Common'],
            ['rare', 'Force Rare'],
            ['epic', 'Force Epic'],
            ['legendary', 'Force Legendary (Charged)'],
          ];
          for (const [id, button] of scenarios) {
            await stage(button);
            const state = await readPresence();
            report.states[id] = state;
            await page.screenshot({ path: `${outDir}/${id}.png`, fullPage: true });
            if (id === 'common') fail('common stays clean', state.presence.length === 0, state);
            else {
              fail(`${id} has one presence layer`, state.presence.length === 1, state);
              const profile = state.presence[0]?.data;
              fail(`${id} stays restrained`, Boolean(profile) && profile.glowAlpha <= 0.07 && profile.sparkleCount <= 4, profile);
              const bounds = state.presence[0]?.bounds;
              fail(`${id} presence stays above result panel`, Boolean(bounds) && bounds.bottom < state.panelTop - 40, { bounds, panelTop: state.panelTop });
            }
          }

          await stage('Force Hidden Pocket Duplicate');
          const hidden = await readPresence();
          report.states.hiddenSecret = hidden;
          await page.screenshot({ path: `${outDir}/hidden-secret.png`, fullPage: true });
          fail('secret premium ambience preserved', hidden.secretPremiumTargets > 0, hidden);
          fail('runtime clean', errors.length === 0, errors);

          await fs.writeFile(`${outDir}/report.json`, JSON.stringify(report, null, 2));
          await browser.close();
          if (report.failures.length) {
            console.error(JSON.stringify(report.failures, null, 2));
            process.exitCode = 1;
          }
          JS
          npm run dev -- --host 127.0.0.1 > /tmp/mpt-rarity-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 0.5
          done
          node tools/.tmp-rarity-presence-audit.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rarity-presence-audit
          path: tmp-rarity-presence-audit
          if-no-files-found: ignore

      - name: Commit only product changes
        if: success()
        run: |
          git restore src/main.ts package.json package-lock.json 2>/dev/null || true
          rm -f tools/.tmp-rarity-presence-audit.mjs
          rm -rf tmp-rarity-presence-audit
          git rm .github/workflows/tmp-result-rarity-presence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/data/presentation.ts src/game/scenes/OpeningScene.ts tests/presentation.test.ts
          git diff --cached --check
          git commit -m "Add restrained rarity presence to results"
          git push origin HEAD:polish/result-rarity-presence
