name: Validate Yandex readiness patch

on:
  push:
    branches:
      - release/yandex-draft-readiness

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[yandex-readiness-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python3 tools/yandex-readiness-patch.py
      - name: Assert GameplayAPI marker ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/game/scenes/OpeningScene.ts').read_text()
          create = text.index('public create(): void')
          initialize = text.index('private async initialize(): Promise<void>')
          create_body = text[create:initialize]
          if 'setGameplayDesired(true)' in create_body:
              raise SystemExit('Opening create still starts gameplay during async initialization')
          render = text.index('this.renderIdle(idleMessage);', initialize)
          start = text.index('platform.activity.setGameplayDesired(true);', render)
          ready = text.index('platform.markReady();', start)
          if not render < start < ready:
              raise SystemExit('Expected renderIdle -> gameplay start -> markReady ordering')
          print('Opening marker order: renderIdle -> GameplayAPI start -> LoadingAPI ready')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit readiness correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/scenes/OpeningScene.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[yandex-readiness-patch] align gameplay marker with playable Opening'
          git push origin HEAD:release/yandex-draft-readiness
