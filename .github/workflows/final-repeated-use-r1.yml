name: Final repeated-use browser review R1

on:
  push:
    branches:
      - audit/final-repeated-use-r1

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assert audit-only branch delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet db5215d6f5a3d081a0fc8e1f6510fccedc44a3aa -- . \
            ':(exclude).github/scripts/final-repeated-use-r1.mjs' \
            ':(exclude).github/workflows/final-repeated-use-r1.yml'
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Install browser helpers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chrome
      - name: Start Vite
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/vite.log
          exit 1
      - name: Normalize first-run empty storage for audit harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/final-repeated-use-r1.mjs')
          s = p.read_text()
          old = "    const before = await readSave(page);\n    if (!before || before.pendingReveal) throw new Error(`Opening ${index}: invalid idle save`);"
          new = "    const before = (await readSave(page)) ?? { chips: 0, totalOpens: 0, pendingReveal: null };\n    if (before.pendingReveal) throw new Error(`Opening ${index}: invalid idle save`);"
          if old not in s:
              raise SystemExit('audit harness patch target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run repeated-use normal-loop review
        run: node .github/scripts/final-repeated-use-r1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-repeated-use-r1
          path: /tmp/final-repeated-use-r1
          retention-days: 3
