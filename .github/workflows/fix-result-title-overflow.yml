name: One-shot result title overflow fix

on:
  push:
    branches:
      - fix/result-title-overflow

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/result-title-overflow
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply source fix
        run: node scripts/fix-result-title-overflow.mjs
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit source changes and remove one-shot files
        run: |
          rm -f scripts/fix-result-title-overflow.mjs .github/workflows/fix-result-title-overflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent result title overflow"
          git push origin HEAD:fix/result-title-overflow
