name: Apply Final Runtime Audit Polish

on:
  push:
    branches:
      - fix/runtime-ux-audit-pass
    paths:
      - .github/scripts/final-audit-polish.py
      - .github/workflows/apply-final-audit-polish.yml

permissions:
  contents: write

jobs:
  polish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-ux-audit-pass
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply final audit polish
        run: python .github/scripts/final-audit-polish.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Asset self-test
        run: npm run assets:selftest
      - name: Asset validation
        run: npm run assets:validate
      - name: Build
        run: npm run build
      - name: Commit verified polish and remove temporary files
        run: |
          rm .github/scripts/final-audit-polish.py
          rm .github/workflows/apply-final-audit-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish collectible scaling and localized reveal UI"
          git push origin HEAD:fix/runtime-ux-audit-pass
