name: Promote Airwaves assets

on:
  push:
    branches:
      - feat/airwaves-drop
    paths:
      - tools/assets/promote-airwaves-assets.mjs

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/airwaves-drop
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: node tools/assets/promote-airwaves-assets.mjs
      - name: Commit reviewed runtime assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/collectibles/portable-radio-*.webp
          git add public/assets/collectibles/walkie-talkie-*.webp
          git add public/assets/package/airwaves-*.webp
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Promote Airwaves runtime assets"
          git push origin HEAD:feat/airwaves-drop
