name: Source Export Temp

on:
  push:
    branches:
      - feat/opening-feel-correction

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package source snapshot
        run: |
          tar --exclude=.git -czf /tmp/cases-yg-source.tgz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cases-yg-source
          path: /tmp/cases-yg-source.tgz
          retention-days: 1
