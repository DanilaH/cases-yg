name: Restore ambient motion

on:
  push:
    branches:
      - feat/opening-feel-pass-v2
    paths:
      - .github/workflows/restore-ambient-motion.yml
      - .github/scripts/restore-ambient-motion.py

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/opening-feel-pass-v2
          fetch-depth: 0
      - name: Restore ambient helper
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/restore-ambient-motion.py
          rm .github/scripts/restore-ambient-motion.py
          rm .github/workflows/restore-ambient-motion.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore ambient motion helper'
          git push origin HEAD:feat/opening-feel-pass-v2
