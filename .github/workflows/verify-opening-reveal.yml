name: Verify opening reveal

on:
  push:
    branches:
      - feat/opening-reveal

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/opening-reveal
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Apply reviewed opener fixes once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/scenes/OpeningScene.ts')
          text = path.read_text()

          text = text.replace(
              "  private firstInteractionTracked = false;\n",
              "  private firstInteractionTracked = false;\n  private standardResultLabels: Phaser.GameObjects.Text[] = [];\n",
          )

          text = text.replace(
              "  private createRoot(): Phaser.GameObjects.Container {\n    this.root?.destroy(true);\n",
              "  private createRoot(): Phaser.GameObjects.Container {\n    this.root?.destroy(true);\n    this.pouch = null;\n    this.collectionButton = null;\n    this.resultPrompt = null;\n    this.standardResultLabels = [];\n",
          )

          text = text.replace(
              "    this.renderSignalHud(root, this.saveState.signal);\n    this.createCollectionButton(root, true);\n\n    this.pouch = createPouchVisual(this, root, metrics.centerX, POUCH_Y);",
              "    this.renderSignalHud(root, this.saveState.signal);\n    if (this.saveState.totalOpens > 0) {\n      this.createCollectionButton(root, true);\n    }\n\n    this.pouch = createPouchVisual(this, root, metrics.centerX, POUCH_Y);",
              1,
          )

          text = text.replace(
              "    if (progress >= 1) {\n      const firstInteraction = this.saveState?.totalOpens === 0 && !this.firstInteractionTracked;\n      if (firstInteraction) {\n        this.firstInteractionTracked = true;\n      }\n      void this.completeTear(firstInteraction);\n    }",
              "    if (progress >= 1) {\n      const firstInteraction = this.saveState?.totalOpens === 0 && !this.firstInteractionTracked;\n      void this.completeTear(firstInteraction);\n    }",
          )

          text = text.replace(
              "      if (firstInteraction && pending.openingNumber === 1) {\n        getPlatformRuntime().analytics.track('first_package_interaction');\n      }",
              "      if (firstInteraction && pending.openingNumber === 1) {\n        this.firstInteractionTracked = true;\n        getPlatformRuntime().analytics.track('first_package_interaction');\n      }",
          )

          text = text.replace(
              "    if (this.deferredResize) {\n      this.deferredResize = false;\n      this.renderResolvedResult(pending);\n    } else {\n      this.setChromeEnabled(true);\n      this.addResultPrompt();\n    }",
              "    this.deferredResize = false;\n    this.renderResolvedResult(pending);",
          )

          method_start = text.index("  private addStandardResultLabels(")
          method_end = text.index("  private async animateHiddenPocket(", method_start)
          replacement = '''  private addStandardResultLabels(pending: PendingReveal, x: number, y: number): void {\n    const root = this.root!;\n    const family = SLICE_REGISTRY.familyById.get(pending.standard.familyId);\n    const familyName = family?.name[getPlatformRuntime().language] ?? pending.standard.familyId;\n    const rarity = pending.standard.rarity.toUpperCase();\n    const color = `#${RARITY_REVEAL_COLORS[pending.standard.rarity].toString(16).padStart(6, '0')}`;\n\n    for (const label of this.standardResultLabels) label.destroy();\n\n    const title = this.add\n      .text(x, y, `${familyName} · ${rarity}`, {\n        color,\n        fontFamily: 'system-ui, sans-serif',\n        fontSize: '22px',\n        fontStyle: 'bold',\n      })\n      .setOrigin(0.5);\n\n    let status = pending.standard.isNew ? 'NEW' : 'DUPLICATE';\n    if (pending.signal.lockConsumed) {\n      status += ' · SIGNAL LOCK';\n    } else if (pending.signal.gain > 0) {\n      status += ` · +${pending.signal.gain} SIGNAL`;\n    }\n    if (pending.signal.lockReached) {\n      status += ' · LOCKED';\n    }\n\n    const statusText = this.add\n      .text(x, y + 34, status, {\n        color: pending.standard.isNew ? '#f7f2ff' : '#c7f8ff',\n        fontFamily: 'monospace',\n        fontSize: '16px',\n        fontStyle: 'bold',\n      })\n      .setOrigin(0.5);\n\n    this.standardResultLabels = [title, statusText];\n    root.add(this.standardResultLabels);\n  }\n\n'''
          text = text[:method_start] + replacement + text[method_end:]

          text = text.replace(
              "    await this.wait(320);\n\n    const hiddenLabel = this.add",
              "    await this.wait(320);\n\n    for (const label of this.standardResultLabels) label.destroy();\n    this.standardResultLabels = [];\n\n    const hiddenLabel = this.add",
          )

          text = text.replace(
              "      standard.group.setScale(0.52).setAlpha(0.62);\n      const secret = createCollectibleVisual",
              "      standard.group.setScale(0.52).setAlpha(0.62);\n      const standardFamily = SLICE_REGISTRY.familyById.get(pending.standard.familyId);\n      root.add(\n        this.add\n          .text(\n            metrics.centerX - 188,\n            470,\n            `${standardFamily?.name[getPlatformRuntime().language] ?? pending.standard.familyId} · ${pending.standard.rarity.toUpperCase()}`,\n            {\n              color: '#b9aec8',\n              fontFamily: 'system-ui, sans-serif',\n              fontSize: '14px',\n            },\n          )\n          .setOrigin(0.5)\n          .setAlpha(0.72),\n      );\n      const secret = createCollectibleVisual",
          )

          path.write_text(text)
          PY
          if [ -n "$(git status --porcelain -- src/game/scenes/OpeningScene.ts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/game/scenes/OpeningScene.ts
            git commit -m "Fix opener progressive disclosure and result state"
            git push
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
