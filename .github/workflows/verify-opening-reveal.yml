name: Verify opening reveal

on:
  push:
    branches:
      - feat/opening-reveal

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/opening-reveal
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Patch strict async shutdown checks once
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/scenes/OpeningScene.ts')
          text = path.read_text()
          text = text.replace("this.phase === 'shutdown'", "this.isSceneShutdown()")
          marker = "  private wait(milliseconds: number): Promise<void> {"
          helper = "  private isSceneShutdown(): boolean {\n    return this.phase === 'shutdown';\n  }\n\n"
          if "private isSceneShutdown(): boolean" not in text:
              text = text.replace(marker, helper + marker)
          path.write_text(text)
          PY
          if [ -n "$(git status --porcelain -- src/game/scenes/OpeningScene.ts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/game/scenes/OpeningScene.ts
            git commit -m "Fix async scene shutdown guards"
            git push
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
