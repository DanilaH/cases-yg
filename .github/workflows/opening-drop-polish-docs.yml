name: Validate Opening Drop polish docs

on:
  push:
    branches:
      - polish/opening-drop-selector

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[opening-drop-polish-docs]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/opening-drop-polish-docs.py
      - name: Assert canonical documentation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OPENING_DROP_POLISH_2026-09-10.md' docs/GAMEPLAY_SYSTEMS.md
          grep -q 'latest-selection-wins' docs/GAMEPLAY_SYSTEMS.md
          grep -q 'roughly 5.5 seconds' docs/OPENING_DROP_POLISH_2026-09-10.md
      - name: Commit canonical docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/GAMEPLAY_SYSTEMS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[opening-drop-polish-docs] document Opening Drop interaction contract'
          git push origin HEAD:polish/opening-drop-selector
