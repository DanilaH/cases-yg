name: Finalize post-Secret docs current state

on:
  push:
    branches:
      - docs/sync-secret-postmerge-work

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fix remaining stale current-state wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'target not found in {path}: {old[:80]}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'docs/PROBE_VALIDATION.md',
              '- squash-merged `main`: `f070cbeb0adf8329d8a514d78a1cad0bb1f8d020` via PR #48; subsequent differences from the exact audit head are canonical-doc synchronization/merge history, not runtime behavior;\n- post-merge main CI #274: **PASS**;',
              '- historical Phase 2.6 squash-merged `main`: `f070cbeb0adf8329d8a514d78a1cad0bb1f8d020` via PR #48;\n- historical Phase 2.6 post-merge main CI #274: **PASS**;',
          )
          replace(
              'docs/PROBE_VALIDATION.md',
              'Historical correction scope: `OPENING_FEEL_CORRECTION_SCOPE.md`. Current delta/acceptance contract: `FINAL_HANDS_ON_OVERCHARGE_PLAN.md`.',
              'Historical feel-correction scope: `OPENING_FEEL_CORRECTION_SCOPE.md`. Phase 2.6 contract: `FINAL_HANDS_ON_OVERCHARGE_PLAN.md`. Current post-Phase-2.6 Secret contract: `SECRET_REWARD_CORRECTION.md`.',
          )
          replace(
              'docs/OPEN_QUESTIONS.md',
              'The first repeated hands-on justified the correction, which is now merged and reviewed. Remaining items here are evidence/tuning questions for Phase 2.6, its direct regression, and later hosted/content-scale work.',
              'The repeated hands-on passes justified the bounded corrections, which are now merged and reviewed. Remaining items here are evidence/tuning questions for the current final merged-main regression and later hosted/content-scale work.',
          )
          replace(
              'docs/IMPLEMENTATION_ROADMAP.md',
              'Do not tune legacy economy numbers by intuition. Overcharge gain/cap are allowed only as simulation-driven tuning inside the approved pass. Do not expand content or add unrelated meta systems before hosted DRAFT.',
              'Do not tune legacy economy numbers by intuition. Current Overcharge gain/cap and the fixed `+40 CHIPS` Secret jackpot are locked for this validation build and may be reopened only from evidence. Do not expand content or add unrelated meta systems before hosted DRAFT.',
          )
          PY
          git diff --check
      - name: Commit final docs wording
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs; then
            exit 0
          fi
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add docs
          git commit -m 'Finalize Secret correction docs status'
          git push origin HEAD:docs/sync-secret-postmerge-work
