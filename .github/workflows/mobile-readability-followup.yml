name: Mobile readability follow-up

on:
  push:
    branches:
      - mobile-acceptance-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mobile-acceptance-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Apply reviewed readability follow-up
        run: node tools/mobile-readability-followup.mjs
      - name: Remove one-shot follow-up machinery
        run: rm tools/mobile-readability-followup.mjs .github/workflows/mobile-readability-followup.yml
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Asset self-test
        run: npm run assets:selftest
      - name: Asset validation
        run: npm run assets:validate
      - name: Production build
        run: npm run build
      - name: Commit validated follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish compact mobile readability"
          git push origin HEAD:mobile-acceptance-hardening
