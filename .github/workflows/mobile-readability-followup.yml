name: Mobile readability follow-up

on:
  push:
    branches:
      - mobile-acceptance-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mobile-acceptance-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Apply reviewed readability follow-up
        id: apply
        continue-on-error: true
        run: node tools/mobile-readability-followup.mjs > mobile-followup-output.txt 2>&1
      - name: Persist patch diagnostic on failure
        if: steps.apply.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-followup-output.txt
          git commit -m "chore: capture mobile follow-up failure"
          git push origin HEAD:mobile-acceptance-hardening
      - name: Stop after patch failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat mobile-followup-output.txt
          exit 1
      - name: Remove one-shot follow-up machinery
        if: steps.apply.outcome == 'success'
        run: rm -f mobile-followup-output.txt tools/mobile-readability-followup.mjs .github/workflows/mobile-readability-followup.yml
      - name: Install dependencies
        if: steps.apply.outcome == 'success'
        run: npm ci
      - name: Typecheck
        if: steps.apply.outcome == 'success'
        run: npm run typecheck
      - name: Unit tests
        if: steps.apply.outcome == 'success'
        run: npm test
      - name: Asset self-test
        if: steps.apply.outcome == 'success'
        run: npm run assets:selftest
      - name: Asset validation
        if: steps.apply.outcome == 'success'
        run: npm run assets:validate
      - name: Production build
        if: steps.apply.outcome == 'success'
        run: npm run build
      - name: Commit validated follow-up
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish compact mobile readability"
          git push origin HEAD:mobile-acceptance-hardening
