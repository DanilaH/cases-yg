name: Apply independent docs audit

on:
  push:
    branches:
      - feature/final-hands-on-overcharge

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply docs audit corrections
        run: python .github/scripts/apply-independent-doc-audit.py
      - name: Show docs diff
        run: git diff --check && git diff --stat && git diff -- README.md docs/
      - name: Commit docs corrections
        run: |
          if git diff --quiet; then
            echo 'No docs changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/
          git commit -m 'Reconcile Phase 2.6 docs after independent audit'
          git push
