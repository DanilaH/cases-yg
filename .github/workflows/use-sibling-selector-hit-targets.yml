name: Use sibling selector hit targets

on:
  push:
    branches:
      - fix/pouch-selector-hitbox
    paths:
      - .github/workflows/use-sibling-selector-hit-targets.yml
      - .github/scripts/use-sibling-selector-hit-targets.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pouch-selector-hitbox
          fetch-depth: 0
      - name: Apply root-space selector hit targets
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/use-sibling-selector-hit-targets.py
          rm .github/scripts/use-sibling-selector-hit-targets.py
          rm .github/workflows/use-sibling-selector-hit-targets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use root-space pouch selector hit targets'
          git push origin HEAD:fix/pouch-selector-hitbox
