name: Mobile HUD and Charged guidance pass

on:
  push:
    branches: [mobile-hud-charged-guidance-pass]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-hud-guidance-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mobile-hud-charged-guidance-pass
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply HUD and guidance pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Shared compact chrome geometry.
          path = Path('src/game/systems/openingChromeLayout.ts')
          text = path.read_text()
          text = text.replace(
              '  signalHudHeight: number;\n  railCardWidth: number;\n',
              '  signalHudHeight: number;\n  hudGap: number;\n  railCardWidth: number;\n',
          )
          text = text.replace(
              '  chipsHudHeight: compact ? 84 : OPENING_FEEL_PRESENTATION.chipsHudHeight,\n  signalHudWidth: compact ? 286 : OPENING_FEEL_PRESENTATION.signalHudWidth,\n  signalHudHeight: compact ? 88 : OPENING_FEEL_PRESENTATION.signalHudHeight,\n',
              '  chipsHudHeight: compact ? 96 : OPENING_FEEL_PRESENTATION.chipsHudHeight,\n  signalHudWidth: compact ? 286 : OPENING_FEEL_PRESENTATION.signalHudWidth,\n  signalHudHeight: compact ? 112 : OPENING_FEEL_PRESENTATION.signalHudHeight,\n  hudGap: compact ? 14 : 10,\n',
          )
          text = text.replace(
              '  selectorTopOffset: compact ? 214 : OPENING_FEEL_PRESENTATION.selectorTopOffset,\n',
              '  selectorTopOffset: compact ? 256 : OPENING_FEEL_PRESENTATION.selectorTopOffset,\n',
          )
          path.write_text(text)

          # Opening HUD internals + exact guidance readiness + compact-aware Signal targets.
          path = Path('src/game/scenes/OpeningScene.ts')
          text = path.read_text()
          text = text.replace(
              '  private getChromeSizing() {\n    return getOpeningChromeSizing(this.metrics?.compactChrome ?? false);\n  }\n',
              '''  public isPouchSelectorReadyForGuidance(pouchType: PouchType = 'charged'): boolean {\n    if (this.phase !== 'idle' || this.dropSwitchInFlight || this.pouchArtLoadInFlight) return false;\n    const card = this.pouchSelectorButtons.find((item) => item.getData('pouchType') === pouchType);\n    if (!card?.active || !card.visible) return false;\n    const idleAlpha = Number(card.getData('idleAlpha') ?? 1);\n    return card.alpha >= Math.max(0.01, idleAlpha * 0.9);\n  }\n\n  private getChromeSizing() {\n    return getOpeningChromeSizing(this.metrics?.compactChrome ?? false);\n  }\n\n  private getSignalHudCenter(): { x: number; y: number } {\n    if (!this.metrics) return { x: 0, y: 0 };\n    const chrome = this.getChromeSizing();\n    return {\n      x: this.metrics.safeLeft + chrome.signalHudWidth / 2,\n      y:\n        this.metrics.safeTop +\n        OPENING_FEEL_PRESENTATION.railTopOffset +\n        chrome.chipsHudHeight +\n        chrome.hudGap +\n        chrome.signalHudHeight / 2,\n    };\n  }\n''',
          )
          text = text.replace(
              '    const token = createChipToken(this, chrome.compact ? 30 : 24, chrome.compact ? 53 : 37, chrome.compact ? 1.05 : 0.86);\n',
              '    const token = createChipToken(this, chrome.compact ? 30 : 24, chrome.compact ? 58 : 37, chrome.compact ? 1.05 : 0.86);\n',
          )
          text = text.replace(
              ".text(chrome.compact ? 62 : 49, chrome.compact ? 13 : 10, messages.opening.chips, {",
              ".text(chrome.compact ? 62 : 49, chrome.compact ? 14 : 10, messages.opening.chips, {",
          )
          text = text.replace(
              ".text(chrome.compact ? 62 : 48, chrome.compact ? 61 : 40, `${Math.max(0, Math.floor(chips))}`, {",
              ".text(chrome.compact ? 62 : 48, chrome.compact ? 72 : 40, `${Math.max(0, Math.floor(chips))}`, {",
          )
          text = text.replace(
              '    const y = this.metrics.safeTop + OPENING_FEEL_PRESENTATION.railTopOffset + chrome.chipsHudHeight + 10;\n',
              '    const y = this.metrics.safeTop + OPENING_FEEL_PRESENTATION.railTopOffset + chrome.chipsHudHeight + chrome.hudGap;\n',
          )
          text = text.replace(
              '    const label = this.add.text(14, 7, labelText, {\n',
              '    const label = this.add.text(14, chrome.compact ? 11 : 7, labelText, {\n',
          )
          text = text.replace(
              '    const value = this.add.text(width - 14, 7, `${clamped}/${threshold}`, {\n',
              '    const value = this.add.text(width - 14, chrome.compact ? 11 : 7, `${clamped}/${threshold}`, {\n',
          )
          text = text.replace(
              '    const overchargeLabel = this.add.text(14, chrome.compact ? 38 : 27, messages.opening.overcharge, {\n',
              '    const overchargeLabel = this.add.text(14, chrome.compact ? 48 : 27, messages.opening.overcharge, {\n',
          )
          text = text.replace(
              '      chrome.compact ? 38 : 27,\n',
              '      chrome.compact ? 48 : 27,\n',
              1,
          )
          text = text.replace(
              '          chrome.compact ? 76 : 50,\n',
              '          chrome.compact ? 98 : 50,\n',
          )
          text = text.replace(
              '''    const signalOrigin = {\n      x: this.metrics.safeLeft + OPENING_FEEL_PRESENTATION.signalHudWidth / 2,\n      y:\n        this.metrics.safeTop +\n        OPENING_FEEL_PRESENTATION.railTopOffset +\n        OPENING_FEEL_PRESENTATION.chipsHudHeight +\n        10 +\n        OPENING_FEEL_PRESENTATION.signalHudHeight / 2,\n    };\n''',
              '    const signalOrigin = this.getSignalHudCenter();\n',
          )
          text = text.replace(
              '''    const signalTarget = {\n      x: this.metrics.safeLeft + OPENING_FEEL_PRESENTATION.signalHudWidth / 2,\n      y:\n        this.metrics.safeTop +\n        OPENING_FEEL_PRESENTATION.railTopOffset +\n        OPENING_FEEL_PRESENTATION.chipsHudHeight +\n        10 +\n        OPENING_FEEL_PRESENTATION.signalHudHeight / 2,\n    };\n''',
              '    const signalTarget = this.getSignalHudCenter();\n',
          )
          path.write_text(text)

          # Guidance waits for the actual Charged card instead of wallet truth alone.
          path = Path('src/game/scenes/GuidanceScene.ts')
          text = path.read_text()
          text = text.replace(
              "import { createGuidancePointer, type GuidancePointer } from '../ui/onboardingGuidance';\n",
              "import { createGuidancePointer, type GuidancePointer } from '../ui/onboardingGuidance';\nimport type { OpeningScene } from './OpeningScene';\n",
          )
          old_update = '''  public update(): void {\n    const openingSceneActive = this.scene.isActive('OpeningScene');\n    if (openingSceneActive === this.wasOpeningSceneActive) return;\n    this.wasOpeningSceneActive = openingSceneActive;\n\n    if (!openingSceneActive) {\n      this.hideOpeningGuidance();\n      return;\n    }\n\n    void this.refreshState();\n  }\n'''
          new_update = '''  public update(): void {\n    const openingSceneActive = this.scene.isActive('OpeningScene');\n    if (openingSceneActive !== this.wasOpeningSceneActive) {\n      this.wasOpeningSceneActive = openingSceneActive;\n      if (!openingSceneActive) {\n        this.hideOpeningGuidance();\n        return;\n      }\n      void this.refreshState();\n    }\n\n    if (openingSceneActive) this.syncChargedPointer();\n  }\n'''
          if old_update not in text:
              raise SystemExit('GuidanceScene update block not found')
          text = text.replace(old_update, new_update)
          text = text.replace(
              '''    const shouldShow = shouldShowChargedOnboardingPointer(\n      this.state,\n      this.selectedPouchType,\n      GAME_REGISTRY,\n      LITE_V2_BALANCE,\n    );\n''',
              '''    const openingScene = this.scene.get('OpeningScene') as OpeningScene;\n    const chargedControlReady = openingScene.isPouchSelectorReadyForGuidance('charged');\n    const shouldShow = shouldShowChargedOnboardingPointer(\n      this.state,\n      this.selectedPouchType,\n      GAME_REGISTRY,\n      LITE_V2_BALANCE,\n      chargedControlReady,\n    );\n''',
          )
          text = text.replace(
              '      chrome.chipsHudHeight +\n      10 +\n      chrome.signalHudHeight / 2;\n',
              '      chrome.chipsHudHeight +\n      chrome.hudGap +\n      chrome.signalHudHeight / 2;\n',
          )
          path.write_text(text)

          # Pure policy now explicitly includes presentation readiness.
          path = Path('src/game/systems/onboarding.ts')
          text = path.read_text()
          text = text.replace(
              '''  registry: ContentRegistry,\n  balance: LiteBalanceConfig,\n): boolean =>\n  state.pendingReveal === null &&\n''',
              '''  registry: ContentRegistry,\n  balance: LiteBalanceConfig,\n  chargedControlReady: boolean,\n): boolean =>\n  chargedControlReady &&\n  state.pendingReveal === null &&\n''',
          )
          path.write_text(text)

          # Focused geometry coverage.
          path = Path('tests/openingChromeLayout.test.ts')
          text = path.read_text()
          text = text.replace(
              '''    expect(metrics.compactChrome).toBe(true);\n    expect(geometry.basic.width).toBe(286);\n''',
              '''    expect(metrics.compactChrome).toBe(true);\n    expect(geometry.chrome.chipsHudHeight).toBe(96);\n    expect(geometry.chrome.signalHudHeight).toBe(112);\n    expect(geometry.chrome.hudGap).toBe(14);\n    expect(geometry.chrome.selectorTopOffset - (8 + geometry.chrome.chipsHudHeight + geometry.chrome.hudGap + geometry.chrome.signalHudHeight)).toBeGreaterThanOrEqual(20);\n    expect(geometry.basic.width).toBe(286);\n''',
          )
          text = text.replace(
              '''    expect(desktop.chipsHudWidth).toBe(216);\n    expect(desktop.railCardWidth).toBe(216);\n''',
              '''    expect(desktop.chipsHudWidth).toBe(216);\n    expect(desktop.chipsHudHeight).toBe(64);\n    expect(desktop.signalHudHeight).toBe(64);\n    expect(desktop.hudGap).toBe(10);\n    expect(desktop.railCardWidth).toBe(216);\n''',
          )
          path.write_text(text)

          # Focused Charged sequencing coverage.
          path = Path('tests/onboarding.test.ts')
          text = path.read_text()
          text = text.replace(
              "    expect(shouldShowChargedOnboardingPointer(eligible, 'basic', DEFAULT_DROP_REGISTRY, LITE_V2_BALANCE)).toBe(true);\n",
              "    expect(shouldShowChargedOnboardingPointer(eligible, 'basic', DEFAULT_DROP_REGISTRY, LITE_V2_BALANCE, true)).toBe(true);\n    expect(shouldShowChargedOnboardingPointer(eligible, 'basic', DEFAULT_DROP_REGISTRY, LITE_V2_BALANCE, false)).toBe(false);\n",
          )
          text = text.replace(
              "    expect(shouldShowChargedOnboardingPointer(eligible, 'charged', DEFAULT_DROP_REGISTRY, LITE_V2_BALANCE)).toBe(false);\n",
              "    expect(shouldShowChargedOnboardingPointer(eligible, 'charged', DEFAULT_DROP_REGISTRY, LITE_V2_BALANCE, true)).toBe(false);\n",
          )
          text = text.replace(
              '''        DEFAULT_DROP_REGISTRY,\n        LITE_V2_BALANCE,\n      ),\n''',
              '''        DEFAULT_DROP_REGISTRY,\n        LITE_V2_BALANCE,\n        true,\n      ),\n''',
              1,
          )
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Asset self-test
        run: npm run assets:selftest
      - name: Asset validation
        run: npm run assets:validate
      - name: Production build
        run: npm run build
      - name: Remove one-shot workflow
        run: rm .github/workflows/mobile-hud-guidance-pass.yml
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/systems/openingChromeLayout.ts src/game/scenes/OpeningScene.ts src/game/scenes/GuidanceScene.ts src/game/systems/onboarding.ts tests/openingChromeLayout.test.ts tests/onboarding.test.ts .github/workflows/mobile-hud-guidance-pass.yml
          git commit -m "Tighten mobile HUD and Charged guidance [mobile-hud-guidance-done]"
          git push origin HEAD:mobile-hud-charged-guidance-pass
