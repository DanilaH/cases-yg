name: Run Runtime UX Refinement Script

on:
  push:
    branches:
      - fix/runtime-ux-audit-pass
    paths:
      - .github/workflows/run-refine-runtime-ux-script.yml

permissions:
  contents: write

jobs:
  refine-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-ux-audit-pass
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - name: Extract and run refinement script
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/refine-runtime-ux-audit.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/refine-runtime-ux.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/refine-runtime-ux.py
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
      - name: Commit refinement and remove temporary workflows
        run: |
          rm .github/workflows/refine-runtime-ux-audit.yml
          rm .github/workflows/run-refine-runtime-ux-script.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine compact collection UX"
          git push origin HEAD:fix/runtime-ux-audit-pass
