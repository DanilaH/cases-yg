name: Materialize AVIF quality candidate

# Temporary branch-only materializer. Remove before merge.
on:
  push:
    branches:
      - perf/avif-quality-audit
    paths:
      - tools/assets/build-runtime-avif.mjs
      - .github/workflows/materialize-avif-quality-candidate.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - name: Build category-specific AVIF companions
        run: npm run assets:avif:build
      - name: Validate candidate
        run: |
          npm run assets:avif:validate
          npm run typecheck
          npm test
          npm run build
      - name: Commit generated AVIF candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "perf: materialize category AVIF quality profile"
          git push origin HEAD:${GITHUB_REF_NAME}
