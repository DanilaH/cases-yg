name: Fix result press interaction

on:
  push:
    branches:
      - feat/opening-feel-pass-v2
    paths:
      - .github/workflows/fix-result-press.yml
      - .github/scripts/fix-result-press.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/opening-feel-pass-v2
          fetch-depth: 0
      - name: Apply result press fix
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/fix-result-press.py
          rm .github/scripts/fix-result-press.py
          rm .github/workflows/fix-result-press.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep result acceptance on pointer release'
          git push origin HEAD:feat/opening-feel-pass-v2
