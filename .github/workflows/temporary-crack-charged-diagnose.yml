name: Temporary charged tear diagnostics
on:
  push:
    branches: [feat/pouch-crack-dissolve-prototype-20260916]
    paths: [.github/workflows/temporary-crack-charged-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      VITE_PLATFORM_RUNTIME: mock
      VITE_DEBUG_PANEL: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: 22.12.0, package-manager-cache: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: |
          npm ci
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Execute same charged test independently with state-on-failure evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/temporary-crack-lifecycle-browser.yml').read_text()
          code=textwrap.dedent(workflow.split("cat > /tmp/crack_lifecycle.py <<'PY'\n",1)[1].split('\n          PY',1)[0])
          assert code.count("for scenario in ('skip-repeat-basic','refresh-resize-charged'):")==1
          code=code.replace("for scenario in ('skip-repeat-basic','refresh-resize-charged'):","for scenario in ('refresh-resize-charged',):")
          code=code.replace('                              await tear(page)\n                              await page.wait_for_function(', "                              await page.screenshot(path=str(OUT/'charged-before-tear.png'))\n                              await tear(page)\n                              await page.screenshot(path=str(OUT/'charged-after-tear.png'))\n                              print('CHARGED_AFTER_TEAR',await state(page),'errors',errors,flush=True)\n                              await page.wait_for_function(")
          Path('/tmp/charged-diagnose.py').write_text(code)
          balance=Path('src/game/data/balance.ts');s=balance.read_text()
          for before in ('      rarityWeights: {\n        common: 72,\n        rare: 25,\n        epic: 3,\n        legendary: 0,\n      },','      rarityWeights: {\n        common: 35,\n        rare: 40,\n        epic: 20,\n        legendary: 5,\n      },'):
              assert s.count(before)==1
              s=s.replace(before,'      rarityWeights: {\n        common: 0,\n        rare: 100,\n        epic: 0,\n        legendary: 0,\n      },',1)
          balance.write_text(s)
          PY
          npm run build
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/charged.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python /tmp/charged-diagnose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charged-diagnosis-screens
          path: crack-lifecycle-browser/
          if-no-files-found: ignore
          retention-days: 3