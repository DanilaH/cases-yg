name: Apply Overcharge engine v3

on:
  push:
    branches:
      - feature/final-hands-on-overcharge

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply engine patch
        run: |
          python .github/scripts/apply-overcharge-engine.py
          python .github/scripts/fix-overcharge-engine-output.py
          python .github/scripts/fix-overcharge-engine-tests.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Assets
        run: npm run assets:selftest && npm run assets:validate
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check && git diff --stat
      - name: Commit engine
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Implement deterministic Signal Overcharge engine'
          git push
