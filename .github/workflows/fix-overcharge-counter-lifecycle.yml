name: Apply Overcharge counter lifecycle fix

on:
  push:
    branches:
      - fix/overcharge-counter-lifecycle

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - name: Apply bounded source patch
        run: node .github/scripts/fix-overcharge-counter-lifecycle.mjs
      - name: Verify and commit source patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/game/scenes/OpeningScene.ts; then
            echo "Source patch already present; nothing to commit."
            exit 0
          fi
          npm run typecheck
          npm test
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts
          git commit -m "Guard Overcharge bonus counter after UI teardown"
          git push
