name: Fix selector interactive signature

on:
  push:
    branches:
      - fix/pouch-selector-hitbox
    paths:
      - .github/workflows/fix-selector-interactive-signature.yml
      - .github/scripts/fix-selector-interactive-signature.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pouch-selector-hitbox
          fetch-depth: 0
      - name: Apply supported Phaser input configuration
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/fix-selector-interactive-signature.py
          rm .github/scripts/fix-selector-interactive-signature.py
          rm .github/workflows/fix-selector-interactive-signature.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use supported selector input config'
          git push origin HEAD:fix/pouch-selector-hitbox
