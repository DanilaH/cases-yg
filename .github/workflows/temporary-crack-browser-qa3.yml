name: Temporary crack dissolve visual acceptance
on:
  push:
    branches: [feat/pouch-crack-dissolve-prototype-20260916]
    paths: [.github/workflows/temporary-crack-browser-qa3.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    env:
      VITE_PLATFORM_RUNTIME: mock
      VITE_DEBUG_PANEL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Extract existing deterministic QA without changing gameplay RNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/temporary-crack-browser-qa.yml').read_text()
          script=textwrap.dedent(source.split("cat > /tmp/qa-crack.py <<'PY'\n",1)[1].split('\n          PY',1)[0])
          old='      await page.wait_for_timeout(2400)'
          new="      await page.locator('#startup-preload').wait_for(state='hidden',timeout=90000)\n      await page.wait_for_timeout(3500)"
          assert script.count(old)==1
          script=script.replace(old,new).replace('for index in range(35):','for index in range(65):')
          Path('/tmp/qa-crack-deterministic.py').write_text(script)
          PY
      - name: Record real rare/basic and legendary/charged tears
        run: |
          for rarity in rare legendary; do
            python - "$rarity" <<'PY'
          from pathlib import Path
          import subprocess,sys
          rarity=sys.argv[1]
          assert rarity in ('rare','legendary')
          source=subprocess.check_output(['git','show','HEAD:src/game/data/balance.ts'],text=True)
          blocks=(
            '      rarityWeights: {\n        common: 72,\n        rare: 25,\n        epic: 3,\n        legendary: 0,\n      },',
            '      rarityWeights: {\n        common: 35,\n        rare: 40,\n        epic: 20,\n        legendary: 5,\n      },',
          )
          forced='      rarityWeights: {\n        common: 0,\n        rare: '+('100' if rarity=='rare' else '0')+',\n        epic: 0,\n        legendary: '+('100' if rarity=='legendary' else '0')+',\n      },'
          for block in blocks:
            assert source.count(block)==1
            source=source.replace(block,forced,1)
          Path('src/game/data/balance.ts').write_text(source)
          print('QA-only forced tier:',rarity)
          PY
            npm run build
            python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/crack-preview.log 2>&1 &
            server=$!
            sleep 2
            python /tmp/qa-crack-deterministic.py "$rarity" || { kill "$server" 2>/dev/null || true; exit 1; }
            kill "$server" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-crack-visual-acceptance-rare-legendary
          path: crack-browser-qa/
          if-no-files-found: ignore
          retention-days: 3
