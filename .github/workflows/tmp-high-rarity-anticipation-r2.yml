name: TEMP high rarity anticipation R2

on:
  push:
    branches:
      - polish/high-rarity-anticipation-r1

permissions:
  contents: write

jobs:
  implement-audit-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/high-rarity-anticipation-r1
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Reuse bounded product patch from R1
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/tmp-high-rarity-anticipation-r1.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply bounded anticipation and rarity-mass pass\n'
          start = text.index(marker)
          run_start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('\n\n      - run: npm ci', run_start)
          lines = text[run_start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-r1.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-r1.sh

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build

      - name: Corrected product contract guard
        run: |
          python - <<'PY'
          from pathlib import Path
          scene = Path('src/game/scenes/OpeningScene.ts').read_text(encoding='utf-8')
          audio = Path('src/game/systems/audio.ts').read_text(encoding='utf-8')
          presentation = Path('src/game/data/presentation.ts').read_text(encoding='utf-8')
          assert "audio.beginRevealAnticipation(pending.standard.rarity, fx.anticipationHoldMs)" in scene
          assert "getGameAudio().beginRevealAnticipation('secret', fx.anticipationHoldMs)" in scene
          assert 'fx.aftershockScale > 1' in scene
          assert 'beginRevealAnticipation' in audio
          assert 'REVEAL_ANTICIPATION_AUDIO' in Path('src/game/data/audioPresentation.ts').read_text(encoding='utf-8')
          assert 'session.commitReveal()' in scene
          section = scene.split('private async animateStandardReveal', 1)[1].split('private async animateRecoveredReveal', 1)[0]
          assert 'commitReveal' not in section
          assert 'prepareReveal' not in section
          assert 'resolve' not in section.lower()
          # Five preset values plus one interface field declaration.
          assert presentation.count('anticipationHoldMs:') == 6
          PY
          git diff --check

      - name: Install browser audit dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Reuse R1 browser audit
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/tmp-high-rarity-anticipation-r1.yml').read_text(encoding='utf-8')
          marker = '      - name: Run anticipation browser audit\n'
          start = text.index(marker)
          run_start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('\n\n      - uses: actions/upload-artifact@v4', run_start)
          lines = text[run_start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/browser-r1.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/browser-r1.sh

      - uses: actions/upload-artifact@v4
        with:
          name: high-rarity-anticipation-audit-r2
          path: audit-artifacts
          if-no-files-found: error

      - name: Restore audit-only changes and commit clean product tree
        run: |
          git checkout -- src/main.ts
          rm -f tools/tmp-anticipation-audit.mjs
          rm -rf audit-artifacts
          rm -f .github/workflows/tmp-high-rarity-anticipation-r1.yml
          rm -f .github/workflows/tmp-high-rarity-anticipation-r2.yml
          git status --short
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish high rarity anticipation and settle'
          git push origin HEAD:polish/high-rarity-anticipation-r1
