name: TEMP sync audio feel docs

on:
  push:
    branches:
      - docs/sync-audio-reward-feel-implemented

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/sync-audio-reward-feel-implemented
          fetch-depth: 0

      - name: Sync implemented feel plan and roadmap
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'anchor missing in {path}: expected {count}, got {actual}: {old[:180]!r}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          feel = 'docs/AUDIO_AND_REWARD_FEEL_POLISH_PLAN.md'
          replace(
              feel,
              'Status: **APPROVED BACKLOG / DO NOT LOSE**',
              'Status: **IMPLEMENTED / COMBINED-AUDITED / FINAL HEADPHONE HANDS-ON PENDING**',
          )
          replace(
              feel,
              'The current external gate remains hosted Yandex DRAFT unless explicitly reprioritized. This plan is the next bounded polish backlog and may be pulled forward deliberately, but it must not silently invalidate the existing gate order.',
              'The bounded implementation in this plan was deliberately pulled forward and is now merged. The current external gate still remains hosted Yandex DRAFT unless explicitly reprioritized. Automated and browser acceptance are green, but the subjective final headphone check required by this document has not been replaced by automation.',
          )
          order_anchor = """7. **Near-completion presentation**\n\nDo not implement all seven blindly in one giant patch. Each pass should remain bounded and independently reviewable, while final approval must judge the combined loop because feel depends on choreography across states.\n\n---\n\n# 14. Validation matrix\n"""
          order_replacement = """7. **Near-completion presentation**\n\nDo not implement all seven blindly in one giant patch. Each pass should remain bounded and independently reviewable, while final approval must judge the combined loop because feel depends on choreography across states.\n\n## Implementation status — 2026-09-08\n\nAll seven bounded passes are implemented and merged without expanding the economy/content scope:\n\n- **#75–#76 — audio presence/state ownership:** base gameplay ambience, persistent Rare/Epic/Legendary/Secret result ambience, explicit duck/mix policy, Hidden Pocket active-page ownership, mute/block/teardown handling, and stable-result ownership correction;\n- **#77 — NEW vs DUPLICATE:** catalogue-registration discovery beat for NEW and a separate recycle/conversion beat for duplicates;\n- **#78 — collect/banking handoff:** short collection acknowledgement, item contraction/nudge, controlled result exit and existing destination-based banking;\n- **#79 — drag/tear tactility:** quiet reusable filtered-noise texture driven by drag progress/velocity with deterministic release/cancel/mute/teardown cleanup;\n- **#80 — high-rarity anticipation/settle:** Common/Rare remain fast, Epic/Legendary/Secret receive bounded anticipation collapse and rarity-specific settle mass, with the secondary micro-aftershock reserved for Legendary;\n- **#81 — collection milestones:** one-shot `4/8`, `8/8`, first Secret and `2/2` Secret milestones, resolved only after durable commit and presented non-blockingly;\n- **#82 — near-completion tension:** typed `7/8` read state, subtle Collection reinforcement, actual final missing-slot emphasis and low-priority result-tray copy, with Hidden Pocket page semantics preserved.\n\nFinal combined automated/browser acceptance was run from exact merged `main` `60432c8d7da1049bff9ec9230527a67b4e5b3cb0` in workflow run `34266189951`. Typecheck, full tests, asset self-test/validation, production build, source-contract guard and the combined browser lifecycle all passed. The combined artifact `final-feel-combined-audit-r1` has digest `sha256:52b15131f568eed1319ce962b00b6f4d8a694096f28c64612f91896938617ca4`; it covered base ambience unlock, Common/Rare/Epic/Legendary/Secret result ownership, mute/unmute, high-rarity anticipation cleanup, Hidden Pocket standard↔Secret audio/visual state, repeated-loop source counts, drag texture teardown, collect/banking return to idle, near-completion presentation and one-shot milestones with zero runtime or failed-request diagnostics. Key screenshots were manually reviewed after the run.\n\nThis closes the implementation backlog and automated combined regression. It does **not** waive the acceptance principle below: final subjective repeated-use listening in headphones (and, ideally, ordinary speakers) is still required to judge annoyance, loudness, timbre and whether the scene became meaningfully better rather than merely busier.\n\n---\n\n# 14. Validation matrix\n"""
          replace(feel, order_anchor, order_replacement)

          roadmap = 'docs/IMPLEMENTATION_ROADMAP.md'
          replace(
              roadmap,
              """10. **Result/reveal choreography correction after local visual review — COMPLETE / TARGETED-BROWSER-AUDITED / MERGED (#63–#65)**\n11. **Real Yandex DRAFT validation — CURRENT NEXT EXTERNAL GATE**\n12. **Content/release expansion — BLOCKED until draft passes**\n13. **Public release hardening**\n""",
              """10. **Result/reveal choreography correction after local visual review — COMPLETE / TARGETED-BROWSER-AUDITED / MERGED (#63–#65)**\n11. **Audio + reward feel bounded polish — IMPLEMENTED / COMBINED-AUDITED / MERGED (#75–#82)**\n12. **Real Yandex DRAFT validation — CURRENT NEXT EXTERNAL GATE**\n13. **Content/release expansion — BLOCKED until draft passes**\n14. **Public release hardening**\n""",
          )
          replace(
              roadmap,
              'Those changes were targeted-browser-audited and merged without changing economy/save/drop/platform semantics. Hosted Yandex DRAFT is now the current gate.',
              'Those changes were targeted-browser-audited and merged without changing economy/save/drop/platform semantics. The separate bounded Audio + Reward Feel plan was then deliberately pulled forward and completed across PRs #75–#82: gameplay ambience, stable rarity ambience, NEW/duplicate differentiation, collect/banking handoff, drag tactility, high-rarity anticipation/settle, collection milestones and 7/8 near-completion presentation. Exact merged `main` `60432c8d7da1049bff9ec9230527a67b4e5b3cb0` then passed the combined feel lifecycle audit in run `34266189951` with artifact digest `sha256:52b15131f568eed1319ce962b00b6f4d8a694096f28c64612f91896938617ca4`, zero runtime/failed-request diagnostics and manual screenshot review. Subjective repeated-use headphone acceptance still remains a hands-on check rather than an automated claim. Hosted Yandex DRAFT remains the current external gate.',
          )
          phase_anchor = """PR #65 changed presentation only: no economy, Save V4, drop, transaction or Yandex platform semantics changed. Targeted Chromium audit reported zero page/console/request errors and the intended visual states were manually reviewed before the clean merge. The next gate remains hosted Yandex DRAFT.\n\n---\n\n# Deferred information pass — NOT PART OF 2.1\n"""
          phase_replacement = """PR #65 changed presentation only: no economy, Save V4, drop, transaction or Yandex platform semantics changed. Targeted Chromium audit reported zero page/console/request errors and the intended visual states were manually reviewed before the clean merge.\n\n---\n\n# Phase 2.9 — Audio + Reward Feel bounded polish — IMPLEMENTED / COMBINED-AUDITED / MERGED\n\nCanonical contract: `docs/AUDIO_AND_REWARD_FEEL_POLISH_PLAN.md`.\n\nThe seven independently reviewable feel passes were implemented through PRs #75–#82 without adding currencies, meta systems, Drop content, pity/targeting rules or a new animation architecture:\n\n1. base ambience + persistent rarity ambience + explicit mix/state rules (#75, lifecycle correction #76);\n2. NEW discovery vs DUPLICATE conversion feel (#77);\n3. collect/banking exit choreography (#78);\n4. continuous drag/tear tactility (#79);\n5. high-rarity anticipation, deliberate ambience collapse and rarity-specific settle (#80);\n6. bounded collection milestone moments (#81);\n7. 7/8 near-completion presentation in Opening + Collection (#82).\n\nAfter the final merge, exact `main` `60432c8d7da1049bff9ec9230527a67b4e5b3cb0` passed the combined automated/browser lifecycle audit in run `34266189951`. The artifact `final-feel-combined-audit-r1` digest is `sha256:52b15131f568eed1319ce962b00b6f4d8a694096f28c64612f91896938617ca4`. Static gates and the combined browser lifecycle were green; no runtime/page or failed-request diagnostics were observed; repeated rarity switching did not grow persistent source counts; Hidden Pocket page ownership, mute/unmute, drag teardown, collect→idle cleanup, near-completion and milestone one-shot semantics all passed. Audit screenshots were manually reviewed.\n\nPer the canonical plan, this is **technical/combined-browser acceptance**, not a substitute for the final subjective repeated-use headphone check. That final listening pass should judge mix fatigue, relative loudness, timbre and whether the new ambience improves the loop over several consecutive openings. No further feature expansion is implied by that check.\n\nThe next external gate remains hosted Yandex DRAFT.\n\n---\n\n# Deferred information pass — NOT PART OF 2.1\n"""
          replace(roadmap, phase_anchor, phase_replacement)
          PY

          git diff --check
          grep -F 'Status: **IMPLEMENTED / COMBINED-AUDITED / FINAL HEADPHONE HANDS-ON PENDING**' docs/AUDIO_AND_REWARD_FEEL_POLISH_PLAN.md
          grep -F 'Audio + reward feel bounded polish — IMPLEMENTED / COMBINED-AUDITED / MERGED (#75–#82)' docs/IMPLEMENTATION_ROADMAP.md

      - name: Commit clean docs-only tree
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-sync-audio-feel-docs.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' docs/AUDIO_AND_REWARD_FEEL_POLISH_PLAN.md docs/IMPLEMENTATION_ROADMAP.md | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync implemented audio and reward feel status'
          git push origin HEAD:docs/sync-audio-reward-feel-implemented
