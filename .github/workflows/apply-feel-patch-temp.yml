name: Apply Feel Patch Temp

on:
  push:
    branches:
      - feat/opening-feel-correction

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply locally reviewed feel-pass patch
        shell: bash
        run: |
          cat > /tmp/feel.patch.gz.b64 <<'PATCH_B64'
[... ELLIPSIZATION ...]
PATCH_B64
          base64 -d /tmp/feel.patch.gz.b64 | gzip -d > /tmp/feel.patch
          patch -p1 --forward < /tmp/feel.patch
          rm -f /tmp/feel.patch /tmp/feel.patch.gz.b64
      - name: Commit product implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Implement opening feel correction"
          git push
