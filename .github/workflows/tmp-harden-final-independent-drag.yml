name: Temporary harden independent audit drag driver

on:
  push:
    branches:
      - audit/final-independent-acceptance-r1
    paths:
      - .github/workflows/tmp-harden-final-independent-drag.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Make synthetic star acquisition tolerant inside the real hit area
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/final-independent-acceptance-r1.mjs')
          s = p.read_text()
          start = s.index('const realTear = async (page, width) => {')
          end = s.index('\n};', start) + 3
          replacement = '''const realTear = async (page, width, beforeOpens) => {
            const candidates = [
              { dx: 0, dy: 0 },
              { dx: 0, dy: 8 },
              { dx: -7, dy: 2 },
              { dx: 7, dy: 2 },
            ];
            for (let attempt = 0; attempt < candidates.length; attempt += 1) {
              const { dx, dy } = candidates[attempt];
              const startX = width / 2 - 158 + dx;
              const startY = 177 + dy;
              await page.mouse.move(startX, startY);
              await page.mouse.down();
              await page.waitForTimeout(65);
              for (let step = 1; step <= 14; step += 1) {
                await page.mouse.move(startX + (312 * step) / 14, startY, { steps: 1 });
                await page.waitForTimeout(15);
              }
              await page.mouse.up();
              await page.waitForTimeout(260);
              const state = await readSave(page);
              if (
                state?.pendingReveal?.openingNumber === beforeOpens + 1 ||
                state?.totalOpens === beforeOpens + 1
              ) {
                return attempt + 1;
              }
            }
            return 0;
          };'''
          s = s[:start] + replacement + s[end:]
          s = s.replace(
              '    await realTear(page, width);\n    await finishPendingPresentation(page, width, before.totalOpens, `repeat-${index}`);',
              '''    const tearAttempts = await realTear(page, width, before.totalOpens);
              assert(`repeat-${index}-star-acquired`, tearAttempts > 0, tearAttempts);
              if (tearAttempts === 0) throw new Error(`repeat-${index}: star could not be acquired inside hit area`);
              await finishPendingPresentation(page, width, before.totalOpens, `repeat-${index}`);''',
              1,
          )
          s = s.replace(
              '  await realTear(page, width);\n  await page.waitForFunction(',
              '''  const chargedTearAttempts = await realTear(page, width, before.totalOpens);
              assert('charged-star-acquired', chargedTearAttempts > 0, chargedTearAttempts);
              if (chargedTearAttempts === 0) throw new Error('charged: star could not be acquired inside hit area');
              await page.waitForFunction(''',
              1,
          )
          p.write_text(s)
          PY
          git diff --check
          grep -Fq 'repeat-${index}-star-acquired' .github/scripts/final-independent-acceptance-r1.mjs
          grep -Fq "assert('charged-star-acquired'" .github/scripts/final-independent-acceptance-r1.mjs
      - name: Commit driver hardening and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add .github/scripts/final-independent-acceptance-r1.mjs
          git rm .github/workflows/tmp-harden-final-independent-drag.yml
          git commit -m 'Harden independent audit star acquisition'
          git push origin HEAD:audit/final-independent-acceptance-r1
