name: Patch Charged-ready beat visibility

on:
  push:
    branches:
      - fix/charged-ready-beat-visibility
    paths:
      - .github/workflows/patch-charged-ready-beat-visibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/charged-ready-beat-visibility
          fetch-depth: 0
      - name: Apply narrow presentation fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/scenes/OpeningScene.ts')
          text = path.read_text()
          old = """      await this.animatePostStandardEconomy(pending, standardVisual);\n      if (this.isSceneShutdown()) return;\n      if (crossedChargedReadyThreshold(pending, LITE_V2_BALANCE)) this.showChargedReadyBeat();\n\n      if (pending.hiddenPocket) {\n"""
          new = """      await this.animatePostStandardEconomy(pending, standardVisual);\n      if (this.isSceneShutdown()) return;\n      if (crossedChargedReadyThreshold(pending, LITE_V2_BALANCE)) {\n        this.showChargedReadyBeat();\n        await this.wait(850);\n        if (this.isSceneShutdown()) return;\n      }\n\n      if (pending.hiddenPocket) {\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Charged-ready call site, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Remove one-shot workflow and commit product fix
        run: |
          set -euo pipefail
          rm .github/workflows/patch-charged-ready-beat-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts .github/workflows/patch-charged-ready-beat-visibility.yml
          git diff --cached --check
          git commit -m "Keep Charged-ready beat visible before result"
          git push origin HEAD:fix/charged-ready-beat-visibility
