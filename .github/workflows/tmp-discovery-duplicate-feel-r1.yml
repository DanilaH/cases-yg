name: TEMP discovery duplicate feel R1

on:
  push:
    branches:
      - polish/discovery-duplicate-feel-r1

permissions:
  contents: write

jobs:
  implement-audit-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/discovery-duplicate-feel-r1
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply bounded discovery and duplicate feel pass
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) < count:
                  raise SystemExit(f'anchor missing in {path}: {old[:100]!r}')
              text = text.replace(old, new, count)
              file.write_text(text, encoding='utf-8')

          replace(
              'src/game/data/audioAssets.ts',
              "  'duplicate',\n  'ui-click',",
              "  'duplicate',\n  'new-discovery',\n  'ui-click',",
          )
          replace(
              'src/game/data/audioAssets.ts',
              "  duplicate: 'assets/audio/duplicate.mp3',\n  'ui-click': 'assets/audio/ui-click.mp3',",
              "  duplicate: 'assets/audio/duplicate.mp3',\n  'new-discovery': 'assets/audio/new-discovery.mp3',\n  'ui-click': 'assets/audio/ui-click.mp3',",
          )

          replace(
              'src/game/systems/audio.ts',
              "  duplicate: [{ frequency: 230, endFrequency: 180, duration: 0.11, type: 'triangle', gain: 0.026 }],\n  'ui-click': [",
              "  duplicate: [\n    { frequency: 260, endFrequency: 170, duration: 0.075, type: 'square', gain: 0.022 },\n    { frequency: 1180, endFrequency: 640, duration: 0.055, type: 'triangle', gain: 0.014, delay: 0.018 },\n  ],\n  'new-discovery': [\n    { frequency: 740, endFrequency: 980, duration: 0.1, type: 'triangle', gain: 0.028 },\n    { frequency: 1110, duration: 0.13, type: 'sine', gain: 0.025, delay: 0.065 },\n    { frequency: 1480, duration: 0.16, type: 'sine', gain: 0.018, delay: 0.125 },\n  ],\n  'ui-click': [",
          )

          replace(
              'src/game/data/audioPresentation.ts',
              "    case 'duplicate':\n      return {\n        duck: { multiplier: 0.78, attackMs: 10, holdMs: 50, releaseMs: 150 },\n      };",
              "    case 'new-discovery':\n      return {\n        duck: { multiplier: 0.62, attackMs: 8, holdMs: 90, releaseMs: 220 },\n      };\n    case 'duplicate':\n      return {\n        duck: { multiplier: 0.78, attackMs: 10, holdMs: 50, releaseMs: 150 },\n      };",
          )

          replace(
              'src/game/data/presentation.ts',
              "  uiPressMs: 70,\n  hudShimmerDurationMs: 900,",
              "  uiPressMs: 70,\n  discoveryPopScale: 1.035,\n  discoveryFrameWidth: 288,\n  discoveryFrameHeight: 208,\n  discoveryLabelOffsetY: 120,\n  discoveryIntroMs: 120,\n  discoveryHoldMs: 80,\n  discoverySettleMs: 200,\n  duplicateConversionAccentMs: 260,\n  hudShimmerDurationMs: 900,",
          )

          replace(
              'src/game/scenes/OpeningScene.ts',
              "    getGameAudio().play(pending.standard.rarity);\n    if (!pending.standard.isNew) {\n      this.time.delayedCall(90, () => getGameAudio().play('duplicate'));\n    }\n    return visual.group;",
              "    getGameAudio().play(pending.standard.rarity);\n    return visual.group;",
          )

          anchor = """  private async animateRewardStaging(\n    pending: PendingReveal,\n    standardVisual: Phaser.GameObjects.Container,\n  ): Promise<void> {\n"""
          discovery_method = """  private async animateDiscoveryBeat(\n    pending: PendingReveal,\n    standardVisual: Phaser.GameObjects.Container,\n  ): Promise<void> {\n    if (!this.root || !this.metrics || !pending.standard.isNew || pending.hiddenPocket) return;\n\n    const messages = getMessages(getPlatformRuntime().language);\n    const presentation = getCollectiblePresentation(pending.standard.familyId);\n    const heroX = this.metrics.centerX;\n    const heroY = presentation.revealY;\n    const rarityColor = RARITY_REVEAL_COLORS[pending.standard.rarity];\n    const frameWidth = OPENING_FEEL_PRESENTATION.discoveryFrameWidth;\n    const frameHeight = OPENING_FEEL_PRESENTATION.discoveryFrameHeight;\n    const beat = this.add.container(heroX, heroY).setAlpha(0).setScale(0.96);\n    beat.setData('rewardMeaning', 'discovery');\n\n    const frame = this.add.graphics();\n    frame.lineStyle(2.2, 0x8df8ff, 0.76);\n    frame.strokeRoundedRect(-frameWidth / 2, -frameHeight / 2, frameWidth, frameHeight, 22);\n    frame.lineStyle(1.2, rarityColor, 0.54);\n    frame.strokeRoundedRect(\n      -frameWidth / 2 + 8,\n      -frameHeight / 2 + 8,\n      frameWidth - 16,\n      frameHeight - 16,\n      18,\n    );\n    const marker = this.add\n      .rectangle(-frameWidth / 2 + 16, -frameHeight / 2 + 16, 7, 7, 0xffd36a, 0.94)\n      .setRotation(Math.PI / 4)\n      .setStrokeStyle(1, 0xffffff, 0.38);\n    const label = this.add\n      .text(0, OPENING_FEEL_PRESENTATION.discoveryLabelOffsetY, messages.opening.addedToCollection, {\n        color: '#dffcff',\n        backgroundColor: '#182130',\n        padding: { x: 9, y: 5 },\n        stroke: '#100b16',\n        strokeThickness: 2,\n        fontFamily: DIGITAL_FONT_FAMILY,\n        fontSize: '8px',\n        fontStyle: 'bold',\n      })\n      .setOrigin(0.5);\n    beat.add([frame, marker, label]);\n    this.root.add(beat);\n\n    getGameAudio().play('new-discovery');\n    await Promise.all([\n      this.runSkippableTween({\n        targets: beat,\n        alpha: 1,\n        scale: 1,\n        duration: OPENING_FEEL_PRESENTATION.discoveryIntroMs,\n        ease: 'Back.Out',\n      }),\n      this.runSkippableTween({\n        targets: standardVisual,\n        scale: presentation.revealScale * OPENING_FEEL_PRESENTATION.discoveryPopScale,\n        duration: OPENING_FEEL_PRESENTATION.discoveryIntroMs,\n        ease: 'Back.Out',\n      }),\n    ]);\n    if (this.isSceneShutdown()) {\n      if (beat.active) beat.destroy(true);\n      return;\n    }\n\n    await this.waitPresentation(OPENING_FEEL_PRESENTATION.discoveryHoldMs);\n    if (this.isSceneShutdown()) {\n      if (beat.active) beat.destroy(true);\n      return;\n    }\n\n    await Promise.all([\n      this.runSkippableTween({\n        targets: beat,\n        y: heroY - 5,\n        alpha: 0,\n        scale: 1.025,\n        duration: OPENING_FEEL_PRESENTATION.discoverySettleMs,\n        ease: 'Sine.Out',\n      }),\n      this.runSkippableTween({\n        targets: standardVisual,\n        scale: presentation.revealScale,\n        duration: OPENING_FEEL_PRESENTATION.discoverySettleMs,\n        ease: 'Sine.Out',\n      }),\n    ]);\n    if (beat.active) beat.destroy(true);\n  }\n\n"""
          replace('src/game/scenes/OpeningScene.ts', anchor, discovery_method + anchor)

          replace(
              'src/game/scenes/OpeningScene.ts',
              """    if (!pending.standard.isNew && pending.chips.recycle > 0) {\n      const scan = this.add\n""",
              """    if (!pending.standard.isNew && pending.chips.recycle > 0) {\n      const messages = getMessages(getPlatformRuntime().language);\n      getGameAudio().play('duplicate');\n      const conversionLabel = this.add\n        .text(\n          this.metrics.centerX,\n          heroY + 106,\n          `${messages.opening.recycled} +${pending.chips.recycle}`,\n          {\n            color: '#c8fbff',\n            backgroundColor: '#182431',\n            padding: { x: 8, y: 4 },\n            stroke: '#100b16',\n            strokeThickness: 2,\n            fontFamily: DIGITAL_FONT_FAMILY,\n            fontSize: '8px',\n            fontStyle: 'bold',\n          },\n        )\n        .setOrigin(0.5)\n        .setAlpha(0);\n      conversionLabel.setData('rewardMeaning', 'conversion');\n      this.root.add(conversionLabel);\n      this.tweens.add({\n        targets: conversionLabel,\n        y: heroY + 100,\n        alpha: 1,\n        duration: 90,\n        ease: 'Sine.Out',\n        onComplete: () => {\n          if (!conversionLabel.active) return;\n          this.tweens.add({\n            targets: conversionLabel,\n            y: heroY + 94,\n            alpha: 0,\n            duration: OPENING_FEEL_PRESENTATION.duplicateConversionAccentMs - 90,\n            ease: 'Sine.In',\n            onComplete: () => conversionLabel.destroy(),\n          });\n        },\n      });\n\n      const scan = this.add\n""",
          )

          replace(
              'src/game/scenes/OpeningScene.ts',
              """  private async animatePostStandardEconomy(\n    pending: PendingReveal,\n    standardVisual: Phaser.GameObjects.Container,\n  ): Promise<void> {\n    await this.animateRewardStaging(pending, standardVisual);\n    if (this.isSceneShutdown()) return;\n""",
              """  private async animatePostStandardEconomy(\n    pending: PendingReveal,\n    standardVisual: Phaser.GameObjects.Container,\n  ): Promise<void> {\n    await this.animateDiscoveryBeat(pending, standardVisual);\n    if (this.isSceneShutdown()) return;\n    await this.animateRewardStaging(pending, standardVisual);\n    if (this.isSceneShutdown()) return;\n""",
          )

          replace(
              'tests/presentation.test.ts',
              """    expect(OPENING_FEEL_PRESENTATION.uiPressMs).toBeLessThanOrEqual(90);\n  });\n""",
              """    expect(OPENING_FEEL_PRESENTATION.uiPressMs).toBeLessThanOrEqual(90);\n    const discoveryDuration =\n      OPENING_FEEL_PRESENTATION.discoveryIntroMs +\n      OPENING_FEEL_PRESENTATION.discoveryHoldMs +\n      OPENING_FEEL_PRESENTATION.discoverySettleMs;\n    expect(OPENING_FEEL_PRESENTATION.discoveryPopScale).toBeGreaterThanOrEqual(1.02);\n    expect(OPENING_FEEL_PRESENTATION.discoveryPopScale).toBeLessThanOrEqual(1.04);\n    expect(discoveryDuration).toBeGreaterThanOrEqual(350);\n    expect(discoveryDuration).toBeLessThanOrEqual(600);\n    expect(OPENING_FEEL_PRESENTATION.discoveryFrameWidth % 8).toBe(0);\n    expect(OPENING_FEEL_PRESENTATION.discoveryFrameHeight % 8).toBe(0);\n    expect(OPENING_FEEL_PRESENTATION.duplicateConversionAccentMs).toBeGreaterThanOrEqual(200);\n    expect(OPENING_FEEL_PRESENTATION.duplicateConversionAccentMs).toBeLessThanOrEqual(320);\n  });\n""",
          )

          replace(
              'tests/audio-presentation.test.ts',
              """  it('clears stale result ambience before a new physical/reveal cycle', () => {\n""",
              """  it('gives NEW discovery a separate foreground beat without creating persistent ambience', () => {\n    const discovery = getAudioCuePresentationDirective('new-discovery');\n    const duplicate = getAudioCuePresentationDirective('duplicate');\n    const signal = getAudioCuePresentationDirective('signal-gain');\n\n    expect(discovery.persistent).toBeUndefined();\n    expect(discovery.clearPersistent).toBeUndefined();\n    expect(discovery.duck?.multiplier).toBeLessThan(duplicate.duck!.multiplier);\n    expect(discovery.duck?.multiplier).toBeLessThan(signal.duck!.multiplier);\n  });\n\n  it('clears stale result ambience before a new physical/reveal cycle', () => {\n""",
          )
          PY

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Asset self-test
        run: npm run assets:selftest

      - name: Asset validation
        run: npm run assets:validate

      - name: Build
        run: npm run build

      - name: Source contract guard
        run: |
          python - <<'PY'
          from pathlib import Path
          scene = Path('src/game/scenes/OpeningScene.ts').read_text(encoding='utf-8')
          assets = Path('src/game/data/audioAssets.ts').read_text(encoding='utf-8')
          assert "getGameAudio().play('new-discovery')" in scene
          assert "rewardMeaning', 'discovery'" in scene
          assert "rewardMeaning', 'conversion'" in scene
          assert "this.time.delayedCall(90, () => getGameAudio().play('duplicate'))" not in scene
          assert scene.count("getGameAudio().play('duplicate')") == 1
          assert "'new-discovery'," in assets
          assert "'new-discovery'" not in assets.split('AVAILABLE_SFX_CUES', 1)[1]
          PY
          git diff --check

      - name: Install browser audit dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Expose DEV game for temporary browser audit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.ts')
          text = path.read_text(encoding='utf-8')
          anchor = "  game.sound.mute = blocked;\n"
          if anchor not in text:
              raise SystemExit('main audit anchor missing')
          text = text.replace(anchor, anchor + "  if (import.meta.env.DEV) (window as typeof window & { __mptAuditGame?: Phaser.Game }).__mptAuditGame = game;\n", 1)
          path.write_text(text, encoding='utf-8')
          PY
          cat > tools/tmp-discovery-duplicate-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
          const errors = [];
          page.on('pageerror', error => errors.push(`pageerror:${error.message}`));
          page.on('console', message => {
            if (message.type() === 'error') errors.push(`console:${message.text()}`);
          });

          const waitScene = async () => {
            await page.waitForFunction(() => {
              const game = window.__mptAuditGame;
              const scene = game?.scene?.getScene?.('OpeningScene');
              return Boolean(scene && scene.phase === 'idle');
            }, null, { timeout: 15000 });
          };

          const resetByButton = async (name) => {
            const button = page.getByRole('button', { name, exact: true });
            await button.waitFor({ state: 'visible' });
            await Promise.all([
              page.waitForEvent('load'),
              button.click(),
            ]);
            await waitScene();
          };

          const collapseDebug = async () => {
            const hide = page.getByRole('button', { name: 'Hide', exact: true });
            if (await hide.isVisible().catch(() => false)) await hide.click();
          };

          const startPhysicalOpen = async () => {
            await page.evaluate(() => {
              const game = window.__mptAuditGame;
              const scene = game.scene.getScene('OpeningScene');
              scene.beginDrag({ id: 777, x: 0 });
              scene.handlePointerMove({ id: 777, x: 420 });
            });
          };

          const findMeaning = async (wanted, timeout = 7000) => {
            const started = Date.now();
            while (Date.now() - started < timeout) {
              const result = await page.evaluate((value) => {
                const game = window.__mptAuditGame;
                const scene = game.scene.getScene('OpeningScene');
                const stack = [...scene.children.list];
                while (stack.length) {
                  const item = stack.pop();
                  if (item?.getData?.('rewardMeaning') === value) {
                    const bounds = item.getBounds?.();
                    return {
                      found: true,
                      phase: scene.phase,
                      x: item.x ?? null,
                      y: item.y ?? null,
                      alpha: item.alpha ?? null,
                      bounds: bounds ? { x: bounds.x, y: bounds.y, width: bounds.width, height: bounds.height } : null,
                    };
                  }
                  if (Array.isArray(item?.list)) stack.push(...item.list);
                }
                return { found: false, phase: scene.phase };
              }, wanted);
              if (result.found) return result;
              await page.waitForTimeout(20);
            }
            throw new Error(`rewardMeaning ${wanted} not observed`);
          };

          await page.goto('http://127.0.0.1:5173/?debug=1', { waitUntil: 'load' });
          await waitScene();
          await resetByButton('Reset save');
          await collapseDebug();
          await startPhysicalOpen();
          const discovery = await findMeaning('discovery');
          await page.screenshot({ path: 'audit-artifacts/new-discovery.png', fullPage: true });
          await page.waitForFunction(() => window.__mptAuditGame.scene.getScene('OpeningScene').phase === 'result', null, { timeout: 12000 });

          await page.getByRole('button', { name: 'DEBUG', exact: true }).click();
          await resetByButton('Seed standards 8/8');
          await collapseDebug();
          await startPhysicalOpen();
          const conversion = await findMeaning('conversion');
          await page.screenshot({ path: 'audit-artifacts/duplicate-conversion.png', fullPage: true });
          await page.waitForFunction(() => window.__mptAuditGame.scene.getScene('OpeningScene').phase === 'result', null, { timeout: 12000 });

          const report = { discovery, conversion, errors };
          fs.mkdirSync('audit-artifacts', { recursive: true });
          fs.writeFileSync('audit-artifacts/report.json', JSON.stringify(report, null, 2));
          if (errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          EOF
          mkdir -p audit-artifacts
          npm run dev -- --host 127.0.0.1 > /tmp/mpt-vite.log 2>&1 &
          echo $! > /tmp/mpt-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/?debug=1 >/dev/null; then break; fi
            sleep 1
          done
          node tools/tmp-discovery-duplicate-audit.mjs
          kill $(cat /tmp/mpt-vite.pid) || true

      - uses: actions/upload-artifact@v4
        with:
          name: discovery-duplicate-feel-audit
          path: audit-artifacts
          if-no-files-found: error

      - name: Restore temporary audit changes and commit clean product tree
        run: |
          git checkout -- src/main.ts package.json package-lock.json
          rm -rf audit-artifacts
          rm -f tools/tmp-discovery-duplicate-audit.mjs
          rm -f .github/workflows/tmp-discovery-duplicate-feel-r1.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Differentiate discovery and duplicate reward feel"
          git push origin HEAD:polish/discovery-duplicate-feel-r1
