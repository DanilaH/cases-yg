name: Temporary final result panel correction

on:
  push:
    branches:
      - tmp/final-result-panel-correction
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/final-result-panel-correction
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded product correction
        run: python tools/tmp-final-result-panel-correction.py
      - name: Diff hygiene
        run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts src/game/data/presentation.ts src/i18n/en.ts src/i18n/ru.ts
          git diff --cached --check
          git diff --cached --exit-code && { echo "No product changes staged"; exit 1; } || true
          git commit -m "Polish result panel signal state [skip ci]"
          git push origin HEAD:tmp/final-result-panel-correction
