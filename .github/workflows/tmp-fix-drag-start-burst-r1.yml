name: Temporary drag-start burst patch

on:
  push:
    branches:
      - fix/drag-start-burst-r1
    paths:
      - .github/workflows/tmp-fix-drag-start-burst-r1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/drag-start-burst-r1
      - name: Patch drag startup envelope
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/game/data/audioPresentation.ts',
              '''  updateMs: number;\n  idleReleaseMs: number;\n  releaseMs: number;\n''',
              '''  updateMs: number;\n  startAttackMs: number;\n  startVelocityCap: number;\n  startGainMultiplier: number;\n  idleReleaseMs: number;\n  releaseMs: number;\n''',
          )
          replace_once(
              'src/game/data/audioPresentation.ts',
              '''  updateMs: 35,\n  idleReleaseMs: 90,\n  releaseMs: 55,\n''',
              '''  updateMs: 35,\n  startAttackMs: 120,\n  startVelocityCap: 0.32,\n  startGainMultiplier: 0.28,\n  idleReleaseMs: 90,\n  releaseMs: 55,\n''',
          )
          replace_once(
              'src/game/data/audioPresentation.ts',
              '''export const getDragTextureMix = (progress: number, velocity: number): DragTextureMix => {\n  const clampedProgress = Math.max(0, Math.min(1, progress));\n  const clampedVelocity = Math.max(0, Math.min(1, velocity));\n  const intensity = Math.min(\n    1,\n    clampedProgress * DRAG_TEXTURE_PROFILE.progressWeight +\n      clampedVelocity * DRAG_TEXTURE_PROFILE.velocityWeight,\n  );\n  const brightness = Math.min(1, clampedProgress * 0.72 + clampedVelocity * 0.28);\n  return {\n    gain:\n      DRAG_TEXTURE_PROFILE.minGain +\n      (DRAG_TEXTURE_PROFILE.maxGain - DRAG_TEXTURE_PROFILE.minGain) * intensity,\n    bandHz:\n      DRAG_TEXTURE_PROFILE.minBandHz +\n      (DRAG_TEXTURE_PROFILE.maxBandHz - DRAG_TEXTURE_PROFILE.minBandHz) * brightness,\n    q:\n      DRAG_TEXTURE_PROFILE.minQ +\n      (DRAG_TEXTURE_PROFILE.maxQ - DRAG_TEXTURE_PROFILE.minQ) * clampedVelocity,\n  };\n};\n''',
              '''export const getDragTextureMix = (progress: number, velocity: number, startupProgress = 1): DragTextureMix => {\n  const clampedProgress = Math.max(0, Math.min(1, progress));\n  const clampedVelocity = Math.max(0, Math.min(1, velocity));\n  const clampedStartup = Math.max(0, Math.min(1, startupProgress));\n  const startupVelocityCap =\n    DRAG_TEXTURE_PROFILE.startVelocityCap +\n    (1 - DRAG_TEXTURE_PROFILE.startVelocityCap) * clampedStartup;\n  const effectiveVelocity = Math.min(clampedVelocity, startupVelocityCap);\n  const intensity = Math.min(\n    1,\n    clampedProgress * DRAG_TEXTURE_PROFILE.progressWeight +\n      effectiveVelocity * DRAG_TEXTURE_PROFILE.velocityWeight,\n  );\n  const brightness = Math.min(1, clampedProgress * 0.72 + effectiveVelocity * 0.28);\n  const startupGainMultiplier =\n    DRAG_TEXTURE_PROFILE.startGainMultiplier +\n    (1 - DRAG_TEXTURE_PROFILE.startGainMultiplier) * clampedStartup;\n  return {\n    gain:\n      (DRAG_TEXTURE_PROFILE.minGain +\n        (DRAG_TEXTURE_PROFILE.maxGain - DRAG_TEXTURE_PROFILE.minGain) * intensity) *\n      startupGainMultiplier,\n    bandHz:\n      DRAG_TEXTURE_PROFILE.minBandHz +\n      (DRAG_TEXTURE_PROFILE.maxBandHz - DRAG_TEXTURE_PROFILE.minBandHz) * brightness,\n    q:\n      DRAG_TEXTURE_PROFILE.minQ +\n      (DRAG_TEXTURE_PROFILE.maxQ - DRAG_TEXTURE_PROFILE.minQ) * effectiveVelocity,\n  };\n};\n''',
          )

          replace_once(
              'src/game/systems/audio.ts',
              '''  private dragTextureGain: GainNode | null = null;\n  private dragTextureIdleTimer: number | null = null;\n''',
              '''  private dragTextureGain: GainNode | null = null;\n  private dragTextureIdleTimer: number | null = null;\n  private dragTextureEnvelopeStartedAt: number | null = null;\n''',
          )
          replace_once(
              'src/game/systems/audio.ts',
              '''    this.dragTextureSource = null;\n    this.dragTextureFilter = null;\n    this.dragTextureGain = null;\n    if (!source) return;\n''',
              '''    this.dragTextureSource = null;\n    this.dragTextureFilter = null;\n    this.dragTextureGain = null;\n    this.dragTextureEnvelopeStartedAt = null;\n    if (!source) return;\n''',
          )
          replace_once(
              'src/game/systems/audio.ts',
              '''  private updateDragTexture(context: AudioContext, progress: number, velocity: number): void {\n    const mix = getDragTextureMix(progress, velocity);\n    const now = context.currentTime;\n    if (!this.dragTextureSource || !this.dragTextureFilter || !this.dragTextureGain) {\n''',
              '''  private updateDragTexture(context: AudioContext, progress: number, velocity: number): void {\n    const now = context.currentTime;\n    const isStarting = !this.dragTextureSource || !this.dragTextureFilter || !this.dragTextureGain;\n    if (isStarting || this.dragTextureEnvelopeStartedAt === null) this.dragTextureEnvelopeStartedAt = now;\n    const startupProgress = Math.min(\n      1,\n      Math.max(0, ((now - this.dragTextureEnvelopeStartedAt) * 1000) / DRAG_TEXTURE_PROFILE.startAttackMs),\n    );\n    const mix = getDragTextureMix(progress, velocity, startupProgress);\n    if (isStarting) {\n''',
          )
          replace_once(
              'src/game/systems/audio.ts',
              '''  private silenceDragTexture(): void {\n    const context = this.context;\n    const gain = this.dragTextureGain;\n    if (!context || context.state !== 'running' || !gain) return;\n    const now = context.currentTime;\n''',
              '''  private silenceDragTexture(): void {\n    const context = this.context;\n    const gain = this.dragTextureGain;\n    if (!context || context.state !== 'running' || !gain) return;\n    const now = context.currentTime;\n    this.dragTextureEnvelopeStartedAt = null;\n''',
          )

          replace_once(
              'tests/audio-presentation.test.ts',
              '''    const end = getDragTextureMix(1, 1);\n\n    expect(DRAG_TEXTURE_PROFILE.maxGain).toBe(0.01);\n''',
              '''    const end = getDragTextureMix(1, 1);\n    const startupBurst = getDragTextureMix(0.02, 1, 0);\n    const steadyBurst = getDragTextureMix(0.02, 1, 1);\n\n    expect(DRAG_TEXTURE_PROFILE.maxGain).toBe(0.01);\n    expect(DRAG_TEXTURE_PROFILE.startAttackMs).toBeGreaterThanOrEqual(100);\n    expect(DRAG_TEXTURE_PROFILE.startAttackMs).toBeLessThanOrEqual(160);\n    expect(DRAG_TEXTURE_PROFILE.startVelocityCap).toBeLessThanOrEqual(0.35);\n    expect(DRAG_TEXTURE_PROFILE.startGainMultiplier).toBeLessThanOrEqual(0.35);\n''',
          )
          replace_once(
              'tests/audio-presentation.test.ts',
              '''    expect(end.bandHz).toBeLessThanOrEqual(DRAG_TEXTURE_PROFILE.maxBandHz);\n  });\n''',
              '''    expect(end.bandHz).toBeLessThanOrEqual(DRAG_TEXTURE_PROFILE.maxBandHz);\n    expect(startupBurst.gain).toBeLessThan(steadyBurst.gain * 0.5);\n    expect(startupBurst.bandHz).toBeLessThan(steadyBurst.bandHz);\n    expect(startupBurst.q).toBeLessThan(steadyBurst.q);\n  });\n''',
          )
          PY
      - name: Remove temporary harness and commit
        run: |
          rm .github/workflows/tmp-fix-drag-start-burst-r1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/data/audioPresentation.ts src/game/systems/audio.ts tests/audio-presentation.test.ts .github/workflows/tmp-fix-drag-start-burst-r1.yml
          git diff --cached --check
          git commit -m "Soften drag texture startup burst"
          git push origin HEAD:fix/drag-start-burst-r1
