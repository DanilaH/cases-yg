name: Apply Opening Composition Pass

on:
  push:
    branches:
      - fix/reveal-layering-composition
    paths:
      - .github/scripts/apply-opening-composition-pass.mjs
      - .github/workflows/apply-opening-composition-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/reveal-layering-composition
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - name: Apply vertical composition patch
        run: node .github/scripts/apply-opening-composition-pass.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name "DanilaH"
          git config user.email "41333602+DanilaH@users.noreply.github.com"
          git add src/game/data/presentation.ts tests/presentation.test.ts
          git commit -m "Rebalance opening vertical composition"
          git push origin HEAD:fix/reveal-layering-composition
