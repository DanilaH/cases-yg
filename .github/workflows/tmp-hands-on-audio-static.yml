name: TEMP hands-on audio correction static

on:
  push:
    branches:
      - polish/hands-on-audio-corrections-r1-static
    paths:
      - .github/workflows/tmp-hands-on-audio-static.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/hands-on-audio-corrections-r1-static
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded audio correction
        run: python tools/tmp-apply-hands-on-audio.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Asset self-test
        run: npm run assets:selftest
      - name: Asset validation
        run: npm run assets:validate
      - name: Build
        run: npm run build
      - name: Commit product correction and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp-apply-hands-on-audio.py .github/workflows/tmp-hands-on-audio-static.yml
          git add src/game/data/audioAssets.ts src/game/data/audioPresentation.ts src/game/systems/audio.ts src/game/scenes/OpeningScene.ts tests/audio-presentation.test.ts tests/audio-runtime-contract.test.ts
          git commit -m "Tune hands-on audio feel and feedback"
          git push origin HEAD:polish/hands-on-audio-corrections-r1-static
