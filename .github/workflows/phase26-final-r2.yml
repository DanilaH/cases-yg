name: Phase 2.6 final exact browser audit R2

on:
  push:
    branches:
      - audit/phase26-final-r2

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assert exact audited product tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 1d450bffe083954c45208071753db03484a661c5 -- . \
            ':(exclude).github/scripts/phase26-final-r2.mjs' \
            ':(exclude).github/workflows/phase26-final-r2.yml'
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Install browser helpers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chrome
      - name: Start Vite
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/vite.log
          exit 1
      - name: Run Phase 2.6 browser/state audit
        run: node .github/scripts/phase26-final-r2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase26-final-r2
          path: /tmp/phase26-final-r2
          retention-days: 3
