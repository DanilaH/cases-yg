name: TEMP validate Secret presence R3
on:
  push:
    branches: [polish/independent-feel-correction-r1]
    paths: [.github/workflows/tmp-validate-secret-presence-r3.yml]
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/independent-feel-correction-r1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Expose audit handles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.ts'); t=p.read_text(); anchor='  game.sound.mute = blocked;\n'
          injection='''  if (import.meta.env.DEV) {\n    const auditWindow = window as typeof window & { __auditGame?: Phaser.Game; __auditAudio?: unknown };\n    auditWindow.__auditGame = game;\n    auditWindow.__auditAudio = audio;\n  }\n'''
          if anchor not in t: raise SystemExit('audit anchor missing')
          p.write_text(t.replace(anchor, anchor + injection, 1))
          PY
      - name: Run targeted Secret validation R3
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/vite-secret-presence-r3.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          node tools/tmp-validate-secret-presence-r3.mjs
      - name: Print report
        if: always()
        run: |
          test -f audit-secret-presence-r3/report.json && cat audit-secret-presence-r3/report.json || true
          tail -80 /tmp/vite-secret-presence-r3.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-presence-validation-r3
          path: audit-secret-presence-r3
          retention-days: 14
      - name: Clean temporary validation
        if: always()
        run: |
          git checkout -- src/main.ts package.json package-lock.json || true
          rm -rf audit-secret-presence-r3
          rm -f .github/workflows/tmp-validate-secret-presence-r3.yml tools/tmp-validate-secret-presence-r3.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary Secret presence validation R3'
            git push origin HEAD:polish/independent-feel-correction-r1
          fi
