name: Temporary result feel polish patch

on:
  push:
    branches:
      - feat/result-reward-feel-polish
    paths:
      - .github/tmp-result-feel-polish.py
      - .github/workflows/tmp-result-feel-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python .github/tmp-result-feel-polish.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit product polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add src/game/data/audioAssets.ts src/game/systems/audio.ts src/game/scenes/OpeningScene.ts
          git commit -m 'Polish reward staging, rarity and pouch grab feel'
          git push origin HEAD:feat/result-reward-feel-polish
