name: Temporary fix independent acceptance harness

on:
  push:
    branches:
      - audit/final-independent-acceptance-r1
    paths:
      - .github/workflows/tmp-fix-final-independent-acceptance-r1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Patch transaction-aware audit semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/final-independent-acceptance-r1.mjs')
          s = p.read_text()

          old = '        return state.totalOpens === before + 1 && state.pendingReveal !== null;'
          new = '''        return (
                  state.totalOpens === before &&
                  state.pendingReveal !== null &&
                  state.pendingReveal.openingNumber === before + 1
                );'''
          if old not in s:
              raise SystemExit('pending wait contract marker missing')
          s = s.replace(old, new, 1)

          recovery_scope = s.index('// C. Recovery idempotency')
          start = s.index("  await stageScenario(page, 'Force Epic');", recovery_scope)
          end_marker = "  await shot(page, '31-recovery-final-idle');"
          end = s.index(end_marker, start) + len(end_marker)
          recovery = '''  await showDebug(page);
          await Promise.all([
            page.waitForEvent('framenavigated', { timeout: 10000 }),
            page.getByRole('button', { name: 'Force Epic', exact: true }).click(),
          ]);
          await page.waitForLoadState('domcontentloaded');
          const first = await readSave(page);
          assert('recovery-first-load-has-pending', first?.pendingReveal !== null && first?.totalOpens === 17, {
            totalOpens: first?.totalOpens,
            pending: first?.pendingReveal?.transactionId ?? null,
          });

          // Reload again immediately, while the first recovery presentation is still active.
          await page.reload({ waitUntil: 'domcontentloaded' });
          const second = await readSave(page);
          const fingerprint = state => state?.pendingReveal ? {
            transactionId: state.pendingReveal.transactionId,
            openingNumber: state.pendingReveal.openingNumber,
            collectibleId: state.pendingReveal.standard?.collectibleId,
            chips: state.pendingReveal.chips,
            signal: state.pendingReveal.signal,
          } : null;
          assert('recovery-pending-identical-after-second-reload', JSON.stringify(fingerprint(first)) === JSON.stringify(fingerprint(second)), {
            first: fingerprint(first), second: fingerprint(second),
          });
          await waitGame(page);
          await hideDebug(page);
          await shot(page, '30-recovery-after-second-reload');
          await page.waitForFunction(
            key => {
              const raw = localStorage.getItem(key);
              if (!raw) return false;
              const state = JSON.parse(raw);
              return state.totalOpens === 18 && state.pendingReveal === null;
            },
            SAVE_KEY,
            { timeout: 12000 },
          );
          const completed = await readSave(page);
          assert('recovery-completes-once', completed?.totalOpens === 18 && completed?.pendingReveal === null, completed);
          for (let i = 0; i < 5; i += 1) {
            await tap(page, width / 2, 585, 45);
            await page.waitForTimeout(140);
          }
          await page.reload({ waitUntil: 'domcontentloaded' });
          await waitGame(page);
          await hideDebug(page);
          const afterReload = await readSave(page);
          assert('recovery-stays-complete-after-reload', afterReload?.totalOpens === completed?.totalOpens && afterReload?.chips === completed?.chips && afterReload?.pendingReveal === null, {
            completed, afterReload,
          });
          await shot(page, '31-recovery-final-idle');'''
          s = s[:start] + recovery + s[end:]

          collection_scope = s.index('// D. Fully populated collection')
          start = s.index("  await stageScenario(page, 'Force Common');", collection_scope)
          end_marker = '  await showDebug(page);'
          end = s.index(end_marker, start) + len(end_marker)
          collection = '''  await setSave(page, baseSave({ chips: 120, totalOpens: 3 }));
          await showDebug(page);'''
          s = s[:start] + collection + s[end:]

          p.write_text(s)
          PY
          git diff --check
          grep -Fq 'state.pendingReveal.openingNumber === before + 1' .github/scripts/final-independent-acceptance-r1.mjs
          grep -Fq "assert('recovery-first-load-has-pending'" .github/scripts/final-independent-acceptance-r1.mjs
          grep -Fq 'baseSave({ chips: 120, totalOpens: 3 })' .github/scripts/final-independent-acceptance-r1.mjs
      - name: Commit harness fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add .github/scripts/final-independent-acceptance-r1.mjs
          git rm .github/workflows/tmp-fix-final-independent-acceptance-r1.yml
          git commit -m 'Correct independent audit transaction semantics'
          git push origin HEAD:audit/final-independent-acceptance-r1
