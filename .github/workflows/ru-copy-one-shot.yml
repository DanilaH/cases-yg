name: One-time RU copy patch

on:
  push:
    branches:
      - fix/ru-localization-copy-193
    paths:
      - .github/workflows/ru-copy-one-shot.yml

permissions:
  contents: write

jobs:
  apply-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source-aware copy changes (retry)
        run: node scripts/ru-copy-patch.cjs
      - name: Commit product changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/ru.ts src/game/scenes/OpeningScene.ts src/game/scenes/CollectionScene.ts
          git diff --cached --check
          git commit -m "fix(i18n): polish RU rewards, rarity badges and directions"
          git push
