name: Integrate Camera Assets Clean

on:
  push:
    branches:
      - feat/camera-runtime-assets-clean
    paths:
      - .github/workflows/integrate-camera-assets-clean.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/camera-runtime-assets-clean
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - name: Map uploaded camera sources to pipeline inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets-src/raw/camera
          cp 'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 11_31_12 PM (1)-Photoroom.png' assets-src/raw/camera/common.png
          cp 'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 11_31_12 PM (2)-Photoroom.png' assets-src/raw/camera/rare.png
          cp 'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 11_31_12 PM (3)-Photoroom.png' assets-src/raw/camera/epic.png
          cp 'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 11_31_13 PM (4)-Photoroom.png' assets-src/raw/camera/legendary.png
          cp 'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 11_31_13 PM (5)-Photoroom.png' assets-src/raw/camera/secret-cosmic.png
      - run: npm run assets:prepare -- --family camera --require-all
      - run: npm run assets:validate -- --family camera --require-all
      - name: Enable reviewed Camera art
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/game/data/artAssets.ts')
          text = path.read_text()
          marker = "  'flip-phone-secret-noir',\n]);"
          replacement = "  'flip-phone-secret-noir',\n  'camera-common',\n  'camera-rare',\n  'camera-epic',\n  'camera-legendary',\n  'camera-secret-cosmic',\n]);"
          if marker not in text:
              raise SystemExit('Expected Flip Phone allowlist marker not found')
          path.write_text(text.replace(marker, replacement))
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run build
      - name: Replace raw camera uploads with runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 11_31_12 PM (1)-Photoroom.png' \
            'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 11_31_12 PM (2)-Photoroom.png' \
            'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 11_31_12 PM (3)-Photoroom.png' \
            'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 11_31_13 PM (4)-Photoroom.png' \
            'public/assets/collectibles/ChatGPT Image Sep 3, 2026, 11_31_13 PM (5)-Photoroom.png'
          git add public/assets/collectibles/camera-*.webp src/game/data/artAssets.ts
          git commit -m 'Add final Camera collectible assets'
          git push origin HEAD:feat/camera-runtime-assets-clean
