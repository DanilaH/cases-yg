name: Fix PR3 recursion

on:
  push:
    branches:
      - feat/opening-reveal

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/opening-reveal
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Fix shutdown guard recursion once
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/scenes/OpeningScene.ts')
          text = path.read_text()
          bad = "  private isSceneShutdown(): boolean {\n    return this.isSceneShutdown();\n  }"
          good = "  private isSceneShutdown(): boolean {\n    return this.phase === 'shutdown';\n  }"
          if bad not in text:
              raise SystemExit('Expected recursive shutdown guard was not found')
          path.write_text(text.replace(bad, good))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts
          git commit -m "Fix OpeningScene shutdown guard recursion"
          git push
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
