name: Sync Phase 2.6 final canonical docs

on:
  push:
    branches:
      - feature/final-hands-on-overcharge
    paths:
      - .github/phase26-final-docs-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Synchronize canonical docs
        run: python .github/scripts/sync-phase26-final-docs.py
      - name: Assert bounded docs-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' README.md docs/DECISIONS.md docs/FINAL_HANDS_ON_OVERCHARGE_PLAN.md docs/GAMEPLAY_SYSTEMS.md docs/IMPLEMENTATION_ROADMAP.md docs/INFRASTRUCTURE_STATUS.md docs/OPEN_QUESTIONS.md docs/PROBE_VALIDATION.md docs/PRODUCT.md docs/TECHNICAL_DIRECTION.md | sort)"
          test "$changed" = "$expected"
          ! grep -R -n -E 'APPROVED NEXT / NOT CURRENT RUNTIME|Phase 2\.6 final-hands-on correction \+ Signal Overcharge: \*\*CURRENT APPROVED PASS\*\*|Phase 2\.6 — final-hands-on correction \+ Signal Overcharge — CURRENT APPROVED PASS|Approved next extension — Signal Overcharge \(NOT CURRENT RUNTIME\)' README.md docs/FINAL_HANDS_ON_OVERCHARGE_PLAN.md docs/IMPLEMENTATION_ROADMAP.md docs/PRODUCT.md docs/GAMEPLAY_SYSTEMS.md docs/PROBE_VALIDATION.md
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Commit canonical docs sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/DECISIONS.md docs/FINAL_HANDS_ON_OVERCHARGE_PLAN.md docs/GAMEPLAY_SYSTEMS.md docs/IMPLEMENTATION_ROADMAP.md docs/INFRASTRUCTURE_STATUS.md docs/OPEN_QUESTIONS.md docs/PROBE_VALIDATION.md docs/PRODUCT.md docs/TECHNICAL_DIRECTION.md
          git commit -m "Sync canonical docs for audited Phase 2.6 candidate"
          git push origin HEAD:feature/final-hands-on-overcharge
