name: Sync post-Secret docs

on:
  push:
    branches:
      - docs/sync-secret-postmerge-work

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply docs sync
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/sync-secret-postmerge-docs.mjs')
          text = path.read_text()
          needle = """  text = replaceOne(\n    text,\n    '## 2.1 Signal Overcharge tuning — RESOLVED FOR CURRENT VALIDATION BUILD',\n    '## 2.1 Signal Overcharge tuning — RESOLVED FOR CURRENT VALIDATION BUILD',\n    'open questions marker',\n  );\n"""
          if needle not in text:
              raise SystemExit('marker guard block not found')
          path.write_text(text.replace(needle, ''))
          PY
          node .github/scripts/sync-secret-postmerge-docs.mjs
      - name: Verify docs-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only -- . ':!docs/**' ':!.github/scripts/sync-secret-postmerge-docs.mjs' ':!.github/workflows/sync-secret-postmerge-docs.yml')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-doc changes:"
            echo "$unexpected"
            exit 1
          fi
          git diff -- docs
      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs; then
            echo 'Docs already synchronized.'
            exit 0
          fi
          git config user.name 'DanilaH'
          git config user.email '41333602+DanilaH@users.noreply.github.com'
          git add docs
          git commit -m 'Sync docs after Secret correction merge'
          git push origin HEAD:docs/sync-secret-postmerge-work
