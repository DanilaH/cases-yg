name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate

      - name: Build baseline
        run: npm run build
      - name: Report baseline footprint
        run: node tools/assets/report-build-footprint.mjs dist baseline

      - name: Build asset v2 candidate
        run: npm run build:asset-v2
      - name: Report asset v2 footprint
        run: node tools/assets/report-build-footprint.mjs dist asset-v2

      - name: Install GPU compression benchmark tools
        run: npm install --no-save --package-lock=false gpu-tex-enc@1.2.5
      - name: Benchmark representative GPU texture formats
        run: node tools/assets/benchmark-gpu-compression.mjs

      - name: Upload asset v2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: asset-pipeline-v2-evidence
          path: |
            .asset-build/runtime-v2-report.json
            .asset-build/qa-v2
            .asset-build/gpu-benchmark/report.json
          if-no-files-found: error
