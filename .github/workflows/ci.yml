name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate

      - name: Build baseline
        run: npm run build
      - name: Report baseline footprint
        run: node tools/assets/report-build-footprint.mjs dist baseline

      - name: Build asset v2 candidate
        run: npm run build:asset-v2
      - name: Report asset v2 footprint
        run: node tools/assets/report-build-footprint.mjs dist asset-v2
      - name: Benchmark WebP effort 4
        run: node tools/assets/benchmark-webp-effort-v2.mjs

      # Alpha-trim and GPU-format research was completed and archived in CI #625.
      # Do not repeatedly spend several minutes rebuilding those frozen experiments
      # on unrelated follow-up commits.
      - name: Upload asset v2 effort evidence
        uses: actions/upload-artifact@v4
        with:
          name: asset-pipeline-v2-effort-evidence
          path: |
            .asset-build/runtime-v2-report.json
            .asset-build/webp-effort4-report.json
          if-no-files-found: error
