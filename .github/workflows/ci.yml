name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate

      - name: Build baseline
        run: npm run build
      - name: Report baseline footprint
        run: node tools/assets/report-build-footprint.mjs dist baseline

      - name: Build final asset v2 candidate
        run: npm run build:asset-v2
      - name: Report final asset v2 footprint
        run: node tools/assets/report-build-footprint.mjs dist asset-v2-effort4

      # Alpha-trim and GPU-format research was completed and archived in CI #625.
      # The full-catalog effort-4 vs effort-6 comparison is archived in CI #627.
      # This final experiment run publishes the exact effort-4 runtime candidate
      # plus the narrow unchanged source snapshot needed to assemble the clean
      # production branch outside the research harness.
      - name: Upload final asset v2 candidate
        uses: actions/upload-artifact@v4
        with:
          name: asset-pipeline-v2-final-candidate
          path: |
            .asset-build/public-v2
            .asset-build/runtime-v2-report.json
            .asset-build/qa-v2
            src/game/scenes/BootScene.ts
            src/game/scenes/CollectionScene.ts
            src/game/data/artAssets.ts
            src/game/systems/artLoading.ts
            tests/runtime-assets.test.ts
            tests/startup-asset-staging.test.ts
            assets-src/collectibles.manifest.json
            tools/assets/shared.mjs
          if-no-files-found: error
