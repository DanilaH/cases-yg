name: Pouch WebP quality audit

on:
  push:
    branches:
      - experiment/pouch-webp-quality-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit pouch WebP quality
        run: node tools/assets/audit-pouch-webp-quality.mjs

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: pouch-webp-quality-audit
          path: .asset-build/pouch-quality
