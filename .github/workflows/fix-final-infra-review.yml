name: Fix final infrastructure review

on:
  push:
    branches:
      - feat/asset-runtime-infrastructure

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/asset-runtime-infrastructure
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Fix mute persistence wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          opening = Path('src/game/scenes/OpeningScene.ts')
          text = opening.read_text()
          duplicate = """      void persistMutedPreference(getPlatformRuntime().storage, muted).catch((error: unknown) => {\n        console.warn('[settings] failed to persist mute preference', error);\n      });\n      void persistMutedPreference(getPlatformRuntime().storage, muted).catch((error: unknown) => {\n        console.warn('[settings] failed to persist mute preference', error);\n      });\n"""
          single = """      void persistMutedPreference(getPlatformRuntime().storage, muted).catch((error: unknown) => {\n        console.warn('[settings] failed to persist mute preference', error);\n      });\n"""
          if duplicate in text:
              text = text.replace(duplicate, single, 1)
          opening.write_text(text)

          collection = Path('src/game/scenes/CollectionScene.ts')
          text = collection.read_text()
          old = """    button.on('pointerup', () => {\n      audio.toggleMuted();\n      this.render();\n    });\n"""
          new = """    button.on('pointerup', () => {\n      const muted = audio.toggleMuted();\n      void persistMutedPreference(getPlatformRuntime().storage, muted).catch((error: unknown) => {\n        console.warn('[settings] failed to persist mute preference', error);\n      });\n      this.render();\n    });\n"""
          if old in text:
              text = text.replace(old, new, 1)
          collection.write_text(text)
          PY
      - name: Commit source fix if changed
        run: |
          if [ -z "$(git status --porcelain -- src/game/scenes/OpeningScene.ts src/game/scenes/CollectionScene.ts)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts src/game/scenes/CollectionScene.ts
          git commit -m "Fix mute preference persistence wiring"
          git push
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
