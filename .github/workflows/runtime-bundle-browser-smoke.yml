name: Runtime bundle browser smoke

on:
  push:
    branches:
      - experiment/runtime-asset-bundles-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install project dependencies
        run: npm ci

      - name: Install temporary browser harness
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Build Pages-like mock runtime
        run: npm run build
        env:
          VITE_PLATFORM_RUNTIME: mock
          VITE_DEBUG_PANEL: 'true'

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Verify bundled cold startup in Chromium
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
          const pageErrors = [];
          const consoleErrors = [];
          const requests = [];

          page.on('pageerror', (error) => pageErrors.push(error.message));
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          page.on('request', (request) => requests.push(request.url()));

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
          await page.waitForFunction(() => {
            const overlay = document.querySelector('#startup-preload');
            return overlay?.getAttribute('data-state') === 'hidden';
          }, { timeout: 45_000 });

          const result = await page.evaluate(() => {
            const canvas = document.querySelector('#game canvas');
            const overlay = document.querySelector('#startup-preload');
            const debugButton = [...document.querySelectorAll('button')]
              .find((button) => button.textContent === 'Startup timing');
            return {
              overlayState: overlay?.getAttribute('data-state') ?? null,
              canvasWidth: canvas instanceof HTMLCanvasElement ? canvas.width : 0,
              canvasHeight: canvas instanceof HTMLCanvasElement ? canvas.height : 0,
              hasStartupTimingButton: Boolean(debugButton),
            };
          });

          if (result.overlayState !== 'hidden') throw new Error(`Startup overlay state: ${result.overlayState}`);
          if (result.canvasWidth <= 0 || result.canvasHeight <= 0) throw new Error('Phaser canvas is not ready');
          if (!result.hasStartupTimingButton) throw new Error('Startup timing debug probe is missing');
          if (pageErrors.length > 0) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);

          const packRequests = requests.filter((url) => url.includes('/assets/bundles/') && url.endsWith('.mptpack'));
          const directRuntimeWebp = requests.filter((url) =>
            url.startsWith('http://127.0.0.1:4173/') &&
            url.includes('/assets/') &&
            url.endsWith('.webp')
          );
          if (packRequests.length !== 6) {
            throw new Error(`Expected 6 bundle requests, saw ${packRequests.length}: ${packRequests.join(', ')}`);
          }
          if (directRuntimeWebp.length !== 0) {
            throw new Error(`Unexpected direct WebP network requests: ${directRuntimeWebp.join(', ')}`);
          }

          const startupTimingButton = page.getByRole('button', { name: 'Startup timing' });
          await startupTimingButton.click();
          await page.waitForFunction(() => {
            const status = document.querySelector('.mpt-debug-panel [data-status]');
            return status?.textContent?.includes('platformToArtMs') ?? false;
          });
          const timingText = await page.locator('.mpt-debug-panel [data-status]').textContent();

          console.log(JSON.stringify({
            result,
            packRequests: packRequests.length,
            directRuntimeWebp: directRuntimeWebp.length,
            timingText,
            consoleErrors,
          }, null, 2));
          await browser.close();
          NODE

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/vite-preview.log || true
