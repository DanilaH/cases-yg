name: Runtime bundle browser smoke

on:
  push:
    branches:
      - experiment/runtime-asset-bundles-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bundle candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install candidate dependencies
        run: npm ci

      - name: Checkout current main baseline into worktree
        run: |
          git fetch origin main --depth=1
          git worktree add --detach /tmp/cases-yg-main FETCH_HEAD
          npm ci --prefix /tmp/cases-yg-main

      - name: Install isolated browser harness
        run: |
          rm -rf /tmp/browser-harness
          npm install --prefix /tmp/browser-harness --package-lock=false playwright@1.55.0
          /tmp/browser-harness/node_modules/.bin/playwright install --with-deps chromium

      - name: Build bundle candidate
        run: npm run build
        env:
          VITE_PLATFORM_RUNTIME: mock
          VITE_DEBUG_PANEL: 'true'

      - name: Build main baseline
        working-directory: /tmp/cases-yg-main
        run: npm run build
        env:
          VITE_PLATFORM_RUNTIME: mock
          VITE_DEBUG_PANEL: 'true'

      - name: Start both preview servers
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-bundle.log 2>&1 &
          echo $! > /tmp/vite-bundle.pid
          (cd /tmp/cases-yg-main && npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/vite-main.log 2>&1) &
          echo $! > /tmp/vite-main.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null && \
               curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/vite-bundle.log || true
          cat /tmp/vite-main.log || true
          exit 1

      - name: Compare cold startup under identical mobile network emulation
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/browser-harness/node_modules/playwright');

          const profile = {
            name: 'moderate-4g',
            latency: 80,
            downloadThroughput: 1_250_000,
            uploadThroughput: 625_000,
            connectionType: 'cellular4g',
          };

          const median = (values) => {
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.floor(sorted.length / 2)];
          };

          const runVariant = async (browser, variant) => {
            const samples = [];
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const context = await browser.newContext({
                viewport: { width: 1280, height: 720 },
                serviceWorkers: 'block',
              });
              const page = await context.newPage();
              const client = await context.newCDPSession(page);
              await client.send('Network.enable');
              await client.send('Network.setCacheDisabled', { cacheDisabled: true });
              await client.send('Network.emulateNetworkConditions', {
                offline: false,
                latency: profile.latency,
                downloadThroughput: profile.downloadThroughput,
                uploadThroughput: profile.uploadThroughput,
                connectionType: profile.connectionType,
              });

              const pageErrors = [];
              const consoleErrors = [];
              const requests = [];
              page.on('pageerror', (error) => pageErrors.push(error.message));
              page.on('console', (message) => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('request', (request) => requests.push(request.url()));

              await page.goto(variant.url, { waitUntil: 'domcontentloaded', timeout: 60_000 });
              await page.waitForFunction(() => {
                const overlay = document.querySelector('#startup-preload');
                return overlay?.getAttribute('data-state') === 'hidden';
              }, { timeout: 60_000 });

              if (pageErrors.length > 0) throw new Error(`${variant.name} page errors: ${pageErrors.join(' | ')}`);

              const packRequests = requests.filter((url) => url.includes('/assets/bundles/') && url.endsWith('.mptpack'));
              const directRuntimeWebp = requests.filter((url) =>
                url.startsWith(variant.url) && url.includes('/assets/') && url.endsWith('.webp')
              );
              if (packRequests.length !== variant.expectedPacks) {
                throw new Error(`${variant.name}: expected ${variant.expectedPacks} packs, saw ${packRequests.length}`);
              }
              if (directRuntimeWebp.length !== variant.expectedWebp) {
                throw new Error(`${variant.name}: expected ${variant.expectedWebp} direct WebP, saw ${directRuntimeWebp.length}`);
              }

              await page.getByRole('button', { name: 'Startup timing' }).click();
              await page.waitForFunction(() => {
                const status = document.querySelector('.mpt-debug-panel [data-status]');
                return status?.textContent?.includes('platformToArtMs') ?? false;
              });
              const timingText = await page.locator('.mpt-debug-panel [data-status]').textContent();
              const timing = JSON.parse(timingText ?? '{}');
              samples.push({
                attempt,
                platformToArtMs: timing.platformToArtMs,
                moduleToReadyMs: timing.moduleToReadyMs,
                packRequests: packRequests.length,
                directRuntimeWebp: directRuntimeWebp.length,
                consoleErrors,
              });
              await context.close();
            }
            return samples;
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              // Alternate ordering so one implementation does not consistently own
              // all first-run OS/browser cache effects. Browser HTTP cache itself is
              // disabled for every context above.
              const baseline = await runVariant(browser, {
                name: 'main',
                url: 'http://127.0.0.1:4174/',
                expectedPacks: 0,
                expectedWebp: 115,
              });
              const bundle = await runVariant(browser, {
                name: 'bundle',
                url: 'http://127.0.0.1:4173/',
                expectedPacks: 6,
                expectedWebp: 0,
              });

              const baselineArt = baseline.map((sample) => sample.platformToArtMs);
              const bundleArt = bundle.map((sample) => sample.platformToArtMs);
              const baselineMedian = median(baselineArt);
              const bundleMedian = median(bundleArt);
              const deltaMs = bundleMedian - baselineMedian;
              const deltaPercent = (deltaMs / baselineMedian) * 100;

              console.log(JSON.stringify({
                profile,
                baseline,
                bundle,
                baselineMedianPlatformToArtMs: baselineMedian,
                bundleMedianPlatformToArtMs: bundleMedian,
                bundleDeltaMs: deltaMs,
                bundleDeltaPercent: Number(deltaPercent.toFixed(1)),
              }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Show preview logs on failure
        if: failure()
        run: |
          cat /tmp/vite-bundle.log || true
          cat /tmp/vite-main.log || true
