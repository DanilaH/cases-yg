name: Fix Phase 2.6 LOCK cash-out visual seam

on:
  push:
    branches:
      - feature/final-hands-on-overcharge
    paths:
      - .github/phase26-lock-cashout-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply focused visual fix
        run: python .github/scripts/fix-phase26-lock-cashout-visual.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:selftest
      - run: npm run assets:validate
      - run: npm run build
      - name: Assert focused product diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "src/game/scenes/OpeningScene.ts"
          git diff --check
          git diff -- src/game/scenes/OpeningScene.ts
      - name: Commit focused visual fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts
          git commit -m "Keep Signal armed through cash-out result beat"
          git push origin HEAD:feature/final-hands-on-overcharge
