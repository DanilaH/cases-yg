name: Fix OpeningScene Restart

on:
  push:
    branches:
      - fix/hands-on-ux-pass
    paths:
      - .github/workflows/fix-opening-restart.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/hands-on-ux-pass
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - name: Reset OpeningScene lifecycle on every start
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/scenes/OpeningScene.ts')
          text = path.read_text()
          old = """  public create(): void {\n    const platform = getPlatformRuntime();\n"""
          new = """  public create(): void {\n    // Phaser reuses the Scene instance after Collection -> Opening. Shutdown is\n    // terminal only for the previous activation, so reset activation state here.\n    this.phase = 'booting';\n    this.drag = null;\n    this.resultCarouselDrag = null;\n    this.resultReady = false;\n    this.deferredResize = false;\n    this.ignoreNextResultTap = false;\n\n    const platform = getPlatformRuntime();\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one create() anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify project
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run assets:selftest
          npm run assets:validate
          npm run build
      - name: Commit verified restart fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-opening-restart.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Reset OpeningScene lifecycle on restart"
          git push origin HEAD:fix/hands-on-ux-pass
