name: Run Runtime UX Fix Script

on:
  push:
    branches:
      - fix/runtime-ux-audit-pass
    paths:
      - .github/workflows/run-runtime-ux-fix-script.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-ux-audit-pass
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Extract and apply audited fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-runtime-ux-audit-fixes.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-runtime-ux-fixes.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/apply-runtime-ux-fixes.py

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Asset self-test
        run: npm run assets:selftest
      - name: Asset validation
        run: npm run assets:validate
      - name: Build
        run: npm run build

      - name: Commit verified fixes and remove temporary workflows
        run: |
          rm .github/workflows/apply-runtime-ux-audit-fixes.yml
          rm .github/workflows/run-runtime-ux-fix-script.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix runtime UX issues found in audit"
          git push origin HEAD:fix/runtime-ux-audit-pass
