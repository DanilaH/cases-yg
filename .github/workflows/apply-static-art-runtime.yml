name: Apply static art runtime integration

on:
  push:
    branches:
      - feat/asset-runtime-infrastructure

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/asset-runtime-infrastructure
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Wire static scene art and new pouch tab wrapper once
        run: |
          python - <<'PY'
          from pathlib import Path

          opening = Path('src/game/scenes/OpeningScene.ts')
          text = opening.read_text()
          if "staticTextureKey" not in text:
              text = text.replace(
                  "import { SLICE_BALANCE } from '../data/balance';\n",
                  "import { staticTextureKey } from '../data/artAssets';\nimport { SLICE_BALANCE } from '../data/balance';\n",
                  1,
              )
          if "../ui/staticArt" not in text:
              text = text.replace(
                  "} from '../ui/openingVisuals';\n",
                  "} from '../ui/openingVisuals';\nimport { addCoverArt } from '../ui/staticArt';\n",
                  1,
              )

          old_bg = """    root.add(\n      this.add.rectangle(metrics.logicalWidth / 2, LOGICAL_HEIGHT / 2, metrics.logicalWidth, LOGICAL_HEIGHT, 0x171421),\n    );\n\n    const haze = this.add.ellipse(metrics.centerX, 330, Math.min(metrics.logicalWidth * 0.72, 920), 520, 0x4b365e, 0.22);\n    root.add(haze);\n"""
          new_bg = """    const background = addCoverArt(\n      this,\n      root,\n      staticTextureKey('opening-bg'),\n      metrics.logicalWidth,\n      LOGICAL_HEIGHT,\n    );\n    if (!background) {\n      root.add(\n        this.add.rectangle(metrics.logicalWidth / 2, LOGICAL_HEIGHT / 2, metrics.logicalWidth, LOGICAL_HEIGHT, 0x171421),\n      );\n      const haze = this.add.ellipse(\n        metrics.centerX,\n        330,\n        Math.min(metrics.logicalWidth * 0.72, 920),\n        520,\n        0x4b365e,\n        0.22,\n      );\n      root.add(haze);\n    }\n"""
          if old_bg in text:
              text = text.replace(old_bg, new_bg, 1)

          text = text.replace("    this.pouch.dragZone.setX(this.pouch.tabEndX);\n", "", 1)
          text = text.replace("    this.pouch.dragZone.setX(tabX);\n", "", 1)
          text = text.replace("      targets: [pouch.tab, pouch.dragZone],\n", "      targets: pouch.tab,\n", 1)
          opening.write_text(text)

          collection = Path('src/game/scenes/CollectionScene.ts')
          text = collection.read_text()
          if "staticTextureKey" not in text:
              text = text.replace(
                  "import { SLICE_REGISTRY, type GadgetFamilyDefinition, type StandardRarity } from '../data/collectibles';\n",
                  "import { staticTextureKey } from '../data/artAssets';\nimport { SLICE_REGISTRY, type GadgetFamilyDefinition, type StandardRarity } from '../data/collectibles';\n",
                  1,
              )
          if "../ui/staticArt" not in text:
              text = text.replace(
                  "import { createCollectibleVisual, RARITY_REVEAL_COLORS } from '../ui/openingVisuals';\n",
                  "import { createCollectibleVisual, RARITY_REVEAL_COLORS } from '../ui/openingVisuals';\nimport { addCoverArt } from '../ui/staticArt';\n",
                  1,
              )

          old_bg = """    root.add(\n      this.add.rectangle(metrics.logicalWidth / 2, LOGICAL_HEIGHT / 2, metrics.logicalWidth, LOGICAL_HEIGHT, 0x211b2c),\n    );\n    root.add(this.add.ellipse(metrics.centerX, 375, Math.min(metrics.logicalWidth * 0.82, 1050), 610, 0x4c3a5d, 0.2));\n    return root;\n"""
          new_bg = """    const background = addCoverArt(\n      this,\n      root,\n      staticTextureKey('collection-bg'),\n      metrics.logicalWidth,\n      LOGICAL_HEIGHT,\n    );\n    if (!background) {\n      root.add(\n        this.add.rectangle(metrics.logicalWidth / 2, LOGICAL_HEIGHT / 2, metrics.logicalWidth, LOGICAL_HEIGHT, 0x211b2c),\n      );\n      root.add(this.add.ellipse(metrics.centerX, 375, Math.min(metrics.logicalWidth * 0.82, 1050), 610, 0x4c3a5d, 0.2));\n    }\n    return root;\n"""
          if old_bg in text:
              text = text.replace(old_bg, new_bg, 1)

          foreground_anchor = """    if (this.view === 'shelf') {\n      this.renderShelf(root);\n    } else {\n      this.renderLibrary(root);\n    }\n\n    this.renderPager(root);\n"""
          foreground_insert = """    if (this.view === 'shelf') {\n      this.renderShelf(root);\n    } else {\n      this.renderLibrary(root);\n    }\n\n    addCoverArt(\n      this,\n      root,\n      staticTextureKey('collection-foreground'),\n      metrics.logicalWidth,\n      LOGICAL_HEIGHT,\n    );\n\n    this.renderPager(root);\n"""
          if foreground_anchor in text and "staticTextureKey('collection-foreground')" not in text:
              text = text.replace(foreground_anchor, foreground_insert, 1)
          collection.write_text(text)
          PY
      - name: Commit source patch if changed
        run: |
          if [ -z "$(git status --porcelain -- src/game/scenes/OpeningScene.ts src/game/scenes/CollectionScene.ts)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/OpeningScene.ts src/game/scenes/CollectionScene.ts
          git commit -m "Wire reviewed background layers into scenes"
          git push
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
